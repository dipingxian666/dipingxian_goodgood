先生,早在1942 年出版的《中国文法要略》中就提出“有一\n些常用来组成组合式复词的成分(近似词尾)”、“应该随时留意”,文中举了\n两个例子,其中一个例子就用的指人类词缀加以说明:“一是表示各种职业的从\n[p.8]\n第1 章绪论\n上海师范大学硕士学位论文\n2\n业员的:医士、医生、医师、护士、伶人、庖人、学者、......会员、店员、海员。\n这里面只有‘员’字比较灵活,可以供制造新词之用。这可以说是现代汉语类词\n缀研究的开端。然而,在随后的近二十年中,文中提出的问题似乎并没有引起国\n内学者们的重视,很少有人谈及类词缀。直到1979 年吕叔湘出版的《汉语语法\n分析问题》,开创性的提出了“类语缀”这一术语,由此,类词缀问题才引起了\n人们的重视与关注。书中列举了“可”、“好”、“难”、“准”等18 个类前\n缀和“员”、“家”、“人”、“民”等23 个类后缀,至此,“类前缀”和“类\n后缀”作为语言学中的两个新术语被明确提出。\n第二个阶段是从二十世纪八十年代到九十年代,这个阶段是类词缀研究的发\n展阶段。在这一阶段,学者们对类词缀重视起来。赵元任在《汉语口语语法》中\n将类词缀称为“复合词中结合面宽的第一语素”;任学良在《汉语造词法》中提\n出“准词头”和“准词尾”的概念的区别;此外还有郭良夫的《现代汉语的前缀\n与后缀》,讨论了一部分“新兴的前缀”,指明他们正在发展成为前缀;张静在\n其主编的《新编现代汉语》中提出“稍有实义但正在虚化的词缀”与“典型词\n缀”......总体而言,这一阶段的研究已经从根本上打破了“词根——词缀”两极\n化的观念,但是引入“类词缀”概念的并不多,即使有,也只是比较简单的论述。\n第三阶段是从二十世纪九十年代至今,类词缀的研究进入深入发展阶段。这\n段时期,学者们广泛认识到了汉语词缀存在的现状和复杂性,肯定了类词缀存在\n的合理性;诸多专家学者撰文、著书探讨类词缀问题,阐明自己的观点,使汉语\n类词缀研究朝着深入细致的方向发展。\n1.2.2 关于现代汉语新兴指人类词缀的研究现状\n已有研究成果中,对指人“类词缀”的理论方面的探讨主要围绕汉语形态、\n词缀化两个方面进行。汉语存在形态这一观点己经为大多数学者所赞同。近几年\n大批量新兴“类词缀”的出现及参与构词更是强化了汉语界对汉语形态的认知。\n《现代汉语准词缀发展变化的几种模式》(刁晏斌,2004)认为准词缀即类词缀\n是现代汉语中数量较多而又非常活跃的构词成分,并总结了准词缀的五种发展变\n化模式。《类词缀的发展与现代汉语的形态化趋势》认为类词缀是现代汉语的形\n[p.9]\n上海师范大学硕士学位论文\n第1 章绪论\n3\n态标记,类词缀属于构词形态,最近几年产生的很多新词都是通过类词缀的附加\n构词产生的。《词缀的性质与汉语词法特点》(董秀芳,2005)认为汉语中存在\n派生规则,但地道的词缀一直不多,在对几个认可度较高的词缀分析后,指出“派\n生构词不是汉语主要的词法模式,汉语中主要的词法模式仍是复合法。”指人“类\n词缀”在语法化上的表现主要是词根词素的词缀化。《浅析“亲属称谓名词”的\n类词缀化及构成新词的特点》(宋培杰,2002)分析指出“爷”、“婆'、“哥”、\n“嫂”等亲属称谓名词在构成新词的过程中,词汇意义弱化,语法意义增强,词\n缀化倾向明显。《从汉语词缀的定义看“词缀化”》从汉语词缀定性和定量分析\n两方面做支撑论证汉语语素的虚化并词缀化倾向。《现代汉语构词法中的词缀化\n倾向研究》以报刊领域中的语料为依据,将语言单位放在鲜活的语言环境中进行\n分析,从而认定现代汉语构词法中词缀化倾向的存在。\n汉语中的词语随着历史的演变而变化,指人类词缀的产生也并不是凭空而\n来,它也是随着词语的演变而产生的。指人类词缀是从类词缀的语义层面划分出\n的重要一类,因其数量较多并呈日益增多的趋势,备受关注。整理前人文献,我\n们发现,指人类词缀的研究主要是从指人类词缀的范围、特点功能、演化途径这\n几个大的方面来研究的。《说流行语“X 党”——兼论指人语素的类词缀化》(陈\n昌来朱艳霞,2011)列举了几个新兴的指人类词缀并认为指人语素类词缀化的\n动因在于框填;《现代汉语准词缀发展变化的几种模式》(刁晏斌,2004)认为\n准词缀(即类词缀)是现代汉语中数量较多而又非常活跃的构词成分,并总结了\n准词缀的五种发展变化模式;《浅析“亲属称谓名词”的类词缀化及构成新词的\n特点》(宋培杰,2002)分析指出“爷”、“婆”、“哥”、“嫂”等亲属称谓\n名词在构成新词的过程中,词汇意义弱化,语法意义增强,词缀化倾向明显。《汉\n语表人词缀的认知基础及社会文化蕴涵》(齐焕美,2010)指出表人词缀的虚化\n过程多与人类隐喻转喻的认知方式有关,各项语义特征或多或少地透露出一些历\n史文化信息;《从犀利哥和凤姐看“哥”“姐”背后文化义的擅变》(程辰,2010)\n通过对“哥”和“姐”用法的分析,发现“哥”和“姐”的使用和发展是不平衡\n的,并在历史的使用过程中也已经融合了多层文化含义。另外,还有许多文章是\n通过对一个词缀的探究来发先新兴指人类词缀的发展规律和发展趋势等,例如:\n[p.10]\n第1 章绪论\n上海师范大学硕士学位论文\n4\n《说流行语“X 党”——兼论指人语素的类词缀化》(陈昌来朱艳霞,2011)\n一文考察了“X 党”的语义和句法功能,并分析了该类词语的形成和发展规律。\n《“族”词类的语言学研究》(鲁瑛,2010)通过对“X 族”词类的构造和功能\n的探讨,认为“族”在现代汉语中被广泛作为类词缀使用是实词虚化现象,在“X\n族”词类的使用和传播过程中,“X 族”已经成为一个语言模因,是语言模因在\n词层面上的表现;《网络“控”族新词及其所折射的社会文化心理》(李媛媛,\n2010)以“控”族词为研究对象,主要分析“控”族词的产生结构特点及其所折\n射的社会文化心理。\n综上,现代汉语新兴指人类词缀的研究还是比较零碎松散的,对于新兴语言\n现象的产生没有更多理论依据和现实依据的挖掘。本文将着重对现代汉语新兴类\n词缀进行描写和分析,并讨论出新兴类词缀产生的原因以及未来新兴类词缀发展\n的趋势。\n1.3 研究思路及方法\n1.3.1 主要设想、思路及章节内容简介\n本文绪论为引言部分,说明本文的研究范围,阐述论文选题的目的和意义,\n对前人的研究成果进行了总结,然后介绍了本文研究所运用的理论、方法以及语\n料来源。第二章主要分析新兴指人类词缀的定义、性质和特征和种类。对进一步\n认清词缀、类词缀、指人类词缀、新兴指人类词缀的性质和特点有一定的理论和\n实际意义。第三章,我们对新兴指人类词缀进行整理和归纳,选举出几个典型的\n新兴指人类词缀(控、族、二代、奴、帝),从语音、语义、语法、语用等几个\n方面进行考察。第四章主要是对新兴指人类词缀产生的原因进行探究,主要从内\n外两个方面着手,内部原因主要分为:隐喻和转喻机制,词类泛化,经济机制等;\n外部因素主要是由于信息传播和文化习惯等。第五章是对新兴指人类词缀的发展\n进行预测。预测方向主要有:发展成为典型的指人词缀,发展停滞并逐渐淡出,\n回归实词状态。\n[p.11]\n上海师范大学硕士学位论文\n第1 章绪论\n5\n1.3.2 理论方法与语料来源\n本文主要运用语法化理论和标记理论作为基础,对现代汉语新兴指人类词缀\n进行描写分析和考察,尝试说明新兴指人类词缀产生的原因和特点;利用语料库\n语言学的方法,将动态描写与静态解释相结合,对收集语料进行定量统计和定性\n分析,尝试对新兴指人类词缀的发展进行预测。研究过程中力求符合以下几个原\n则:描写与解释相结合;形式和意义相结合;定性与定量相结合;动态与静态相\n结合;理论逼近和语料证明结合。\n本文从类词缀的性质范围和分类对新兴的指人类词缀进行定量考察定性分\n析,从而发现新兴指人类词缀的特点。本文的语料主要来自于CCL 语料库、BBC\n语料库及部分网页。按照出现频次高低,筛选出五个具有典型性的新兴指人类词\n缀进行系统的分析和考量,通过对共性和个性的描写和解释,旨在发现新兴指人\n类词缀产生发展的外部原因和内部机制。通过较为全面的解释和合理的分析,对\n未来新兴指人类词缀的发展方向进行预测。\n[p.12]\n第2 章现代汉语新兴指人类词缀\n上海师范大学硕士学位论文\n6\n第2 章现代汉语新兴指人类词缀\n2.1 现代汉语类词缀的定义和特征\n现代汉语中的词缀是指指派生词中附加在词根上的定位不成词语素。词缀一\n定要附在词根的前后或者中间,能表示附加的意义,起语法作用。但是在现代汉\n语中并不是所有的附加在词根后的语素都能称为词缀,一些语素的意义并没有词\n根那样实在,也没有词缀那么虚化,我们把这样的语素叫做“类词缀”。\n关于现代汉语类词缀,早在1942 年,吕叔湘先生就在《中国文法要略》里\n用“近似词尾”来表示现代汉语的“类词缀”这个概念,书中列举了“士、生、\n师、人、者、丁”等19 个“近似词尾”,之所以把称作为“近似词尾”是因为\n他认为“词尾”一定是“本身没有丰富意义”的,所以这些“帮着造词”而且本\n身又具有丰富意义的词尾被称作为“近似词尾”。高名凯1948 年在《汉语语法\n论》中提出了“仿佛是后加成分”的语素“家”和“长”,他认为“纯粹的后加\n成分本身不能独立存在”,所以提出了“准后加成分”的说法,这个说法成为了\n“类词缀”的雏形。1957 年陆志韦在《汉语的构词法》中列举了一些“类乎后\n置成分的东西”,如“者、家、化、个、拉、也、来、然、乎”等。直到1979\n年,吕叔湘先生在《汉语语法分析问题》中提出“有不少语素差不多可以算是前\n缀或者后缀,然而还是差点儿,只可以成为类前缀或者类后缀。......加个‘类’\n字是因为他们语义上还没有虚化,有时候还以词根的面貌出现。”\n类词缀在意义方面并没有完全虚化,具有一定的词汇意义,其位置也不是完\n全固定的。而且类词缀和词缀相比有更多的能产性,不同的类词缀虚化程度不一。\n2.2 现代汉语新兴指人类词缀\n2.2.1 现代汉语新兴指人类词缀的定义\n现代汉语新兴指人类词缀是指具有一类人共同特征的义素,通常都在词尾,\n[p.13]\n上海师范大学硕士学位论文\n第2 章现代汉语新兴指人类词缀\n7\n指人类后缀居多。现代汉语新兴指人类词缀虽然数量不多,但其具有很高的衍生\n性和高使用频率。“指人”一方面表现在类词缀本身是由含有“人”的义素泛化\n而来,另一方面表现为类词缀都表现出一类人特征。王铁锟(1992)曾给新词语\n下过如下定义“新词语是指一个新创造的或从其他语言、从本民族的方言词、古\n语词和行业词中所借用过来的词语,也指一个产生新词义、新用法的固有词语。”\n仿照新词语的定义,本文认为新兴指人“类词缀”的“新兴”主要体现为以下两\n种情况:(1)旧有类词缀的新用。这些类词缀在古汉语中曾经出现,但只是零\n星用法,直到近期突然活跃起来,新生类推能力显著增强,并且形成新的语义,\n使用频率增加,使用范围扩大。(2)新类词缀的产生。这种情况又可细分为汉\n语系统中原有的词根词素某一项或某几项义项虚化,产生作指人“类词缀”的新\n用法从其他语言、从本民族的方言词、古语词和行业词中借用过来经过改造直接\n以“类词缀”的身份进入汉语系统。\n2.2.2 现代汉语新兴指人类词缀的特征\n新兴指人类词缀来源广泛复杂,有的是从表人名词虚化而来,有的是从表示\n与人有关的各种事物的词通过隐喻衍化而来,有的是从亲属称谓泛化而来,还有\n的是从虚词转化而来。通过探究,我们发现,新兴指人类词缀具有以下特点:(1)\n语义泛化,表示“一类人”;(2)定位都在词尾,以类后缀居多;(3)都是新\n兴的流行语,具有较大的普遍性和较高的使用频率。\n本节将从新兴指人类词缀的外部特征对指人类词缀的特点进行分析。\n2.2.2.1 派生词长度\n本文从语料库中截取定量语料,对“控”、“族”、“二代”、“奴”、“帝”\n这几个新兴指人词缀进行统计,与旧有指人类词缀进行对比分析发现,新兴指人\n类词缀和旧有指人词缀都能构成双音节词,且多数都是双音节词,不同的是,新\n兴指人类词缀更具有三音节化的取向,组成的词以三音节为主,其中“二代”更\n是只能生成三音节词语;除此之外,很多旧有指人词缀可以构成四音节或者四音\n节词以上的词,而新兴指人类词缀除“控”和“族”可以够成极个别四字音节词,\n其构成四字音节词的能力较弱。\n[p.14]\n第2 章现代汉语新兴指人类词缀\n上海师范大学硕士学位论文\n8\n2.2.2.2 词根类别\n新兴指人“类词缀”派生词语的构词成分以汉字为主,同时兼有字母及阿拉\n伯数字。具体可分以下三种:\n1.完全由汉字构成。这种情况占绝大多数,如“房虫”、“化妆达人”、“标\n题党”、“富二代”、“犀利哥”、“动姐”、“拍客”、“丝袜控”、“骨妹”、\n“宅男”、“孩奴”、“剩女”、“不就业派”、“月嫂”、“卡爷”、“驴友”、\n“月光族”等。\n2.由汉字与字母构成。其中的字母又可分为汉语拼音缩写,如“MM(妹妹)\n控”、“Apple 控”、“SOHO 族”等。\n3.由汉字与字母、阿拉伯数字共同构成。如“3P(游戏机、手机、计算机)\n族”、“4G 派”、“作8 族”。\n2.2.2.3 构词方式\n在可搭配构词的词根类别方面,新兴指人“类词缀”与旧有指人“类词缀”\n基本相同,都可与名词性、动词性、形容词性搭配,其中又以名词性词根为主。\n但在个新兴指人“类词缀”内部,各类词缀主要可搭配的词根类别各不相同,存\n在差异。如“控”、“奴”、“帝”主要是和名词性词根搭配,“族”“客”则\n主要是和动词性的词根搭配,与“党”搭配构词的词根在类别方面的分布显得较\n为均衡,名词性、动词性、形容词性三种类别中,都能找到一定数量的词根和它\n搭配构成派生词。如\n名词性:短信党、动漫党、传说党、韩寒党、药加鑫党\n动词性:抢包党、租房党、拍砖党、追剧党、偷拍党\n形容词性:低调党、寂寞党、华丽党、天真党、邪恶党\n2.2.3 现代汉语新兴指人类词缀的表达功能\n新兴指人类词缀的出现是语言文化进步的表现,新兴指人类词缀使词具有多\n样化的特点,也使现代汉语的表达更具形象化和鲜明化,具体的表达功能可概括\n为四个方面。\n2.2.3.1 使表达更加简便\n[p.15]\n上海师范大学硕士学位论文\n第2 章现代汉语新兴指人类词缀\n9\n出于语言的经济性原则和省力原则,语言表达形式越来越短小精炼。最理想\n的语言表达效果是在保证信息不变的前提下,用经济而简约的手段达到同样的效\n果。因为类词缀都具有语义类化的作用,因此能够使复杂的短语结构词汇化,使\n表达更加简单。\n2.2.3.2 使分类更加细化\n随着社会的发展,人类对自我的认知越来越深刻,分类标签越来越细致,对\n指人语素的需求量也随之增加。新兴指人“类词缀”的出现一定程度上满足了人\n类追求个性、定义自我的要求。同时,这些新兴指人“类词缀”虽然在大的语义\n指向上与旧有指人“类词缀”都是指“一类人”,但在具体的语义内容上,侧重\n点有所不同,语域范围不同,具有细化分类的功能。\n如“电脑迷”和“网虫”,“电脑迷”原指沉迷于电脑的人,它指称的范围\n较广,既指对电脑相关技术着迷,志在计算机软硬件研究开发的人,也指对电脑\n所提供的服务,如游戏、电影、聊天等着迷,沉迷于网络所架构的虚拟世界的人。\n作为“电脑迷”的同义词,后起的“网虫”指称对象更为专一,仅指“沉迷\n于网络所提供的各种服务的网民”。“网虫”产生后,分担了“电脑迷”的一部\n分指称对象,现在的“电脑迷”主要指对电脑相关技术着迷的人员,一本专门介\n绍电脑技术相关知识的杂志也命名为《电脑迷》。\n2.2.3.3 使感情色彩强化\n感情色彩义是词素的词素义或附加语义的一部分,类词缀的色彩义直接影响\n着所构成词语的感情色彩,许多原本在色彩义上为中性的词根词素在与新兴指人\n“类词缀”结合后具有了明显的情感偏向。如“党”带有较强的贬义色彩,因此\n与“党”搭配构成的词多带有明显的贬义,表达憎恨、厌恶的感情。如:\n“标题党”:指论坛中通过夸大或异化标题吸引人眼球赚取点击量,而所写\n文章内容与标题并无关系或关系不大的一类人。\n“脑残党”:指经常在论坛中发表各种无知或幼稚愚昧言论的人。\n“五毛党”:逐渐扩展为一种新兴的职业,指被某些公司、企业或其他机构\n雇用,通过在论坛中恶意、大量散发简短广告、调查数据而赚取报酬的一类人,\n因发表一条赚取五毛钱而获名“五毛党”。\n[p.16]\n第2 章现代汉语新兴指人类词缀\n上海师范大学硕士学位论文\n10\n2.2.3.4 使表达更加生动\n大多数新兴指人“类词缀”的传播途径都是先由网络或娱乐媒体兴起,在经\n常泡网的年轻网民间传播。年轻网民一般有追求个性化、求新求异、对特殊化事\n物极其敏感的特点,因此相对而言,表达生动化的词语更容易得到快速大范围的\n流传。如“驴友”、“考碗族”等。\n“驴友”指三五成群或单枪匹马四处游逛的人,他们通常背着背包花最少的\n钱,走最多的路自助旅行。“驴友”的产生一方面是取自“旅友”的谐音,另一\n方面符合了“友”词族的词语模式,再有就是将自己比作擅长耐力走路的驴,符\n合了“驴友”一词的指称对象—青年男女的标新立异心理,更为生动化。\n“考碗族”主要指那些己经在企业就业或者即将告别校园的年轻人,他们为\n进入公务员队伍,长时间有计划地复习备考,全国各地四处参加相关考试。其中\n的“碗”喻指公务员的“铁饭碗”。与“考碗族”共存的还有另外一个词“公考\n派”,“公考派”的词义与“考碗族”完全相同,但是在被认可程度和使用频度\n上较“考碗族”要低得多。在百度输入“考碗族”得到相关结果约18500 个,“考\n碗族”在政务网和各大主流媒体上都有使用,且多数作为关键词出现在文章标题\n中。而“公考派”只在个别文章中出现。产生这种现象,本文认为相对“公考派”,\n“考碗族”一词更加形象生动,更容易获得追求时尚的青年人的认可。\n[p.17]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n11\n第3 章新兴指人类词缀个案解析\n3.1 浅析新兴指人类词缀“控”\n近年来,由于受到日语“コン”的影响,一些年轻人喜欢用“控”这个字来\n表示对某一事物的极度喜爱。例如:\n(1)年纪轻轻就凭《绯闻女孩》迅速上位的泰勒·摩森,是个出了名的“纯\n棉控”,其标志性单品是学院派的白衬衫加上棉布裙,尽显“90 后”女生的青\n春和清纯。\n例(1)中的“纯棉控”指极度喜欢纯棉的人。汉语网络语言中广泛使用的\n“控”音译自日语“コン”,发音为“con”,近似于汉语“kong”。意指极度\n喜欢某东西的一类人,如“萝莉控”指的是男性(今亦有指女性)对未成年的少\n女比对成年女性更具性方面的兴趣的人,“围巾控”指对围巾有强烈的嗜好和喜\n欢的人,会不由自主地喜欢戴围巾的动漫形象、收集很多围巾。\n3.1.1“控”的来源\n日语“コン”,源自英语complex,截取其前半部分来代表整个词的意思。\n这是和制英语常用的一种构词方式——截取,即对于较长的外来语,只截取其前\n半部分来表示整个词。但是,日语“コン”在英语complex 的基础上发生了一些\n变化。英语中complex 主要有四个义项,其中一个义项是不正常的精神状态、情\n结,如自卑情结、恋母情结、受迫害妄想症。日语“コン”在使用之初,保留了\n其有些极端甚至变态的意思,但是“コン”由原来英语中表示某种精神状态转变\n为表示具有某种精神状态的人,如“ショタコン(正太控)、ロリコン(萝莉控)、\n颜コン(颜控)、おじコン(大叔控)”等,都主要是指具有某种特殊喜好的人。\n“控”在使用之初,主要用于翻译相应的日语词语,基本上沿用了日语“コン”\n的意义和用法,表示“对......极度喜欢的一类人”。之所以选择汉字“控”来表\n示日语的“コン”,不仅仅是因为音近。事实上,在汉语中,“控”是一个动词\n性的语素,选择一个动词性的语素来对应外语中的名词性成分,这并不很符合汉\n[p.18]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n12\n语的使用习惯,但是“控”还是作为最终的选择逐渐流行开来,关键在于“控”\n本身含有的“控制”的意思与“コン”在语义上存在某种内在的联系。如:\n(2)没想到就因为三步骤,从此和倩碧结了缘,慢慢居然成了他家粉丝,东\n东越买越多,越来越疯狂,俨然一个十足的倩碧控,就是控制不了。\n(3)她奶奶是个珠宝首饰控,看见亮晶晶的东西就有控制不住的欲望。\n可见,“x 控,”对某种事物的喜爱是一种不能自控的极度的喜爱,不能自\n控就是被控制,这种强烈的喜爱到了控制不住的程度,与汉语“控”原有的“控\n制”的意义暗合,所以可以说汉日谐音兼义,使得汉字“控”成为最佳选择,并\n进一步促进了“控”的流行。\n3.1.2 “控”类词缀化的动因解释\n由于“控”音译自外语,具有新鲜感和陌生化效果,因而受到年轻网民的追\n崇和热捧。更多的年轻人不再满足于翻译日语的相应词语,而更喜欢自己创造新\n词,如“高跟鞋控、围脖控、小说控、文具控、苹果控、香水控、格子控”等。\n在这些新词新语中,指人语素呈现出向类词缀演化的强烈倾向。指人语素在流行\n中发生类词缀化倾向的动因在于框填。使用者追求新鲜感,大量套用“X 控”创\n造新词。\n同时,正是由于大量套用、模仿使得进入“X 控”这一框填模式的可变成分\n即“X”的范围越来越广,如“珠宝控、首饰控、发卡控、杯子控、长靴控、围\n巾控、皮带控、包包控、数码控、蕾丝控、眼镜控、制服控、针织衫控、本本控”\n等。因为“X 控”负载了某种流行语义,扩大组配范围就是扩散的最佳途径,利\n用框架进行替换和充填,使得框架的语义得到巩固,同时,逐渐巩固的框架义会\n允许更多的成分进入。整个过程是一个相互作用相互促进的框、填并存的过程。\n汉语中发生类似的类词缀化倾向的指人语素还有不少,如“一客、一党、一族、,\n友、一男、一女、一哥、一帝、一奴”等。\n在框填的作用下,“控”逐渐类词缀化,语言使用者通过模仿现有的语言结\n构而复制出一种具有新内容的变体形式。在这种同构类推的过程,变化的是语言\n内容,不变的是语言结构,我们按照同一种结构类推出相似语句,通过这种手段\n[p.19]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n13\n使得框填模式得以复制和传播。在同构类推的机制下,语言使用者能够利用“X\n控”这一模式及其内部的结构关系,不断创造具有新语义的“X 控”,使得“X\n控”具有很强的能产性,从而迅速得到传播。\n3.1.3“控”的使用特点及其功能演变\n作为一个网络用语,“控”在词义演变、使用主体与对象以及影响扩散等方\n面都具有自己的特色。\n3.1.3.1 语用隐含义、色彩义的演变\n1)语用隐含义的变化\n日语“コン”最初是ACG(Animation、Comic、Game,漫画、动画、游戏)\n界用语,主要用于形容一些不同于常人的行为举止,有些偏执甚至变态的形象,\n如“妹控”指喜欢上自己妹妹的人。除了亲妹妹外,AGG 作品中出现喜欢上干妹、\n继妹(因父母再婚而来的无血缘妹妹)、堂妹、表妹情节的也可以算是妹控取向\n的作品,“女神控”指对不真实存在或难以触及的女性具有极其爱慕感情的男性,\n“女仆控”指对女仆更具性方面的兴趣的人。\n汉语中“控”最初用于翻译相应的日语词,因而也带有【+偏执】【-正常】\n的语义,但是随着“控”使用频率的增加,使用范围的扩大,这种隐含义逐渐减\n弱并脱落。如:\n(4)有时候,觉得自己并没有什么特殊控好,但是却非常喜欢一个动漫角\n色,这个其实就是潜意识的“控”了。当你觉得这个角色穿女仆装时特别可爱,\n或者带上眼镜更佳,其实这个就是“女仆控”了。\n以“女仆控”为例,最初是指一类不正常的偏执性兴趣的人,多是迷恋ACG\n的人群。例(4)中,觉得这个角色穿女仆装时特别可爱,就可以称之为“女仆\n控”,可见“女仆控”原来带有的【+偏执】【-正常】的语义已逐渐减弱,甚至\n已经没有“不正常”的意思了。\n2)色彩义的变化\n如上所述,“控”在使用之初,带有明显的“偏执的不正常的”隐含义,经\n常指人的行为或态度过于极端,因而在褒贬色彩上具有明显的贬义色彩,如最初\n[p.20]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n14\n产生的“控”族词“妹控、正太控、萝莉控、百合控、绝对领域控”等,多与不\n正常的性兴趣有关,但是在使用的过程中,“控”的一些隐含义脱落,原来的贬\n义色彩也开始淡化,逐渐成为一个中性色彩的词。如:\n(5)都说偶控兰蔻控得要死了,......偶也不知道为什么就是那么迷恋这个牌子。\n(6)被什么控制着你的爱好,你就是什么控。\n例(5)中,“控”基本上是“迷恋”的意思,例(6)中基本上是“爱好者”\n的意思,可见“控”在使用中已逐渐趋向于中性。\n类词缀“控”其基本的语义含有“喜欢”的意思,但是在具体的使用中,\n“控”与“喜欢”有很大的差别,即使是同为动词的“控”,也不能简单等同于\n“喜欢”。“控”的使用是有限制的,通常对语境和使用主体有特殊的要求。虽\n然“控”的语义似乎相当纷繁,但从修辞认知的角度看,其词义的衍生、功能的\n扩展、隐含义与色彩义的变化,都是围绕着“喜欢”而产生的修辞关联。\n3.1.3.2“控”的对象与使用主体\n“控”的对象主要是某一类具有显著特征的人或物。以人为对象的,如:“正\n太控、萝莉控、大叔控、伪娘控、御姐控”等。以“御姐控”为例,“控”的对\n象“御姐”本意是对姐姐的敬称,引申指成熟的强势女性,一般泛指年龄稍大、\n性感成熟的女性,具备成熟、智慧、自信、优雅、坚强等特质。“控”的对象也\n可以是物,以衣物、首饰、手表、装饰品等饰物为主。再如“皮草控、长靴控、\n倩碧控、浪琴控”等,往往是时尚的、流行的、有品位的或者奢侈的。“控”的\n对象也可以是日常事物,如“文具控”,但这里所指的“文具”一般都不是普通\n的文具,而是一些制作精美、具有观赏价值或收藏意义的文具。总之,“控”的\n对象必须具备吸引人的令人喜爱的特质。\n从社会语言学角度看,“控”的使用主体以年轻人为主,开始主要在动漫迷、\n游戏迷中流行,后来逐渐扩散到一般的年轻网民,以80 后和90 后为主,女性使\n用者居多。例如:\n(7)以前没有发觉,只是以为只有自己才会控这种东西,后来才知道,原来大\n部分女生都有这种癖好,就是对于杯子类的容器会见一次买一次!\n(8)宝蓝色蕾丝修身小TEE,搭配腰部荷叶细节灰色长裤,小女生控蕾丝,小\n[p.21]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n15\n女人控风情,都会时髦风劲吹。\n3.1.3.3“控”的广泛应用\n如前文已指出的,表示“极度喜欢”的“控”,本来只是在二次元动漫界使\n用,如早期的“妹控、伪娘控、百合控、重机械控、美型控”等都与动漫、游戏\n中的人物形象有关,而且语义所指多与性有关。\n随着“控”的语用隐含义和色彩义的演变,【+偏执】【-正常】的语义的减弱,\n“控”逐渐扩散到网络的其他领域,如聊天室、论坛等,在中国最大的贴吧——\n百度贴吧中,还有专门的主题贴吧:控吧。\n如今其使用范围早已超出了网络,内容也多与时尚、潮流等相关,时常出现在平\n面媒体以及电视媒体的娱乐节目和时尚类节目中。调查发现,从2010 年初开始\n“控”就在平面媒体中出现了。例如:\n(9)我是“美容仪器控”(外滩画报,20110226)\n(10)米歇尔·奥巴马第一夫人“腰带控”(时尚芭莎,20121224)\n尤其是一些新闻或杂志文章的标题,为了吸引读者的眼球,就更容易选择网\n络用语。例如:\n(11)明星们的时尚“控”生活:勇敢贝嫂“高跟鞋控”(齐鲁晚报,20100415)\n(12)美肤细节控:双眼减龄神奇变身(嘉人,20100507)\n3.1.4 使用策略与修辞效果\n3.1.4.1 使用策略\n1)创新与从众\n从修辞的角度看,“控”的新意义和新用法,显然与语言的使用者——即表\n达者特定的修辞策略有关。一方面,“控”负载的新词义直接来自日语,表达者\n通过扩大语义距离来制造语用距离,从而达到陌生化的效果;另一方面,“控”\n在导入汉语后,通过框填形成类词缀,通过“X 控”不断创造符合汉语中新的语\n言现象的新词语,这也是表达者考虑接受者的心理期待,通过框填式流行语以保\n留话语框架的形式实现了话语关系上的“从众”,同时它又通过替换和充填这一\n可行性操作加以塑造,又直接将创新因素在形式层面上体现出来。“控”是以“控”\n[p.22]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n16\n的关键语义为意义基础,以汉语中原有动词性语素“控”为功能基础而产生的。\n动词“控”在类词缀“控”带有的“极度喜欢某事物的一类人”的意义基础上抽\n取出主要的动词性的意义“(不能自控)地喜欢”,新词义的保留满足了年轻人\n使用外来语的猎奇心理。而“控”作为动词使用的新功能,更符合汉语的使用习\n惯,这也是语言使用者将外来语汉化的表现。同时也反映出年轻人的创新意识,\n作为新词新语的引领者,年轻人不仅喜欢借用外来词,而且喜欢在此基础上创造\n出更符合汉语传统使用习惯的新用法。\n2)变异与顺应\n语言使用者在创造和使用新词新语时,总是存在创新与从众两种心理。而在\n不同语言的接触过程中,则表现为变异与顺应两大方面。\n语言的使用是一个经常不断的、有意无意的、受语言内或语言外因素左右的\n语言选择过程。不同语言接触的过程中,首先,在语言内外因素的协调和制约下,\n语言使用者根据语言表达的新需要对语言系统的要素进行某种程度的调整或创\n新,一种方法就是直接引进另一种语言中的新的语言形式,如“控”的导入,直\n接来源于日语,以满足新的功能要求。其次,一种外来语言形式在引进之后,必\n然会遇到语言融合的问题。\n语言的融合经常表现为外来语在被引进一种语言之后会发生一些变化以更\n好地适应这种语言的使用习惯。由于语言存在于交际使用中,语言顺应也只能在\n交际中体现出来。语言的不自主性、开放性、动态性构成了语言顺应的前提和基\n础。如果不能有效地运载和传递信息,或者不符合一种语言的使用习惯,就有可\n能发生顺应。适切性是语言顺应的根本原则。在汉语中,这种顺应经常表现为外\n来语的汉化,如“控”导入之后,缺少一个相应的动词来陈述,并且词缀“控”\n并不符合汉语传统的语言习惯,从而导致符合汉语动词性用法的“控”的产生与\n流行。可见,语用表达的新需要直接促成变异,而语言交际的适切性要求语言发\n生一定的顺应。所以,语言的变异与顺应实质上是在协调人、语言、社会的关系,\n目的是为了提高运载和传递信息的效率。\n3.1.4.2 修辞效果\n如前文所述,“控”的形成与发展是受表达者的修辞策略影响的,而“控”\n[p.23]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n17\n的广泛使用和影响扩散,则是因为“控”在使用中能造成特殊的修辞效果。\n“控”受其语源的影响,总是令人联想到“情结”,一种不正常的精神状态。纵\n观“控”形成与发展演变的过程,一方面,在语义表达上,“控”原来带有偏执、\n着迷、受制和不由自主的意思,其原有的词义是多重的。随着使用频率的增加,\n范围的扩大,其使用语境也发生了变化,逐渐趋向于随意、中立和调侃,这样的\n语境削弱了语义上的多重性。当一个人说自己是“某某控”的时候,他的意思是,\n承认自己很着迷,但又觉得这不是什么大不了的事情。通过说出自己是“控”而\n消解了“控”的力度。例如:\n(13)我们是十足的数码电子产品狂热者,请叫我们“数码电子控”。\n(14)老妈是“精品控”,老爸是“西门子控”,至于我,就可怜了,“淘宝控”。\n(15)我们生活在这座城市的甲乙丙丁,我们一不留神就成了“时尚控”。\n这些句子所提供的语境都是比较随意的生活化的情景,“控”的力度已大大\n削弱,有时甚至相当于一般的“喜欢”,而这种被削弱的语义反而更贴合语境所\n反映的事实。但是年轻人不满足于原有的表达方式,觉得“喜欢”太一般,即使\n用“极度喜欢”也很难达到他们所希望达到的效果。可以这样说,在具体的语境\n中,“控”被削弱的语义使得其符合真实的生活,而其原有的不能自控的高程度\n语义使得其产生了高于生活的夸张的效果,这种陌生化的略带夸张的修辞效果正\n是语言使用者追求的目标。\n3.2 分析新出现代表人类词缀的“族”\n“族”的解释有四种在《现代汉语词典》中主要是:1家族:宗~_合~_\n同~。2以前的一种非常残忍的刑法,是对犯罪者的家人或者是亲属实行死刑,\n有的甚至株连妻子的家庭以及犯罪的父母等。3种族:这里主要指的是各个团体\n组织:汉~_藏~_维吾尔~等。4表示的是拥有共同特性的一类事物:水~花~\n_芳香~。在新创建的“X 族”词中,“族”的含义更加偏向于词典上第四种解\n释的意思“表示拥有某种共同特性的一类事物”的拓展定义。和第五版《现代汉\n语大全》相比,第六版的把以前的第四种含义又向前做了一定的延伸,把“具有\n某种共同特性的一类事物”拿出来进行单独的解释。这种微妙的变化体现出“族”\n[p.24]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n18\n在被使用后其含义发生改变的这一种现象。“族”的潜在含义并没有被固定,仅\n仅只是侧重于定位以及类化,相当于汉语中的词缀像“打工族”“蜗居族”“北\n漂族”等。\n许多人都认为“族”来源于日本,是根据日语翻译过来的。在我国不断推进\n社会主义建设的大前提下,大量的日本文化流传到我国,和我国的传统文化相互\n交融和合并。中日文化的交流中,语言的交流是最常见到的,中日不断地用语言\n进行交流这就使得“族”字在我国更加的流行和时尚。李晓东(2013)指出,“族”\n本身来源于日本,先进入到我国港台地区后流传到中国大陆。万红(2007)提出,\n“族”是由日本流传进中国的,而且是先进入到中国台湾,后发展到中国内陆,\n“族”本身是由日本流传进来,其含义表示拥有相同爱好或者相似的生活方式的\n一类人。王春娇(2011)也指出,“族”本身并不是来源于中国,目前流行的“X\n族”是外来语汉化的一种表现。不过,不少人并不同意这个观点,认为“族”是\n由我国古代慢慢发展到如今现在这种含义的。如台湾汉语学关专家谢箐玉和许瑞\n峰(2003)通过对汉语的深入研究加上大量的参考文献,运用历时研究和共时研\n究两种方法,证明了“X 族”是从我国汉语发展而来的,他们认为像这样的语言\n虚化的表现形式是汉语语法的改变之一。综上所述,我们可以认定\n“X 族”的使用和发展是汉语自身发展和进步的结果,只是在发展的过程中\n受到了日语的推动作用,这是语言交流中的必然现象。假如汉日语不进行交流,\n“X 族”也会出现,只不过可能需要的时间更加长久。\n在此我们将考查类后缀“族”的读音、使用语法以及类别分别进行研究,然\n后从功能和作用两个方面分析“族”。\n3.2.1 词类“族”的特点\n3.2.1.1\n词类“族”的语言特性\n从“族”类词音节的角度来讲,通常是双音节的语素,加上类后缀“一族”\n后,就组成了一个“2+1”音步的三音节附缀式词组。\n例如:\n(1)鹿城区乡镇部门中的一个大学专业没有要求的职位,竟然有544 名人员竞\n[p.25]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n19\n争,致使其考录比例差距较大。公务员的报考热度日益上涨,致使报考过程中出\n现“考碗族”以及“考霸”的现象。\n(2)“飞鱼族”崭露头角,此类文化现象可以生动地描述成作者在文章结尾处\n点出的“飞鱼”。评论者周梅森点评《巴黎飞鱼》中最吸引观赏者的是逐步描述\n了是“海归”当中的“飞鱼族”。\n除了以上所列举的“考碗族”以及“飞鱼族”这里类外,还有存在部分单音\n节以及多音节附缀式的词组。举例来讲“阅读族”、“家具族”、“工作族”、\n“网络同居族”、“低薪娱乐族”、“手机晾衣族”、“世界自由族”等词语。\n从词语的构成元素来看,“族”的词根大部分是由汉语构成,除此之外,还\n存在英语缩写词以及字母词。比如:\n(3)BOBO 族(布波族)\n该词一开始是出现在纽约报刊著名作家戴维·布鲁克斯的《天堂里的BOBO\n族———世界人才的发展》一书当中。BOBO 这个词组是Bourgeois(布尔乔亚)\n和Bohemia(波西米亚)这两个词语拼组而成。BOBO 族是指拥有资产阶级物质\n的高科技人才,他们在拥有巨额财富的同时,又想追求心灵的解脱,享受放纵与\n流浪。\n(4)SOHO 族\n这个词组代表着居家工作者。SOHO 是smallofficehomeoffice 的简称,其含\n义是小资产投资、居家工作。\n(5)3P 族\n3P 族指生活主要借助电脑、手机以及游戏机,不熟悉现实生活的这类人。\n从“族”的构成元素来看:,除了“族”之外,出现词缀位置上还存在“一\n族”,二者同时存在,举例来讲:“追名逐利族、有车一族”、“龙卡一族、北\n京漂泊一族、青年潮流一族”。大多数情况下相同前位成分能够与“族”和“一\n族”分别组成词组,这样可以迎合不同场所讲话的不同要求。,比方讲“工作族、\n工作一族”,“计算机族、计算机一族”等“一族”与“族”能够相互交换,“一”\n具有调节韵律的功能。\n3.2.1.2 “族”词类的语法特征\n[p.26]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n20\n由词组词性的角度来看,大多数词组具有名词与动词的性质。比方说:“拇\n指族”中年轻人占大多数,“草莓族”曾在台湾盛行,这与年轻人有直接联\n系,......同时也存在以“柿子”、“水蜜桃”作比,他们叫做“柿子族”、“水\n蜜桃族”。“奔奔族”是指物质比较缺乏,自身没有信仰,大多数奔奔族的精神\n比较空虚、缺乏认同感、信仰缺失使得自己的心灵显得比较空洞,价值观扭曲,\n精神萎靡不振。\n从双音节词的内部结构的角度来看,大部分是由动词性以及名词性短语构\n成,比如讲“吊瓶族”、“捕猎族”、“抓狂族”、“信用卡族”、“背包族”、\n“微博族”等这类词语,例如:\n大多数饭店与小食店都出现相似的状况,客人仅仅订购一杯饮料,但是却长\n时间坐在饭店里。少数饭店老板还向记者表示这种状况经常发生,他们将这类人\n叫做“啃椅族”。(《赣州报刊》2006 年8 月16 日)\n他们吃住在学校,连休闲也在学校,生活跟先前类似。最大的不同点是他们\n已经毕业了。这类人叫做“赖校族”。(《青年报刊》2006 年6 月9 日)\n也有一部分形容词性质的词组,比方讲“穷困一族”、“潮流一族”这类词\n语。还有象声、字母以及数字构成词组,比方讲“咔嚓一族、26 岁一族”等。\n这类词语都有一个共同点,不管与“族”组合词组的性质如何,一旦形成“族”\n类词,则统称名词,由此可以看出“族”的语法标志作用非常突出,这一方面与\n“子、头、者、化”这类词缀的语法含义比较相似。\n3.2.2 “X 族”中的“X”的构词法解析\n3.2.2.1 音译法\n音译法是指借助英语的发音转换成汉字的方法。比如:\n(6)嘻哈族\n是指那类装扮非主流,热爱运动的青年人。“嘻哈”来源于Hip-Hop。Hip-Hop\n文化开始于1970 年美洲黑种人在街头进行说唱表演,中文意思是“嘻哈”,90\n年代流行与日本、韩国与台湾,近几年来,大家十分崇尚“韩流”,嘻哈深受\n十七八岁青年人的热爱\n[p.27]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n21\n(7)飞特族\n是由Freeter 这个词翻译而来,Freeter 单词由英语free(自由)与德语的\nArbeiter(上班者)二者组合而成。Freeter 是指随心所欲的工作方式。飞特族一\n般收入较低,他们是只希望拥有自己的自主空闲时间的一类社会人士,更偏爱短\n期工。\n3.2.2.2 比拟法\n比拟法是指借助已有的语言资料,借助比拟、比喻的修辞手法组成新词的方\n法。比方讲:\n(8)草莓族\n该词一开始出现在台湾,借草莓外表鲜艳且比较粗燥,水果不耐压的特点比\n喻20 世纪80 年代后出生的这类人。这类人心里比较脆弱,害怕挫折,这与不耐\n压的水果比较相似。这也叫做“柿子族”或者“水蜜桃族”。“草莓族”也可以\n带表由于新陈代谢紊乱导致脸部出现粉刺与青春痘的一类人。\n(9)夹心族\n这类人既要赡养双方的父母,还要承受抚养孩子的压力,这类人也叫做“三\n明治族”。\n(10)飞鱼族\n这类人他们自己在国内的事业小有成就,但他们却选择了出国深造,这是韩\n国与香港的电视剧中经常出现的情节。\n(11)啃老族\n这类人以前叫做“袋鼠族”,一开始出现在法国的《快报》中,是指该去独\n立生活,自主工作的的人,还行袋鼠一样在妈妈的怀抱里,过度依赖家庭\n3.2.2.3 说明法\n说明法是指借助对事物的描述,从而产生的造词方式。这种方式的优点就是\n词组的比较简单明了。比方讲:\n(12)月光族\n这类人每月工资没有剩余,开销比较大,经常是处于透支状态。主要指自己\n有固定收入的白领以及提前消费的这类人。\n[p.28]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n22\n(13)陪拼族\n这类人是指经常陪同妻子购物的男士。\n(14)网络晒衣族\n这是指经常把自己买的衣服拍照,或者将自己穿上衣服的照片发出来,来显\n摆自己的衣着技巧\n(15)校漂族\n这类人往往由于考研,未就业或这留恋学校的原因,这些毕业生仍然居住在\n学校周围。就目前而言,他们已经毕业了,但是还要借助学校的教育资源生活,\n还一直保留着上学时的生活习惯。这类毕业生被叫做“校漂族”,他们还没有完\n全适应社会,是出于两者之间的“边缘人群”。\n3.2.3 “族”词类的功能分布和构词能力\n从功能分布这一特点上分析来看,因为“族”自身是一个个体词性,在现实\n生活中,作为主语等句子成分的情况较多,因此,从整体上来看,“X 族”都体\n现出个体词性的特点,尤其是充当定语时,都要跟“的”搭配使用。例如:\n(16)由于人们的生活质量大幅度提升,有房族在增加。\n(17)在地铁等公共场合,穿孔一族随处可见。\n(18)广场上的“露天音乐会”,在一定程度上丰富了打工族的精神世界,并使\n城市的夜景更具魅力。\n“族”具有非常强大的生成力,一者,它能够依据使用者的意志、好奇心等,\n在特殊的社会环境下组合成新词,二者,它还能够以“族”类词为前提条件,从\n而衍生出大量,具有相同结构的词汇,比如:“追星族”、“上班族”等,而使\n用最为广泛的是以“车”为结构,而推出的“族”类词,例如:乘车族、飞车族\n等等,不仅出现了这样类似的模仿,而且还会有反仿这一现象,从而构成了一个\n大的词语群。这些不同的词语汇聚在一起,能够体现其存在的内在联系,同时也\n充分的验证了“族”所具有的强大生成力。(曹大为,2007)\n总之,“X 族”在创新新词等过程中,其与常见的附缀式词语是属于同一类\n型的,而且组合结构是固定的,不会独立的成为一个词语,通常位置在词根后面。\n[p.29]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n23\n词根“X”和词缀“族”之间的关系也比较复杂,并非是叠加或者累积,其呈现\n出虚化的特点。同时,“族”在充当名词时,其主要起到一种标志型作用。与一\n般的词缀相比,其虽然存在个性,但是,“族”的词缀化特点十分明显,尤其是\n在创新一个新词时,这种能力就比较突出。“族”的使用范围在逐步变得广泛的\n情况下,其之前的含义就比较单一了,简言之,其在充当定语成分时,功能性成\n分更为突出。由于“族”逐渐呈现出词缀化,所以,在衍生出新词时,并广泛的\n运用。\n3.2.4 “X 族”的历时研究\n在语言研究过程中,可以将研究的层面划分为不同的内容,具体是:共时研\n究和历时研究,在对真实的语言进行阐述时,还会对其进行细致的解说,所以,\n二者必须要紧密联系在一起。上文中所讨论的“X 族”词类,主要是站在共时层\n面进行剖析,下文我们将会立足于语言机制,对“X 族”词类展开研究。笔者认\n为,在语法化演变历程中,“X 族”是“族”词素的一个语言模因,最后,借助\n模仿等手段,将其广泛的运用,而这是站在历时层面展开论述的。\n3.2.4.1 “X 族”的语法化\n语法化(grammaticalization)是指某一语法现象演变的历程,对其展开深\n入的分析,主要是为了掌握其语法的使用范围以及在句子中所充当的成分等。语\n法化的含义是,在对语言的结构与形式进行考察时,对其后期发展的共时因素和\n历时因素进行推测(卢植,2006)。对于社会实践而言,语言在衍生过程中会呈\n现出明显的语法化特点,一般指的是语言实义的虚化,揭示语法成分的这一类现\n象,或者是语法成分由虚而走向更虚的过程,在我国语言界,就将其概括为“实\n词虚化”(沈家煊,2004)。Traugott(2008)在考察不同语言的前提下,提出\n了适用性较强的语法化路径(:实义单位(conent item)〉语法词(grammaical\nword)〉附着成分(clitic)〉屈折词缀(inflectional affix)。在深入阐述\n上文中的“X 族”词类特点及其分布规律时发现,“族”词类的构词成分中比较\n明显的特点是黏着性,一般不能独立组合成为一个词语,只是在“X”词根后依\n附着,这种成分带有标记性色彩。所以,从语法角度上来看,“X 族”是“族”\n[p.30]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n24\n词素演变的新型词语类型,是语法功能作用的结果。“重新分析”(reanalysis)\n和“类推”(analogy)是语法功能发挥的不同方式,相对于一般的语言来说,\n这种演变是十分关键的。类推实际上就是结合不同对象在某个层面的共同点,从\n而类推出其在不同层面的一种情感或者表达方式等,而“重新分析”指某个词语\n等表层形式基本固定,而发生了内部的结构上的变动。类推作用的产生是建立在\n某个一个成分的“聚合”(paradigmatic)点上,然而,重新分析是以语言结构\n为基础,其作用的发挥是在语言结构的“组合”(symptomatic)轴上。在“族”\n发生变化时,从历时层面上分析来看,“类推”所其到的作用比较突出。“族”\n在衍生出新的词语时,其成分是名词,而在其前后都可以组合更多的名词,然而,\n不管是何种组合类型,都能够利用“类推”这一方式,从而创造出新的词语,最\n后的结构就是“族”类词。如:\n名词+族:小说族、音响族、素食族、单身族\n动词+族:领舞族、打工族、涉外族、接送族、旁听族\n形容词+族:新新一族、新酷一族、前卫一族、国际自由族\n字母+族:T 族、G 族、e 酷族、BP 族、QQ 族、BOBO 族、NONO 族\n由此可见,“族”的变化过程是,从不定位的语素--定位的类后词缀,而且\n词缀会逐渐带有表纯语法特点,在逐渐虚化时,会在其他词“X”之后紧紧依附\n着,然后演变为一个固定结构的词“X 族”。\n3.2.4.2“X 族”的模因论阐释\n模因理论认为,模因这种现象跟人类的基因特点存在较大的共性,他代表的\n是一个文化或信息单位,在采用复制等方式下,将其传播出去。“模仿”主要为\n模因的识别与分析提供了理论前提,不管是何种信息,从广义的角度上来看,只\n要会成为一个“模仿”的本体,并可以被“复制”,那么我们就可以视他为模因\n(Blackmore,2007)。那些思想、行为、文化、风俗等都可以看作是一个模因,\n同时,因为语言自身就是一个模因,所以他跟语言之间存在依托的关系,不管是\n词语、句子、词汇、文章等,只要可以被模仿,那么就应该是一种模因(谢朝群、\n何自然,2007),所以,在社会上出现了“语言模因”(\nmemes\nlinguistic\n)的说\n法。可见,“X 族”本质上就是一个语言模因,由于法语化趋势更为名下,所以,\n[p.31]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n25\n“族”逐渐演变为“X 族”,并且还成为了一个类词缀,使其在其他词根“X”\n后面紧紧的依附着,最后创造出“XX 族”,然而,“X 族”在复制构成中,所\n采用的形式是保持不变的,比如:暴走族、刷卡族等。何自然(2005)认为,语\n言模因信息的模仿方式,主要是两类,具体是:基因型和模因的表现型,模因的\n基因型,其内容是稳定的,但是,模因形式存在较大的差异性;模因的表现型刚\n好与之相反,那么“X 族”模因的复制就应该被划分为模因的表现型,这是站在\n词层面进行分析的。模仿行为的实施过程会带有意外的效果(Blackmore ,1999),\n模因就是通过模仿,而被传播出去,而在模因的复制过程中,这两个基本方式在\n现实生活中就十分常见。\n模因复制过程中最为常见的方式之一就是重复,他们可以被划分为不同的类\n型,具体是:直接套用和同义异词。在讲话期间,为了描述自己的想法和意见,\n会直接借用名人的语句等,这就属于直接套用的方式。如果面临跟之前词语环境\n存在较大共同点的情况,模因通常会借助这种手段,在模仿的过程中将其传播出\n去。同义异词即同样的信息内容,但是却使用不同的方式或者手段将其传播或复\n制出去。在现实生活中,出现这样例子较多的是针对相同的事物,由于所处的社\n会时期以及场所等存在较大的差异性,所以,说法也会随着使用者的意志、情绪\n等呈现出不同的形式。(何自然,2008)\n前文所谈及到的,类推实际上就是针对不同的对象,从来对比其存在的共同\n点与不同点,从而类推出他们在其他层面存在的共性。通常来说,类推有两种方\n式,具体是:同音类推就是利用词语的谐音,从而组合成一个全新的模因变体,\n这个类推的过程是从一般--特殊。如模仿“草木皆兵”创造出谐音词语“草木皆\n冰”,该词语所要表达的是气温非常之低,草木都已经结冰了。在现实生活中,\n比较常见的同音类推方法就是广告、新闻等,比如:“闲”妻良母等。与同音类\n推相比,所存在明显的区别的是,同构类推所代表的是对当前语言结构形式的模\n仿基础上,从而延伸出一种全新的形式、内容等的模因变体(何自然,2008)。\n在类推期间,语言结构是固定,不会由于在创造新词时而发生变动,但是,语言\n内容会随着使用者的意志以及社会环境等出现较大的调整,所以,我们依照这种\n规律,从而创造出结构相似的句子,并借助此方式,模仿并传播该模因。如:\n[p.32]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n26\n(19)\nnot\nor\nsmoke\nTo\n,\nquestion\na\nis\nthat\n.\n(20)文章跟姚笛两人的“艳照门”事件。(百度娱乐)\n例(19)由名句“\nbe\nnot to\nor\nbe\nTo\n,\nquestion.\na\nis\nthat\n”,其是在同构类推\n的基础上产生的。例(20)中的“艳照门”,就是由之前的“水门”事件为模因。\n按照这样的规律,通过模仿,然后展示出来,与此同时,联系上文中所提到的“X\n族”词类中“族”语法化类推历程,我们发现,同构类推是“X 族”模因模仿的\n主要方式。所以,假如将“a 类”比喻为从事为某事物的一类人,那么同样可以\n衍生出同一属性的“b 族”,按照这个方式推广下去,凡是从事的人都可以以\n“族”来称谓,所以“X 族”模因也被复制出去,只要是从事某项行为的一类人\n就是“X 族”,如“追星族”等等。\n有时我们也会遇到“X 一族”的词类,如“新新一族”等,笔者认为,“X\n一族”就是对“X 族”语言结构的模仿,从而衍生出模因变体,二者两者都可以\n表示“具有相同特点的一类群体”,但他们也有差异性,所以会结合具体的语言\n环境而合理使用。通过对比发现,“族”义的虚化性会超过“一族”,“族”可\n以代表个别群体,也可以是个体(曹大为,2007:152)。\n由此可见,“X 族”词类的产生的理论基础就是语法化和模因论,与此同时,\n其也为语言的进化过程提供了解释的依据。通过语言模因的模仿等,新词会大量\n的出现,从而改变了传统的表达方式,而这种语言表达会受到更多群体的关注。\n通过归纳“X 族”的研究结果,我们认为,语言系统十分开放而强大,在同\n一时期,其变化程度不大,但是随着社会的发展,在不同的阶段,会存在较大的\n差异性。语言有多元化的演变方式,比较常用的就是模因传播和语法化。在“X\n族”词类的变化历程中,“族”词素的语法化更为突出,而且成为类后词缀,而\n“X 族”却成为了一个语言模因,依照此结构而将创造的词语传播出去,而这些\n词汇的表达方式也十分多样。所以,语法化的结果就是有些词汇语会成为语言中\n的词缀等,词缀跟其他的构词结构,实际上都是语言模因,如“X 门”等,这种\n语言模因在模仿的基础上得以衍生,并用以表达不同的思想,这样就使得语言的\n表达方式呈现出多元化的特点,促进了语言的发展与进步。\n[p.33]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n27\n3.3 浅析新兴指人类词缀“二代”\n如今,“二代”在各大网络社交平台上频频出现,如“官二代”等,这些“二\n代”现象出现时的最初形式是“富二代”,“富二代”一词是在我国一档访谈类\n节目《鲁豫有约》中出现,指的是我国在实施市场经济以后成长起来的第一批民\n营企业家“富一代”们的下一代,他们凭借着对父母辈财产的继承,物质条件较\n好,所以称为富二代。在这以后,很多“二代”们先后被网民创造出来,简言之\n就是目前所常见的“某二代”类词。在远古或者封建社会,“二代”就已经出现\n了,但是,其含义跟现在相比存在较大的差异性。\n3.3.1 “X 二代”类词的来源及意义\n“代”在《说文解字》中解释为“代,更也。凡以此易彼,以后续前,皆日\n代。“二代”一词的初始含义是两个朝代。(汉语词典)如《论语·八情》:“周\n监龄二代,郁郁乎文哉!”邢是疏:“二代,谓夏、商。”这里“代”就是朝代\n的意思,到了唐朝,百姓为避免触犯李世民的忌讳,将“世”写成“代”,从这\n以后,这种说法就一种被保留了下来。“代”也有了“世”的意味。父子先后都\n同属于一个朝代。如王维《李陵咏》中“汉家李将军,三代将门子。”其中“三\n代”就是爷爷、父亲、孙子这三代人。当前,“某二代”中“代”也暗含了祖辈\n的继承关系,但是,其侧重于与“某一代”有继承关系的后一代人,指“某一代”\n的的儿子或者女儿等群体,如“富二代”就是“富一代”的后代人等。\n3.3.2 “X 二代”类词的语用特征\n在语义表达层面,“某二代”类词指的是与“一代”在思想、情感等领域存\n在的共性,同时,由于“一代”们的这一特点十分明显,比如:“富二代”基本\n上都会被认为是家庭资产多,收入水平高的群体,因为他们父母那一辈人物质财\n富较多,所以,他们的生活高枕无忧,同时消费能力较强;跟其相反的是群体是\n“贫二代”,他们的家庭条件不好,生活拮据,受教育机会不大,无法走出贫穷\n的境地。\n在表达情感层面,在使用“某二代”过程中,大多会带有使用者讥讽的意味\n[p.34]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n28\n如:\n(1)“......我家里很穷,不是富二代,都是社会最底层的人......”\n(2)“......官二代为什么会实现理想抱负?......”\n(3)“......如果废除高考这一制度,我们有什么资格跟星二代相比?演绎再好顶\n用吗......”\n(4)“......农二代在城里只能去最便宜的地方吃饭,把省下来的钱用于买房娶\n媳妇......”\n(5)“......穷二代非常看重钱...他们还特别喜欢打架......”\n从前三个例子中发现,使用者心理有一种愤懑的情感色彩,而且还有嘲讽意\n味。如今,“某二代”就成为了一个标志性的记号,在划分某类人时,只要其跟\n你“权”等存在联系,那么就会被化为“某二代”的范围,这就使得劳苦大众产\n生一种抵触或者是排斥的心理。他们会联系到社会的不公正现象,或者是潜在的\n利益,从而滋生一种批评性的情绪。与此相反的是后面两个例子,那些“贫二代”\n们,在现实生活中使用时,所体现的是一种抱怨的心态。\n3.3.3 “二代”类词缀流行原因\n3.3.3.1 语言外部原因\n1.经济与社会阶层因素\n从1978 年开始,我国就逐渐开始实施市场经济体制,社会的资源分配格局\n发生了重大的变革,之前的社会层次也被逐渐优化,尤其是贫富分化现象的加剧,\n使得低收入群体的消费能力较低,而且成为社会的边缘人物,这种地位上的悬殊,\n会随着人口结构的变化而更为明显,并呈现出“遗传性”特点,上一辈人的有利\n条件或者是不利条件等都会在下一代人身上反射出来,使下一代人的身上被贴上\n这样的标签,以致于“二代”现象出现,这就为“X 二代”类词的衍生提供了必\n要的社会环境。\n2.二代们的炫耀心理和大众们惯性心理因素\n一些“二代”们存在着夸耀的心理,导致了社会各界人士对“二代”这一群\n体引起了高度的重视,并成为其嘲讽的对象,另外,该词语实际上是一种贬义词。\n[p.35]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n29\n如王健林的儿子王思聪,他说“我交朋友看重的不是你是否有钱,因为他们的钱\n都没有我的多”的炫富行为等。所以,我们眼中的“富二代”基本上就是挥金如\n土的代名词,“官二代”则成为以权谋私的说法。除此以外,从人类本质上来看,\n大多数人都安于现状,比如:我国的农民阶层,由于受到了男耕女织,小农经济\n等影响,他们不愿创新,喜欢故步自封,实际上,他们十分卑微,也明白了阶级\n之间的差异性,但是,因为这种生活惯性因素的存在,导致他们所培育的下一代\n也具有这一属性,可以称为是“贫二代”,并且这一定律被更多的人所认同。\n“二代”的出现跟人们的心理需求是一脉相承的。“富二代的丑闻被公之于\n众之后,很多人对其产生了不满情绪,而且带有一种嘲讽的意味。他们凭借出身\n背景上的优势,不去劳动,反而还扰乱社会;当前,社会贫富良机分化严重,以\n致于人类的敏感神经不断紧绷,究其原因,主要是由于社会对第二代人的感情、\n思维等无法理解或感知,所以将此划分到这一范围。实际上,这也是由于社会制\n度的缺乏以及市场经济的弊端而导致的。“X 二代”新词非常的形象,能够使大\n众的心理得到较大程度的满足。\n3.网络为这类词语的传播提供了便捷的渠道。\n我们通过查询“某二代”类词语看到,这些词语基本上都出现在网络上,比\n如:微博社交平台。而在网络文学中很少使用,所以,可以认为网络为“某二代”\n类词的复制提供了便捷的渠道。网络语言比较灵活,而且受到的限制较小,网民\n可以结合自己的意志,从而随意阐述自己的观点、态度等。作为网络平台,其逐\n渐成为人类表达思想情感的重要途径。\n3.3.3.2 语言内部原因\n第一是语言的生成性。徐盛桓(1984)指出:“语言系统十分开放,同时其\n具有较强的生成性特点,主要借助有限的手段,从而达到无止境运用的目的。”\n考虑到语言的这种特殊属性,人类就会依据当前的结构,从而满足无限运用的目\n标。语言的这种生产机制,会导致类词缀化特点更加明显。“X 二代”词族,实\n际上就是从“富二代”演变而出的“官二代等关联词,所以,导致“二代”的能\n产性就比较强大。\n第二是类推仿造法的广泛运用。“X 二代”的使用范围十分广泛,而且跟现\n[p.36]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n30\n代的造词结构存在着紧密的关系,同时在分析该此法时,就自然联想到“词语模”。\n李明宇首次提出“词语模”的理论定义,他认为:“词语模是创造词语的一个框\n架,其组成部分分为两大类,分别是:‘模标’和‘模槽’”。比如:“富二代”\n中的模标就是“二代”,能够将“官”的位置替换掉,那么就成为一个“模槽”\n了。因为结合“词语模”类推仿造法,在使用该词语时,就会出现“X 二代”词\n族,所以,导致在社会上频频出现“二代”构词形式,而“二代”的类词缀化特\n点更为突出。\n3.4 浅析新兴指人类词缀“奴”\n3.4.1 新兴指人类词缀“奴”的起源\n有关“X 奴”类词语的最初发展现状,我们产生了不同的看法:如果是出于\n借词,那么他就是一个从外面被引入的词语;假如是仿古词,那么就跟我国古代\n社会存在紧密的关系,这就是古人造词的缘由。\n关于借词说,学界有两种意见,有的人认为是从台湾借入的,有的人认为是\n其他国家。这是由于,在很早的时候,“卡奴”一词就产生了较大的意见分歧。\n“卡奴”是指台湾地区金融机构将在90 天内没有能力偿还信用卡的人。2005 年\n12 月6 日,台湾还在某次会议中提到了要“解放卡奴”的倡议,从这以后,“卡\n奴”一词就在社会上大规模的使用,而且家喻户晓。2005 年12 月21 日,《人\n民日报》就发表了与“卡奴”相关的文章,这就是最早出现这一词汇的书面证明\n资料。专家们认为“卡奴”借入后,就衍生了大量的“X 奴”类的词语。认为该\n词语出自于美国的专家,其依据是在2001 年海南出版社出版了某学者撰写的写\n的《Net Slaves》,译名为“网奴”,在对美国的网页进行查找与搜索时,可以\n看到较多的是:\nSlave\nMortage\n———按揭奴\nSlave\nHouse\n———房奴\nSlave\nCar\n———车奴\n[p.37]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n31\nSlave\nCard\n———卡奴\nSlave\nWage\n———工资奴\nSlave\nGasoline\n———汽油奴\n第二种说法实际上是一种自源说,也有人提出“X 奴”类词语在很早时期就\n已经出现了。有的专家认为,在我国远古社会,就有类似的词语产生。比如:“书\n奴”指对他人的书法一直模仿,缺乏自身的特点,没有创新的意味,所以成为书\n法奴隶的一类人呢。唐代僧人亚栖的《论书》:“若执法不变,纵能入石三分亦\n被号为“书奴”。元明清时期,“书奴”就是专业书论的代名词。“诗奴”指不\n能由自己的性子和思想来创作诗词,被其结构形式而拘束。如苏轼的《赠诗僧道\n通》“从今岛可是诗奴”。苏轼就将贾岛这种人称为是“诗奴”。而“卡奴”等\n是对“诗奴”等词语的模仿而产生的新词。“书奴”等是“X 奴”类词语的早期\n面目。我们认为在古代,“X 奴”类词语就在社会上广泛的运用。通过分析“X\n奴”的结构得知,不管是“X”还是“奴”,他们的构词语素都是保持不变的,\n同时也具有稳定的特点。因此,不能使用英语翻译法,将“网奴”作为“X 奴”\n类词的初始化。台湾的“卡奴”一词赋予了人的生命力,由于词语的普及,所以,\n使中国人的脑洞大开,就延伸出了大量跟“X 奴”类相关的词语。\n3.4.2 “X 奴”的构成和搭配\n本节所分析的主要内容是:“X 奴”中“X”的音节特点;“X 奴”的使用\n以及组合等。\n3.4.2.1 关于指人类词缀的词根“X”\n从音节数对“X”进行研究,在现实生活中,“X”基本上都是单音节语素。\n之后,在其后面会添加同类的类词缀“奴”,这样就演变为一个双音节合成词。\n例如:房奴等。在这些“X”中,他们都是充当名词的成分;但是,有些充当的\n成分是动词。其具体划分为:1.表示心理、感情类的动词,比如:爱奴、恨奴、\n怨奴。2.也有表示动作类的动词,比如:考奴、教奴、学奴。应该要引起主义的\n是,充当动词成分的“X”出现的次数很少。\n排除单音节语素所组合而成的“X”外,“X”的结构也可以为双音节形式。\n[p.38]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n32\n但是,这样组合的情况并不多见。这里的“X”和后面的类后缀“奴”联系在一\n起,就成为“2+1”式合成词。如:工作奴等。在这些“X”中,具体使用的方\n式有:\n1.大多数成分都充当的是双音节名词。如:电脑奴、美国奴、零食奴等。\n2.少部分充当的是动宾成分。如:看钱奴、守财奴、考研奴、出国奴等。\n这里应该要考虑的是,由于“X 奴”这一新词语正在演变,因此,“X 奴”\n的词意以及表达方式会受到客观环境或者是主观意志等因素的作用,其所会出现\n的情况有:1.针对含义相近的词语,到底使用何词作为“X”以及后面的“奴”\n组合,从而创造出一个新词语呢,这就存在较大的不稳定性,比如:“机奴”和\n“电脑奴”等,实际上,他们的所要表达的意思相近,就是使用的构词法存在较\n大的差异性。2.相同的词语成“X 奴”,也能够产生不一样的含义。比如:“车\n奴”不仅可以代表油价上涨,导致用车的费用在增加,所以被迫省钱来养车者,\n另外,也可以代表的是害怕自己的代步车被偷窃,所以整天都产生一种焦虑的心\n情的人。3.合成的原始阶段,较多词语的含义让人难以理解,比如:“基奴”中\n“基”,实际上代指的是基金等。\n3.4.2.2“X 奴”的句法功能\n“奴”自身就是一个体词性语素。在跟其他词语组合之后变为“X 奴”,但\n是他仍然在句子中冲淡定语等成分,并呈现出体词性的特点。\n(1)居住在北京中关村的张丽在购买几次基金后,就将自己称为是“基奴”:\n他每天都会翻阅相关的金融资料,了解市场汇率变动的趋势,同时还订阅了与基\n金相关的杂志期刊,并在网上时刻关注有关基金的最新消息等。“基奴”热情在\n短期内难以抑制。\n(2)非要在成为房奴以后,再变为车奴。\n(3)房奴的“幸福感”。\n(4)“白奴”是怎么演变为宾语成分的“X 奴”,一般在使用时会跟“是、解\n放”类动词进行搭配。\n(5)老公出差,我在家里成为一个彻底的“性奴”。\n(6)特别渴望我国也出现像马丁路德金解放美国黑人奴隶那样,将“学奴”解\n[p.39]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n33\n放出来。\n从“X 奴”的构词特点以及分布规律来看,“X 奴”和其他的后缀组合的固\n定模式是“X 者、X 型、X 性”,他们的造词形式以及语法作用都没有较大的变\n化,因此,只要是“X 奴”构成的附加后缀式词,都可以将其化为同一个范畴意\n义。\n3.4.3 “X 奴”的语义分析\n“奴”是一个会意字,有关书籍中是这样诠释的:“奴,奴婢,皆古之罪人\n也。《周礼》曰:其奴,男子入于罪隶,女子入于春藁。“从女从又”《现代汉\n语词典》(增补本)奴的解释具体为以下几个:1受到旧社会的挤压、丧失自由\n的人,与“主公”的地位是相对立的:~隶农奴。2年轻女子的自称。3使用对\n待奴隶等类似的方式:~役。通过细致的比较这三个义项发现,任何的义项都没\n有“X 奴”类词语中“奴”的含义。可见,这里的词语,从最初到现在都出现了\n很大的变化。前三个就是字典中所梳理的原始含义,而后面几个就是后来的延伸\n含义。因此,我们应该对“X 奴”类词语进行这样研究:受某些事物的牵扯;与\n他人的关系保持独立的人。属于中性词语,只是一种称谓。带有讥讽、嘲笑的意\n思。\n3.4.4 “奴”作为新兴指人类词缀出现的原因\n现代汉语词典中针对“奴”字做出了下列几个注释:1被旧社会压迫,丧失\n自由权等人,与“主人”这一地位是对立的。2指的是丧失人身自由的人,特定\n指的是为了还贷而努力工作的人,带有嘲讽的意味3对自己一种谦虚的称呼,女\n子专用作为的称述。4就像奴隶一样的待他。通过对比这几个词意发现,前三个\n出现的都是名词形式,最后一个是以动词形式出现;从情感层面分析来看,前两\n个和最后一个的情感色彩是负面的,语义情感是“为了他的利益而被迫这样”,\n人身失去了自由,第二个则是“以谋取自己的利益而必须”,虽然有自由身,但\n是有较强的个人欲望,情感是正面的;从范畴化正反两个层面分析来看,第一个\n和后两个都是“奴”的初始范畴,所要展示的含义是“丧失了自由身,附属性”,\n[p.40]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n34\n而第二个和第一个是隐喻,是认知主体对“奴”这一词意的拓展,在体验性感知\n的基础上,人类对实践活动表现出了心理上的定义。“奴”作为新兴指人类词缀,\n其范畴意义由最初的“没有人身自由等”--“为自己的利益而努力奋斗等”的\n过程。所以,“奴”作为新兴指人类词缀,其词意是逐渐丰富的,也反映了人类\n的认知变化趋势。\n首先,从人脑的体验性来看,“奴”作为新兴指人类词缀,与其存在紧密的\n关系,从原始社会,“奴”就诞生了,其贯穿了整个封建时期,“奴”的范畴意\n义都是指“人身自由被剥夺”的底层社会人。由于信息科技水平的突飞猛进,房\n奴等新词不断涌现,实际上,这就是认知主体对社会发展现状的感知与理解等。\n人脑是一个体验外在世界的器官,由于社会的进步,人的大脑也会不断进化,这\n是社会实践发展的结果,呈现出非常明显的体验性特点。新兴指人类词缀“奴”\n的使用,是随同社会竞争或生活压力的增强而对自身发展所提出的一种更高的要\n求,是人的大脑在接触外在物质世界时所发生的适应性调整变化。雷卿(2012)\n认为感知是人的脑器官在认识客观世界以后的反映,这种感知的源头是建立在对\n外界的分析、过滤等基础上。按照这个理论说法,“奴”族新词亦也就是指在认\n知主体的大脑器官在对外界事物进行体验或加工的过程中而呈现出的一种状态,\n比如:油价上调、考取各种资格证书等,然而,这种感知的出现是以社会实践活\n动为依托,最后创造出“奴”这一新兴指人类词缀,总之,所有的感知活动都必\n须要依靠人的大脑器官来进行体验。\n第二,从认知机制的体验性来看,“奴”作为新兴指人类词缀与其存在紧密\n的关系。认知为人类了解客观事物以及进行语言或情感上的沟通起到了衔接的作\n用,同时具有意向性等特点,在利用人脑这一载体的基础上,从而展现出较强的\n体验性。“奴” 作为新兴指人类词缀,按照认知主体的意志,“奴”的内涵不\n断被丰富与完善,其范畴意义变为“获得自由、以利益而战”,跟之前的“人身\n自由受限、没有社会背景”的范畴意义截然不同。徐盛恒等人(2010)指出在意\n向性发生时,感知才会出现,然而,意向性所涵盖的内容有:个体、群体意向性。\n这就使认知特点更为突出。“奴”族新词是通过人在社会生活中的感悟或理解等\n而产生的一种心理上的特点。房价上调的购房压力,导致人们必须要拼命工作赚\n[p.41]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n35\n钱,从而来提升住房质量,这样,个体意向性、群体意向性会随着实践主体的认\n知过程而衍生出“房奴”这一新词;更多的面试者会将自身的受教育层次提升,\n通过考取资格证书来体现自己的学历、素质、能力等,所以,出现了“学奴”等;\n为了赚取更多的钱,达到人生的奋斗目标,出现了“钱奴”等新事体。这些都是\n认知主体站在自身利益的角度上,从而对社会某一实践活动所发出的体验,在认\n知程度加深的过程中,这一群体的规模也在扩大,“奴”族新词的演变历程是:\n个体意向性--群体意向性,最后在社会上形成主流意识。这些“奴”族新词,主\n要是为了满足自身的利益而形成的一种认知机制,其目的是为了将认知主体的情\n感、思维等展示出来,这是社会发展的过程中,人类对实践认知的结果体现,同\n时,借助“奴”这一类词缀,从而对这种体验进行心理上的加工,最后反馈出来。\n因此,“奴”作为新兴指人类词缀,其出现的过程,实际上就是认知主体对社会\n实践的体会以及感受的过程。\n第三,“奴”作为新兴指人类词缀与语言体验性之间存在紧密的关系。王寅\n(2006)认为在词汇等层面,语言体验性的作用十分突出。这对认知“奴”族新\n词具有一定的指导性。从构词结构上来看,“奴”字可以被分为“女+又”,起\n初,“奴”就是“罪人”的含义,之后代表的是社会地位较低的群体,在封建社\n会,女性不被重视,体现“社会附属性”特征,所以,它的范畴意义引申为“社\n会地位低下”等主要语义特征。\n因此,从“奴”的结构以及音义上分析来看,这体现了社会不断进化的过程。\n“奴”在当前的汉语中,其新兴指人词缀比较常见的是,比如:“拼命工作”等\n词意的代名词。将“奴”的范畴意义跟之前意义相比,是存在共性的,主要是由\n于在现代社会,“奴”作为类词缀,其主要是代表的是一种语言符号,另外,它\n的家族共同点比较突出。与原范畴意义存在较大差异的是,“奴”的新范畴意义\n还覆盖了“享有平等社会地位”等。为了满足自身的住房需求,而向银行等金融\n机构融资,并通过辛苦工作来偿还信贷,这样一类人就统称为“房奴”;为了出\n行便利而购车,这类人就称为是“车奴”等。这次词组的出现,象征的是现代化\n人类的某种生活所需,其产生跟社会实践活动等息息相关,也与人自身的思想、\n情感等有紧密的联系,出现的“人”服务同时还受到“物质利益等”的影响,这\n[p.42]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n36\n种追求自身利益的体验感会让感知主体自然想到“奴”的范畴意义,在将其内涵\n进行梳理以后,最后,“奴”作为类词缀出创造出更多全新的词语,主要是用以\n展示人内心的情感等特点。站在词汇化的视角上分析来看,这就突出了“奴”类\n词在构成新词语时具有较强的社会体验感与解释力。\n3.5 浅析新兴指人类词缀“帝”\n当前,由于“表情帝”等不是“皇帝”的“帝”被广泛的运用,一种新兴指\n人类词缀“帝”愈发展示出其突出的能产性特点,所以,更多的专家以及学者等\n将其作为研究的重点。本章节所分析的主要内容是词缀“帝”与其他词语组合而\n出现的新兴词语模式“X 帝”,并对其特点等进行细致的归纳与梳理。\n3.5.1 句法结构特征\n词语模一般“由模标和模槽两个部分构成,模标是固定成分,一般起类别标\n示作用,模槽是非固定成分,起填充替换作用。语用主体可以根据表达的需要,\n在模槽里填上一定的语言成分———语素、词或短语,从而创造出新的词语”。\n(龚娜,2010)根据李宇明对词语模的分类,“X 帝”词语模应属于“前空型”\n词语模,前边的模槽“X”可以是语素、词或短语,甚至英文单词、英文单词的\n缩写,具有多样性特点。如,“乳帝”中的“乳”就是语素;“石帝”、“熊帝”\n中的“X”就是单音节词,“内幕帝”、“表情帝”中的“X”是双音节词;“秒\n房帝”、“技犯帝”、“贺岁帝”、“超级模仿帝”、“民工摇滚帝”、“人品\n运气帝”中的模槽就是双音节及多音节短语;“offer 帝”、“cos 帝”中的模槽\n是英语单词和英文单词缩写。\n从“X 帝”的构成成分来看,模槽“X”为双音节词语的结构居多,且以名\n词性成分和动词性成分为主。如:“精英帝”、“表情帝”、“真相帝”等。\n当“X”为形容词性成分时基本都是具有描写性的性质形容词。在其音节构成中,\n双音节词占大多数。因此,“X 帝”的主要构成模式为“双音节词/短语+帝”,\n这也反映了当代汉语构词的新特征:\n“汉语词缀一向以构成双音节的派生词为主,\n单音节+词缀(词缀+单音节),是汉语双音化传统的体现。但现阶段‘单音节+\n[p.43]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n37\n词缀’的双音化格式,已成弱化趋势。代之而起的是‘双音节+词缀’的势头,\n三音化成了带词缀新词的主流。”(沈孟璎,1995)尽管“帝”在此处并没有形\n成真正的词缀,但其作为类词缀,词缀化的倾向已经出现。\n作为模标,类词缀“帝”的定位性是构成“X 帝”词语模的前提。而利用特\n定框架,运用类推方法批量创造出”X 帝”类新词语是该词语模存在的动因。名\n词性结构、动词性结构、形容词、区别词,甚至英文单词、英文缩略语都可以作\n为待嵌词语与“帝”结合,结合后的新词语在功能类型上均为名词性成分,即“帝”\n族词的性质均呈现出名词化特征。关于类词缀“非独立成词性”的特点,”帝”\n作为成词语素独立充当句法成分的例子并不多见,而且一般见于新闻标题中。\n如:\n(1)山西大学生电影节封帝苏有朋新目标冲击金马(新浪网,2010 年11\n月30)\n(2)人民选择大奖约翰尼·德普称帝,成龙获封“动作影星”(凤凰网,\n2011 年1 月7 日)\n(3)章子怡被看中演3D 花木兰王学圻有望戛纳夺帝(东方网,2010 年5\n月23 日)\n(4)世界杯新帝完成征服团队梦幻智者主帅功不可没(搜狐网,2010 年7\n月13)\n(5)气质非凡塞班3 新帝诺基亚C7 低价促销(中关村在线,2011 年1 月7\n日)\n作为一个历史词,“帝”从古代汉语的成词语素发展到现代汉语,一般不能\n独立成词,必须与其他语素结合表义,如:上帝、天帝、皇帝、帝都、帝京、帝\n王、帝子等。“封帝”、“称帝”尽管沿用了古代汉语的结构形式,但“帝”的\n词汇意义由“古代的君主、皇帝”到“某一领域里有专长者”已经发生了泛化、\n转移。\n在例(1)~例(3)中,“帝”作宾语,义为“在某一领域获得最高荣誉的\n人或团体”。如例(1)中“帝”指的是2010 年山西太原大学生电影文化节“最\n受大学生欢迎男演员奖”。例(2)中的“帝”义为美国2011 年人民选择奖颁奖\n[p.44]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n38\n典礼中的“2011 年最受欢迎男演员奖”。例(3)中的“帝”专指戛纳电影节“最\n佳男演员奖”。\n例(4)~例(5)中,“帝”都作主语中心。在例(5)中,“帝”与另一\n个主语中心“诺基亚”构成同位关系。“帝”作主语时不可单用,前面必须有修\n饰限制性成分,这是由“帝”表义的模糊性决定的。因为“帝”出现领域的不确\n定性,以及其“天、神、君王”等词义的虚化,致使“帝”独立作主语时容易陷\n入语义指向不清的尴尬,所以“帝”作主语中心时,前面一定会出现表范围或表\n性质的修饰性成分。例(4)中“帝”指世界杯比赛中的最终获胜国,例(5)中\n的“帝”指的是采用了Symbian3 智能系统的手机极品。这样,“帝”又出现了\n另一个新义,即“某一领域的领军人物、团体或产品”。\n综上,“帝”在个别新闻标题中虽可独立成词,但成词能力较弱,特别是在\n充当主语中心时必须前加修饰限制性成分。作宾语时,虽保留了古代汉语的结构\n形式,但词义已发生转移并且呈现出泛化的特点。所以,“帝”虽然不完全具备\n“非独立成词性”的特点,但据其成词能力的弱化与词义功能的泛化特点推测,\n“帝”在未来有向“非独立成词性”动态变化的可能。\n比较《现代汉语词典》“帝”的释义:(1)宗教徒或神话中称宇宙中的创\n造者和主宰者:上帝、天帝、玉皇大帝。(2)君主,皇帝:称帝、三皇五帝。\n在“X 帝”结构中,原有的“天神”义与“君主”义已经虚化,取而代之的是转\n移、泛化后的新义:“某一领域有专长或突出特点的代表人物;最能突显某特色\n的物品。”如:\n(6)内幕帝曝西班牙队将访华超低出场费便宜球迷(腾讯网,2011 年1 月8 日)\n“内幕帝”:了解内幕比较权威的人。\n(7)从“穷小子”到“练摊帝”(《甘肃日报》,2011 年1 月5 日)\n“练摊帝”:从摆地摊开始创业成功的人。\n(8)一男子用粉笔画出3D 效果被捧为“粉笔帝”(搜狐网,2010 年10 月21\n日)\n“粉笔帝”:能用粉笔写出超常效果的人。\n(9)毕业生45 天赢得11 家名企青睐获封“offer 帝”(腾讯网,2011 年1 月\n[p.45]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n39\n5 日)\n“offer 帝”:收到录用信最多的人。\n(10)COS 帝陈汉典百变雷人(环球网,2010 年12 月16 日)\n“COS 帝”:最擅长角色扮演或服饰扮演的人。\n(11)操控帝动力帝!一汽丰田新锐志上市新车解析(汽车中国网,2011 年1 月\n5 日)\n“操控帝”“动力帝”即在操控功能和动力方面都非常出色的汽车。\n(12)“石帝”田黄价比金贵(博宝网,2010 年12 月9 日)\n“石帝”:寿山石中最珍稀的品种田黄。\n词汇意义的转移、泛化并不能等同于词汇意义的大部分虚化,从此意义上\n讲,”帝”还不能真正看成是词缀,而只能说“帝”有向词缀发展演变的趋势,\n我们且称作为类词缀。\n3.5.2 语义演变的隐喻认知考察\n认知语言学理论提出,隐喻是人类对社会的一种感知模式,暗含着人物的思\n想、情感等,属于一种表达方式或技巧,也是产生新词意的根本动力。实际上,\n语言在描述或者是感受物理世界时,是会受到人思维结构等因素的制约,并非是\n直接反馈出来的。人类对世界的了解过程中,会呈现出明显的概念化特性。抽象\n概念的产生,往往需要结合人类的发展历史等,在此条件下产生隐喻思维方式,\n由于隐喻能够将理性与想象有机的融合在一起,通过发挥人的想象力,从而在大\n脑中产生一种抽象化的概念。\n隐喻是“通过阐述某一个事物,进而将另一个与之相联系的事物认知方式进\n行替换”(赵艳芳,2000),这反映的是源认知域投射到感知目标区域的过程。\n其代表的是A、B 两个不同认知领域的事物,在隐喻结构中存在一定的关联性,\n通过对A 进行描述,进而来将B 替换掉,这是由于“人类在对他们进行认识和了\n解时,出现了一种联想性的思维,所以,在感知两种不同事物的基础上,从而来\n体验或者是理解客观世界的实际情感与思想等” (赵艳芳,2000),因此,在\n人类对整个世界进行认识和感知时,这就充分体现了隐喻性特点。“帝”的词意\n[p.46]\n第3 章新兴指人类词缀解析\n上海师范大学硕士学位论文\n40\n由最初的单一化,逐渐被泛化。其指的是人们在对某一领域进行感知时,使用隐\n喻思维,从而将其概念投射到另外一个区域的现象。\n我国相关数据显示,在人类发展历史上,有关“帝”的初始义诠释较多,其\n中,影响范围最为广泛的就是“花蒂说”。我国清朝时期的著名学者吴大澄就“帝”\n的字形,从而联想到金文字形跟花蒂形之间的关系,王国维对此说法也表示高度\n的认同,除此以外,郭沫若也有过具体的诠释:由此可见,“花蒂说”所体现的\n是在原始社会,人类对生殖的敬畏。因为古代人的思想比较保守、落后,而且在\n认识事物时存在能力上的局限性,另外,在感知或解读生命时,缺乏合理的依据,\n所以,对人类较强的繁衍能力十分敬畏。这种心理上理解,会对表达能力产生一\n定的作用。“帝”字最初的词意比较原始化,而随着历史的发展,逐渐能够将人\n类对世界的体验反射出来。在现实社会,人类“近取诸身”,就是联系具体的事\n物而衍生出新的词语。\n由于社会的不断进步,人的大脑也更为强大,人们“不再只局限于多事物的\n感知以及体验,而是会产生一种意识上的反思或者是感受等。这时,人们就不会\n一直创造新词,反而会联系已经熟知的事物,进而在大脑上形成一种抽象化的概\n念,并对其共同点进行归纳,最后借助对熟悉事物的理解,最后在不同的领域内\n衍生出一种新的思维投射”(赵艳芳,2001),这实际上体现的就是隐喻思维的\n过程。\n“帝”最为常见的含义就是人类隐喻理解的结果。根据相关资料的调查得出,\n在秦朝时,“帝”所代表的含义就是社会的主导者,比如:玉皇大帝等。如《书·洪\n范》:“帝乃震怒,不畀洪“范九畴。”《诗·商颂》:“帝命不违,至于汤齐。”\n“先秦有很多的典籍都提到了天神,例如:《诗经》言‘帝'43 例等。这些典籍\n中都所指的是天神。除此以外,还有其他文献中也提到了这一概念。(周及徐,\n2001)可见,在秦朝年间,“帝”这一词义的演变历程为“花蒂”转化为“天神”。\n“在人类通过感知具体的事物而产生一定的理解时,那么就具备了抽象思维能\n力,通常来说,会联系到与其相关的具体事物,从而来将这种抽象的概念表达出\n来。”针对这两个没有任何关系的领域,因为“不可知的强大力量”产生,导致\n其逐渐向目标域的投射,而“帝”这一词,也就衍生了隐喻义。\n[p.47]\n上海师范大学硕士学位论文\n第3 章新兴指人类词缀解析\n41\n根据傅斯年对我国远古时期“帝”这一字的了解与分析发现,在殷商末年,\n“帝”的“君主”义就出现了(周及徐,2001)。在周朝,人们把大王称为是天\n子,在这以后,我国古代的最高权力者就用“天子”这一称呼。在战国之前,“帝”\n并非代表的是“主公”这一敬称。而在战国年间,“三皇五帝”的说法就已经产\n生,很多理论派为了找寻根源,就将其引申到了神话传说中,使其带有一定的神\n秘色彩。到秦王嬴政时期,用“皇帝”来称呼帝位,从这以后,皇帝就成为一个\n统称。在“天神”隐喻义的前提下,人们又开始联想,并将“天神”概念成分的\n语义特点,引申到了目标域,这样就能够将所转移的词意特点再次呈现出来,就\n这样,”帝”的隐喻义就呈现出了“再概念化”特点,并增加了“君主”这一词\n意。“帝”词义范围不断泛化,并是以人的隐喻认知方式为基础。\n在“君主”义的前提下,“称帝”的动词义出现。如:汉扬雄《剧秦美新》:\n“(汉祖)自武关与项羽戮力咸阳,创业蜀汉,发迹三秦,尅项山东而帝天下。”\n动词义的出现主要是为了展示出其具有动词意,而这并非是由于隐喻思想替换而\n造成的。\n作为模标的“帝”,最近几年,在“君主”义的情况下,其含义又发生了深\n刻的变化:“在某一领域拥有最高殊荣的人”等。“帝”的语义变得广泛,而且\n扩大到了“个人”等,从“人”延伸到“物”。人类通过发挥自身的想象力,从\n而将初始域跟目标域联系在一起,归纳其存在的共同点。并二次重复了这一投射\n过程,“帝”的隐喻义又在此被诠释,”帝”族词的概念又被重新的得到定位,\n“帝”的词义不断被完善和调整。“帝”词义的广泛性,造成了“帝”族词词性\n出现类化,而促使词语模的确定,从而呈现出明显的能产性特点。\n[p.48]\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n上海师范大学硕士学位论文\n42\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n4.1 外部原因\n4.1.1 社会和经济原因\n在现代汉语发展过程中,由于受到了社会从众等心理的影响,导致新兴类词\n缀不断被复制出去。从修辞的层面上来看,当前汉语指人类词缀的用途与含义与\n使用语言的人的手段相比存在紧密的关系。一方面,新兴指人类词缀所衍生的新\n词意,都是从其他语言中演变过来的,在将词意范围扩大的基础上,表达者会根\n据词语的内涵来创造其使用的区域,这种距离感会使得彼此的关系疏远;另一方\n面,在框填的基础上,单个语素形成类词缀,这样,新词语就会不断产生,而这\n也是语言表达着所希望达到的结果。通过框填式流行语,从而使话语框架保持不\n变,这样话语之间就呈现出从众的关系,与此同时,利用替换等手段,对这一新\n词加以完善,并从形式上将创新的意味展示出来。很多新词义的保留,主要是为\n了迎合青少年的好奇心,另外,也体现出年轻人追求个性的特点。作为一个创造\n新词的人,年轻人会依据自己的意志或者是喜好,从而发明出语言的新型使用形\n式,而不是复制外来词语。\n除此以外,导致新兴指人类词缀被传播的主要影响因素之一就是经济性原\n则。西方有位专家曾提出,在交流过程中,人们要以“合作原则”为前提\n(\ns\nnPrinciple\nCooperatio\n):1数量原则(\nquantity\nof\nmaximum\n),让你的讲话\n包含最多的信息;2质量原则(\nquality\nof\nmum\n-\nmaxi\n),让你的讲话质量达到最\n高;3关联原则(\nrelation\nof\nmaximum\n),让你的讲话内容有较强的衔接性;4\n方式原则(\nmanner\nmaximumof\n),确定出最好的途径来将你的含义表达出来,\n概括起来发现,他们所提出的即是语言的效率性等。可见,在广义的层面上,语\n言经济原则所体现的具体特点为:信息数量的浓缩;质量上的改善。在互动时,\n应该将繁杂的信息剔除,传达核心信息。当前汉语在沟通过程中,对网络社交存\n在较大的依赖性,网络平台在一定程度上提升了这些词语的传播效率。当前,现\n[p.49]\n上海师范大学硕士学位论文\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n43\n代汉语新兴指人类词缀的源头都出自于网络,而在网络文学中,出现的词语很少,\n所以,我们可以认为,新兴指人类词缀的广泛复制,得力于网络的巨大推动。网\n络语言环境比较宽松,这里没有较多的束缚,网民可以肆无忌惮的表达自己的思\n想和情感等。网络,作为一个传播信息的平台,由于其具有社交性强,传播速度\n快等功能,所以,会为语言复制提供有利的条件。在此条件下,人们在互动时,\n会将繁杂的信息去除,而会强调重点内容,在经济性原则的基础上,滋生了一些\n类词缀,主要是用于对新生事物的概括或描述。\n4.1.2 心理认知机制影响\n认知语言学理论提出,隐喻主要是人类对自然万物的认知过程以及表达思维\n的方式等,是新词语衍生的重要前提与基础。语言在描述客观事物时,会由于受\n到自身知识、能力等因素的限制,导致其并不会直接将自己的思想认知展示出来。\n人类对自然世界的了解过程中,实际上就是一种概念化或抽象化的概括。抽象概\n念在出现以后,通常会利用人类所掌握的知识与实践等,在此条件下所出现的隐\n喻思维方式,由于隐喻可以将理性、想象有机的联系在一起,所以在推测的过程\n中,会导致概念比较模糊化。\n隐喻是“通过对某一事物的描绘,进而联想到与其相关的另一事物的感知形\n式”(赵艳芳,2001),这种方式的产生来源于对认知领域的了解,从而投射到\n目标认知领域。在认知领域不同的情况下,出现两个事物,分别为A、B,其在\n隐喻结构中产生了共性,在描述A 的过程中,将B 替换掉,这是由于“人们在对\n认领域联想到了相似的事物,所以会将其联系在一起进行诠释,以此来表达自己\n的思维和认识等” (赵艳芳,2001),因此,在所有的认知过程中,其都呈现\n出明显的隐喻性特点。“帝”等最初都是由初始含义而延伸过来的,其表示的是\n人们通过使用隐喻的思维,进而联想到与该领域存在共性的另一区域,而最终所\n呈现的投射现象。\n[p.50]\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n上海师范大学硕士学位论文\n44\n4.2.1 语言具有生成性\n徐盛桓(1984)指出:“语言系统十分开放,而且其具有生成性这一特点,\n在借助相关手段的基础上,能够使其无止境的重复生成这一过程。”由于考虑到\n这一特性,人类会根据本来的语言结构等,从而衍生出多种含义。这样,类词缀\n化现象就变得更为明显。\n4.2.2 框填模式主导\n指人语素在流行中发生的类词缀化倾向的动因在于框填,因为它负载了某种\n流行语义,扩大组配范围就是扩散的最佳途径,而具体的方式就是以某一指人语\n素为框架进行替换和充填。新兴指人类词缀和词根一起组成的词族是“X+ 指人\n语素”的扩散。从本质上来说,他们都代表的是某一类人群的共性。在填充好“X”\n后,这些词族的语义会变得更为丰富,此时,我们会提取其在框架中的独特含义。\n比如:“X 控”指的是某人热爱某种事物的疯狂程度;“X 二代”是指父母一代\n所拥有的共性,而下一代人也同样具有此特点的一类人;在刚出现新词语时,使\n用者会依据自身的兴趣和意志,从而进行广泛的套用。由于不断的模仿,以致于\n框填模式可以发生变化,即“X” 的词义呈现出泛化。指人语素的组合能力更\n强,与此同时,虚化的程度在加深。在填充期间,我们会看到“X”所呈现的特\n性,如“X 控”中的“X”,代表的大多是名词等。由于词汇在现实生活中被广\n泛的使用,所以,不同词族在其框架含义的基础上又会产生新的词义。如“官二\n代”表示的是当官人员的孩子,但是,该词语实际上暗含了对这一群体的讥讽与\n蔑视。部分的“X+指人类词缀”的含义,并不在局限于一个群体,也能够表示\n出某个人,在添加线性词语以后,还可以补充“们”,表示复数形式。如:\n(1)我是一个“苹果控”。\n(2)哈韩族们,清华教授会向你们描述一个韩国的真实面目。\n(3)这些给观众带来众多乐趣的表情控们,怎么会甘愿留在舞台下面,纷\n纷摩拳擦掌。\n“X+指人类词缀”开始从群体倾向到个体,这说明了这一类型的词根模式\n逐渐形成。可见,很多“X” 在被填充以后,框架内的词义会变得更为广泛;\n4.2 语言内部原因\n[p.51]\n上海师范大学硕士学位论文\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n45\n另外,在稳定的框架内,会流入更多的成分。在该过程中,其就具有了相互影响、\n相互促进的关系。\n4.2.3 模因论阐释\n模因理论指出,模因跟人类的基因存在较大的相似性,其本质上一个文化或\n者信息单位,在采用模仿手段的基础上,使其得以被传播出去。“模仿”是对模\n因进行识别或分析的重要前提,不管是何种信息,只要从广义的角度上能够成为\n“模仿”的原体,在将其“复制”以后,就会出现一个模因(Blackmore ,99:\n66)。那些被模仿的语言文化等,都会成为一个模因,实际上,语言本质上就属\n于模因,所以在语言之中就存在了模因,无论是何种词语句子等,在能够被模仿\n的基础上,那么就会被复制出去,也会有很大可能性成为模因(谢朝群、何自然,\n2007),所以,“语言模因”(\nmemes\nlinguistic\n)之类的说法。\n可见,“X 族”等都被统称为是语言模因,由于指人类词缀的语法功能逐渐\n增强,所以从语法层面上来讲,其就成为了类词缀,与其存在联系的其他词根\n“X”后就会形成“X 族”等,而这个“X 族”会在复制过程中衍生出全新的词\n汇。何自然(2007)认为,语言模因的信息复制等手段可以被划分为不同的类型,\n具体是:模因的基因型,指的是模因的内容保持原样,但是形式有了改变;模因\n的表现型指的是模因的形式相同,而内容却存在较大的差异性。那么“X 族”模\n因的传播就被划分为表现型,事实上,这是在词层面,语言模因的展示特点。模\n仿行为的执行过程中会给人一种意外的感觉。(Blackmore ,1999),模因就是\n在借助模仿手段的基础上来将其内容传播出去的,在此期间,主要使用的方式为\n重复、类推。\n重复是模因复制与传播的手段之一,有两种类型———直接套用和同义异\n词。话语中使用各种引文、口号,转述别人的话语,交谈中引用名言、警句等等,\n都是直接套用。遇到与原语相似的语境,模因就往往以这种方式来自我复制和传\n播。同义异词即信息相同但以异形传递。这种传播方式的典型例子莫过于日常交\n际中不同时期、不同地方对同一事物的不同说法了。(何自然,2008)\n前文所阐述到的类推,在对比的基础上,掌握不同对象之间的共同点与差异\n[p.52]\n第4 章现代汉语新兴指人类词缀产生极其流行动因解释\n上海师范大学硕士学位论文\n46\n性,并以此类推,联想其跟其他领域所存在的紧密关系。通常而言,类推会被划\n分为不同的类型,具体是:同音类推,指的是对词语的发音进行模仿,从而产生\n一种全新的模音变体,很多时候,运用的都是这种类推的方式。如模仿“草木皆\n兵”,而创新之后的词语有“草木皆冰”,该词语的含义是某个地方气温极低。\n在一些广告或者是新闻中,利用谐音类推的现象也比较多见。如:“闲”妻良母\n等。与同音类推所存在的区别是,同构类推所指对当前的语言结构进行模仿的前\n提下,从而衍生出全新的模因变体(何自然,2008)。在此期间,语言所表达的\n含义必然会发生变化,但是,语言的结构是固定的,以此为标准,从而衍生出类\n似的词语或者是句子等,再借助此方式,使其得以被传播出去。\n[p.53]\n上海师范大学硕士学位论文\n第5 章余论\n47\n第5 章余论\n本文通过使用定性分析法、定量分析法,从而全面系统的研究了类词缀的性\n质、特点、类型等,并对新兴的指人类词缀展开了彻底的探讨,最后总结出新兴\n指人类词缀的结构模式,在选取五个具有代表性的新兴指人类词缀的情况下,对\n整个词语结构模式进行了深入的剖析,最后,归纳出了他们所存在的共同点与不\n同点,并找出了存在这种现象的内外影响因素。\n在以后的社会发展过程中,新兴指人类词缀会出现全新的特点,这里我们将\n进行大胆的推测:\n(一)可能出现新的“类词缀”\n当前,我国社会发展速度惊人,一些全新的事物,全新的概念不断出现,类\n词缀的发展方式,能够在最短的时间内衍生出新的词汇,从而达到对全新事物的\n概括之需,所以,在未来时间里,新的“类词缀”出现的可能性较大。当前,我\n国同世界各国之间的文化交流更为频繁,而汉语系统会受到更多新词的冲击,这\n在一定程度上有利于消除我国古代汉语词汇所存在的弊端,除此以外,他源性“类\n词缀”会更常见。\n(二)很有可能某些“类词缀”演变为“典型词缀”\n在社会发展过程中,语言也会发生较大的变化,很有可能某些“类词缀”的\n词义会变得更为丰富,而其语法作用也会渐趋于增强,从而演变为“典型词缀”。\n虽然当前汉语中出现类词缀完全虚化的情况不多,但是,在深入的研究之后发现,\n类词缀的发展特点是跟词根的关系更为疏远,并增强了与典型词缀之间的关系。\n(三)可能某些“类词缀”回归词根词素\n某些新兴指人“类词缀”的产生,其主要是为了诠释当前社会的文化发展态\n势,所以其存在的时间会较短。由于社会的不断向前发展,最终,这部分新兴指\n人“类词缀”会被纳入到词根词素的范围内。如“二代”,因为“二代”派生所\n组合成的词语,会存在语义指称上的弊端。出现“官二代”的“李刚之子”这类\n情况还是不多见的,不能将其以偏概全。由于词语所反映的特殊情况从人类眼前\n逐渐淡化,所以,最后这类词缀也将回归到词根词素。\n[p.54]\n参考文献\n上海师范大学硕士学位论文\n48\n参考文献\n[1] 安志伟.现代汉语指人名词研究[D].山东师范大学博士学位论文,2010.\n[2] 曹大为.“族”的类词缀化使用分析[J].山东社会科学,2007(5).\n[3] 常敬宇.《论词缀》,《汉语学习》1986 (6).\n[4] 陈昌来朱艳霞. 说流行语“党”兼论指人语素的类词缀化[J].当代修辞学,2010.\n[5] 陈发喜.帝-女性先祖的文字表征- “帝”字本义的综合考释[J]. 郧阳师范高等专科学\n校学报, 2004.\n[6] 陈敏. 从三个平面分析“X 奴”[J].淮南师范学报,2011.\n[7] 陈原.社会语言学[M].北京:商务印书馆,2000.\n[8] 程辰.从犀利哥和凤姐看哥、姐背后文化义的擅变[J].广州广播电视大学学报,2010(3).\n[9] 刁彦斌.现代汉语准词缀发展变化的几种模式[J].廊坊师范学院学报.2004(3).\n[10] 董秀芳.词缀的性质与汉语词法特点[J].汉语学习.2005(6).\n[11] 段文汇.从认知看“裸X”族新词中的隐喻[J].内江师范学院学报, 2010(9) : 69-70.\n[12] 高志武.X 二代族词的立体解读[J].辽宁师范大学学报(社科版),2013(2).\n[13] 耿彦秋.现代汉语新兴类词缀研究[D].吉林大学硕士学位论文,2013.\n[14] 龚娜.当代汉语新兴词语模的共性与个性——以“X 门”和“被X”为例[J].广西社会\n科学,2010\n[15] 郭良夫.现代汉语的前缀和后缀[J].中国语文,1983.\n[16] 郭立萍.现代汉语外来词单音成分语素化和词缀化动因研究[J].山西大同大学学报(社\n会科学版),2008(6).\n[17] 何自然.语言模因及其修辞效应[J].外语学刊,2008.\n[18] 胡裕树.现代汉语[M].上海:上海教育出版社,1981.\n[19] 雷卿.语言表征的感知基础——心智哲学视角[J].现代外语,2012\n[20] 李蓓. 现代汉语新兴类词缀研究[D].辽宁师范大学硕士学位论文,2004.\n[21] 李华.现代汉语表人 ·\n············......\n·························... ...\n··\n···························... ...\n[p.6]\n山东大学硕士学位论文\n中文摘要\n本文以二十一世纪以来陆续出现的新兴指人1“ 类词缀” 为主要研究对象\n综合运用现代汉语词汇及现代语法理论方面的相关知识和研究成果 将描写与解\n释、静态与动态、共时与历时相结合 试图在对现代汉语类词缀本质问题认识加\n深的基础上对其中“ 指人” 的类词缀从不同角度进行分析、描述 以便更清楚地\n了解汉语词汇及其构词法的发展变化 为汉语构词法研究提供一定的理论依据\n并为特定时期的语言文化研究提供词汇方面的素材 为进一步完善词典编纂和提\n高对外汉语词汇教学质量提供一定帮助。全文共分六章\n第一章 绪论。概述本文要研究的问题 介绍新兴指人“ 类词缀” 研究的选\n题依据 指人“ 类词缀” 的相关研究情况 本文的研究内容以及指导理论与研究\n方法。\n第二章 指人“ 类词缀” 语料库的设计与建设。介绍了本文所用指人“ 类词\n缀” 语料库的建设情况 包括选材原则、抽样原则与方法 也介绍了对语料库进\n行的加工处理工作 包括分词与标注、人工校对、统计等工作。\n第三章 旧有指人“类词缀” 的范围及特点。统计比较了\n部代表论著中认\n定的旧有指人“类词缀” 以其中认可度较高的\n个为例 对旧有指人“ 类词缀”\n的性质特点、外部特点等进行分析描述。\n第四章 新兴指人“类词缀” 的特点及功能。详列\n个新兴指人“ 类词缀”\n并从派生词长度、构词成分、词根类别、构词方式四个方面对其特点进行分析\n然后结合实例对新兴指人“ 类词缀” 在表达上的四个功能进行详细描写。\n第五章 新兴指人“类词缀” 的演化途径。指出新兴指人“ 类词缀” 共有四\n种演化途径\n由指人名词虚化而来\n由亲属称谓泛化而来\n通过隐喻衍化而来\n由外来语素汉化而来。\n第六章 余论。预测新兴指人“ 类词缀” 的发展将呈现的三种趋势 并指出\n本文存在的不足。\n关键词\n类词缀\n指人\n新兴\n语料库\n1本文题目及文章中所用“ 新兴指人‘类词缀” 中的“ 指人” 与文章引文中的“ 表人” 实为同一概念 为\n防止出现“ 表人” 和“类词缀” 连用时出现“ 表人类” 的误读现象 特用“ 指人” 一词代替。\n[p.7]\n山东大学硕士学位论文\n一\n嗯\n七\n一\n泊\n一\n一\n一\n研角\n一\n】\n一\n七\n印\n一\n七\n州\n加\n一\n亡\n一\n[p.8]\n山东大学硕士学位论文\n爪\n一\n一\n七\n田爪们。\n亡\n一\n丁\n[p.9]\n山东大学硕士学位论文\n第一章绪论\n一\n选题依据\n语言与社会共变 社会的发展 新事物的产生 人类对自我认识的深入 这\n些都在词汇这一语言最敏感因素上体现出来。近二十年来 尤其是\n世纪以后\n汉语的构词方式也发生了一定的变化 出现了大量类似于派生构词方式构造的新\n词 其中的许多类似词缀 但又没有那么典型 在语义上具有“ 人” 的附加意义\n我们称之为\n新兴指人“ 类词缀”。新兴指人“ 类词缀” 的大量出现和参与构词\n在一定程度上影响和改变了汉语词汇体系的面貌。而汉语学界对此方面的研究还\n比较零散、薄弱。如在中国期刊全文数据库搜索指人“ 类词缀” 方面的研究论文\n得出专门研究此方面的论文仅\n篇\n《现代汉语表人名词类词缀浅析、汉语表人\n词缀的认知基础及社会文化蕴涵》、《指称人的语缀结构及构词过程》、《现代汉语\n表人名词后缀类后缀考察》 大多数的论文是针对某个指人“ 类词缀” 进行描写、\n分析 如《网络“ 客” 族新词的产生机制与社会文化心理》、《析附缀式新词“\n奴’ 》、’\n族” 词语中“ 族” 的虚化情况考察》等 还有一些对指人“ 类词缀”\n的分析是作为整个词缀、类词缀研究的小部分被提及。面对\n世纪以来新兴指人\n“类词缀” 大量出现 但研究没能及时跟进的现状 我们认为有必要对新兴指人\n“ 类词缀” 进行深入全面的研究。\n本文认为对现代汉语中的新兴指人“ 类词缀” 进行研究具有以下重要理论意\n义和实践价值。\n第一 有助于进一步认识汉语构词法和汉语的本质特点。从形态学分类法来\n看 现代汉语属于孤立语 没有严格意义上的形态变化。但语言作为一种人类社\n会的产物 随着社会的发展而发展 词汇又是语言各要素中最为敏感、变化最快\n的部分。现代汉语的词语结构主要以复合式构词为主 音节上主要以双音节为主。\n而新时期新词语的大量产生和使用 使汉语一直以来较为稳定的构词方式产生了\n变化 派生式构词作为汉语同其他语言在构词方面共有的一种方法得到了前所未\n有的大发展 同时在构词音节上 新时期的新词语表现出明显的“ 三音化” 倾向。\n[p.10]\n山东大学硕士学位论文\n汉语构词法的这些发展变化 促使我们要以发展变化的眼光看待汉语构词法以及\n整个汉语词汇系统。\n第二 有助于更好地描写和认识指人“ 类词缀”。通过对新兴指人“ 类词缀”\n进行研究 挖掘新兴指人“ 类词缀” 与旧有指人“ 类词缀” 的联系与区别 可以\n发现汉语词汇在结构上的变化发展和一定社会文化背景之间的密切关系。我们知\n道 社会生活、社会心理、人们的思维状况都会在语言上留下印迹 新时期产生\n的新兴指人“ 类词缀” 在语义特征上都明显地透露出一定的社会文化信息。如“ 嫂”\n这个类词缀的兴盛 反映出下岗女性重新谋职、自强自立的积极心态\n“ 虫” 所构\n成词语色彩的由贬义到中性到略含褒义 则体现出当今社会人们对“ 虫子” 善钻\n研特点的发现及偏爱。\n第三 有助于为计算机自动分词提供必需的词法知识。随着电子网络技术的\n飞速发展 信息在计算机间的海量传播 语言学研究的关注焦点由单独的人际系\n统扩展为人际和人机双系统。这就要求我们在自身对语言清晰认识的基础上 把\n这些认识模式化地教给计算机 以便实现计算机的自动处理。目前 中文信息处\n理已从字处理阶段发展到词处理甚至句处理阶段。“ 词处理严格地说还是初步的\n还没有解决所有问题” 1 其中未登陆词的处理就是其中的一个难题。未登陆词包\n括多种类型 词根加词缀式派生词就是其中的一类。如机器分词词表难以收罗尽\n所有派生词 况且新兴类词缀大多具有很强的新生类推潜能 派生词也具有很强\n的临时性和偶发性 这样对于词表中没有收录的词 自动分词系统就会以缺省值\n的形式将其且分为一个个单字 这势必会影响分词的效果 增加后期校对的劳动\n量。如何将词根和新生类推潜能很强的类词缀根据一定的语言规则归并从而实现\n更准确的切分就成了派生构词研究的重要内容。因此 将占有较大比例的新兴指\n人“ 类词缀” 研究的成果加入语言规则库对于提高自动分词的正确性和精确率有\n着重要的意义。\n第四 为对外汉语教学提供帮助。对外汉语词汇库中 指人名词占有非常大\n的比例 类词缀及其构成的派生词又是对外汉语语法和词汇教学的重要组成部分。\n对于语言习得者来说 掌握派生词的构词规律 推断出以前从未见过的派生词的\n词义和根据规则生成合理的新的派生词 有利于其在学习中事半功倍、以点带面\n1陆检明、郭锐\n《汉语语法研究所面临的挑战》 《世界汉语教学\n年第\n期。\n[p.11]\n山东大学硕士学位论文\n的快速大量掌握新词。因此 深入研究类推潜能强的新兴指人“ 类词缀” 的特点\n对对外汉语教学者和习得者都有很大帮助。\n二研究背景综述\n年 吕叔湘先生在《中国文法要略》一书中列举了“ 士、生、师、人、\n者、丁、夫、店、馆、院” 等\n个称作“ 近似词尾” 的成分。\n年 陆志韦等\n在《汉语的构词法》中 将“ 读者、作家、软化、不价、扒拉、折腾、锅巴、后\n来、天然、近乎” 之类中的第二个字称作“ 类于后置成分的东西”。直到\n年\n吕叔湘先生在《汉语语法分析问题》“ 语缀” 一节说“ 有不少语素差不多可以算是\n前缀或后缀 然而还是差点儿 只可以称为类前缀或类后缀。......说他们作为前\n缀和后缀还差点儿 还得加个‘类’字 是因为它们在语义上还没有完全虚化 有\n时候还以词根的面貌出现。......存在这种类前缀和类后缀可以说是汉语语缀的第一\n个特点” 并列举了“ 可、好、难、准” 等\n个类前缀和“ 员、家、人、民” 等\n个类后缀。至此 “类前缀” 和“类后缀” 作为语言学中的两个新术语被明确提出。\n世纪\n“ 类词缀”\n增多趋势\n作为\n年代以后 “ 类词缀” 问题受到越来越多学者的关注。其中的指人\n“ 类词缀” 语义层面划分出的重要一类 因其数量较多并呈日益\n而更受关注。梳理前人成果 我们发现各方学者对指人“ 类词缀” 的\n研究主要集中在以下几个方面\n一\n指人“ 类词缀” 的范围\n作为一个较新的话题 “ 类词缀” 的研究在较多方面存在争议。其中根本的一\n点就是在“ 类词缀” 的判定方面还没有达成统一的标准 这也导致各家对指人“ 类\n词缀” 范围的确定存在差异 全面系统分析指人“ 类词缀” 的文章更是少之又少。\n《现代汉语表人名词后缀类后缀考察》李华\n是唯一一篇系统划定指人\n“ 类词缀” 范围并给予分析的学位论文 但受时间限制 文中分析的\n个指人“ 类\n词缀” 都是旧有的。《说流行语“\n党” —\n兼论指人语素的类词缀化》陈昌来、\n朱艳霞\n列举了几个新兴的指人“ 类词缀” 并认为指人语素类词缀化的动\n因在于框填 这是作者搜索到的唯一一篇较全面列举新兴指人“ 类词缀” 的文章\n但由于文章重点在于分析流行语“ 党” 因此对其他的类词缀只是概括性的介绍\n[p.12]\n山东大学硕士学位论文\n并不具体。\n二\n指人“ 类词缀” 的理论探讨\n已有研究成果中 对指人“ 类词缀” 的理论方面的探讨主要围绕汉语形态、\n词缀化两个方面进行。\n汉语存在形态这一观点己经为大多数学者所赞同。近几年大批量新兴“ 类词\n缀” 的出现及参与构词更是强化了汉语界对汉语形态的认知。《现代汉语准词缀发\n展变化的几种模式》刁晏斌\n认为准词缀\n即类词缀\n是现代汉语中数量\n较多而又非常活跃的构词成分 并总结了准词缀的五种发展变化模式。《类词缀的\n发展与现代汉语的形态化趋势》于秒\n认为类词缀是现代汉语的形态标记\n类词缀属于构词形态 最近几年产生的很多新词都是通过类词缀的附加构词产生\n的。《词缀的性质与汉语词法特点》董秀芳\n认为汉语中存在派生规则\n但地道的词缀一直不多 在对几个认可度较高的词缀分析后 指出“ 派生构词不\n是汉语主要的词法模式 汉语中主要的词法模式仍是复合法。”\n指人“类词缀” 在语法化上的表现主要是词根词素的词缀化。《浅析“ 亲属称\n谓名词” 的类词缀化及构成新词的特点》宋培杰\n分析指出“ 爷”、“ 婆’ 、\n“ 哥”、“ 嫂” 等亲属称谓名词在构成新词的过程中 词汇意义弱化 语法意义增\n强 词缀化倾向明显。《从汉语词缀的定义看“ 词缀化”\n宋伶俐\n从汉\n语词缀定性和定量分析两方面做支撑论证汉语语素的虚化并词缀化倾向。《现代汉\n语构词法中的词缀化倾向研究》郑远春\n以报刊领域中的语料为依据 将\n语言单位放在鲜活的语言环境中进行分析 从而认定现代汉语构词法中词缀化倾\n向的存在。\n三\n社会语言学角度解析指人“ 类词缀”\n《作为一种社会文化现象的新语汇—\n关于“ 某嫂” 称谓法》李明洁\n认为新近出现的“ 某工程”、“ 某意识”、“ 某文化”、“ 某嫂” 等新语汇是一种以语\n言现象为形式的文化景观 是一种社会文化现象 它们在很大程度上忠实地一\n记录\n了转型期社会的思潮变化与社会热点 也会随着公众关注程度的变化而兴衰\n《汉\n语表人词缀的认知基础及社会文化蕴涵》齐焕美\n指出表人词缀的虚化过\n程多与人类隐喻、转喻的认知方式有关 各项语义特征或多或少地透露出一些历\n[p.13]\n山东大学硕士学位论文\n史文化信息\n《从犀利哥和凤姐看哥、姐背后文化义的擅变》程辰\n通过\n对“ 哥” 和“ 姐” 用法的分析 发现“ 哥”、“ 姐” 的使用和发展是不平衡的 并\n且在历史的使用过程中也已经融合了多层文化含义。另外 《网络“ 客” 族新词的\n产生机制与社会文化心理》裴景瑞、于全有\n、《各种各样的【新型族和从\n中可见的日本社会》杨本娟\n等对个别新词产生的社会文化心理和从中揭\n示的社会现象进行了比较深入的分析和探讨。\n四\n对个别指人“ 类词缀” 的解析\n《析附缀式新词“\n奴”\n许丽\n对“\n奴” 的兴起原因、构成和搭配\n及语义分析方面进行了详尽的分析。《说流行语“\n党” —\n兼论指人语素的类词\n缀化》陈昌来、朱艳霞\n一文考察了“\n党” 的语义和句法功能 并分析\n了该类词语的形成和发展规律。’族” 词类的语言学研究》鲁瑛\n通过对\n“\n族” 词类的构造和功能的探讨 认为“ 族” 在现代汉语中被广泛作为类词缀\n使用是实词虚化现象 在“\n族” 词类的使用和传播过程中 “\n族” 已经成为一\n个语言模因 是语言模因在词层面上的表现。《网络“控” 族新词及其所折射的社\n会文化心理》李媛媛\n以“ 控” 族词为研究对象 主要分析“ 控” 族词的\n产生、结构特点及其所折射的社会文化心理。\n三\n研究内容\n前辈学者们对于指人“ 类词缀” 做了大量的研究工作 并取得了很多成果。\n本文与前文研究的重点不同 本文的研究对象包括两部分 一部分为\n个认可度\n较高的旧有指人“ 类词缀” —\n员、家、手、界、师、生、士、型、迷、棍 它\n们皆出自\n部比较有代表性的论著中划定的指人“ 类词缀”\n另一部分为二十一\n世纪以来新产生的\n个新兴指人“ 类词缀” —\n虫、达人、党、二代、哥、姐、\n客、控、妹、男、奴、女、派、嫂、爷、友、族 它们也是本文的主要研究对象。\n[p.14]\n山东大学硕士学位论文\n四\n指导理论与研究方法\n一\n指导理论\n语法化理论\n类词缀的产生受到多方面的影响 既有不同国家、民族接触带来的语言融合\n也有社会发展新鲜事物产生的自然需要 还有人们求新求异的个性化心理 但与\n之相比 最根本的原因还是适应语言发展的内部规律。语法化是类词缀产生的最\n重要、最根本的动因。\n语法化指的是语法范畴和语法成分产生和形成的过程和现象 典型的语法化\n现象是语言中意义实在的词语或结构式变成无实在意义、仅表语法功能的语法成\n分 或者一个不太虚的语法成分变成更虚的语法成分。1汉语中 从词根到词缀的\n演变过程就是一个典型的语法化过程。语法化理论认为 语法化不是一墩而就的\n是一个长时间的逐渐演变的过程 它把历时和共时结合到一起。历时方面 体现\n为由此及彼的逐渐演变\n共时方面 则体现为同时期不同形式的同时存在。具体\n到词缀方面 指的是从词根到词缀的演变过程中 除了存在词根和词缀这两极之\n外 还存在着连接这两极的中间状态—\n类词缀。作为词根到词缀的过渡 类词\n缀是一个连续统 它一部分接近于词根 一部分接近于词缀 因此要想把类词缀\n同词根和词缀径渭分明地划分开来难度很大。\n标记理论\n在整个语言系统中 各种语言单位有一部分的成份是基本的 其负载的意义\n是中性的\n】\n为了表达的需要 有时要在这些单位的基础上从语音、语法、\n语义、语用、风格等方面添加某些特征意义 这就使得它们在形式上具有了某种\n“ 标记”\n成了“ 有标记” 项。标记现象指语言现象分布的不对称性 有\n关这种不对称现象的理论就叫标记理论\n。例如 就英语动词\n的语态而言 主动语态是无标记的\n动词是原型\n被动语态是有标记\n的\n标记形式是\n动词过去分词。在汉语中 “类词缀” 也是一种标记\n形式。指人“ 类词缀” 与词根词素结合构词 不管词根词素原来的词性如何 结\n合后的派生词词性皆为名词\n另外 语义上都标记为“ 一类人”。\n1吴福祥\n《近年来语法化研究的进展》 《外语教学与研究》\n年 第\n期。\n[p.15]\n山东大学硕士学位论文\n二\n研究方法\n语料库语言学的方法\n在现代语言学研究中 基于语料库的方法越来越受到诸多专家学者的青睐 网\n络上无限丰富的资源为语言研究提供了大量的素材。我们在研究中也充分地利用\n了网络资源 依托北京大学现代汉语语料库 并结合网易、新浪、淘宝、腾讯、\n百度、人人、人民网等几大用户量较多的网站选取语料素材 建立了用以考察新\n兴指人“ 类词缀” 使用情况的大规模真实文本语料库。在此基础上利用\n、\n等工具对语料进行加工、切分 在定性的基础上对新兴指人“ 类词缀”\n进行了定量的统计分析。\n静态描写与动态解释结合\n处在某一静态平面上的语言成分 不是一夜之间产生的 而是长时间沉淀、\n积累的结果 新时期的语言学研究必须将静态描写与动态解释有机结合。本文在\n描写静态平面上新兴指人“ 类词缀” 使用状况的同时 从动态角度分析具体案例\n的演化发展过程。\n定量统计与定性分析结合\n本文力求通过对语言事实的统计、量化以及尽可能细致地描写、归纳、\n达到定性解释的目的。首先\n现频次、频度等的量化统计\n使用统计软件对语料库中的指人“ 类词缀”\n分析\n进行出\n然后在定量研究的基础上 对新兴指人\n的音节搭配特征、构成方式等进行了详细的定性分析 描写新兴指人\n使用的真实状况。\n“ 类词缀”\n“ 类词缀”\n[p.16]\n山东大学硕士学位论文\n第二章\n指人“ 类词缀” 语料库的设计与建设\n一\n选材原则\n本文考察的是新兴指人“ 类词缀” 需要建立一个具有针对性的特殊用途语料\n库。面对新兴指人“ 类词缀” 分布分散的现状 如何快速有效的选取适合本文需\n要且有代表性的文本 对于研究是至关重要的。在遵循一般语料库的设计原则基\n础上 本研究所需语料库的设计主要侧重以下几个方面。\n时代性\n既然是研究新兴指人“ 类词缀” 因此本文在选取语料时更加注重对时代性的\n考虑。本语料库所选语料以\n世纪以来近十年现代汉语普通话语料为主 为方便\n新兴指人“ 类词缀” 与旧有指人“ 类词缀” 的比较 也在一定程度上选取了\n世\n纪之前的一些语料。\n代表性\n“ 计算机语料库必须有代表性才能据之对语言整体做出合乎实际的推理与判\n断。” 1语料的代表性是衡量语料库科学性的重要指标之一。本文依托由北京大学\n汉语语言学研究中心创建的北京大学\n语料库为主要语料来源 考虑到其更新\n时间到\n年 作者又从网易、新浪、淘宝、腾讯、百度、新华网、人民网等几\n大用户量较多、敏感度较强的网站选取大量的语料素材 建立起一个\n万字的\n语料库。\n平衡性\n语料库中各种语料内容的比例和数量是否均衡 直接影响到整个语料库的平\n衡性、准确性。所以 在语料的选择上 我们注意保持语料分布的均衡性。北京\n大学\n语料库本身的内容设置包括当代报刊、当代文学、当代翻译作品文学、\n当代应用文、当代翻译作品应用文、当代电视电影、现代文学、现代戏剧、现代\n网文、现代口语等 在从几大门户网站搜索语料时 作者也尽可能照顾到网文、\n博客、新闻、公文的平衡选取 以期使所得语料尽可能全面真实的反映新兴指人\n1\n二建新\n《计算机语料库的建设与应用》 北京\n清华大学出版社\n年版 第\n页。\n[p.17]\n山东大学硕士学位论文\n“ 类词缀” 的使用情况 使研究结果更具科学性。\n规范性\n对于普通的语料库而一\n言 规范性是确保所建语料库具有科学性的重要因素之\n一。选取的语料具有规范性 统计出的结果才具有可靠性。但“ 规范” 是需要一\n定的时间长度来检验认可的 就本文所研究的对象—\n新兴指人“类词缀” 而言\n若严苛地用“ 规范性” 来选取语料 显然有失偏颇。因此 本文在选择语料时\n力求在保证全面、少遗漏的基础上达到“ 规范性” 在从门户网站下载语料时 本\n文着重从规范性较强的网文、公共博客、新闻、公文中选取 对于开放度、自由\n度较高、规范性较差的论坛、贴吧 则是有针对性的挑选甄别。\n二\n抽样原则与方法\n科学的抽样方法是保证语料库的科学性和使用价值的最重要的条件之一。“ 正\n确的抽样方法应当结合功能目标和语料类型 通过模拟试验后确定。” 1本文的研\n究目的是描写指人“ 类词缀” 尤其是新兴指人“ 类词缀” 在实际生活中使用的原\n始面貌 对新兴指人“ 类词缀” 进行研究。根据这一功能目标 我们确立了代表\n性、平衡性和总体数量适中的原则 采取分层抽样与等距离抽样相结合的方法进\n行语料的抽样。\n从理论上说 语料库的规模越大则代表性越强 但是一方面语料库的规模越\n大 需要耗费的资金和时间越多\n另一方面 即使语料库的规模巨大 如果没有\n科学的抽样方法确保样本的均衡分布 语料的代表性也并不与语料库的规模成正\n比。本语料库的语料主要有两大来源 一为北京大学\n语料库 一为门户网站\n的语料。\n北京大学\n语料库的语料不管是从语体还是文体类型而言 都是比较均衡\n的 在抽取时 我们直接运用关键词搜索的方法。首先登陆北京大学\n的现代\n汉语语料库 设定语料的截取长度为“ 关键词前后三十个字符数” 将\n个指人\n“ 类词缀” 作为“ 关键词” 依次输入搜索栏 得到每个关键词的目标语料 将这\n些语料全部下载 分别按指人“ 类词缀” 命名保存为\n文本 在保存时注意将\n1盛玉麒\n《语言文字信息处理》 济南\n山东大学出版社\n年版 第\n页。\n[p.18]\n山东大学硕士学位论文\n其内码由\n转换为简体中文\n以便于以后的分词。\n对于各大门户网站上的语料 我们则采用分栏目分层抽样的方法。如腾讯网\n共有新闻、财经、娱乐、体育、汽车、科技、女性、时尚、读书、游戏、博客、\n军事、公益、儿童\n个栏目 在每个栏目的搜索栏中输入指人“ 类词缀” 将得\n到以这个指人“ 类词缀” 为关键词的条目若干。如在腾讯网娱乐栏目搜索栏输入\n“ 哥” 得到搜索结果\n项 将其前\n页显示内容链接到相关网页 手动\n保存为\n文本格式。\n三\n语料库的加工处理\n在语料库的建设过程中 我们采取计算机自动处理和人工干预两者结合的方法。\n一\n预处理\n文本格式整理\n在进行语料库自动分词及标注之前 我们先对文本中的文字格式及标点符号\n进行统一处理 防止出现分词软件无法识别、重复识别或识别错误等状况。其中\n转换统一标点符号是工作的重点。因为文本语料都较大 如“ 家” 和“ 生” 的原\n始语料分别为\n兆和\n兆 如果用文本或\n文档自带的“ 查找一替换” 功\n能来进行 因其过程中占用较大内存 速度会非常慢 还容易出现计算机“ 无法\n响应” 的死机现象。为此 我们选用了\n软件。\n软件也是一款文\n本处理软件 它可以快速实现文本的批量处理。利用这款软件 我们将英文输入\n格式下的标点符号全部转换为汉字输入格式的标点符号 将全、半角状态下的标\n点符号统一转换为半角状态下的标点符号 删除了所有的制表符。对于文本中多\n余的空格和段落标记 我们也利用\n软件进行了清理。\n文本冗余信息的处理\n本文所用语料均来自北京大学\n现代汉语语料库和门户网站 两种途径得\n来的语料一定程度上都存在着冗余信息。\n语料库在每条语料下面都标注了语料\n来源 如“ 迷” 的第\n条语料为\n“ 劲装的羽·泉冲上了机械手臂 不断反转、摇摆的机械手臂晃动在歌〔迷〕\n眼前 如此出新、出奇的构思和舞台设计令人眼花缭乱、目不暇接。文件名\n当\n[p.19]\n山东大学硕士学位论文\n代史传中国北漂艺人生存实录\n文章标题\n作者\n”\n其中 “【】” 中的内容标示了此条语料的来源 但它不仅不会对我们的研究有\n实质性的帮助 相反会对以后的分词、标注等带来困挠 所以在整理语料时 我\n们用\n软件对此类冗余信息进行了清除。对于从门户网站上下载的语料\n则是存在带有网站编辑标识、广告语等冗余 对此 我们也用\n软件加人\n工删除进行了清除。经过文本冗余信息的处理 很多无用或重复多余的内容被清\n理掉 文本的大小发生明显变化 如“ 家” 由一\n兆缩减为\n兆 “ 生” 由\n兆缩减为\n兆 这为接下来的分词提供了便利。\n二\n分词与标注\n本文所建语料库的自动分词和词性标注 采用由中国社会科学院计算技术研\n究所开发研制的“ 汉语词法分析系统”\n。\n。\n系统以国家标准\n《信息处理用现代汉语分词规范》和《面对中文信息处理的词语切分和词性标注\n规范》为基本参照 以空格作为分词标志。自动分词是中文信息处理的基础性和\n关键性的工作 包括预处理过程中的词语粗切分、切分排歧与未登录词识别等部\n分 其基本思路为\n先进行原子切分 在此基础上采用最短路经、概率统计、全\n切分等方法 找出前\n个最符合的切分结果 生成二元分词表 然后通过基于类\n的隐马分词、词类的隐马标注得到想要的词法分析结果。语料中所切分出来的词\n语单位 是信息处理使用的、具有确定的语法功能和语义功能的基本单位。\n在具体处理本文所建语料库时 鉴于“ 家”、“ 生”、“ 党”、“ 客” 等所含语料\n条数较多\n如“ 家” 共\n条\n兆\n’生” 共\n条\n兆 如果直\n接放入工\n系统进行切分 容易引起电脑内存不足、切分时间较长等问题\n因此 在切分这几个大文本前 我们先借助\n分割合并软件对它们进行了切分\n将大的文本切分为\n兆左右大小的小文本文件 再逐一分词。\n三\n人工校对\n人工校对是语料库加工过程中非常重要的一环 对于确保统计数据的准确性\n起着至关重要的作用。\n系统的分词精准度虽然己达到\n但这个数\n据是建立在分词规范所涵盖的词语范围之内 对于本文的主要研究内容—\n新兴\n[p.20]\n山东大学硕士学位论文\n指人“ 类词缀” 而言 由于其“ 新兴” 的特性 很多词语不在规范之内 因此导\n致分词的精准度大大降低 这也就大大增加了人工校对的工作量。为保证数据统\n计的合理性、研究结果的准确性 本文的校对工作主要为\n纠正切分错误的指人\n“ 类词缀” 所构成的词语 并对错误的词性标注进行改正。具体操作如下表\n表\n计算机分词、标注与人\n几校对对照表\n例子\n原语料\n计算机分词、标注语料\n人」二\n校对\n网虫\n我家\n岁半的小网虫迷\n我\n家\n岁\n半\n的\n小\n忍乙 网\n虫\n恋淘宝。\n吮南迷恋八淘八宝\n。加\n网购控\n有什么方法可以戒掉我\n有八什么\n方法\n可以八戒八掉八我\n网购\n控\n的‘网购控’\n的\n‘ 闷洲为属酬叮左冷\n官二代\n榜样的力量是无穷的 是\n榜样\n的\n力量\n是八无穷\n的\n官\n二代\n可以潜移默化传给“ 官二\n是八可以\n潜移默化\n传八给八“\n穿\n代” 的。\n二今伽代汾” 加的\n。\n脉客族\n高校准新生热衷“ 脉客\n高\n校准八新生\n热衷八“ 浦吞馆\n脉\n客\n族” 网土找校友积攒人脉\n茜扬呀岌力踱\n网丫找八校友\n积\n族\n攒八人\n脉\n住容达人\n住容达人是不需要更少\n刀界赵人油厂是八不\n需要八更\n少\n容八达\n的川品类\n的\n旧\n品类\n人\n各注\n计算机分词标注所用词性标记\n名词\n词性语素\n类词缀\n分词后出现的类似问题数量较多\n出的统计结果 进而影响本文的研究。\n动词\n数词\n量词\n名词性语素\n动\n如果不逐一校对改正 势必会影响最后得\n四\n指人“ 类词缀” 的统计\n将校对后的分词单位从语料库文本中分离抽取出来 是进行定量统计工作的\n基础。本文采用\n软件和\n数据库命令来进行此部分的工作。我们\n先用\n软件将语料库文本中每个分词单位后的两个空格替换为换行符 以\n保证每一个分词单位独占一行。然后运用\n数据库统计出语料库中所有词的\n词长、词种、词次、出现的累计词频 具体统计数据如下\n[p.21]\n山东大学硕士学位论文\n表\n词长、词种、词次及累计词频统计表\n词长\n词种\n词次\n累计词频\n字词\n字词\n字词\n字词\n。\n字词\n字词\n字词\n字词\n字词\n未标识\n合计\n上表中 词长指的是词语的音节长度\n词种指的是不同的词语形式 后文涉\n及到的指人“ 类词缀” 派生词的词种 则指由同一个指人“ 类词缀” 与不同的词\n根构造产生的不同词语形式\n词次指所有词种出现的总次数\n词频则指本文所建\n语料库中各词语的使用频率。\n由统计结果可知\n字词的词种最多 这是与汉语的双音化趋势 n新生类推潜能极弱 甚至弱于一般词根 类词缀的新生类推潜能却很强。对此\n我们的观点稍有不同。与词缀相比 类词缀的新生类推潜能确实要强得多 但就\n类词缀这个系统而言 其内部成员在新生类推潜能上是有差异的 有些类词缀的\n新生类推潜能确实很强 但有一些类词缀虽然产生时间较晚 但其新生类推潜能\n并不强 甚至较弱。\n本文认为具体类词缀新生类推潜能的强弱主要受意义泛化后所保留的语义影\n响。如“ 师” 的类词缀义为“ 擅长某种技术的人” “ 家” 的类词缀义是“ 掌握某\n种专门学识或有丰富实践经验及从事某种专门活动的人” 因此 只要是表示某技\n术、职业等的词根都存在与“ 师”、“ 家” 搭配构词的可能。随着社会的发展 在\n原本就很丰富的技术、职业门类之外又不断有新的产业、知识及活动门类出现\n因此 “ 师”、“ 家” 的新生类推潜能较强 其派生出的新词如“ 美发师”、“ 整容师”、\n“ 美甲师”、“ 修脚师”、“ 调酒师”、“ 舞美师”、“ 金融家”、“ 投资家”、“ 卖家”、“ 买\n家”、“ 玩家” 等等。而相对的 “ 棍” 的新生类推能力则较弱。“ 棍” 的类词缀义\n为“ 品行很坏的人” 带有鲜明的贬义性 因此能与“ 棍” 搭配的词根也要有贬义\n倾向 这样刁‘能与“ 棍” 的贬义性相融。由“ 棍” 派生出的词语主要有“ 赌棍’ 、\n“ 恶棍”、“ 淫棍”、“ 赌棍”、“ 光棍” 等固定的几个。\n二\n外部特点\n由指人“ 类词缀” 构造的派生词在词语长度、词根类别上都表现出一些共同\n的特点。本节基于本文所建的专题语料库对\n个旧有指人“类词缀” 构成的派生\n词的音节特点进行穷尽式统计分析。\n派生词长度\n表\n旧有指人“ 类词缀” 派生词长度统计表\n按词种计\n指人“ 类\n双音节\n三音节\n四音节\n四音节\n合计\n词缀”\n词\n词\n词\n以上词语\n员\n家\n手\n界\n师\n生\n[p.27]\n山东大学硕士学位论文\n二\n型\n迷\n棍\n合计\n日有指人“ 类词缀” 的派生词由指人“ 类词缀” 和词根组配构成 因此其音\n节数量至少为两个。从上表的统计数据可看出 由这\n个指人“ 类词缀” 构成的\n派生词共\n个 其中双音节词\n个 三音节词\n个 占绝对主导地位 四\n音节以上词语则非常的少 仅有\n个。总体而言\n个类词缀都可与单音节词根\n词素结合 派生出双音节词语\n除“ 棍” 之外 其他\n个类词缀还都可以和双音\n节词根词素搭配派生出三音节词语\n可与四音节及以上结构搭配派生出四音节以\n上词语的则非常少\n个类词缀中 只有“ 界” 和“ 型” 的四音节以上派生词数\n量还较为可观。如\n员\n成员\n船员\n安检员\n伴奏员\n少先队员\n网络管理员\n家\n仇家\n船家\n编导家\n表演家\n历史学家\n社会活动家\n手\n扒手\n帮手\n爆破手\n刀斧手\n体检枪手\n论文枪手\n界\n报界\n警界\n出版界\n电影界\n社会科学界\n文化创意界\n师\n厨师\n机师\n按摩师\n灯光师\n美容美发师\n金融分析师\n生\n考生\n书生\n保送生\n毕业生\n士\n辩士\n策士\n辩护士\n传教士\n型\n特型\n原型\n都市型\n肥胖型\n活泼可爱型\n悲情浪漫型\n迷\n歌迷\n官迷\n电脑迷\n电影迷\n计算机迷\n动漫角色迷\n棍\n党棍\n赌棍\n恶棍\n光棍\n土棍\n词根类别\n下表的统计数据显示了语料库中可与\n个旧有指人“ 类词缀” 相组配的词根\n成分的词性类别。\n[p.28]\n山东大学硕士学位论文\n表\n旧有指人“ 类词缀” 派生词词根类别统计表\n按词种计\n公名\n词动\n词形\n容\n词合\n计\n员\n家\n手\n界\n师\n生\n丁\n型\n迷\n棍\n合计\n由数据可知\n个类词缀中 与名词性词根词素构成的派生词共\n个 与\n动词性词根词素构成的派生词共\n个 与形容词性词根词素构成的派生词共\n个\n除了“ 界” 和“ 迷” 不能与形容词性的词根词素搭配构词 只能与名词性和\n动词性词根词素搭配构词 其余\n个旧有指人“ 类词缀” 都可以与名词性、动词\n性及形容词性的词根词素搭配构成派生词。但在具体搭配情况上 各词之间差异\n较大\n员”、\n如“ 员” 更多的与动词性词根搭配构词 如“ 办事员”、“ 报关员”、“ 炊事\n“ 导购员”、“ 运动员” 等\n“ 家”、\n“ 艺术界”、\n“ 界”、“ 迷” 更多的与名词性词根搭配构词\n如“ 书法家”、“ 金融家”、\n“ 体育界”、\n和“ 型” 则更多的与形容词性词根搭配构词 如\n“ 棋迷”、“ 牌迷” 等\n而“ 手”\n“ 敌手”、“ 能手”、“ 妙手”、“ 新\n手”、“ 多面手”、“ 内向型”、“ 普通型”、“ 袖珍型”、“ 开放型”、“ 性感迷人型” 等。\n[p.29]\n山东大学硕士学位论文\n第四章新兴指人“ 类词缀” 的特点及功能\n一\n新兴指人“ 类词缀” 的特点\n王铁馄曾给新词语下过如下定义\n“ 新词语是指一个新创造的或从其他语言、\n从本民族的方言词、古语词和行业词中所借用过来的词语 也指一个产生新词义、\n新用法的固有词语。”\n那什么是新兴指人“ 类词缀”\n仿照新词语的\n定义 本文认为新兴指人“ 类词缀” 的“ 新兴” 主要体现为以下两种情况\n旧有类词缀的新用。这些类词缀在古汉语中曾经出现 但只是零星用法 直到近\n期突然活跃起来 新生类推能力显著增强 并且形成新的语义 使用频率增加\n使用范围扩大\n新类词缀的产生。这种情况又可细分为\n汉语系统中原有的\n词根词素某一项或某几项义项虚化 产生作指人“ 类词缀” 的新用法\n从其他语\n言、从本民族的方言词、古语词和行业词中借用过来经过改造直接以“ 类词缀”\n的身份进入汉语系统。\n由此笔者认为新兴指人“ 类词缀” 在具备指人“ 类词缀” 的性质特点\n语义\n泛化 表示“ 一类人”\n定位在组合的最后\n新生类推能力之外 还应具备以下两\n个特征\n必须是刚出现的、已经进入或开始出现并逐步进入人们日常生活的。\n本研究取\n年为时间上限\n年为下限。\n普遍性。能够被多数人接受\n便于交际 并且具有较广的使用范围的。除此之外 结合教育部\n年到\n年发布的《中国语言生活状况报告》中公布的新词语 及新词语在公布之后的使\n用调查 确定了本文所研究的新兴指人“ 类词缀” 共\n个 分别是\n虫、达人、\n党、二代、哥、客、姐、控、妹、男、奴、女、派、嫂、爷、友、族。\n本节主要从新兴指人“ 类词缀” 的外部特征 包括派生词长度、词语构成材\n料、词根类别、构词方式四个方面对\n个“ 类词缀” 进行分析。\n一\n派生词长度\n[p.30]\n山东大学硕士学位论文\n表\n新兴指人“ 类词缀” 派生词长度统计表\n按词种计\n新兴指人\n双音节词\n三音节词\n四音节词\n四音节以\n、\n“ 类词缀”\n上词语\n目\n计\n虫\n达人\n党\n二代\n哥\n姐\n客\n控\n妹\n男\n奴\n女\n派\n嫂\n爷\n友\n族\n合计\n从该表统计数据中可看出 新兴指人“ 类词缀” 与旧有指人“ 类词缀” 既有\n相同也有差异。相同的是 新兴指人“ 类词缀” 不但可以构成传统的双音节词语\n而且能大量地构造三音节词语 并且三音节词占有绝对的主导地位。不同的是\n由\n个新兴指人“ 类词缀” 派生出的词语在词语长度上有趋向单一化的特点 如\n“ 姐”、“ 客”、“ 奴”、“ 嫂”、“ 爷”、“ 友” 的派生词几乎都为双音节词语 如\n姐\n动姐\n款姐\n导姐\n托姐\n富姐\n客\n播客\n换客\n拼客\n闪客\n剩客\n奴\n卡奴\n车奴\n房奴\n孩奴\n婚奴\n嫂\n月嫂\n地嫂\n险嫂\n护嫂\n宴嫂\n爷\n款爷\n息爷\n卡爷\n股爷\n侃爷\n友\n驴友\n肉友\n脖友\n寨友\n秒友\n[p.31]\n山东大学硕士学位论文\n由“ 党”、“ 二代”、“ 控”、“ 妹”、“ 派”、“ 族” 派生出的词语则以三音节为主\n其中“ 二代” 更是只能构成三音节词语 如\n党\n标题党\n传说党\n电子党\n宝物党\n偷拍党\n二代\n农二代\n官二代\n写二代\n独二代\n单二代\n控\n封面控\n眼镜控\n淘宝控\n伪娘控\n正太控\n妹\n书包妹\n四眼妹\n白粉妹\n咖啡妹\n油脂妹\n派\n公考派\n手机派\n数字派\n跟风派\n团购派\n族\n刷刷族\n保湿族\n恐归族\n抠抠族\n脑残族\n除“ 士” 和“ 棍” 之外 其他旧有指人“ 类词缀” 都或多或少的可构成四音\n节及四音节以上词语 但新兴指人“ 类词缀” 与此特点有明显不同。除双音节的\n“ 达人” 构成四音节词语较多 “ 控” 和“ 族” 能构成少量四音节词语 其他十几\n个新兴指人“ 类词缀” 都不能或极少构成四音节及四音节以上词语。如\n达人\n网络达人\n音乐达人\n美丽达人\n瘦身达人\n养生达人\n控\n美少女控\n连衣裙控\n下午茶控\n米老鼠控\n大龄偶像控\n族\n胡萝卜族\n向日葵族\n职业敲族\n地铁快餐族\n家务甩手族\n二\n构词成分\n新兴指人“ 类词缀” 派生词语的构词成分以汉字为主 同时兼有字母及阿拉\n伯数字。具体可分以下三种\n完全由汉字构成。这种情况占绝大多数 如“ 房虫”、“ 化妆达人”、“ 标题\n党”、“ 富二代”、“ 犀利哥”、“ 动姐”、“ 拍客”、“ 丝袜控”、“ 骨妹”、“ 宅男”、“ 孩\n奴”、“ 剩女”、“ 不就业派”、“ 月嫂”、“ 卡爷”、“ 驴友”、“ 月光族” 等。\n由汉字与字母构成。其中的字母又可分为汉语拼音缩写 如“\n“ 妹妹”\n的首字母缩写控” 英文单词 如“\n控” 英文单词缩写 如“\n的缩写\n族”。\n由汉字与字母、阿拉伯数字共同构成。如“\n计算机、手机、游戏机\n族”、“\n派”、“ 作\n族”。\n三\n词根类别\n新兴指人“ 类词缀” 派生出的词语在语义上都带有卜人的语义特征 在词性\n[p.32]\n山东大学硕士学位论文\n上自然属于名词 但与这些“ 类词缀” 搭配构词的词根是否也是名词 还是如旧\n有指人“ 类词缀” 一样 也可以有其它类别\n为此 我们对新兴指人“ 类词缀”\n派生词的词根类别进行了统计分析。\n表\n新兴指人“ 类词缀” 派生词词根类别统计表\n按词种计\n、\n羹麟咒名词动词形容词合计\n虫\n达人\n党\n二代\n哥\n姐\n客\n控\n妹\n男\n奴\n女\n派\n嫂\n爷\n友\n族\n合计\n由上表可见 在可搭配构词的词根类别方面 新兴指人“ 类词缀” 与旧有指\n人“ 类词缀” 基本相同 都可与名词性、动词性、形容词性搭配 其中又以名词\n性词根为主。但在\n个新兴指人“ 类词缀” 内部 各类词缀主要可搭配的词根类\n别各不相同 存在差异。如“ 哥”、“ 控”、“ 嫂”、“ 友” 主要是和名词性词根搭配\n构词举例如下\n哥\n三轮哥\n火车哥\n校服哥\n雪碧哥\n鲍牙哥\n控\n丝袜控\n短裙控\n明星控\n包包控\n零食控\n嫂\n报嫂\n菜嫂\n房嫂\n水嫂\n宴嫂\n友\n吧友\n博友\n仓友\n麻友\n车友\n[p.33]\n山东大学硕士学位论文\n“ 客”、“ 族” 则主要是和动词性的词根搭配 如\n客\n搜客\n淘客\n晒客\n闪客\n拼客\n族\n抄号族\n啃楼族\n秒杀族\n吃网族\n玩卡族\n与“ 男” 搭配构成派生词的形容词性词根较多 如\n豪华男\n闷骚男\n自由男\n暴力男\n吝音男\n忧郁男\n三低男\n相对其它新兴指人“ 类词缀” 与“ 党” 搭配构词的词根在类别方面的分布显\n得较为均衡 名词性、动词性、形容词性三种类别中 都能找到一定数量的词根\n和它搭配构成派生词。如\n名词性\n短信党\n动漫党\n传说党\n韩寒党\n药加鑫党\n动词性\n抢包党\n租房党\n拍砖党\n追剧党\n偷拍党\n形容词性\n低调党\n寂寞党\n华丽党\n天真党\n邪恶党\n四\n构词方式\n新兴指人“ 类词缀” 与词根词素的搭配构词方式共有三种\n音译法\n音译法是指在不违背汉语言规范和不引起错误联想或误解的前提下 按照原\n语名称的发音 找到与之相近的汉语字词进行翻译。新兴指人“ 类词缀” 所构词\n语主要是将英语词、日语词等音译成汉语词素参与构词。如\n尼特族\n音译自英语词\n“\n” 的简称 指那些不升学、不就业、不进修、不参加就业辅\n导 终日无所事事的人。\n飞特族\n音译自外语词\n由英文的\n“ 自由” 和德文的\n“ 工作者” 结合而成 指不求长期稳定的工作 为了有自主空间 更愿意“ 打短\n工” 的人。\n萝莉控\n音译自日语词“ 口 夕” 指热切追求\n动画、漫画、游\n戏\n等等作品中登场的幼、少女角色的人。\n萌女\n“ 萌” 音译自日语“ 乙元”\n罗马拼音输入为\n指\n一\n岁\n的同人女。\n御宅族\n日文假名打九\n罗马音\n加上\n常直接称为\n加改 一般指对\n动画 漫画 游戏的总称\n具有超出一般人知识面 鉴赏、游玩能力的特\n[p.34]\n山东大学硕士学位论文\n殊群体。\n比拟法\n比拟法指通过比拟、比喻等手段构造新词 比拟法所构新词大多具有简明、\n生动活泼、幽默风趣等特点。如\n肉食女\n形容那些主动追求男性的女性 这类女性多为白领 她们虽阅人\n无数 却仍待字闺阁 一旦看见中意男性 会如饿虎扑食一样主动表达爱意 且\n完全不顾旁观者诧异的目光。\n凤凰男\n取“ 山沟里飞出金凤凰” 之义 指的是那些出身贫寒 几经辛苦\n考上大学 毕业后留在城市工作生活的男子。\n啃椅族\n为了享受空调、无线网络等 在商场、快餐店点两杯饮料坐半天\n的情侣、学生。\n野鹅族\n指母亲陪孩子出国 父亲在家里挣钱养家 聚少离多的韩国家庭。\n草葛族\n多用来形容\n年后出生的年轻人像草毒一样 尽管表面上看\n起来光鲜亮丽 但却承受不了挫折 一碰即烂 不善于团队合作 主动性及积极\n性均较上一代差。\n说明法\n说明法是通过对事物加以描述说明从而产生新词。说明法产生的新词 词义\n一般比较明确 容易理解。在由新兴指人“ 类词缀” 类推产生的新词中 说明法\n所构新词占有很大的比例。如\n合吃族\n临时随机组合共同去饭馆、餐厅消费且费用均摊的人员。\n换客\n将自己不用的物品拿出来跟他人交换对自己有用的物品的人 其\n交换方式一般在网络上进行。\n轻熟女\n二十五到三十岁的未婚女性。“ 轻” 指的是外貌年轻\n“ 熟” 指\n的是内心成熟 谈吐优雅。\n经济适用男\n指外貌与经济实力一般 但性情温和、有责任感、顾家的\n男人。也称“ 经济适用型男” 简称“ 经适男”\n偷菜党\n指活跃于网络游戏开心农场、\n农场等 以偷取他人农场果实\n为乐 以废寝忘食、下手快狠准为特征的网民。\n[p.35]\n山东大学硕士学位论文\n二\n新兴指人“ 类词缀” 的功能\n每一个词语都有其产生和存在的理由。新兴指人“ 类词缀” 以及由它们构成\n的派生词的批量化出现 具有以下四种表达功能。\n一\n简化表述\n语言表述往往出于经济或省力的考虑倾向于采用较为短小的形式 最理想的\n语言表达效果是在保证信息准确无误的前提下 用最经济最简约的手段达到最理想\n的交际效果。派生词在信息含量方面比复合词及词组具有优势 因为类词缀都具有\n语义类化作用 因此能使复杂的短语结构词汇化 以达到简化表述的作用。如\n宅女—\n长期不出门 对自己的生活没有目标 整日在家虚晃度日的女性。\n何洁解约后首亮相 自称变“ 宅女”。《上海青年报\n年\n月\n日\n高跟鞋控—\n非常喜欢购买并穿着高跟鞋的女性。\n袁泉变身“ 高跟鞋控” 陈坤、陆毅沦为小跟班。电影网\n年\n月\n日\n拍客—\n利用各类相机、摄像机或手机等数码设备拍摄图像或视频后 上传\n网络并分享、传播影像的人群。\n都市拍客\n网络推手还是编外记者\n长江商报》\n年\n月\n日\n二\n细化分类\n随着社会的发展 人类对自我的认知越来越深刻 分类标签越来越细致 对\n指人语素的需求量也随之增加。新兴指人“ 类词缀” 的出现一定程度上满足了人\n类追求个性、定义自我的要求。同时 这些新兴指人“ 类词缀” 虽然在大的语义\n指向上与旧有指人“ 类词缀” 都是指“ 一类人” 但在具体的语义内容上 侧重点\n有所不同 语域范围不同 具有细化分类的功能。\n如“ 电脑迷” 和“ 网虫”\n“ 电脑迷” 原指沉迷于电脑的人 它指称的范围较广 既指对电脑相关技术\n着迷 志在计算机软硬件研究开发的人 也指对电脑所提供的服务 如游戏、电\n影、聊天等着迷 沉迷于网络所架构的虚拟世界的人。\n作为“ 电脑迷” 的同义词 后起的“ 网虫” 指称对象更为专一 仅指“ 沉迷\n[p.36]\n山东大学硕士学位论文\n于网络所提供的各种服务的网民”。“ 网虫” 产生后 分担了“ 电脑迷” 的一部分\n指称对象 现在的“ 电脑迷” 主要指对电脑相关技术着迷的人员 一本专门介绍\n电脑技术相关知识的杂志也命名为《电脑迷》。\n三\n强化感情色彩\n感情色彩义是词素的词素义或附加语义的一部分 类词缀的色彩义直接影响\n着所构成词语的感情色彩 许多原本在色彩义上为中性的词根词素在与新兴指人\n“ 类词缀” 结合后具有了明显的情感偏向。\n如“ 党” 带有较强的贬义色彩 因此与“ 党” 搭配构成的词多带有明显的贬\n义 表达憎恨、厌恶的感情。如\n标题党\n指论坛中通过夸大或异化标题吸引人眼球赚取点击量 而所发\n文章内容与标题并无关系或关系不大的一类人。\n脑残党\n指经常在论坛中发表各种无知或幼稚愚昧言论的人。\n五毛党\n逐渐扩展为一种新兴的职业 指被某些公司、企业或其他机构\n雇用 通过在论坛中恶意、大量散发简短广告、调查数据而赚取报酬的一类人\n因发表一条赚取五毛钱而获名“ 五毛党”。\n“ 达人” 带有褒义色彩 指某一行业或领域中的佼佼者。如\n时尚达人\n指引领时尚潮流的一类人。\n美妆达人\n指擅长化妆并拥有自己的一套美妆理论的一类人。\n四\n生动化\n大多数新兴指人“类词缀” 的传播途径都是先由网络或娱乐媒体兴起 在经\n常泡网的年轻网民间传播。年轻网民一般有追求个性化、求新求异、对特殊化事\n物极其敏感的特点 因此相对而言 表达生动化的词语更容易得到快速大范围的\n流传。如\n“ 驴友”、“ 考碗族”\n“ 驴友” 指三五成群或单枪匹马四处游逛的人 他们通常背着背包花最少的\n钱 走最多的路自助旅行。“ 驴友” 的产生一方面是取自“旅友” 的谐音 另一方\n面符合了“ 友” 词族的词语模式 再有就是将自己比作擅长耐力走路的驴 符合\n了“ 驴友” 一词的指称对象—\n青年男女的标新立异心理 更为生动化。\n男子参加驴友团登山遇难 家属状告驴友索赔\n万。辽源信息港\n[p.37]\n山东大学硕士学位论文\n年\n月\n日\n名驴友突遇大雨被山洪冲走。中国新闻网\n年\n月\n日\n三名北京驴友登山 一人心脏病发被成功救助。\n京华时报》\n年\n月\n日\n“ 考碗族” 主要指那些己经在企业就业或者即将告别校园的年轻人 他们为\n进入公务员队伍 长时间有计划地复习备考 全国各地四处参加相关考试。其中\n的“ 碗” 喻指公务员的“ 铁饭碗”。与“ 考碗族” 共存的还有另外一个词“ 公考派”\n“ 公考派” 的词义与“ 考碗族” 完全相同 但是在被认可程度和使用频度上较“ 考\n碗族” 要低得多。在百度输入“ 考碗族” 得到相关结果约\n个 输入“ 公考\n派” 得到的相关结果只有\n个\n“ 考碗族” 一词在政务网和各大主流媒体上都有\n使用 且多数作为关键词出现在文章标题中\n而“ 公考派” 只在个别文章中出现。\n产生这种现象 本文认为相对“ 公考派” “ 考碗族” 一词更加形象生动 更容易\n获得追求时尚的青年人的认可。如\n走近“ 考碗族”。中国共产党新闻网 引自 山西日报\n年\n月\n日\n公考报名结束 “ 考碗族” 再次“ 上路”。桓台政务网\n年\n月\n日\n“ 考碗族” 何去何从。青年时报\n年\n月\n日\n[p.38]\n山东大学硕士学位论文\n第五章\n新兴指人“ 类词缀” 的演化途径\n马庆株先生根据词缀主要来源的不同将语言分成自源性词缀的语言1、他源性\n词缀的语言\n英语、词缀自源他源并重的语言\n如德、俄、法语。根据研究资\n料 英语词缀大多数是他源性的 “ 在现代英语中 本族语词缀是少数 大多数派\n生词缀是源自古希腊文、拉丁文或法文的借词成份” 2现代英语从古英语自由词\n演变虚化而来的派生词缀只有数十个。3“ 与欧洲的主要语言相比 汉语是另一种\n类型的语言。汉语词缀显然主要是自源性的固有语素。......渗透性很强的词缀对\n汉语的渗透性并不强......汉语的抗渗透能力是很强的。” 4由此可见 汉语作为抗\n渗透能力很强的语言 其词缀是以自源性的为主。可以说 汉语中公认的典型词\n缀都是自源性的。但近些年 随着改革开放带来的不同民族、“ 集团之间各方面交\n流的加强 作为信息载体的语言频繁接触 汉语与外来语互相影响 汉语中他源\n性的类词缀开始呈增多趋势。因此 就现代汉语分析 类词缀的来源表现出自源\n性为主、他源性为辅的特点。具体到本文所讨论的\n个新兴指人“ 类词缀” 其\n演化途径则主要表现为四种\n由指人名词虚化而来\n由亲属称谓泛化而来\n通过\n隐喻衍化而来\n由外来语素汉化而来。\n一\n由指人名词虚化而来\n在\n个新兴指人“ 类词缀” 中 有\n个是由指人名词虚化而来 约占总数的\n一半 它们分别是“ 男”、“ 女”、“ 友”、“ 客”、“ 奴”、“ 派”、“ 党”、“ 达人”\n一\n“ 男”、“ 女”\n“ 男”、“ 女” 本义分别为“ 阳性的人\n男性 男人 男孩”\n“ 女性 女人\n与‘男’相对”。作为两个区别词 他们的习惯用法是与中心词语搭配构成“ 男生’ 、\n“ 男友”、“ 男权”、“ 男老师”、“ 女孩”、“ 女神”、“ 女王”、“ 女售票员” 等 在其\n中做定语。但随着\n年“ 超级女声” 这一大众歌手选秀赛在全国的热播 “ 超\n1马庆株\n《现代汉语词缀的性质、范围和分类》 《中国语一\n言学报》 第六期 商务印书馆\n。\n2李冬\n《外国语》 英语派生词缀的语义问题》\n年第\n期。\n3程丽霞\n《语言接触、类推与形态化》 《外语 外语教学》\n年第\n期。\n4马庆株\n《汉语语义语法范畴问题》「 北京。北京语言文化大学出版社\n。\n[p.39]\n山东大学硕士学位论文\n女” 作为“ 超级女声” 的缩略形式在网络及日常生活中迅速传播开来。无独有偶\n同为\n年 央视《百家讲坛》栏目邀请学者讲课 吸引了无数网友的支持 俨\n然成为了学术版“ 超级女声” 模仿“ 超女” 这一称呼 他们被网友称为“ 学术超\n男”。后来\n年出现的“ 快男”\n“ 快乐男声” 的简称\n“ 学术超女” 是对“ 超\n女”、“ 学术超男” 的直接呼应。\n年教育部首次公布\n年\n个汉语新词 “ 剩女”、“ 轻熟女” 赫然在\n列。随着“ 宅男”、“ 宅女”、“ 凤凰男”、“ 孔雀女”、\n’型男”、“ 干物女”、“ 亚熟男”\n的出现 “ 男”、“ 女” 作为表示具有某些具体特征的一类人附加在词根语素之后做\n类词缀的用法逐渐确定下来。\n、\n、\n年 每年都会有一些新的例子出\n现 如\n男\n乙男潮男耳钉男食草男肉食男酱油男蚊子男经适男豪华男\n三不男牛奋男闷骚男文盲男事业男受伤男三无男自由男\n暴力男吝音男懦弱男醋缸男逍遏男忧郁男碎嘴男粉红男\n肌肉男奢侈男食草男草食男三低男经济适用男\n女\n潮女萌女御宅女润物女比婚女杠杆女拜金女普相女肉食女\n三不女三块女同人女草食女白金剩女简单方便女清汤挂面女\n二\n“ 友”\n“ 友” 是一个会意字 甲骨文形状为两个“ 又” 并排 表示两只同时伸出来的\n手 两手相交 形同今日的握手。《说文“又部》“ 同志为友 从二又 相交友也。”\n自古以来 “ 友” 的内涵义基本没变 多指两人经过接触 互相认可的基础上互为\n友好 色彩义上为褒义。但现在广为流传的“ 友” 类词族中的“ 友” 的意义发生\n了泛化 互称“ 友” 的两人可能并不认识 而是因为某种共同的爱好而联系到一\n起 色彩义上则更多地体现为中性。这些爱好可以是共同的物质享受 如“ 饭友”、\n“ 麻友”、“ 粉友”、“ 碟友”、“ 车友” 等 也可以是共同的精神需求 如“ 琴友”、\n“ 棋友”、\n’诗友”、“ 赋友”、“ 藏友”、“ 辩友”、“ 钓友” 等。与原来的“ 友” 建立\n在相接触相认可基础上有所不同 “ 拼友”、“ 驴友” 等更多地表现为互联网上因共\n同爱好而固结的群体 只要你具有了此爱好便自然而然成为其中的一分子。如\n拼友驴友晒友寨友肉友脖友隔友秒友微友牛友\n[p.40]\n山东大学硕士学位论文\n三\n“ 客”\n古代汉语中 “ 客” 就有“ 奔走各地从事某种活动的人” 的意思 如“ 吴王好\n剑客 百姓多疮瘫。”\n后汉书·马廖传》 再如“ 墨客”、“ 政客”、“ 说客”、“ 迁\n客”、\n’门客”、“ 刺客”、“ 侠客”、“ 食客”、“ 缥客” 等皆为此种用法。由此可见\n汉语系统中的“ 客” 本来就是一个指人的类词缀 只是很长一段时间内 “ 客” 的\n派生能力并不是很强。随着中外文化接触日益频繁 “ 黑客” 和“ 博客” 两个外来\n词的借入 激发了“ 客” 的类词缀潜能。“ 黑客” 音译自英文“\n” 其实“\n”\n的正确译法应为“ 骇客” 由于“ 骇客” 的“ 骇”\n应\n和“ 黑客 的“ 黑”\n己\n音相似 在网络传播中被误传 这个外来词在“ 客” 的汉语原有义项“ 奔走各地\n从事某种活动的人” 中找到了部分契合点 从而产生“ 客” 现在的类词缀义“ 在\n网络上从事某种活动的人”。这个契合点也帮助它很快地被人们尤其是网民所接\n受 从而产生了如“ 灰客”、“ 红客”、\n’蓝客”、“ 飞客 、“ 奇客”、“ 极客 之类\n从事与“ 黑客” 相似、相近或相关活动的网“ 客”。但到此 “ 客” 作为类词缀的\n大规模类推还没有出现 直到“ 博客” 一词引入汉语。“ 博客” 在英文中的名称其\n实是“\n” 由\n和\n两个单词组成 字面意思为网络日记 后来喜欢新\n名词的人把这个词的发音故意改了一下 读成\n由此\n这个词被创造\n出来。“\n” 引入汉语音译为“ 博客” 指网络日记 撰写\n的人“\n”\n也被翻译成“ 博客”。“ 客” 作为“ 从事某种活动的人” 与大量词根词素结合 从\n而实现更高程度的词缀化。如\n播客视客测客威客换客拍客拼客微客威客托客秀客印客\n搜客淘客晒客粉客米客掘客优客摩客闪客哄客赞客笑客\n四\n“ 奴”\n与“ 友” 相同 “ 奴” 也是一个会意字 《说文解字》解释说\n“ 奴 奴碑 皆\n古之罪人也。” “\n奴” 类词语在古代曾经出现过 唐代僧人亚栖《论书》\n法不变\n身特点\n纵能入石三分亦被号为‘书奴” “ 书奴” 指一味模仿他人书法\n“ 若执\n缺少自\n沦为书法奴隶的人\n再如北宋大文人苏轼在《赠诗僧道通》中戏称贾岛\n“ 从今岛可是诗奴” “ 诗奴” 指不能自如驾驭文字作诗 而为诗之格律所束缚的\n人。对照《现代汉语词典》增补本\n中对“ 奴” 释义的解释 我们认为“ 书奴\n’\n[p.41]\n山东大学硕士学位论文\n“ 诗奴” 是在其基本义项“ 旧社会中受压迫、剥削、役使而没有人身自由等政治\n权利的人” 基础上意义发生了泛化。只是当时的泛化还只是零星出现 直到\n年“ 卡奴” 一词在台湾出现 激发产生了一系列以“ 奴” 作为类词缀的词语。人\n们开始广泛地用“\n奴” 指称受某些生活或情感享受所累 陷入某种境况无法自\n拔的人。由于“ 奴” 强调一种束缚的关系 与之搭配的词根词素必须得体现出这\n种“ 束缚” 义 类推出来的新词在语义上才合理 因此相对其他几个新兴指人“ 类\n词缀” 由“ 奴” 类推出的新词数量有限。具体如下\n车奴白奴墓奴房奴垄奴基奴孩奴婚奴证奴性奴考奴\n学奴药奴节奴礼奴情奴欲奴考研奴出国奴养老奴\n五\n“ 派”\n现代汉语中作为类后缀的“ 派” 有两种用法 一种是音译英语“\n” 而来\n音译的同时带上了“\n” 的意义 指一种带馅儿的西式点心。随着饮食文化的中\n西交融 “ 派” 的意义变得泛化 新生类推能力增强 不单指西式的小点心 差不\n多日常可做点心馅儿的名词都可与“ 派” 搭配构成“ 一派” 如“ 蛋黄派”、“ 草蓦\n派”、“ 紫薯派”、“ 蓝幕派”、“ 菠萝派”、“ 巧克力派” 等。“ 派” 的另一种类后缀用\n法是本文重点研究的对象 作为指人“ 类词缀” 的“ 派” 在汉语词典中已有类似\n语义 指“ 人物、事物的系统、流别” 但所产生的词语主要局限在宗教、政党或\n学术团体领域 如“ 左派”、“ 右派”、“ 保守派”、“ 革新派”、“ 新月派”、“ 峨眉派”、\n“ 华山派” 等。“ 派” 的新兴指人“ 类词缀” 意义在此基础上进一步泛化 指“ 因\n某一共同特点被归聚到同一聚合体中的人” 所涉领域较为宽泛 如“ 打工派”、“ 公\n考派”、“ 功夫派”、“ 手机派”、“ 激动派” 等。由于隐喻的作用 有些“ 派” 构成\n的新词是将两种类后缀用法交叉到了一起 既可以指带馅儿的点心 又可比喻作\n某一类人 如“ 夹心派” 表面指各种馅儿作夹心层的点心 但更多的是被用来喻\n指夹在某两个利益主体之间左右为难、动弹不得的人。再如\n留洋派恋校派逍遥派潇洒派柒零派创意派精算派跟风派数字派\n歪歪派倒麻派美国派团购派成都派\n派游飘派市场派推介派\n可爱派学生派行动派不就业派\n[p.42]\n山东大学硕士学位论文\n六\n“ 党”\n从历史上看 “ 党” 和“ 族” 的关系比较近 《周礼大司徒》言\n“ 五族为党”。\n“ 族” 也叫“ 党” 如“ 父族”、“ 母族” 也称为\n’父党”、“ 母党”。汉语系统中 “ 党”\n有基本义“ 朋辈、朋党” 指意气相投的人 具有浓重的贬义色彩。日语中的“ 党”\n也具有“ 朋党” 义 在此之外 日语中还有“ 甜食党”、“ 麻辣党”、“ 烟党” 等表\n示“ 拥有相同爱好或属性的一类人” 的意思。“\n党” 经由日本舶至台湾 再由台\n湾流行于大陆。作为新兴指人“ 类词缀” 的“ 党” 保留了基本义中的贬义色彩\n与词根词素构成的新词大多具有贬义 如\n标题党低调党无聊党传说党吃饭党寂寞党偷菜党杯具党补课党\n假唱党偷拍党上班党熬夜党灌水党隐身党在线党自拍党炒作党\n复制党刷屏党飞车党抢包党百度党瑜伽党吊带党丝袜党\n党\n七\n“ 达人”\n年\n月 随着东方卫视制作的一款真人秀节目《中国达人秀\n的迅速走\n红 贴附了各种标签的“ 达人” 开始进入人们的视听领域。有人认为“ 达人” 一\n词来自日语“ 赴。匕凡” 也有人认为“ 达人” 来源于中国传统文化 如《左传·\n昭公七年》中有“ 圣人有明德者 若不当世 其后必有达人” 王勃的《滕王阁序》\n中有“ 所赖君子见机 达人知命”。我们认为“ 达人” 的“ 类词缀” 用法仍然以汉\n语原有用法为基础 而日语的传入只是起了激化的作用。众所周知 日语受汉语\n的影响非常深 尤其在唐代的时候 中日文化交流密切 日本多次遣使者来唐学\n习 那么“ 达人” 一词吸入日语也就不足为奇。“ 其后必有达人”、“ 达人知命” 中\n的“ 达人” 都指的是通达事理的人 借入日语后语义得到延伸 发展为“ 经过长\n年的锻炼 积累了丰富的经验 而得到某个领域真谛的人” 也就是某一领域高手\n的意思。而近几年借助电视媒体 在日语中语义发生变化的“ 达人” 又反过来进\n入台湾流行语 再由台湾传入大陆。在东方卫视的《中国达人秀》中 “ 达人” 在\n保留“ 高手” 含义的基础上又被赋予了另一层含义 即为“ 对某一项目执著偏好\n拥有梦想并渴望创造奇迹的人” 与专业人士不同 他们大多来自民间 对梦想的\n追求不是因为岗位所需 而是兴趣爱好使然。如\n网络达人美容达人团购达人音乐达人灌水达人恋爱达人美丽达人\n[p.43]\n山东大学硕士学位论文\n博客达人时尚达人购物达人数码达人旅游达人原创达人印花达人\n达人数码达人标本达人淘宝达人影响力达人办公室达人\n二\n由亲属称谓泛化而来\n由亲属称谓泛化而来的新兴指人“ 类词缀” 有“ 爷”、“ 哥”、“ 姐”、“ 嫂”、“ 妹”\n个 它们本来都是亲属称谓语 最初仅限于称呼与自己或家庭成员有血缘关系或\n姻亲关系的亲属 它们包含了“ 性别\n男女性”、“ 长幼\n年纪”、“ 辈分\n长同\n晚辈”、“ 系属\n父母系”、“ 血亲姻亲” 五个方面的意义。后来随着社会的发展\n也为了迎合交际中拉近双方心理和情感距离的需要 人们逐渐习惯用亲属称谓语\n来称呼与自己的亲属身份相类似的非亲属 原来的亲属称谓语在“ 系属父母系”、\n“ 血亲姻亲” 两方面的意义逐渐淡化。发展到当今社会 “ 长幼\n年纪”、“ 辈分\n长同晚辈’ 两方面的意义也丢失 仅仅保留了简单的类化性概念 如“ 爷’ 、\n“ 哥” 仅保留了“ 男性” 这一简单的类化意义 “ 嫂” 指“ 从事某行业的已婚女性”。\n同时 这些类词缀又衍生出或凸显了新的附加性的感情意义 如“ 爷” 更多地含\n有诙谐挪榆、讥讽贬斥的意味 “ 嫂” 更多地承载了忍辱负重、吃苦耐劳、善解人\n意等含义 “ 姐”、“ 妹” 则隐含“ 年轻、貌美” 等意义。下面结合具体例子对这\n个由亲属称谓泛化来的新兴指人“ 类词缀” 进行分析。\n一\n“ 爷”\n“ 爷” 的本义是“ 父亲”。《玉篇·父部》“ 箭 俗为父箭字。” 《木兰诗》“ 军\n书十二卷 卷卷有爷名。” 在汉语系统里 “ 爷” 作亲属称谓语 单独使用的情况\n比较少 现如今主要存在于部分北方方言里。大多数情况下多叠用作“ 祖父” 的\n面称“ 爷爷”。在男尊女卑、老幼有序的中国古代社会 “ 爷爷” 往往是一家之主\n在直系亲属中享有最高地位 所以“ 爷” 暗含着“ 地位高” 的语义特征。随着词\n义的发展 “ 爷” 的意义泛化 可以用来敬称与祖父辈分相同或年长的男子 如“ 张\n爷爷”、“ 王爷爷”、“ 大爷”、“ 赵爷” 等。自八十年代以来 随着经济的繁荣 出\n现了越来越多的新行业、新现象 由“ 爷” 派生出一批新词语。如最近出现的“ 人\n权教师爷” 一词被各大权威性报纸、网站使用。\n外交部发言人\n奉劝美国不要以“ 人权教师爷” 自居。中国新闻网\n[p.44]\n山东大学硕士学位论文\n年\n月\n日\n美方称中国人权恶化 中方奉劝美不要当“ 教师爷”。外交部网站\n年\n月\n日\n美国\n“ 人权教师爷”\n人民日报海外版\n年\n月\n日\n“ 人权教师爷” 别再喋喋不休。中国网\n年\n月\n日\n“ 人权教师爷” 可以休矣。人民日报\n年\n月\n日\n再如\n款爷倒爷息爷卡爷包爷揽爷托爷股爷柳爷板爷的爷班爷\n宰爷捧爷导爷膀爷侃爷冒儿爷原料爷担忧爷教师爷\n二\n“ 哥”\n现代汉语中 “ 哥” 最基本的义项是指称同族和亲戚中的兄长。后来 随着词\n义的扩大 “ 哥” 可以泛称年龄稍长或年龄跟自己差不多的男子 但无论是本义的“ 哥”\n还是泛称的“ 哥” 两者在作称谓语时都表现出“ 亲密”、“ 尊敬” 的感情色彩。\n作为新兴指人“ 类词缀” 用法的“ 哥” 最早被人们广泛使用 是与表示新兴\n职业的词语搭配构词 表示“ 从事某一行业或具有某有行业特点的男性” 如“ 吧\n哥”、“ 报哥”、“ 的哥”、“ 铁哥”、“ 呼哥”、“ 空哥”、“ 商哥”、“ 水哥”、“ 托哥”、“ 学\n生哥”、“ 厅哥” 等。\n年 随着“ 犀利哥” 爆红网络 “ 哥” 开始作为指称某个\n特殊个体而使用 如“ 三轮哥”、“ 奔跑哥”、“ 火车哥”、“ 校服哥”、“ 雪碧哥”、“ 熨\n斗哥” 等。出现此现象的原因 是因为这些词语的产生都源于某个具体事件 该\n事件中的主人公虽然因超乎寻常的表现而引人眼球 但其身份却为不为人知的普\n通陌生人 再加上将事件广泛传播的也是一些不知名的网友 因此 “ 犀利哥” 等\n类似词语的出现 更多的是为了指称上的方便。现在 “ 哥” 这种新用法进一步泛\n化 “ 哥” 在原本的“ 尊敬” 意之外又增加了“ 戏谑、调侃” 的色彩 也开始用于\n指称具有某种特点的一类人。如\n鲍牙哥电视哥苍天哥淡定哥深邃哥\n三\n“ 嫂”、“ 姐”、“ 妹”\n《说文》“ 嫂 兄妻也。” 现代汉语中泛称年岁不大的己婚妇女。“ 嫂” 作为\n新兴指人“ 类词缀” 用法 它的出现是有稳定的社会背景的 即大量下岗人员的\n存在和再就业工程的实施。“ 嫂” 字在汉语中有着深厚的文化底蕴 包含“ 忍辱负\n[p.45]\n山东大学硕士学位论文\n重、吃苦耐劳、善解人意、成熟明达” 等种种文化含义 因此由“ 嫂” 构成的一\n系列新词语也包含了“ 同情”、“ 尊敬” 的意思。如\n月嫂报嫂菜嫂地嫂警嫂空嫂军嫂乘嫂商嫂纺嫂巴嫂险嫂\n的嫂房嫂纱嫂水嫂邮嫂乐嫂呼嫂北嫂宴嫂洁嫂护嫂保安嫂\n馒头嫂环卫嫂家政嫂服务嫂接送嫂育儿嫂\n“ 姐” 原本用来称呼本族或亲戚同辈而年龄比自己大的\n不包括称嫂的\n女\n子 “ 妹” 和“ 姐” 相似 只是年龄上与“ 姐” 相反。泛化后指从事某职业或具有\n某特点的年轻女子 不受年龄限制。如\n“ 失控姐” 指的是优漫卡通卫视中演女警\n的四岁半小女孩。再如\n动姐海姐铁姐巴姐吧姐导姐倒姐京姐港姐空姐款姐的姐\n富姐托姐军姐呼姐水姐亚姐一姐吧妹宾妹骨妹鬼妹书包妹\n四眼妹白粉妹外来妹打工妹洗头妹槟榔妹点心妹咖啡妹油脂妹\n随着人类自我意识的增强 “ 个性” 作为一项标杆受到越来越多年轻人的追捧\n求新求异、追求与众不同的现象日益普遍。一些年轻人为了博得众人眼球 不惜\n“ 损毁” 自身形象 用中性甚至异性形象示人 由此产生的“ 春哥”、“ 曾哥”、“ 著\n姐” 打破了“ 哥”、“ 姐” 对指称对象性别的限制 只是此类现象只是少数。\n三\n通过隐喻衍化而来\n隐喻是从一个认知域投向另一个认知域 也就是用一种概念表达另一种概念\n两种概念之间的关联来自认知域里的联想。1在旧有的指人“ 类词缀” 中 “ 手”\n是一个典型的通过隐喻衍化来的类词缀。如“ 狙击手”、“ 削球手”、“ 神枪手” 等\n词根所指的器械或动作必须借助“ 手” 这个肢体部位才能进行 此时的“ 手” 是\n最重要的操作工具 因此 用“ 手” 这一发出动作的局部肢体来隐喻整体的“ 人”\n也就合情合理。与此相似 在\n个新兴指人“ 类词缀” 中 “ 虫” 和“ 二代” 也\n是通过隐喻衍化而来。\n一\n虫\n现代汉语中 “ 虫” 指的是节肢动物的一类 因其中的大多数外形丑陋且对人\n1齐焕美\n《汉语表人词缀的认知基础及社会文化蕴涵》 菏泽学院学报\n年 第\n期。\n[p.46]\n山东大学硕士学位论文\n类有害 如“ 蛆虫”、“ 蚜虫”、“ 豆虫”、“ 甲壳虫” 等 所以不受人类喜爱。后来\n人们将“ 虫” 的“ 危害性” 特征附在破坏人民生活的人身上 借用固有词语“ 蛀\n虫”、“ 蠢虫”、“ 腐虫”、“ 寄生虫” 等指称贪官污吏 “ 虫” 具有了明显的比喻义。\n随着其比喻义的固定 “ 虫” 的指人类词缀用法越来越鲜明 如“ 懒虫”、“ 馋虫”、\n“ 磕睡虫”、“ 可怜虫”、“ 跟屁虫”、“ 应声虫”、“ 糊涂虫” 等。此时的“ 虫” 词族\n仍具有令人厌恶的贬义色彩 但已达不到令人憎恨的程度 “ 虫” 的贬义色彩相对\n减弱。随着语言的发展 人们在“ 虫” 的“ 危害” 义之外又挖掘出“ 虫” 的另一\n特征 即啃噬东西时往往很慢 需要很长时间 但一直在坚持 从不主动放弃。“ 虫”\n的这一特征被运用到指人范畴中 指“ 沉迷于某一事物的人” 此时“ 虫” 的贬义\n色彩进一步淡化 如“ 书虫 、“ 网虫”、“\n虫”、“ 咖啡虫”、“ 游戏虫” 等。再\n到现在 “ 虫” 的词义被进一步引申。长时间沉迷于某一事物 对此事物必然会有\n深刻的理解 从而由知之不多到精通 “ 虫” 有了指称“ 某一行业中的行家” 的意\n思 贬义色彩消退 逐渐带有褒扬或戏谑的意味 如“ 车虫” 指在汽车交易中搞\n推销从中获利的人\n“ 房虫” 指充当中间人从买卖房子中获取利益的人\n“ 药虫”\n指从药品生产经营中牟取利益的人。\n二\n二代\n汉语系统中并没有“ 二代” 的用法 只有数量词“ 第二代” 指运用新技术等\n手段对原有产品进行革新 从而创造出具有更佳性能的新产品 如“ 第二代身份\n证” 指采用非接触式\n卡技术制作的身份证 再如“ 第二代战斗机”、“ 第二代酷\n睿\n处理器”。本文认为“ 二代” 是对“ 第二代” 的简化 将子女的繁衍比喻做产\n品的更新换代 产生“ 继承了父辈特点的一类人” 的语义。如“ 富二代” 指\n年\n代出生 继承上亿家产的富家子女\n“ 星二代” 指同父母一样继续从事演艺工作并\n成为明星的人。再如\n农二代独二代单二代官二代民二代贫二代穷二代权二代写二代\n四\n由外来语素汉化而来\n随着改革开放的深入 汉民族与其他民族各方面交流的加强 新概念的引入\n新时期汉语新兴的类词缀中出现了一些他源性的类词缀。在翻译工作者和广大受\n[p.47]\n山东大学硕士学位论文\n众的共同努力下 这些外来词译音成分或直译成分大多借用了汉语己有词形 进\n入现代汉语词汇系统 实现外来语素的汉化 从而使这些汉语固有词在原有语义\n基础上产生新的义项。具有了新义项的词作为类词缀与词根词素大量结合构成新\n词。在新兴指人“ 类词缀” 中 “ 族” 和“ 控” 属于此类。\n一\n“ 族”\n“ 族” 在《现代汉语词典》中有四种解释 其中释义\n是“ 指具有某种共性\n的一大类事物” 如“ 水族”、“ 卤族元素”、“ 芳香族化合物”。作为近几年使用度\n非常高的“ 族” 其新兴指人“ 类词缀” 用法不能不说和它的这一基本义有密切关\n系。当然 “ 族” 词语快速流行的直接触发因素还是日语词“ 御宅族”、“ 暴走族”\n的吸入。在中日文化尤其是语言的交流过程中 台湾很大程度上充当了中转站的\n作用 日本的流行元素多数先传入台湾 后经台湾传入大陆 “ 族” 也不例外。“族”\n传入后与汉语固有词“ 族” 的基本释义交融 衍化出“ 具有某种共性的一类人”\n的义项 并作为一个语素进入汉语造词系统。“ 族” 的新生类推能力非常强 以《中\n国语言生活状况报告》中公布的历年新词为参照 “ 族” 作类词缀类推出的新词\n年有“ 奔奔族”、“ 吊瓶族”、“ 飞鱼族” 等共\n条1\n年有“ 炒股族”、“ 毕\n婚族”、“ 代排族”、“ 考碗族” 等共\n条2\n年有“ 脑残族”、“\n隐身族”、\n“ 囤粉族”、“ 固贷族” 等共\n条3\n年更是增加了“ 背卡族”、“ 毕漂族”、“ 啃\n楼族”、“ 秒杀族”、“ 刷刷族” 等共\n条4\n年又增加了“ 恐归族”、“ 炒更族”、\n“ 作\n族”、“ 退盐族”、“ 周族” 等新词语。\n二\n“ 控”\n在分析“ 控” 之前 我们需先对现代汉语系统中早已存在的另一种“ 控” 族\n1合吃族、急婚族、啃椅族、赖校族、乐活族、慢活族、陪拼族、捧车族、试药族、装嫩族\n2难民族、转存族、爱邦族、帮帮族、炒鸟族、倒卡族、拒电族、辣奢族、漱婚族、晒黑族、晒卡族、掏空\n族、淘券族\n3泡良族、抢抢族、抠抠族、野鹅族、家里蹲族、土食族、酱油族、山寨族、恐年族、职业敲族、住车族、\n走粉族、啃薪族、宅内族、\n族、家务甩乎族、抛抛族、闪闪族、爱券族、背奶族、单眼族、飞单族、\n卧槽族、宅生族、纵狗族、扒手族、枪迷族\n4保湿族、鹰爱族、草食族、蹭暖族、抄号族、朝活族、车车族、车缝族、吃网族、揣证族、倒分族、抵触\n族、地铁快餐族、短漂族、反烧族、搞手族、鬼旋族、好高族、后备厢族、胡萝卜族、换乘族、换客族、\n婚活族、剪彩族、老公族、理车族、庐舍族、裸婚族、麦兜族、蘑菇族、捏捏族、趴网族、泡泡族、骗\n保族、飘摇族、抢卖族、悄婚族、闪玩族、上班走私族、时彩族、试衣族、死扣族、速食族、偷菜族、\n玩卡族、无火族、虾米族、咸鱼族、向口葵族、虚客族、学租族、蚁族、隐车族、英漂族、智旅族、逐日\n族、装忙族、准老族、桌游族、字幕族\n[p.48]\n山东大学硕士学位论文\n词进行简单说明。为了更好区分 我们将这种已有的“\n控” 记为“\n控\n”。“\n控 ” 是由非定位词根“ 控\n” 与词根\n复合而成的双音节复合词。“ 控\n” 取的是\n它的原有义项“ 控制” 义 “\n” 的构成主要是单音节语素 如“ 疾控”、“ 线控’ 、\n“ 数控”、“ 声控”、“ 风控” 等。从表达和运用上看 这类“\n控\n” 复合词多为专\n有名词 多应用于科学技术领域。而作为本文要分析的新兴指人类词缀的“ 控”\n是近两年从日语中音译来的。\n“ 控” 音译自日语“ “ 夕” 它的源头是英文单词“\n”\n萝莉塔\n情结\n中\n的前头音\n。“\n哪\n” 用日语片假名表记为“ 口\n一夕·二夕\n卜“ 夕久” 简称作“ 口\n“ 夕”。后来随着日本动漫的传播 “ 口\n“ 夕” 在日语中的意义得到延伸 不再单纯是萝莉塔情结的简称 而扩展为指热\n切追求\n英文\n卫\n、\n、\n的缩写 是动画、漫画、电玩游戏\n的总称\n作品中登场的幼女、少女角色的爱好者们。以此为基础\n界形成了\n“ 正太控”、“ 女仆控”、“ 妹控”、“ 伪娘控”、“ 大叔控”、“ 美少年控” 等一批类似\n的词语。随着\n世纪\n年代日本动漫在中国的盛行 喜欢动漫的人们把“ 控”\n族词音译到现代汉语系统。\n世纪 随着网络的发展和人们交流的深入 日本动\n漫领域中的“ 控” 族词突飞猛进式地在网络中出现。“ 控” 族词在产生之初其词义\n因感情极端强烈所带有的贬义色彩也逐渐消退而成为一个中性词 语义的适用范\n围被扩大 逐步深入到日常生活语言的通用领域。现在作为指人“ 类词缀” 的“ 控”\n指的是“ 特别喜好某样东西的一类人”。“ 控” 对词根词素的语义限制较小 因此\n其新生类推能力特别强 构成的新词很多 如\n花控\n控\n控微博控品牌控蜜糖控条纹控丝袜控苹果控\n腮红控性能控辣椒控进口控声音控清纯控大叔控铁塔控格子裙控\n[p.49]\n山东大学硕士学位论文\n第六章\n余论\n本文以专业的大规模语料库为基础 综合运用现代汉语词汇及现代语法理论\n方面的相关知识和研究成果 对现代汉语指人“ 类词缀” 尤其是\n个新兴指人\n“ 类词缀” 进行了定性和定量的分析 描写了新兴指人“ 类词缀” 的特点、演化\n途径及使用情况。\n通过对新兴指人“ 类词缀” 及其派生词语的深入研究 可以预测新兴指人“ 类\n词缀” 的发展将呈现以下趋势\n一\n可能会有新的“ 类词缀” 出现\n现代中国社会处于高速发展阶段 新现象、新理念以惊人的速度涌现 类词\n缀的派生方式能够快速大量的构成新词 满足新事物的命名所需 因此在以后的\n时间里 可能会有新的“ 类词缀” 出现。伴随国际间经济文化交流的日益密切\n对于汉语中固有词缀很少的现象 汉语系统将吸收越来越多的外来词语 来弥补\n汉语词汇系统本身的缺陷 他源性“ 类词缀” 可能会继续增多。\n二\n某些“ 类词缀” 可能发展成为“ 典型词缀”\n在长期的语言发展变化中 某些“ 类词缀” 很可能语义进一步虚化 语法功\n能进一步增强和稳定 最终发展成为“ 典型词缀”。尽管目前汉语中还少有类词缀\n完全虚化为典型词缀的例子 但通过分析 我们可以清晰的看到类词缀的发展进\n程是不断远离词根 不断向典型词缀靠近的。\n三\n某些“ 类词缀” 可能回归词根词素\n某些新兴指人“ 类词缀” 的出现只是现今某特定社会文化现象的反映 很可\n能将成为“ 昙花一现”。随着时间长河的不断筛选 这部分新兴指人“ 类词缀” 终\n将回到词根词素的行列。如“ 二代” 由“ 二代” 派生构成的词语在语义指称上具\n有明显的以偏概全的缺陷。“ 官二代” 的“ 李刚之子” 及“ 军二代” 的药家鑫毕竟\n只是少数现象 并不能代表全部。随着词语对应的特定现象淡出人们的视野 这\n些类词缀也将回归到词根词素。\n受本人能力所限 本文还有许多不足之处 比如限于抽样规模 基于语料库\n[p.50]\n山东大学硕士学位论文\n的计量研究不足 统计不够全面 得出的数据还有所欠缺\n没有考察新兴指人“ 类\n词缀” 在各文体中的使用情况\n对于新兴指人“ 类词缀” 派生构成的新词在产生\n后各年的存废情况、流行情况没有细致考察 这也是留待以后解决的问题。\n[p.51]\n山东大学硕士学位论文\n参考文献\n「〕安志伟\n现代汉语指人名词研究\n〕山东师范大学博士学位论文\n「〕曹保平\n汉语类词缀研究述评「\n曲靖师范学院学报\n年第\n期\n〔〕曹炜\n现代汉语词汇研究仁\n北京\n北京大学出版社\n「\n陈昌来 朱艳霞\n说流行语“\n党” —\n兼论指人语素的类词缀化「\n当代\n修辞学\n年第\n期\n「\n陈光磊\n汉语词法论〔\n上海\n学林出版社\n「\n程辰\n从犀利哥和凤姐看哥、姐背后文化义的擅变〔\n广州广播电视大学\n学报\n年第\n期\n」刁晏斌\n现代汉语准词缀发展变化的几种模式〔\n廊坊师范学院学报\n年第\n期\n丁建川\n两个新兴的类前缀「」宁夏大学学报\n人文社会科学版\n年\n第\n期\n「\n董秀芳\n汉语词缀的性质与汉语词法特点\n汉语学习\n年第\n期\n「\n韩陈其\n汉语词缀新论「\n扬州大学学报\n人文社会科学版\n年第\n期\n葛本仪\n现代汉语词汇学\n」济南\n山东人民出版社\n仁」郭立萍\n现代汉语外来词单音成分语素化和词缀化动因研究【〕山西大同\n大学学报\n社会科学版\n年第\n期\n「\n韩晨宇\n汉语三音节新词语与类词缀的发展初探「\n北京广播电视大学学\n报\n年第\n期\n「〕胡裕树主编\n现代汉语仁\n上海\n上海教育出版社\n巧\n金迎喜\n中韩词缀化现象比较「〕解放军外国语学院学报\n年第\n期\n李蓓\n现代汉语新兴类词缀研究「\n辽宁师范大学硕士学位论文\n」李华\n现代汉语表人名词后缀、类后缀考察「〕北京语言大学硕士学位论\n文\n「〕李进玉\n现代汉语类词缀研究「\n西北师范大学硕士学位论文\n[p.52]\n山东大学硕士学位论文\n李萌\n谈汉语中来自外来语的类词缀「\n齐齐哈尔师范高等专科学校学报\n年第\n期\n李明洁\n作为一种社会文化现象的新语汇—\n关于“ 某嫂” 称谓法\n语\n文建设\n年第\n期\n李媛媛\n网络“ 控” 族新词及其所折射的社会文化心理「\n山西大同大学\n学报\n社会科学版\n年第\n期\n刘月华\n实用现代汉语语法「〕北京\n外语教育与研究出版社\n鲁瑛\n“\n族” 词类的语言学研究「\n外国语文\n年第\n期\n陆志韦等\n汉语的构词法〔〕北京\n科学出版社\n罗湘英\n亲属称谓的词缀化现象「」汉语学习\n年第\n期\n吕叔湘\n汉语语法分析问题〔\n北京\n商务印书馆\n吕叔湘\n说代词语尾“ 家” 「\n载《汉语语法论文集》「〕北京\n商务\n印书馆\n马庆株汉语语义语法范畴问题「\n北京北京语言文化大学出版社\n马庆株\n现代汉语词缀的性质、范围和分类「\n《中国语言学报》\n年\n第\n期\n缪小放\n新兴类语缀例释「\n语文建设\n年第\n期\n裴景瑞 于全有\n网络“ 客” 族新词的产生机制与社会文化心理「〕柳州\n职业技术学院学报\n年第\n期\n齐焕美汉语表人词缀的认知基础及社会文化蕴涵「\n菏泽学院学报\n年第\n期\n任学良\n汉语造词法仁〕北京\n中国社会科学出版社\n沈家煊\n不对称和标记论〔」南昌\n江西教育出版社\n沈家煊\n“ 语法化” 研究综观仁」《外语教学与研究》\n年第\n期\n盛玉麒\n语言文字信息处理〔\n济南\n山东大学出版社\n宋伶俐\n从汉语词缀的定义看“ 词缀化”\n广东教育学院学报\n年\n第\n期\n宋培
