从能产性来看,“鬼”的能产性最高,“怪”的能产性最低;从语义\n色彩来看,“X鬼”“X精”“X怪”通常表贬义,“X神”多表褒义;从音节的组合能力来看,“怪”“神”多与单音节成分组\n合,“鬼”多与双音节成分组合,“精”与单双音节组合的情况较为平均。通过对“鬼”“精”“怪”“神”泛化机制的对比研\n究,可知其语义内部的关系大致经历了相似的从“传说中的事物”义隐含到“具有某种特征(状态)的人”义逐渐泛化的\n过程。此过程展现了信息化的发展给汉语词汇注入了新的生机与活力,以及人们的思想由“鬼神崇拜”到“人文关怀”的\n转变。\n关键词:类后缀;语义特征;泛化机制\n中图分类号:H136;H146.1 文献标识码:A 文章编号:1672-8254(2025)01-0014-09\n汉语中有一种被称为类词缀的语法形式[1]。\n类词缀呈现类化(泛化)的意义特征,指在“原有\n实语素意义的基础上,以‘ 隐喻’ 联想的思维方\n式,通过类推机制形成的一种以原语素的某种语\n义特征为内涵、外延扩大了的类指(泛指)义” [2]。\n汉语中的“鬼” “精” “怪” “神” 具有能产性、定位\n性及语义虚化等特点,亦属于类词缀。本文将通\n过对其所构成的常用词进行对比分析,探究其在\n能产性、音节数与语义色彩方面的异同,并将其\n语义特征与历时泛化过程进行对比,讨论其泛化\n机制。本研究既能增进对汉语类词缀的理解,也\n能够揭示词汇发展与文化变迁的联系。\n一、类后缀“鬼” “精” “怪” “神” 的对\n比分析\n(一)构成常用词的数量对比\n笔者使用BCC汉语语料库统计检索并手动\n去除不相关词语后,总结“鬼” “精” “怪” “神” 作\n为类后缀时构成的常用词语共150个(见表1)。\n通过表1的对比分析,可以得出以下结论。\n1.“X鬼”的能产性最高\n由“鬼”“精”“怪”“神”作为类后缀所构成的\n常用词语中,“X鬼”的能产性最高。“鬼”能与名\n词、形容词和动词结合,说明其语法化程度较高。\n其中“A+鬼”构词数量最多,占“X鬼”构词总数的\n66.20%。可知在由“X鬼”产生的新词语中,前置\n成分“X”多是形容词或形容词性成分,如近年来网\n络热词“机灵鬼”,就是“A+鬼”结构。\n“X神” 能与名词、形容词和动词结合,其中\n“N+神”的构词数量最多,占“X神”构词总数的\n60.98%。从中能够看出在由“X神”产生的新词\n语中,前置成分“X” 多为名词或名词性成分。近\n些年来“人名+神”的词语频频出现,如“韦神(韦\n东奕)”“乔神(乔丹)” “巴神(巴萨)” 等,都是由\n“N+神”构成。\n“X精” 能与名词、形容词和动词结合,其中\n“N+精”的构词数量最多,占“X精”构词总数的\n57.69%。由此可知由“X精” 产生的新词语中,\n前置成分“X” 多是名词或名词性成分,如近年来\nDOI:10.13831/j.cnki.issn.1672-8254.2025.01.003\n[p.2]\n的网络热词“柠檬精” “小腰精” “杠精” 等,都是\n由“N+精”构成。\n表1 “鬼”“精”“怪”“神”作为类后缀时构成的常用词语\n单位:个\n数量\n格式\n作为类后缀时构成的常用词语举例\n数量\n鬼(71)\n“N+鬼”\n神鬼、牛鬼、人鬼、烟鬼、海鬼、水鬼、怨鬼、痨病鬼、精灵鬼、女鬼、邋遢鬼、笨蛋鬼、滑头\n鬼、骷髅鬼、男鬼、流氓鬼、鼻涕鬼、苦命鬼、幽灵鬼\n19(26.76%)\n“A+鬼”\n恶鬼、老鬼、小鬼、大鬼、丑鬼、死鬼、冤鬼、瘦鬼、胖鬼、馋鬼、傻鬼、坏鬼、穷鬼、笨鬼、倒霉\n鬼、幼稚鬼、调皮鬼、自私鬼、吝啬鬼、淘气鬼、风流鬼、开心鬼、势利鬼、缺德鬼、顽皮鬼、\n糊涂鬼、好吃鬼、花痴鬼、逍遥鬼、精细鬼、贪心鬼、好色鬼、快活鬼、恶心鬼、贪吃鬼、滑稽\n鬼、麻烦鬼、可爱鬼、刻薄鬼、荒唐鬼、粗心鬼、下流鬼、偏心鬼、胆小鬼、懒惰鬼、浪荡鬼、\n肮脏鬼\n47(66.20%)\n“V+鬼”\n吸血鬼、捣蛋鬼、催命鬼、杀人鬼、冒失鬼\n5(7.04%)\n精(26)\n“N+精”\n人精、蛇精、树精、鬼精、水精、鳖精、狗精、马精、猫精、鱼精、猪精、狐狸精、马屁精、蜈蚣\n精、蜘蛛精\n15(57.69%)\n“A+精”\n马屁精、迷人精、麻烦精、烦人精、孤独精\n5(19.23%)\n“V+精”\n倒霉精、害人精、闯祸精、惹祸精、磨人精、败家精\n6(23.08%)\n怪(12)\n“N+怪”\n蛇怪、湖怪、雪怪、海怪、风怪、酒怪、山怪、畸形怪、大头怪、天鹅怪\n10(83.33%)\n“A+怪”\n—\n0(0%)\n“V+怪”\n赌怪、蒙面怪\n2(16.67%)\n神(41)\n“N+神”\n雷神、歌神、山神、门神、武神、福神、月神、龙神、水神、冰神、酒神、剑神、火神、雪神、蛇\n神、股神、战神、雨神、狼神、虎神、心神、赌神、财神、日月神、土地神\n25(60.98%)\n“A+神”\n古神、萌神、穷神、幸运神、糊涂神、自由神、明白神\n7(17.07%)\n“V+神”\n爱神、睡神、封神、考神、杀神、食神、学神、吃神、保护神\n9(21.95%)\n2.“X怪”的能产性最低\n常用词中,“X怪” 只能与名词和动词结合,\n且数量较少,在“鬼” “精” “怪” “神” 中能产性最\n低,语法化程度较弱。\n其中,“N+怪”结构所构成词的数量最多,占\n“X怪”构词总数的83.33%。于是可知由“X怪”\n产生的新词语中,前置成分“X” 多为名词或名词\n性成分,如近年来出现的网络热词“压力怪” “阴\n阳怪” “ 细节怪” “ 长手怪” 等,都是由“ N+怪”\n构成。\n但是这并不意味着除最能产的名词和动词\n外,其他词性的前置成分“X”就不能和“怪”产生\n新词。如笔者所搜集的常用词中未出现由“A+\n怪”构成的词,但是近些年来的网络词语中仍出现\n了一些由“A+怪”构成的新词语。例如,形容一个\n人对外界经常表现过度的敏感,可以称其为“敏感\n怪”;形容一个人总是对自己的学习、工作等方面\n有过度的焦虑,可以称其为“焦虑怪”;形容一个人\n总是在行为或思想上有过度的纠结,可以称其为\n“纠结怪”;等等。\n(二)构成常用词前置成分音节对比\n将“鬼”“精”“怪”“神”作为类后缀时构成的\n常用词语按音节划分(见表2),统计分析后得出\n以下结论。\n表2 “鬼”“精”“怪”“神”作为类后缀时构成常用词的前置成分音节数\n单位:个\n鬼\n精\n怪\n神\n数量\n比例(%)\n数量\n比例(%)\n数量\n比例(%)\n数量\n比例(%)\n单音节\n21\n29.58\n12\n46.15\n8\n66.67\n34\n82.93\n双音节\n50\n70.42\n14\n53.85\n4\n33.33\n7\n17.07\n1.“鬼”作为类后缀时,与双音节成分结合的\n情况较为常见\n“鬼”前置成分多为双音节,占其构词总数的\n70.42%。可见由“X鬼”产生新词时,“X”多为双\n音节成分。如网络热词“机灵鬼”一词,“机灵”便\n为双音节词。又如“糊涂鬼”“逍遥鬼”“滑稽鬼”\n“可爱鬼”中的“糊涂”“逍遥”“滑稽” “可爱”,都\n是双音节词。\n5\n1\n第1期\n杨媛媛,杨博淳:类后缀“鬼”“精”“怪”“神”语义特征与泛化机制对比研究\n[p.3]\n2.“精”作为类后缀时,与单双音节成分结合\n的情况较为平均\n“精”前置成分为单音节的与双音节的数量\n基本持平,由表可知分别占构词总数的46.15%\n和53.85%。由“X精” 产生新词时,“X” 为单音\n节与双音节的情况差不多。如近年来出现的网\n络热词中,既有由单音节成分“杠”与“戏”组成的\n“杠精”和“戏精”,又有由双音节成分“柠檬” 组\n成的“柠檬精”。\n3.“怪”“神”作为类后缀时,与单音节成分结\n合的情况较为常见\n“怪”“神”前置成分为单音节的,分别占其构\n词总数的66.67%和82.93%。由此可知,当“X\n神”产生新词时,“X” 多为单音节成分。如近年\n来的网络热词“ 萌神” 等,都是由单音节成分与\n“神”构成。但是它们作为类后缀产生新词时,前\n置成分的音节数不一定是常构成词的音节数。\n例如由“X怪”产生的网络热词中,“X”为双音节\n成分的占大多数,就像“压力怪”“纠结怪” “敏感\n怪”等,都是由双音节成分与“怪”构成。\n(三)构成常用词色彩义对比\n将“鬼”“精”“怪”“神”作为类后缀时构成的\n常用词,按色彩义划分可以分为褒义词、中性词\n和贬义词(见表3),统计分析后得出以下结论。\n表3 “鬼”“精”“怪”“神”作为类后缀时构成常用词的色彩义\n单位:个\n鬼\n精\n怪\n神\n数量\n比例(%)\n数量\n比例(%)\n数量\n比例(%)\n数量\n比例(%)\n褒义词\n3\n4.05\n0\n0\n0\n0\n36\n87.80\n中性词\n5\n6.8\n1\n3.84\n0\n0\n3\n7.32\n贬义词\n63\n88.73\n25\n96.15\n12\n100\n2\n4.88\n1.“鬼” “精” “怪” 作为类后缀时,大多数为\n贬义词\n“鬼” “ 精” “ 怪” 作为类后缀时,只有“ 可爱\n鬼”“开心鬼”“淘气鬼”等少数词带有褒义色彩。\n可知由“鬼” “精” “怪” 作为类后缀产生的新词,\n多是贬义词,如网络热词“杠精”“柠檬精” “抄袭\n怪”等。但是也会产生褒义词,如“开心鬼”“机灵\n鬼”等。\n2.“神”作为类后缀时,大多数为褒义词\n“神”作为类后缀时,只有“邪神”“穷神”“糊\n涂神”等少数词带有贬义色彩。可知由“神”作为\n类后缀产生新词时,多是褒义词,如网络热词“可\n爱神”。\n二、类后缀“鬼” “精” “怪” “神” 的语\n义特征与语义分类\n(一)“X鬼”的语义特征与语义分类\n1.“X鬼”的语义特征\n“鬼”的本义为人死后的灵魂,所以在古时\n“死人”又称“归人”。《说文解字》云:“人所归为\n鬼。” [3]《尔雅》又载:“鬼之为言归也。” [4]“鬼”在\n古代方言中亦有狡黠、机灵之意。《方言》:“自关\n而东,赵、魏之间谓之黠,或谓之鬼。” [5]“鬼”又有\n“鬼怪” 义,《诗经》中便有“ 为鬼为蜮” [6]之说。\n大部分由“X鬼” 构成的词都有贬义色彩。这是\n由于古代生产力和科技文化水平有限,当先民无\n法解释一些自然现象时,便认为有鬼作祟。如东\n晋《搜神记》载:“吴时,庐陵郡都亭重屋中常有鬼\n魅,宿者辄死。自后使官,莫敢入亭止宿。” [7]因\n此,人们通常将一些陋习或对某一行为的蔑视称\n为“X鬼”。正是“鬼怪”这一含义为“鬼”的类词\n缀化奠定了基础。“X鬼” 构成的词多为名词性\n词语,在使用时有夸张意味,增强了“鬼” 字前面\n词语的含义,而“ 鬼” 本身的词汇意义逐渐类化\n(泛化)。\n2.“X鬼”的语义分类\n由“X鬼” 构成的词按意义划分主要有以下\n几类:\n(1)传说中有明显特征的鬼怪\n水鬼、山鬼、女鬼、吸血鬼\n第一类词语中的“鬼” 未脱离“鬼魂、鬼怪”\n义,表示传说中的某种鬼魂。如“水鬼” 意为“水\n中的鬼怪”,“ 山鬼” 就是“ 山里的精怪”,“ 吸血\n鬼”是“会吸血的生物”。由于这些鬼魂常被人们\n厌恶,所以多为贬义词。\n6\n1\n渤海大学学报(哲学社会科学版)\n第47卷\n[p.4]\n(2)具有某种明显的负面形象特征与陋习\n的人\n酒鬼、烟鬼、恶鬼、痨病鬼、刻薄鬼、自私鬼、\n邋遢鬼、胆小鬼、吝啬鬼、贪吃鬼\n第二类词语中的“鬼” 未完全脱离“鬼魂、鬼\n怪”这一含义,由“X鬼” 产生的具有[+人]语义\n特征的词时多带有蔑视意味。比如“烟” “酒” 本\n来是中性词,但是加在“鬼”字前,就成了贬义词。\n下面例句1中的“酒鬼” 便用来形容一个嗜酒如\n命的人渣的形象。例句2中的“烟鬼”,常作为人\n们“斥责”的对象出现,是一种负面形象。\n1前些日子,我们小镇上一位初中生放学回\n家,父母忙于打麻将,没有为他准备饭菜,他百无\n聊赖去街头玩耍,遇一酒鬼索要钱财,孩子没有,\n竟被掐死。(《人民日报》1994年)1\n2悦意的人先表示了悦意,随之就数落起烟\n鬼的无德;不悦意的人先斥责烟鬼的败家子行\n径,随之就表示根本不该予以同情,但究竟是人\n数不多。(陈忠实《白鹿原》)\n(3)具有某种明显孩子特征的人\n淘气鬼、调皮鬼、捣蛋鬼、机灵鬼\n第三类词语中,“鬼” 的“鬼怪、鬼魂” 义已经\n比较模糊了,这类词中的“鬼” 只能表示一类人。\n此时由“X鬼” 产生的具有[+人]语义特征的词\n常用来形容某些具有童稚特征的人,且多为褒\n义。如“机灵” 是褒义词,“淘气” 是中性词,加在\n“鬼”前均构成了褒义词。例句3和4中的“淘气\n鬼”与“机灵鬼”都表示一种带有孩子天性特征的\n人,使用“淘气鬼”与“小机灵鬼”比单说某人“淘\n气”与“机灵”更能表达一种喜爱之情。\n3数十位精灵可爱的小小巫师、淘气鬼以及\n天使精灵于大埔超级城表演杂技及歌舞,给游客\n带来一个又惊又喜的万圣节。(新华社2004年)\n4在中国乒乓球队一线主力队员中,刘国梁\n年纪最轻,个头最小,在大伙心目中,他是个“小\n机灵鬼”。(《人民日报》1996年)\n(4)处于某种状态的人\n开心鬼、可爱鬼\n第四类词语中,“鬼” 的“鬼怪、鬼魂” 义已经\n消失,此时由“X鬼”产生的具有[+人]语义特征\n的词只是表示某人存在的状态,且多为褒义。如\n例句5和6中的“开心鬼” 与“可爱鬼” 是网络新\n词。由于“开心”和“可爱” 是带有明显褒义色彩\n的词,所以与“ 鬼” 构成新词语后仍带有褒义\n色彩。\n5我不在乎万圣节,只想当开心鬼。(新浪\n微博2023年)\n6狗狗并非什么人生导师,只是傻憨的可爱\n鬼而已。人们不可能像狗狗那样,但是偶尔放肆\n一下疯一疯也没什么不可以,毕竟人生只有一\n次!(网络语料2016年)\n(二)“X精”的语义特征与语义分类\n1.“X精”的语义特征\n“精”的本义是挑选好米[3](143)。后又有“妖\n精、精灵”等义。《搜神记》载“千年老精,不能复\n别” [7](402),在这里的“精” 是“ 妖精” 的意思。又\n有“虎者,阴精而居乎阳” [7](175),这里的“精” 即\n为“精灵” 之义。“妖精、精灵” 中的“精” 是指除\n人以外的非生命体经过修炼或吸收灵气而形成\n的带有某种特征的事物。古人认为,如果有一种\n东西吸取日精月华,年深日久便能“成精”,其可\n幻化为人形拥有某项特殊的能力,又能魅惑人。\n《论衡》载“物之老者,其精为人” [8]。《抱朴子》\n中也谈道“ 又万物之老者,其精悉能假托人\n形” [9]。正是“妖精、精灵”这一义项为“精”成为\n类词缀奠定了基础。\n2.“X精”的语义分类\n由“X精” 构成的词按意义划分主要有以下\n几类:\n(1)传说中由生命体经过修炼或吸收灵气而\n形成的具有一定修为且有害于人的妖精\n树精、鼠精、琵琶精、蜘蛛精\n第一类词语中的“精”没有脱离“妖精、精灵”\n的含义。一般来说,这类妖精都具有人的某些特\n征或假托人形而存在,因此常为贬义词。如“树\n精”就是大树经过修炼后假托人形的妖精。\n(2)暗喻某类具有一定动物或事物特征的人\n陀螺精、蛇精、兔子精、狐狸精、柠檬精\n第二类词语中的“精” 未完全脱离“妖精、精\n灵”的含义。因此,由“X精” 产生的具有[+人]\n语义特征的词,首先表示某些动植物或其他事物\n“成精了”。这与第一类词语相似。而后用来隐\n喻人时,又将此类事物最明显的特征扩大化来形\n容人,这类词多有贬义色彩。如例句7中的“狐\n7\n1\n第1期\n杨媛媛,杨博淳:类后缀“鬼”“精”“怪”“神”语义特征与泛化机制对比研究\n[p.5]\n狸精”,首先表示的是“狐狸”这种动物“成精” 后\n假托人形。因为狐狸长相媚态且生性狡猾,所以\n用“狐狸精”来形容人时,便常表示妖冶淫荡的女\n子或奸诈狡猾的人。\n7老板娘瞪眼道:“你想赶我走,好让那小狐\n狸精陪着你?(古龙《陆小凤传奇》)\n又如网络热词“柠檬精”。柠檬的特点是口\n感酸,所以将柠檬“酸”的特点扩大化后加在人身\n上,表示某人对某事产生强烈嫉妒甚至怨恨的心\n理。如例句8中“远离‘柠檬精’”,就是远离这种\n心理状态不健康的人群。\n8希望同学们在社会中,勇立时代潮头,争\n做时代先锋;摆脱冷气,远离“柠檬精”。(人民网\n微信公众号2019年)\n(3)具有某种经常性的令人不适的行为或状\n态的人\n杠精、闯祸精、告状精、骗人精、害人精、倒霉\n精、孤独精、马屁精\n第三类词语中的“精”的“妖精、精灵”义模糊\n化,这类词中的“ 精” 表示的是一类令人讨厌的\n人。由于前两类“精” 通常是令人不适、讨厌的,\n所以此时由“X精” 产生的具有[+人]语义特征\n的词,常用来形容那些具有某种令人不适的行为\n或状态的人,多为贬义。如例句9中的“害人精”\n就是用来指代“经常害人”的人。\n9他们普遍认为粟美仙是一个间接杀手,当\n粟美仙下班时总是有人在背后指指戳戳,而杭素\n玉娘家的亲戚对粟美仙都是横眉竖目的,他们骂\n她是个害人精。(苏童《另一种妇女生活》)\n“抬杠”这一行为令人不适,于是产生“杠精”\n一词。如例句10中网友戏谑只会一味抬杠的人\n时说,“给‘杠精’ 一个槽点,他能‘杠起’ 整个地\n球”。可见“杠精”不同于能包容他人的人。\n10这样热衷抬杠的一类人,被网友称为“ 杠\n精”。网友戏谑说“ 给‘ 杠精’ 一个槽点,他能\n‘杠’起整个地球”。时事热点、视频弹幕、影视评\n论......互联网生态的准入低门槛和交际便捷性,\n使得爱杠人士充斥在社交网络的各个角落。\n(《人民日报》2018年)\n(4)把某种特性发挥到极致的人\n戏精、手精、腿精、腰精\n第四类词语中的“精”的“妖精、精灵”义已经\n完全消失,此时由“X精”产生的具有[+人]语义\n特征的词,常形容把某种特性发挥到极致的人。\n近几年来的网络热词“戏精” 用来形容把“戏” 演\n到极致的人。“戏精” 一词放在不同语境中表现\n的语义色彩不同,它既可以是褒义词,也可以是\n贬义词。例句ᙜ\nI\n1中的“戏精” 形容文物的形态各\n有特色,种类丰富,用在此语境中是褒义词。而\n例句ᙜ\nI\n2的“戏精” 则是指一个人过度追求他人的\n目光,故意做出夸张的行为引起别人注意,用在\n此处是贬义词。\nᙜ\nI\n1你以为文物都是沉默的历史见证者?在\n山东这片文化底蕴深厚的土地上,有许许多多的\n“戏精”文物,它们憨态可掬又富有内涵,快来一\n瞅它们的独特Style。(新华网2024年)\nᙜ\nI\n2跟“戏精” 相处很烦?3招应对表演型人\n格。(小红书2024年)\n(三)“X怪”的语义特征与语义分类\n1.“X怪”的语义特征\n“怪”的本义为奇异和奇异的事物[3](219),后\n又有“妖怪、怪物” 的含义。如《搜神记》载:“ 妖\n怪者,盖精气之依物者也。” [7](113)“精”与“怪”前\n面都可以加上“妖”而构成“妖精”与“妖怪”。徐\n华龙提出了二者的区别:精由自然界的有生命的\n物体变化而来,如鸟、马、牛、鸡、鼠等飞禽走兽,\n都可以变化成为精;无生命的自然界的山、石、水\n等则可以划入怪类[10]。“怪”的出现常常会给人\n带来一种恐惧感,这为“ 怪” 一词积累了语义背\n景。正是“妖怪、怪物”这一义项为“X怪”成为类\n词缀奠定了基础。\n2.“X怪”的语义分类\n由“X怪” 构成的词按意义划分主要有以下\n几类:\n(1)传说中由非生命体变化而成且有害于人\n的妖怪\n山怪、石头怪、水怪\n第一类词语中的“怪”未脱离“妖怪、怪物”的\n含义,常用来表示某种妖怪。如“山怪” 就是“在\n山中的妖怪或怪物”,“水怪”为“在水里的妖怪或\n怪物”。\n(2)具有某种怪异特征的人\n长手怪、圆脸怪、畸形怪、情绪怪\n第二类词语中的“怪” 未完全脱离“妖怪、怪\n8\n1\n渤海大学学报(哲学社会科学版)\n第47卷\n[p.6]\n物”的含义。因为“ 妖怪、怪物” 义也包含着“ 奇\n怪、怪异”义,故由“X怪”产生的具有[+人]语义\n特征的词,常用来形容某类有怪异特征的人。这类\n词一般都是网络新词。如“长手怪”在网络中指手\n或手臂长于常人的人。又如“情绪怪”是由心理学\n专有名词“情绪巨婴” (Emotional-Intelligence-\nDeficient,EID)转变而来,指缺乏“情感智慧能力”\n的人,也就是情绪异于常人的人。\n(3)经常有怪异举动的人\n抄袭怪、白嫖怪、阴阳怪、洁癖怪、嘤嘤怪、盗\n图怪、造谣怪\n第三类词语中“怪”的“妖怪、怪物”义已经模\n糊,因此由“X怪”产生的具有[+人]语义特征的\n词,已经变成去形容某类行为怪异的人。这类词\n一般都是形容一些因网络而产生的新行为,且这\n些行为大都具有负面特征。如“白嫖” 一词产生\n于一些人在某视频网站看视频经常不打赏的行\n为。这类人被称为“白嫖怪”,后也用于经常免费\n获取他人资源的一类人,如例句ᙜ\nI\n3。相似的还有\n“盗图怪”,指经常盗取他人图片的一类人;“造谣\n怪”,形容经常造谣的人;“阴阳怪”,形容经常对\n别人阴阳怪气的人。\nᙜ\nI\n3 对付白嫖怪,我最有发言权!(小红书\n2023年)\n(4)经常有某种过度化行为的人\n压力怪、纠结怪、敏感怪、焦虑怪、反思怪、细\n节怪、自拍怪\n此处第四类词语中的“怪” 已经完全没有了\n“妖怪、怪物”的含义,因此由“X怪” 产生的具有\n[+人]语义特征的词,常用来形容某类经常有过\n度化行为的人。如“压力怪” 是形容经常给自己\n过度压力的一类人;“纠结怪”是形容经常过度纠\n结的一类人;“焦虑怪”是形容经常过度焦虑的一\n类人。\n(四)“X神”的语义特征与语义分类\n1.“X神”的语义特征\n“神”的本义是“天神,引出万物者也” [3](2)。\n词句中常用“神” 表示在宗教或传说中有一定修\n为的超自然体,通常都是能造福普通人的正面形\n象。如《诗经》中写道:“ 神之吊矣,诒尔多\n福。” [6](355)《论衡·订鬼》又云:“沧海之中,有度\n朔之山。上有大桃木,其屈蟠三千里,其枝间东\n北曰鬼门,万鬼所出入也。上有二神人,一曰神\n荼,一曰郁垒,主阅领万鬼。” [8](344)中国古代的神\n大多有自己的名字,如水神“共工”、火神“祝融”、\n战神“刑天”等。与无名无姓的鬼怪相比,“神”在\n人们心中有至高无上的地位。人们对待“ 鬼”\n“精”“怪”“神”的态度也不同。《搜神记》展现人\n们对“树怪”“树精”“神木(树)”三种截然不同的\n态度。对待“树怪” 时,人们的态度是愤怒,并且\n直接用刀斧“斫之”:“叔高大怒曰:‘树老汁赤,如\n何得怪!’ 因自严行复斫之” [7](398);面对“ 树精”\n时,由于“精” 常常具有人的某种特征,所以人们\n用对待人的方式来“劾之”:“又有大树,树有精,\n人止其下者死,鸟过之亦坠。侯劾之,树盛夏枯\n落,有大蛇,长七八丈,悬死树间” [7](35);而面对千\n年古木时,人们的态度是尊敬,在木前加了“神”\n字,体现这根木头的珍贵,如“ 孔章曰:‘ 千年神\n木,何由可得’” [7](402)。\n即使“神”与经常表示反面形象的“鬼”“怪”\n“灵”组词时,“鬼神” “神怪” “神灵” 也通常表示\n正面形象或强大的超自然体。如《汉书》载:“阴\n阳者,顺时而发,推刑德,随斗击,因五胜,假鬼神\n而为助者也。” [11]又如《史记》言:“生而神灵,弱\n而能言,幼而徇齐,长而敦敏,成而聪明。” [12]《后\n汉书》亦曰:“此明公至德,神灵之祐,虽武王白鱼\n之应,无以加此。” [13]翦伯赞曾谈到,灵魂不灭的\n观念被引申到世间万物后,并不是单纯延长幻\n想,而是由于人类不理解自然,也无力克服自然,\n只有这样才能产生神与恶魔等信仰。例如,黑夜\n的恐怖、森林的幽暗、海波的浩荡、冰河的移动、\n火山的爆发、暴风雷雨的震撼等自然现象,曾使\n古代先民深感困惑与恐惧。由于无法解释这些\n奇异现象,也无法克服这些自然威胁,先民们便\n产生了一种想象,认为周围的自然物体及现象都\n暗藏着超自然的幽灵。这种观念最终导致了万\n物有灵的信仰,即自然界被赋予了人格化的属\n性,从而形成了最初的神祇崇拜[14]。所以“神”在\n生产力极不发达的古代,经常充当能力强大且对人\n有利的角色,因此由“X神”构成[+人]的词大多\n带有褒义色彩,在使用时常表示某人在某一方面的\n表现极为突出;而在其后面加上“神”说明人们不\n仅承认某人在某方面的突出表现或某种特点,更表\n达了一种尊敬与崇拜。\n9\n1\n第1期\n杨媛媛,杨博淳:类后缀“鬼”“精”“怪”“神”语义特征与泛化机制对比研究\n[p.7]\n2.“X神”的语义分类\n由“X神” 构成的词按意义划分主要有以下\n几类:\n(1)传说中掌管某类事物且有益于人的神灵\n风神、水神、火神、酒神、太阳神、月神、财神、\n爱神、保护神、自由神\n第一类词语中的“神”未脱离“神仙、神灵”这\n一基本含义,仍代指掌管某一方面的神灵。这类\n词常指有利于人的神灵,带有人们的美好愿景,\n具有一定的褒义色彩。然而这类“X神” 产生的\n词也有一些带贬义色彩,如“邪神”“死神”等。比\n如例句ᙜ\nI\n4中的“邪神” 表示某人不正常的精神状\n态。再如例句ᙜ\nI\n5,虽然“死神”是一种可以掌控生\n死的“神”,但是与“死神”同时出现的经常是“抗\n争”“搏斗”“挣脱”等带有[+抵抗]义的词语,因\n此有一定的贬义色彩。\nᙜ\nI\n4大家走后,秀氏痛哭流涕,又苦劝了一回。\n大春子向来最听秀氏的话,今天有点邪神附体,\n跟秀氏瞪着眼睛这么一嚷,怒发冲冠,双眦欲裂,\n要玩儿命的神气。秀氏见他这宗状况,也就不敢\n再劝了。(蔡友梅《新鲜滋味》)\nᙜ\nI\n5面对生命在瓦斯、毒气、撞车、翻船、火灾\n等重大事故中消失,面对这辽宁历史上所不曾有\n过的如此频繁的恶性事故屡屡发生,以宽容、憨\n厚为本的辽宁人发怒了,发狠了,4000万辽宁人\n要用自己的双手去扼住死神的咽喉。(《报刊精\n选》1994年)\n(2)某领域有擅长之处的人\n车神、武神、赌神、球神\n第二类词语中的“神” 未完全脱离“神仙、神\n灵”这一含义。因为“神仙” 具有[+掌管某一方\n面]的语义特征,所以这方面一定是他所擅长的,\n故第二类由“X神” 产生的具有[+人]语义特征\n的词,表示在某领域有所擅长的人,将这个人比\n喻为掌管某方面的神灵,多为褒义词。如例句ᙜ\nI\n6\n中的“球神” 用来形容足球运动员马拉多纳擅长\n踢足球,像是掌管足球的“神灵”,也表示人们对\n他的尊敬与敬佩。又如例句ᙜ\nI\n7中的“车神” 用来\n形容赛车手舒马赫擅长赛车,像是掌管赛车的\n“神灵”,是人们对他赛车技术的肯定与赞赏,也\n是对他本人的敬仰与崇拜。\nᙜ\nI\n6千百万球迷为此感到欢欣鼓舞,他们称马\n拉多纳是“球神”,他的声望盖过了本届比赛的所\n有球星。(《人民日报》1986年)\nᙜ\nI\n7“车神”舒马赫在6日的排位赛中表现神勇,\n赢得了正式比赛的首发位置。(新华社2004年)\n(3)某方面有卓越成就的人\n战神、考神\n第三类词语中“神”的“神仙、神灵”义已经模\n糊化,不再表示在某领域中像“神灵”一样存在的\n人这一含义。因此,第三类由“X神”产生的具有\n[+人]语义特征的词表示,只要在某领域有成就\n的人都可以被尊称为“神”,多带有褒义色彩。如\n例句ᙜ\nI\n8中的“战神”并不是指战场上的“神灵”,而\n是指在篮球场上有卓越成就的人。\nᙜ\nI\n8然而,决定比赛胜负的不是八一队的“ 战\n神”刘玉栋,也不是上海队的“超级中锋”姚明,而\n是集体发威的沪江“群鲨”。(新华社2002年)\n(4)常表现某种状态的人\n萌神、可爱神、糊涂神、埋汰神\n在第四类词语中,“神” 的“神仙、神灵” 义已\n经完全消失了,因此第四类由“X神”产生的具有\n[+人]语义特征的词,用来形容经常表现某种状\n态的人。一般这类词褒义居多,比如“埋汰神”一\n词,“埋汰” 一词本身是东北地区的方言,是一个\n贬义词,但是加在“神”字前构成“埋汰神”却用来\n形容天性好玩总是弄得一身脏的孩子,表达的是\n人们对小孩子或宠物的喜爱之情,是一个褒义\n词,如例句ᙜ\nI\n9。\nᙜ\nI\n9手工珍珠毛衣链和我的小埋汰神模特儿。\n(小红书2022年)\n(五)“X鬼”“X精”“X怪”“X神”语义特征\n的异同点\n1.语义特征的共同点\n“鬼”“精”“怪”“神”四个类后缀语义特征的\n共同点是本义或引申义都是传说中的某类鬼神,\n语义类化(泛化)后所构成的词能够形容某类人,\n并与其他词语组成新词。\n2.语义特征的不同点\n“鬼”“精”“怪”“神”四个类后缀语义特征的\n不同点是,由“鬼” “精” “怪” 构成的词多形容一\n些有负面特征或行为的人。无论其前面的词是\n褒义词、中性词还是贬义词,构成新词后多为贬\n义词。而由“神” 构成的词常用来形容在某方面\n0\n2\n渤海大学学报(哲学社会科学版)\n第47卷\n[p.8]\n出众的人,无论其前面的词是褒义词、中性词还\n是贬义词,构成新词后多为褒义词。\n三、类后缀“鬼” “精” “怪” “神” 的形\n成机制对比\n(一)历时泛化过程\n“X鬼”“X精”“X神”“X怪” 成为类后缀的\n历时泛化过程如下表所示(见表4)。\n由表4可得知,“X鬼”最开始指代人死后的\n灵魂,之后语义逐渐泛化为具有某种明显的负面\n形象或某种明显孩子特征的人,再泛化为处于某\n种状态的人。“X精”由引申义“妖精”,逐渐泛化\n为暗喻某类具有一定动物或物品特征或者某种\n经常有令人不适的行为状态的人,再泛化为把某\n种特性发挥到极致的人。“X怪” 由最开始的奇\n异的事物,引申为“妖怪” 义,语义逐渐泛化为具\n有某种经常性怪异举动或者某种怪异特征的人,\n再泛化为具有某种过度化行为的人。“X神” 由\n最开始的万物的创造者,语义逐渐泛化为某领域\n有擅长之处或者某方面有卓越成就的人,再泛化\n为常表现某种状态的人。\n表4 “鬼”“精”“怪”“神”成为类后缀历时泛化过程\nX鬼\nX精\nX怪\nX神\n本义\n人死后的灵魂\n孤鬼、野鬼、鬼魂\n挑选好米\n—\n奇异,奇异的\n事物\n妖怪、\n怪物\n天神,万物的\n创造者\n风神、水神、\n火神\n引申义\n传说中有明显\n特征且有害于\n人的鬼魂\n山鬼、水鬼\n传说中由生命\n体经过修炼或\n吸收灵气而形\n成的具有一定\n修为且有害于\n人的妖精\n树精、老鼠\n精\n传说中由非生\n命体变化而成\n且可能害人的\n妖怪\n海怪、湖\n怪、山怪\n传说中掌管某\n类事物且有益\n于人的神灵\n雷神、土地\n神\n类化\n(泛化)\n具有某种明显\n的负面形象特\n征与陋习的人\n酒鬼、刻薄鬼、自\n私鬼\n暗喻某类具有\n一定动物或物\n品特征的人\n狐狸精、蛇\n精、柠檬精、\n陀螺精\n具有某种怪异\n举动的人\n白嫖怪、\n抄袭怪\n某领域有擅长\n之处的人\n学神、枪神\n具有某种明显\n孩子特征的人\n淘气鬼、捣蛋鬼、\n机灵鬼\n具有某种经常\n性的令人不适\n的行为或状态\n的人\n害人精、杠\n精、倒霉精、\n孤独精\n具有某种怪异\n特征的人\n细节怪、\n情绪怪\n某方面有卓越\n成就的人\n战神、考神\n再类化\n(再泛化)\n处于某种状态\n的人\n开心鬼、可爱鬼\n把某种特性发\n挥到极致的人\n戏精、手精、\n腰精\n具有某种过度\n化行为的人\n焦虑怪、\n纠结怪\n常表现某种状\n态的人\n糊涂神、埋\n汰神\n“ X鬼” “ X精” “ X怪” “ X神” 在历时泛化\n时,其语义内部的关系大致经历了类似的“传说\n中的事物” 义隐含到“ 具有某种特征(状态)的\n人”义逐渐泛化的过程。这不仅体现“鬼” “ 精”\n“怪”“神”作为类词缀时语义逐渐虚化,也显露人\n们的思想由“尊神尚鬼” 到“ 人文关怀” 的转变。\n人们将敬畏的“鬼”、畏惧的“精” “怪” 与尊崇的\n“神”,都重新构词后用于人们自身去表示人所具\n有的某类特征或某种状态。\n(二)构成新词时的后缀选择\n综上所述,“鬼” “精” “怪” “神” 作为类后缀\n时,不仅有类似的历时泛化过程,也有各自的使\n用环境。比如,网络热词“柠檬精”表示人像柠檬\n一样“酸”,进而衍生出某人对某事产生嫉妒一\n义。人们没有选择将“柠檬”与“鬼”“怪”“神”作\n为其类后缀,是因为“精” 有[+人身上具有某类\n动植物特性]这一语义特征,使用其他三个类后\n缀不能很好表达。\n如“柠檬鬼” 完全符合“X鬼” 中“N+鬼” 的\n结构,在构词方面可以成立。如果有这一表达,\n则可以表示经常对某事产生嫉妒的人。“X鬼”\n常带有[+负面特征或陋习]的语义特征。而“嫉\n妒”有时候是一种自嘲,说它是陋习并不准确,因\n此便没有产生“柠檬鬼” 一词。又如“柠檬怪” 完\n全符合“X怪”中“N+怪”的结构,在构词方面可\n以成立。但是“X怪” 又是[+怪异举动]的词,\n“嫉妒”又不能算是怪异的举动,因此便没有产生\n“柠檬怪”一词。再如“柠檬神”完全符合“X神”\n1\n2\n第1期\n杨媛媛,杨博淳:类后缀“鬼”“精”“怪”“神”语义特征与泛化机制对比研究\n[p.9]\n中“N+神”的结构,如果有这一构词表达,则可以\n表示某人十分擅长嫉妒别人,或是在嫉妒别人方\n面有卓越成就。这种解释显然违背了“柠檬精”\n的内涵,因此没有产生“柠檬神”一词。\n其实“柠檬鬼”“柠檬怪”“柠檬神”在“X鬼”\n“X怪”“X神”的构词中是可以存在的,只是在语\n义和语用上讲不通或不常见。因此,在造新词的\n时候不仅要考虑这个词是否符合构词条件,也要\n考虑其在语义及语用方面是否符合大众的使用\n习惯。\n结 语\n综上所述,从能产性看,“X鬼” 的能产性最\n高,“X神”的能产性次之,“X精” 的能产性再次\n之,“X怪” 的能产性最低。从前置音节的数量\n看,“鬼”作为类后缀时,与双音节成分结合的情\n况较为常见;“精” 作为类后缀时,与单双音节成\n分结合的情况较为平均;“ 怪” “ 神” 作为类后缀\n时,与单音节成分结合的情况较为常见。从语义\n色彩看,“ X鬼” “ X精” “ X怪” 通常表贬义,“ X\n神”多表褒义。通过对“X鬼” “X精” “X怪” “X\n神”历时泛化过程进行对比,“ X鬼” “ X精” “ X\n怪”“X神” 都由表示某些传说中的事物,语义逐\n渐泛化为具有某类明显特征的人,不同之处在于\n“X神”通常表示的是一些正向的特征或行为,而\n“X鬼” “ X精” “ X怪” 常表示一种负面特征或\n行为。\n多数当代网民偏向于使用网络表达自己的\n情绪。以上所探究的网络热词多用来表示“ 幽\n默”和“ 自嘲”,甚至一些还带有“ 无厘头” 的意\n味。网络环境和网络用语是社会大环境的缩影,\n能体现当代人的社会心态和自我认知。“ 鬼”\n“精”“怪”“神”这四个词由“表示传说中的事物”\n逐渐语义泛化为“具有某种特征(状态)的人”。\n这体现的不仅是人们思想上的解放,更展现网络\n时代人们对自己情绪的多样化表达,为汉语词汇\n注入新的生机与活力的过程。\n注释:\n1本文所举例句皆为作者从网络检索而来。其中1\n23467910ᙜ\nI\n4ᙜ\nI\n5ᙜ\nI\n6ᙜ\nI\n7ᙜ\nI\n8出自北京大学CCL语料库,\nhttp://ccl.pku.edu.cn:8080/ccl_corpus;5出自新浪微\n博,https://weibo.com/1806053007/NqivuoeJ4;8出自人\n民网微信,https://mp.weixin.qq.com/s/lEs410icg44-\n3akr0UIUBg;ᙜ\nI\n1出自新华网,http://www.news.cn/politics/\n20241130/6d5fbfee516b4f76b795def10fbcd66d/c. html;ᙜ\nI\n2 出\n自小红书,http://xhslink.com/a/AP4UThx8PWM0;ᙜ\nI\n3出自\n小红书,http://xhslink.com/a/j74114S50XM0;ᙜ\nI\n9 出自小\n红书,http://xhslink.com/a/CPGVWRBxN1M0。\n参考文献:\n[1]吕叔湘.汉语语法分析问题[M].北京:商务印书馆,\n2005:40-41.\n[2]苏宝荣,沈光浩.类词缀的语义特征与识别方法[J].\n语文研究,2014(4):7.\n[3]许慎.说文解字:附音序、笔画检字[M].徐铉,等,校\n定.北京:中华书局,2013:186.\n[4]尔雅[M].管锡华,译注.北京:中华书局,2014:326.\n[5]方言[M].华学诚,游帅,译注.北京:中华书局,\n2022:2.\n[6]程俊英,蒋见元.诗经注析[M].北京:中华书局,\n2017:472.\n[7]搜神记[M].马银琴,译注.北京:中华书局,2012:\n422.\n[8]王充.论衡[M].上海:上海人民出版社,1974:343.\n[9]王明.抱朴子内篇校释[M].增订本.北京:中华书\n局,1985:300.\n[10]徐华龙.妖、怪、精故事的分类研究[J].文化学刊,\n2009(2):110-121.\n[11]班固.汉书[M].北京:中华书局,1962:1760.\n[12]司马迁.史记[M].北京:中华书局,1959:1.\n[13]范晔.后汉书[M].李贤,等,注.北京:中华书局,\n1965:735.\n[14]翦伯赞.中国史纲:第一卷上[M].北京:生活·读\n书·新知三联书店,2014:94-95.\n(责任编辑 陈丽琳)\n2\n2\n渤海大学学报(哲学社会科学版)\n第47卷", "title": "类后缀“鬼”“精”“怪”“神”语义特征与泛化机制对比研究", "topic": "指人 类词缀", "touch": "초자연적 존재 계열 유사접사의 범화 사례로 사례 분석 장에 배치할 수 있다.", "updatedAt": "2026-10-06T11:55:00Z", "url": "", "year": "2025", "id": "9716eb1f", "pid": "p_legacy01"}, {"analysis": "", "author": "周旺", "ch": "pdf", "createdAt": "2026-10-06T11:52:00Z", "cut": 0, "fileName": "类词缀“精”系词族初探_周旺.pdf", "grade": 3, "gradeBy": "AI", "gradeReason": "단일 형태소 사례 연구로 배경 참고에 적합하다.", "insight": "", "keywords": ["类词缀", "X精", "精X", "杠精", "网络流行语", "成因"], "kind": "학술논문", "myView": "", "pages": 4, "publisher": "黑龙江教师发展学院学报, 39(8)", "summary": "'杠精' 등 인터넷 유행어에서 나타난 '精' 계열 어족과 유사접사화를 다룬다. '精'은 전접(精X)과 후접(X精) 모두로 쓰이는데, 전접은 방언에 기반해 정도를 강조하고 형용사·동사·명사와 결합하며, 후접은 종교·민속의 '妖精'에서 비롯해 'X精'식 명사 신어를 대량으로 만든다.", "text": "[p.1]\n2020 年8 月\n第39 卷第8 期\n黑龙江教师发展学院学报\nJournal of Heilongjiang Institute of Teacher Development\nAug.2020\nVol.39 No.8\ndoi: 10.3969 /j.issn.2096-8531.2020.08.037\n收稿日期: 2019-10-31\n作者简介: 周旺( 1997—) ,女,湖南长沙人,硕士,从事古代汉语研究。\n类词缀“精”系词族初探\n周\n旺\n( 湖南师范大学文学院,长沙410081)\n摘\n要: 在语言、词汇发展过程中,网络流行语蜂拥而出,逐渐出现“精”系词族及其类词缀化现象。词缀相对\n于词根位置比较固定,分为“前缀”和“后缀”。而“精”比较特殊,可以作“前缀”,也可以作“后缀”,但形成机制和功\n能是不一样的。“精”作前缀有方言基础,它表示一种程度,具有强调的作用。常与单音节形容词粘合,也可以与动\n词、名词粘合,构成形容词,暗示某事物性质超过正常范围。“精”做后缀源于宗教和民俗文化中的“妖精”等词,在\n语言运用中有了新义新用,并产生了许多名词性的“X 精”式的网络新词。\n关键词: 类词缀; X 精; 精X; 成因; 发展\n中图分类号: H042\n文献标志码: A\n文章编号: 2096-8531( 2020) 08-0115-04\n一、引言\n2018 年12 月3 日,《咬文嚼字》编辑部公布了杂志评选\n的2018 年十大流行语。其中出现“杠精”一词,指的是“抬\n杠成精”的人。12 月19 日,“杠精”入选国家语言资源监测\n与研究中心发布的“2018 年度十大网络用语”。“精”字是个\n形声字,从米,青声。段玉裁《说文解字注·米部》\n[1]注释\n为: “择米也。”如《论语·乡党》: “食不厌精。”刘宝楠的《论\n语正义》注释为: “精者,善米也。”即去粗取精,择取优质纯\n净的好米。根据《汉语大词典》\n[2]的释义,“精”做形容词有\n细小、纯净、明亮、专一、严密、完美、机灵、娴熟等义; 作名词\n有精神、精灵、妖怪、瘦肉等义。除此之外,“精”还有副词\n义,有表示程度,相当于“很”; 有表示范围,相当于“全”\n“都”。在语言、词汇发展过程中,逐渐出现“精”系词族及其\n类词缀化现象,主要有“类前缀”和“类后缀”两种现象。关\n于这个问题,学术界也有一些成果,比如计超的《哈尔滨方言\n词缀研究》\n[3]是从方言角度探讨“精”做前缀的表现和作用;\n黄博雅、康青《网络新生“类词缀”“精”系词族初探》\n( 2013) [4]从网络最新流行的“X 精”切入,分析其语义内涵\n和生成方式特点,这给笔者很大的启发( 2018) 。安静的《略\n说“妖精”隐喻义》\n[5]谈了“妖精”和“妖怪”的区别,并从思\n维和修辞角度揭示“妖精”一词的新用法( 2018) 。下面笔者\n从“精”系词族类前缀和类后缀两方面简单探讨一下“精”字\n在语言应用和词汇发展中的变化。\n二、类前缀\n随着语言和词汇的发展,以“精”为构词基础的双音节\n词或多音节词越来越多,比如精怪、精灵、精明、精准、精密、\n精心、精神、精英、精打细算等等。但我们知道这些例子中的\n“精”有比较实在的意义,是一个词根,与其他词根构成偏正\n式或联合式复合词。但有些词比如精光、精细、精瘦等,\n“精”字意义开始虚化。有人将其归为程度副词,但现代汉\n语程度副词可以修饰许多词类,并不局限于单音节形容词,\n且不可以修饰名词。现代汉语的“精”字单独成词时,并没\n有表程度“很、非常、太”和表范围“都、全”的意思,常与单音\n节形容词粘合,用以强调某事物性质( 窄、细、小、瘦、短、薄、\n湿、干等方面) 超过正常范围,也可以与名词粘合。因此,笔\n者认为“精”具有类词缀的趋势。\n( 一) “精X”的出处及意义\n笔者认为,“精X”表前缀是词汇自身发展和方言影响的\n结果。前文指出,《汉语大字典》《汉语大词典》等词典认为\n“精”有副词义,如《吕氏春秋·至忠》: “夫恶闻忠言,乃自伐\n之精者也。”高诱注: “精,犹甚。”但“精”字单独成词表副词\n义的例子少之又少,常与单音节形容词结合表强调意义,比\n如明代谢谠《四喜记·寻乐江村》: “自家唤作渔翁,一身弄\n得精穷,有人问我缘故,只是饮酒三钟。”《红楼梦》第五十三\n回: “再二年,再省一回亲,只怕就精穷了! ”这里的“精穷”指\n非常贫穷; 《儒林外史》第五回: “只有两个舅奶奶在房里,乘\n着人乱,将些衣服、金珠、首饰,一掳精空。”“精空”指一点不\n剩。我们可以看出古代汉语中就有“精”字意义虚化的现\n象。\n方言中也有许多“精”字意义虚化的现象,比如计超的\n《哈尔滨方言词缀研究》\n[3]( 2013) 指出了哈尔滨方言中有前\n缀“精”。前缀意义虚化程度不高,还有“小、少”的含义,常\n—\n5\n1\n1\n—\n[p.2]\n与形容不足量的空间类单音节形容词粘合。成词后可以重\n叠使用,以此来加深喜爱或不满的情绪。比如“精瘦”指非\n常瘦; “精短”指非常短; “精薄”指非常薄。除此之外,根据\n方言字典,我们发现其他方言中也有类似的现象。比如东北\n官话中还有“精浅”“精稀”“精白”等例; 北京官话中有“精\n瘦”“精湿”“精点儿”等例; 冀鲁官话中有“精湿”“精冷”“精\n窄”“精薄”“精细”“精近”等例; 胶辽官话有“精咸”“精点\n儿”“精短儿”等例,如《聊斋俚曲集·增补幸云曲》: “万岁尝\n尝不美口,少盐缺醋又精咸,这样东西吃不惯。”吴语中有\n“精赤”“精穷”“精干”等例,也有“精精光”“精精干”“精精\n瘦”“精精湿”等例,“精精干”形容非常精干,“精精瘦”形容\n非常瘦; 湘语中有“精腥”“精苦”等例; 中原官话有“精窄”\n“精点儿点儿”等例; 晋语有“精水湿”,表示很湿; 西南官话\n有“精叫唤”表示一个劲儿地叫唤\n[6]。\n计超调查哈尔滨方言后指出,“精”只能与单音节形容\n词黏合,但我们可以看到其他方言中“精”字还可以与名词\n黏合,如“点儿”,“点”是名词,儿化后更突出其“小、少”的特\n点,“精点儿”表示极小,是形容词; 若“精”与名词重叠式黏\n合,如“精点儿点儿”,表示很少很少。“精”还可以和动词黏\n合,表示持续时间较长。吴语中的“精”还可以重叠,更加突\n出程度之深。这些方言中的“精”大多视作副词,用来修饰\n后面的形容词或动词。但一般来说,汉语副词是不可以修饰\n名词的。方言中有些例子可能意义没有完全虚化,但合成词\n的构词方式更像附加式,笔者认为“精”具有词缀化的倾向,\n是类词缀,具有强调的作用。\n( 二) “精X”为类词缀与“精X”为词根的关系\n我们可以看到,有些“精X”式的词,有一词多义或者异\n词同形的关系。比如说“精瘦”“精光”和“精细”。\n“精瘦”,可以理解为复合式合成词“精+ 瘦”,即又精又\n瘦,暗示着虽瘦却强健; 也可以理解为附加式合成词,更突出\n强调“瘦”,是对“瘦”的一种程度描述。两者有构词方式和\n语义的区别。\n《汉语大词典》\n[2]中“精光”的义项有:\n1.光辉。2.指崇高精神的光辉。3.指风仪神采。4.光\n彩; 光焰。5.净尽; 一无所有。《西游记》第四九回: “披肩绣\n带无,精光两臂膊。”6.指眼中的光亮。精,通“ 睛”。《北齐\n书·神武帝纪上》: “〔高祖〕目有精光。”\n我们可以看到除了第5 个义项,其他义项中的“精”都有\n实在的意义,含有“精”的“明亮、精神”等实义,构词方式属\n于复合式。我们现代汉语书面语中常用的是第6 个义项,但\n“精”是通假字,因此跟“精”的本义无关。第5 个义项中的\n“精”意义比较虚,一般视作副词,笔者认为,可以将“精”视\n作前缀,表示程度之深。“精光”的运用非常广泛,一般表示\n动作非常彻底或某物被彻底消耗。比如:\n我饿坏了,把饭吃得精光。\n刚发下来的工资被用得精光。\n电影院的票不到一个钟头就卖得精光。\n他做生意赔个精光。\n《汉语大词典》\n[2]中“精细”的义项有:\n1.服食精美。2.精密细致。3.精明能干。4.细心; 仔\n细。5.清醒; 苏醒。\n这些义项都指明“精细”是复合式合成词,“精”有“优\n质、细小、机灵”等义。但在方言里,“精细”有“非常细”的意\n思,比如:\n她每天吃那么多,腿还精细儿的,真让人羡慕。\n不同于以上两例,“精细”这种方言义和用法并没有进\n入普通词典。但我们必须意识到,“精”作前缀有方言基础,\n并且具有生命力。它表示一种程度,具有强调的作用。常与\n单音节形容词黏合,也可以与动词、名词黏合,暗示某事物性\n质超过正常范围。\n三、类后缀\n当谈及“X 精”,我们最容易想到的是“妖精”。在现代\n生活中,“妖精”有了新的意义和用法,也衍生出许多“X 精”\n式的新词,比如“猪精”“人精”“黏人精”“杠精”等等。这里\n的“精”继承了“妖精”的贬义,可以用来自嘲也可以用来讽\n刺他人,具有攻击性。\n( 一) “X 精”的出处及意义\n“精”和“妖”“怪”的意义比较接近,三字可以组成“妖\n精”“妖怪”“精怪”等词,安静在《略说“妖精”隐喻义》\n[5]中\n通过比较《西游记》中使用这三词的语境,分析了三字的区\n别。总的来说,《西游记》中出现“妖精”69 次,词义偏指\n“精”,隐含“小、少”的意味,如蝎子精、狐狸精、白骨精、蜘蛛\n精、玉兔精、老鼠精。出现“妖怪”57 次,词义偏指“怪”,隐\n含“怪异、变形”的意味,如熊罴怪、通天河鱼怪、九头怪。两\n者的区别是: “妖精”多为小型动物幻化所成,常为女形。已\n经开悟通灵,因此法力更高; “妖怪”则多为大型兽畜幻化。\n“精怪”在《西游记》中有4 例,泛指不同于人的鬼怪。\n事实上,笔者认为《西游记》中“精”“妖”“怪”,甚至\n“魔”,四者是混同的,命名具有一定的任意性。“魔”是从印\n度宗教中翻译过来的,表能扰人者。在中国民间,妖怪、妖\n精、妖魔、精怪基本上可以互相解释,并且在志怪小说、神魔\n小说中亦常常混用或互换。《西游记》中就常用“妖怪”“妖\n精”“妖魔”来称呼同一事物\n[7]。在民俗文化中,世间万物都\n可以吸收天地精华,秉承阴阳之气,获得超自然力量,这个过\n程称为“成精”。“精”能兴妖作怪,一般会给人类带来灾祸。\n所以古代文化中的“精”及“妖精”都具有贬义色彩。\n但在语言运用中,“妖精”一词有了新的用法和意义。\n以前“妖精”指的是民俗文化中的非人非神的具有超自然力\n量的精魅,因其具有危害性也可以用来指穷凶极恶的坏人,\n也常指迷人的美貌女性( 具贬义) ,如清代李渔《奈何天·隐\n妒》: “他近来娶了两个妖精,十分碍眼。”后来社会生活中把\n勾引男性的已婚女性称为“狐狸精”,把性感具有诱惑力的\n未婚女性称为“妖精”。但近年来,由于媒体的作用,“妖精”\n一词活跃于大众的口语交流中,并有了新的意义和用法。比\n如发行于2015 年12 月的一首电影插曲《大王叫我来巡山》,\n其中有句歌词是“我是一个努力干活儿还不黏人的小妖\n精”,随着电影和歌曲的爆红,这句歌词也被大众熟知,“妖\n—\n6\n1\n1\n—\n[p.3]\n精”有了比较正面的形象。自2016 年5 月起播放的电视连\n续剧《欢乐颂》,女主角之一的“曲妖精”成为了城市精英女\n性机灵漂亮的代名词,这一新用法十分流行。至此,“妖精”\n一词褒奖色彩越加浓厚,可以用来形容人格独立、事业成功\n的漂亮女性,也可以指年纪增长而容貌依然保持年轻的时尚\n女性。\n2016 年以前,若称呼对方特别是女性为“妖精”,容易引\n起对方极大不满; 但现在却是对对方的一种赞美和羡慕,人\n们乐于接受。同理,很多宗教、民俗中的一些词以前是贬义\n的,但在现在的语言生活中可以指人,兼有褒义的感情色彩,\n如妖、怪、鬼等,现在“妖孽”“搞怪”“机灵鬼”等语可以表示\n对对方的喜爱。这一变化,与人们的猎奇心理分不开。但不\n可否认的是,“精”字仍有贬义色彩。近年来口语及网络流\n行语中,出现不少“X 精”式的词语,这里的“精”有“成精”的\n意思,指某类人实施某种行为成瘾,让人反感。\n( 二) “X 精”的发展\n“X 精”式的词语处于初步发展阶段,目前所造的词有\n限,比较常见的有: “马屁精”“猪精”“撒谎精/说谎精”“人\n精”“黏人精”“戏精”“杠精”“鸽子精”“柠檬精”等。“猪\n精”“戏精”“杠精”等自2017 年有了新义新用,成为流行语。\n而“鸽子精”“柠檬精”则是2019 年流行起来的。现在笔者\n带大家一起捋一捋。\n说到“猪精”,我们容易想到猪八戒。猪八戒在天宫是\n天蓬元帅,主管天河,天蓬星是道教北斗九星之首,北方属黑\n水,他因为“一嘴拱倒斗牛宫,吃了王母灵芝菜”而被贬下\n凡,成为一头又黑又丑的猪。猪八戒身为猪精,有长相丑陋、\n好吃懒做、邋邋遢遢、糊涂盲目等特征。自2017 年一场“微\n博骂战”后,“猪精”一词被广泛用于形容人,指“不爱干净、\n没有主见、盲目跟风”的一类人。“猪”一词形容人,长期具\n有侮辱性质,但随着影视作品《春光灿烂猪八戒》《猪猪侠》\n等的出现,“小猪猪”具有褒义色彩,人们称可爱有点傻气的\n人为“猪猪女孩/男孩”。与此相反的是2017 年火起来的\n“猪精女孩/男孩”,他们具有“猪精”丑、肥、矫情、无聊的特\n征。\n2017 年12 月,由《人民日报》发起的近3 万网友参与票\n选出的2017 年十大网络流行语中,“戏精”排名第九\n[8]。\n“戏精”一词本来是形容演员演技炉火纯青,在演戏方面的\n造诣无法用人的标准来衡量,只能用“妖精”般不同于“人”\n的夸张方式来形容,如2004 年晓雪的《“戏精”陈利珉》\n[9]。\n但在网络环境下,“戏精”意义丰富化,带有贬义色彩,可以\n指的是那些强行给自己加戏,为了引起身边人的注意而行为\n言语夸张的人,有爱作秀、丑人多作怪或表里不一等讽刺意\n味。当然,网络语言中也保留“戏精”的褒义色彩,单纯指某\n人很会模仿和表演,使大家都感到开心和愉悦。\n“杠精”在2017 年11 月份开始流行,以“X 精”作为类词\n缀的类推性为基础,“杠”指“抬杠”,“杠精”一词是纯粹的贬\n义词,“杠精”指的是“抬杠成瘾”的一类人。这种人多是为\n了表现自己的标新立异而否定别人的一切意见,鸡蛋中挑骨\n头,站在道德制高点发表一些让人反感的言论。在网络生活\n中类似于“键盘侠”“喷子”。比如你晒宠物,就有“杠精”说\n你为什么把钱用在这些牲畜上,而不是好好陪伴家人,你不\n孝。你捐一笔钱做慈善,就有“杠精”说你那么有钱为什么\n不多捐点。现实生活和网络生活中这些类似的例子数不胜\n数,“杠精”的存在具有相当坏的影响。\n“X 精”从产生“猪精”到产生“杠精”仅间距了几个月,\n网络官微及自媒体频繁使用“X 精”词族,传播速度快,受众\n广。由于“X 精”的含义广泛生动,能形象地表达一种情感或\n进行一种评价,因此具有生命力和能产性。2019 年又产生\n了新的流行词语“鸽子精”“柠檬精”。\n“柠檬精”是2019 年第一个火起来的梗,这个词的出现,\n与“柠檬”一词意义变化密切相关。由于柠檬的味道特别\n酸,所以现代人会用“柠檬”表达情绪上的“酸”,即羡慕、嫉\n妒的情绪或感情。这里“柠檬精”指的就是非常羡慕别人因\n此嫉妒,进而自嘲。“柠檬精”与“杠精”“嫉妒狂”等“酸民”\n不同。“酸民”不会反省自我,而是将嫉妒的情绪外化为酸\n溜溜的话试图攻击别人。而“柠檬精”则是由羡慕而内省,\n借以“柠檬精”的称谓进行自嘲,并适当表达羡慕到内心酸\n涩的情绪。由此又衍生出“我酸了”一语。此外,2019 年由\n脱口秀节目《暴走大事件》推出的《柠檬精之歌》将“柠檬”一\n词与“酸”完美结合。其中有这样的歌词: “柠檬树上柠檬\n果,柠檬树下你和我,柠檬它总围绕我。”歌词生动形象地表\n现出普通的现代人没有开挂的人生,只能卑微的生活,因为\n总羡慕别人,最终成为“柠檬精”的心酸历程。由于过分真\n实而引起网友强烈的共鸣,因此“柠檬”被广泛地表达了“柠\n檬精”“酸”的情绪。\n“鸽子精”一词很早就有,用于形容鸽子很聪明,就像成\n精了一样。这种含义下的“精”字尚未虚化。而2019 年此词\n有了新的含义并逐渐流行起来。这个梗起源于外网上一张\n图片,图片中一只鸽子站在墙上,背景是过往的人。由于镜\n头聚焦的是最近的鸽子,所以看起来鸽子的体型大于远处背\n景中的人。偏偏有人提出的疑问: “为什么鸽子会这么大?\n为什么鸽子比人类还要大?”无论题主怎么解释,该网友就是\n不得要领。于是这种在某个事情上领悟不到重点和精髓的\n网友就被称之为“鸽子精”,而且他们喋喋不休无止尽地对\n同一个问题问来问去地像复读机似的,所以这类人也被称之\n为“复读机”。传入国内后,这种含义被广泛认同,且有创新\n的含义。由于国内广泛使用“放鸽子”表示某人爽约,所以\n“鸽子精”又可以表示以各种理由爽约的人。\n从“X 精”中“X”的性质来看,“X”多为动词性、名词性\n的词根。动词性“X”体现在“杠精”“戏精”“马屁精”“鸽子\n精”等,解释时常把动词补充完整,单音节动词变成双音节,\n双音节可以变三音节。而“精”暗含“成精”的意味,即某人\n做某事成瘾。所以“撒谎精”可以翻译为“撒谎成瘾的一类\n人”,“马屁精”可以翻译为“拍马屁成瘾的一类人”,“鸽子\n精”可以理解为“‘放鸽子’成精的人”。由此可知,动词性的\n“X”加上“精”后缀,改变词性,成为一个名词; 名词性词根\n“X”体现在“猪精”“人精”“柠檬精”等,理解时一般意译,\n“精”有强调的作用,因此更强调“X”的特征。“人精”指的\n—\n7\n1\n1\n—\n[p.4]\n是非常精明、世故,具有心机的一类人,“柠檬精”指的是很\n酸的一类人。\n四、结束语\n我们可以看到,“精”具有类词缀的倾向。我们知道,词\n缀相对于词根位置比较固定,分为“前缀”和“后缀”。而\n“精”比较特殊,可以做“前缀”,也可以做“后缀”,但形成机\n制和功能是不一样的。“精”做前缀有方言基础,它表示一\n种程度,具有强调的作用。常与单音节形容词粘合,也可以\n与动词、名词黏合,构成一个新的形容词,暗示某事物性质超\n过正常范围; “精”做后缀源于宗教和民俗文化中的“妖精”\n等词,在语言运用中有了新义新用,并产生许多名词性的“X\n精”式网络新词。\n参考文献:\n[1]段玉裁.说文解字注[M].上海: 上海古籍出版社,1988.\n[2]罗竹风.汉语大词典[K].上海: 汉语大词典出版社,\n1998.\n[3]计超.哈尔滨方言词缀研究[D].南宁: 广西师范学院,\n2013.\n[4]黄博雅.康青.网络新生“类词缀”“精”系词族初探[C].\n中文教学现代化学会.第十一届中文教学现代化国际研\n讨会,2018.\n[5]安静.略说“妖精”隐喻义[N].语言文字周报,2018-12-\n05( 2) .\n[6]许宝华.宫田一郎.汉语方言大词典[M].北京: 中华书\n局,1999: 6937—6944.\n[7]秦娟.明清神魔小说中的妖怪形象研究[D].开封: 河南\n大学,2009.\n[8]任雪菲,蔡贺.功能论视角下简析网络环境中的“戏精”\n[J].社科纵横,2018( 1) : 109—111.\n[9]晓雪.“戏精”陈利珉[J].东方艺术,2004( S1) : 72—73.\nA Preliminary Study on the Family of Category Affix “Jing”Prepositions\nZHOU Wang\n( School of Literature,Hunan Normal University,Changsha 410081,China)\nAbstract: During the process of language and vocabulary,network buzzwords swarm out,the phenomenon of“Jing”prepositions\nand their affixes gradually appears.Affixes are relatively fixed relatively to root positions,which can be divided into“prefix”and“suf-\nfix”.However,“Jing”is quite special.It can be used as“prefix”or“suffix”,but the formation mechanism and function are differ-\nent.“Jing”as a prefix has dialect basis,which indicates a degree of emphasis.It is often bound to a monosyllabic adjective,or a verb\nor a noun to form an adjective,implying that something is out of its normal range.The suffix of“Jing”is derived from the words such\nas“Yao Jing”in religion and folk culture,which have new meanings and uses in the language application,and generate many nominal\n“X-Jing”type network new words.\nKey words: category affix; X-Jing; Jing-X; genesis; development\n( 责任编辑: 刘东旭)\n—\n8\n1\n1\n—", "title": "类词缀“精”系词族初探", "topic": "指人 类词缀", "touch": "'精'의 전접·후접 이중 쓰임은 위치 고정성(定位性) 논의의 예외 사례로 언급할 수 있다.", "updatedAt": "2026-10-06T11:52:00Z", "url": "", "year": "2020", "id": "a7e85465", "pid": "p_legacy01"}, {"analysis": "", "author": "何波麾", "ch": "pdf", "createdAt": "2026-10-06T11:53:00Z", "cut": 0, "fileName": "从“打工人”看指人语素的类词缀化_何波麾.pdf", "grade": 3, "gradeBy": "AI", "gradeReason": "최근 인터넷 유행어 사례 분석으로 배경 사례로 쓰기 좋지만 이론적 깊이는 제한적이다.", "insight": "", "keywords": ["打工人", "指人语素", "类词缀化", "网络流行语", "××人"], "kind": "학술논문", "myView": "", "pages": 3, "publisher": "今古文创, 2023(34)", "summary": "'打工人'을 대표로 하는 '××人' 구조를 대상으로 '人'의 유사접사화를 분석한다. 형태를 N(P)+人, V(P)+人, A(P)+人, A1+(A2人) 네 유형으로 나누고, 의미를 직업·사회 집단·사회 호칭·평가로 분류해 감정 색채를 정리한다. 문장 성분 기능과 다양한 문형에서의 쓰임, 화용 효과도 기술한다.", "text": "[p.1]\n文化综合\n·119·\n2023 年/第34 期/\n从“打工人”\n看指人语素的类词缀化\n◎何波麾\n(四川大学文学与新闻学院 四川 成都 610000)\n一、引言\n关于汉语类词缀的研究素来备受争议,在《汉语语法\n分析问题》(1979)中吕叔湘明确提出:\n“汉语里地道的语缀\n不多......有不少语素差不多可以算是前缀或是后缀,然而\n还是差点儿,只可以称作类前缀和类后缀。说它们作为前缀\n和后缀还差点儿,还得加个‘类’字,是因为它们在语义上\n还没完全虚化,有时候还以词根的面貌出现......存在这种\n类前缀和类后缀是汉语语言的第一个特点。”\n[1]\n在现代汉语中早已出现“××人”的构造,最早此类构\n造遵循传统的成词规律,并没有过多衍生意义,如:代言\n人、经纪人、候选人......同类型的还有“××党”“××鬼”\n等形式,这类指人语素在新词汇中体现出很强的成词能力。\n随着时代发展,新媒体运营蓬勃苏生,更多新词语的出现\n也丰富了“××人”的形式和内涵。随着2021 年网络热词的\n出炉,\n“××人”结构在其中独占三席,分别是“打工人”“尾\n款人”“工具人”,“××人”形式的新词汇从句法形式和意义\n指向可以划分出不同的几类,本文旨在以“打工人”为新词\n新例,分析此类类词缀的结构特征和兴起原因。\n二、语义特征及句法表现\n(一)造词法\n葛本仪先生在《汉语词汇研究》(2001)中将造词法分\n为了八类,音义任意结合法、摹声法、音变法、说明法、比拟\n法、引申法、双音法及简缩法。“××人”作为流行词语常规\n形态即是以“××”附加后缀“人”组成,前者对后者状态进\n行说明,因此“××人”的整体构成是基于说明法而形成的\n造词模式,而对于后缀“人”的界定则在此基础上进行灵活\n组合,将通过摹声法、比拟法、双音法等造词法构造而成的\n词语与之结合,即创造出一类新型“××人”式热词,例如\n“打工人”,通过“打工”这一行为动词对这一类人的身份进\n行了一个界定,再比如“工具人”,“工具”对“人”的基本作\n用和属性进行了界定,而该词本身又是基于将人比做工具的\n比拟意义之上。\n【摘要】以“人”为词缀的结构形式由来已久,近年来以“打工人”为代表,“××人”的形式作为网络流行语\n持续活跃于大众视野中,而“人”作为指人语素的一种也在这种过程中进一步类词缀化。本文分析了“××人”\n的构词特征、语义特征、句法功能及语用效果等,得出了部分有关这方面的结论。\n【关键词】“打工人”;指人语素;类词缀化;网络流行语\n【中图分类号】H146 【文献标识码】A 【文章编号】2096-8264(2023)34-0119-03\n【DOI】10.20024/j.cnki.CN42-1911/I.2023.34.038\n(二)形态结构\n从句法形式来给“××人”的构词划分类型,大致可以\n分为四类:\n第一种:\n“N(P)+人”,如工具人、尾款人;\n第二种:\n“V(P)+人”,如打工人、干饭人;\n第三种:\n“A(P)+人”,如魔怔人、虚拟人;\n第四种:\n“A1+(A2 人)”,如女强人、老好人。\n从韵律格式来看,前三种类型成词模式都是“2+1”类型,\n词汇数目大,大多通过名词或名词短语、动词或动词短语、形\n容词或形容词短语以人为后缀组成;第四种的韵律格式则为\n“1+2”模式,形容词A2 先与人组成偏正结构短语,再加上修\n饰词A1 组成,此类词语数目较少,也很少具有特殊含义。\n(三)意义区分\n与“××鬼”“××族”等指人语素稍有区别,“人”这\n一语素在汉语演变中意义很少虚化,也并无过多变化,本义\n为能制造并使用工具进行劳动又能用语言进行思维和交际\n的生命,后来成词也基本没有跳出过这一体系,只是在原义\n基础上进行扩大,兼指某一群体。同样以“××人”为例,\n可以将词汇意义分为以下几类:\n第一类:表示一种职业,情感色彩偏中性,如打工人、\n教资人、媒体人;\n第二类:表示一种社会群体,情感色彩偏贬义,如局\n外人、做梦人;\n第三类:表示一种社会称谓,情感色彩偏贬义,如社\n会人;\n第四类:表示一种评价,褒义、贬义均有,如女强人、\n魔怔人。\n从语义来看,\n“××人”的意义较为丰富,大多带有语义\n色彩,贬义居多,中性词语多为描述客观职业、身份,贬义\n词语多为身份地位、特点概括,褒义词语则偏向描述技能。\n此外,词语的语义并不是直译,通常会借用隐喻、转喻等手\n法,为词语增添新的具有时代内涵的含义。如第一类中“打\n[p.2]\n·120·\n今古文创\n工人”除了指代上班族之外,还带有“社畜”“工作狂”等\n外延义;第二类中的“香蕉人”则是直接用香蕉比喻外籍华\n人;第三类、第四类中的“社会人”“魔怔人”则是利用了修\n饰词A1 本身的外延情感义,使词语本身附加同样的新意。\n(四)句法表现\n(1)句法结构\n1.充当成分\n“××人”一般都是偏正式或名词性短语,在句中主要\n充当主语、宾语或定语的句法成分。\n1充当主语成分:告别春节假期,“打工人”陆续踏上\n了返乡路。(《南方周末》,2023 年1 月30 日)\n2充当宾语成分:推完这个小推车就下班啦!做快乐\n的打工人!(人民视频,2023 年2 月16 日)\n3充当定语成分:小鹿是当代打工人的嘴替吧!用最幽\n默的语言说出了最现实的问题。\n(搜狐视频,2023年1月15日)\n2.句子形式\n“××人”作为一个已经经历较为现象级传播的热词,在\n各式网络句式中均有运用。基本上各类句式都能使用,体现\n其较为灵活的语法构成以及较为丰富的语义色彩含义。例如:\n1陈述句。今天是2022下半年的第一天,对很多打工人来\n说,也是新一个季度的第一天。(《南方周末》,2022 年7月1日)\n2疑问句。大胆组词“牛鬼蛇神”,疯狂找补演哪个打\n工人了?(新浪娱乐,2022 年11 月18 日)\n3祈使句。为打工人打气,陪你笑对开工,开“新”生\n活!(爱奇艺,2023 年1 月19 日)\n4感叹句。对于离家闯荡的打工人来说,这简直就是\n一枚催泪弹!(优酷,2023 年1 月20 日)\n5否定句。没有打工人需要赔上性命,性命是无价的。\n(新浪娱乐,2022 年5 月26 日)\n(2)句法功能\n词语的句法功能主要体现在其充当句法成分的能力及\n与词的组合能力上,充当句法成分的能力前文已经提及,\n此处主要通过语料观察其与词的组合能力。\n1和名词组合。总书记和代表委员的故事说明,他心里\n装着我们打工人。(新华社,2022 年2 月27 日)\n2和动词组合。学生忙赶作业、打工人踏上离家路途。\n(南方都市报,2023 年1 月29 日)\n3和介词组合。他的付出是有回报的,对于打工人来说\n一路幸运加持。(娱小圈,2022 年2 月8 日)\n4和形容词组合。广州许多打工人迎来了返工首日,广\n州的烟火气回来了。(《南方都市报》,2022 年12 月2 日)\n5和副词组合。全体打工人请注意,今天是520,更重\n要的是,周末倒计时:0 !(娱小圈,2022 年5 月20 日)\n三、语用效果及类词缀化\n(一)语用效果\n我们以“打工人”为例来试分析“××人”在句中的语\n用表达效果:\n简化话语表达。“打工人”实际上是将多音节短语“在\n外打工的人们”缩略为了三音节词语,使得语句表达凝练,\n意义更加明晰,在造句时避免了成文的烦琐,在朗读时使\n得音节短促,不易出错。\n描摹主体性状。“××人”多通过隐喻方式组构语义,\n将一个认知域投射到另一个具有相似性的认知域,形象地\n描写主体的性状,有利于认知主体对某一社会群体或某种\n群体特征有更强烈的感官认知。“打工人”通过简化语言成\n分,使得修饰语更加浓缩精炼,修饰词也更精准,同时强化\n了“打工”一词的隐喻意义,从单纯的“工作”向“无奈地\n工作”演化。\n强化群体特征。“××人”也可通过转喻的方式组构语\n义,指两个相关认知域的事物中更为凸显的一个替代另一\n个的过程。给予其社会语境的话,则可以理解为某一凸显\n的群体特征替代了个人,譬如“打工人”就是选择了劳动群\n体,以“熬夜”“加班”等特征取代了个人,从而凝结成这样\n一群处在相同境遇的人。\n(二)演变过程\n1.“×党”“×族”等指人语素的推动\n在“打工人”出现之前,群体类语缀就有“××\n党”“××族”“××团”“××群”和“××控”等,其中作\n为网络流行语更为活跃的有“××党”“××族”和“××\n控”,\n“××党”的常见词汇有“剁手党”\n“酱油党”等,\n“××\n族”有“追星族”“飙车族”等,\n“××控”有“格子控”等。\n这部分词语为“打工人”的出现奠定了组词规律上的基础,\n同时影响了群众的接受度,人们普遍愿意接纳一种新的词\n语作为自己的指称。\n同时网络词汇的时效性较短,在带有某一种词缀的词\n汇大量涌现后,人们容易出现审美疲劳,逐渐丧失新鲜感,\n因为不同的群体性指人语素类词缀层出不穷,且在风靡一\n段时间后归于沉寂。\n2.“××人”作为类词缀的特点\n上文提到的“××党”和“××族”,党、族等语素具\n有更为明确具体的本义,且古今义尤其是与网络新义区别\n较大,如党的古义有“朋辈、朋党”之义,今义则多为从日\n语演化而来的“政党、党派”之义,“××党”正是借用了古\n今义中的群体义演化而来,其中的党已无明确指向,位置更\n为固定,意义进一步泛化但并为完全虚化,从而类词缀化。\n“族”和“党”在历史上意义较为接近,\n《周礼·大司徒》:\n“五\n族为党。”说明族也叫党,因此“父族、母族”也叫“父党、\n母党”,同时新词汇“追星族”“暴走族”中的“族”也可与\n“党相互替换,词义并不会发生太大变化。”\n[5]\n“打工人”类词缀化的特点与“××党”\n“××族”类似,\n人作为词缀意义更加泛化,在原本“人类;个人”意义上加\n入了群体义,但是并未完全虚化。在这一类成词规律中位置\n也较为固定,同时明确了词语的词性(名词性短语),一般\n不读作轻声。\n[p.3]\n文化综合\n·121·\n2023 年/第34 期/\n(三)兴起原因\n1.指人语素作为类后缀兴起的缘由\n我们按照时间顺序简单梳理一下近年来流行过的指人\n类后缀:最早出现的“追星族”“暴走族”,之后的“凤凰\n男”“犀利哥”“孔雀女”,再之后是“富二代”“官二代”,还\n有“剁手党”“酱油党”,最后到“打工人”的出现。各指人\n语素作为常项在其前面加上可变成分即可经过框架提取,\n和语言充填后形成流行词语,灵活度很高,成词性极强。\n同时,随着时代的发展,人们也趋向标签化思维,分\n类也更具体,各种指人语素分别指代不同的群体也就更加\n稀松平常,如区分性别的“凤凰男”“孔雀女”,区分代际关\n系的“富二代”“星一代”,具有贬义性质的“老婆奴”,具\n有褒义性质的“上分帝”,以及比“上班族”贬义性和自嘲\n意味更浓的“打工人”等。\n以上语缀在受到广泛使用的同时,也逐步被列入了类\n词缀的行列。\n2.“打工人”的流行原因\n从外部因素来看,社会环境交际化,新的社会群体不\n断产生,新的社交称谓也就应运而生,人们迫切需要一种\n能被普遍接受、符合时代潮流的自称或他称以供社交需要,\n作为目前社会主流的“加班”“打工”也就成为首选;同时\n从主观倾向来看,“打工人”一词具有浓厚的隐喻义和自嘲\n意味,也使其脱离严肃的语境,偏向轻松愉快的网络社交\n氛围,自然受到大量受众的追捧和使用。\n而从内部因素看,主要是因为指人语素“人”的类词\n缀化和类推作用。“人”的类词缀化主要表现在,现代汉语\n不断演化过程中,“人”的意义也在不断泛化,其黏附性不\n断增强,独立性不断减弱,能够较好地适应包括互联网环\n境在内的语境变化,体现出极强的成词能力,“人”的类词\n缀化促成结构形成,结构又继续推进类词缀化,形成活跃\n的良性循环。而类推性则主要“×人”结构的演变过程中,\n“人”从最早的黏附于单音节语素上,如“狼人”“商人”,经\n过类推,逐渐可以黏附于双音节、三音节语素上,且语素的\n类型也在不断扩展,从名词或名词性短语、形容词或形容词\n性短语到后面动词和动词性短语也逐渐加入。因此,尽管\n这个结构出现很早,现在仍具有相当的活力和使用频率。\n3.指人语素类词缀的未来发展\n从客观背景来看,随着社会的高速发展,互联网创造\n出更多的互联网生态现象,如自媒体行业的蓬勃发展,信\n息流更加密集纷繁,互联网行业需要更加具有辨识度的方\n法令受众便于区分和接收,因此网络流行语的产生对于社\n会生态和受众表达都十分重要,流行语在一定程度上代表\n着互联网生态,而热词则象征着某一时间段的整体特征。指\n人语素作为一种重要的构词语素,通常指代着某一种社会\n群体,社会意义上拥有相当强的概括归纳能力,而语法意\n义上则具有相当灵活的造词能力和成句能力。对于更替迅\n速信息流密集的互联网社群是非常合适的表达工具。\n从主观情感意义来看,互联网带来更多的语言互动与\n情感互诉,人们在输出和吸取双向互动过程中也衍生出更\n多情感需求。从“打工人”这类指人语素的代表性热词不难\n看出,相较于以前对于社会群体身份的简单陈述与界定,受\n众的整体诉求偏向于自身经历和感受,受众更加在意情感\n的外露,但对于社会环境的整体适应也使得这类词语大部\n分情感色彩偏向于自嘲、反讽等,“打工人”的出现体现了\n这一特点,也预示着带有这一特点的指人语素会更加活跃\n于今后的网络热词当中。\n从语言学角度来看,指人语素的类词缀化尚在进行,\n“××人”还并未完全消弭其本义,根据此类热词的成词类\n推模式,以指人语素为词缀的热词必将会层出不穷,并且在\n演变发展过程中逐渐衍生出更多象征义和引申义,反作用于\n指人语素本身,促进其类词缀化进程,这种进程对于语言学\n以及网络流行语的研究也是相当重要的语料积累。近年来,\n这类热词的构成也在趋向于向多音节词发展,在“××人”\n前面再添加热词作为修饰词,对此类群体身份进一步详细\n地刻画,如春节期间出现并迅速普及的“天选打工人”,通\n过加入同为热词的“天选”,对“打工人”进行了更细致的划\n分,指在疫情政策下照常上班上学的社会群体。由此可见,\n指人语素在网络流行语中还具有较强的成词能力和活跃度。\n四、余论\n综上所述,\n“打工人”的出现和热议证明“××人”结构\n仍在演变之中,“人”作为指人语素具有很强的能产性和类\n推性,在历史演变中并没有被淘汰而是不断适应着时代潮\n流变化出新的结构,焕发着新的生机,其类词缀化也尚在\n进行,最终会不会完全虚化成为词缀还有待考量。\n参考文献:\n[1]吕叔湘.汉语语法分析问题[M].北京:商务印书\n馆,1979.\n[2]葛本仪.汉语词汇研究[M].济南:山东教育出版\n社,1985.\n[3]李忠亮,谢飘飘.“打工人”背后的“那些人”[J].\n语文建设,2020,(24):3.\n[4]褚兰平.汉语类后缀“鬼”的探析[J].兰州职业技\n术学院学报,2021,37(2):3.\n[5]陈昌来,朱艳霞.说流行语“×党”——兼论指人语\n素的类词缀化[J].当代修辞学,2010,(3):7.\n[6]季思媛.网络流行语“×人”的发展探析[J].今古\n文创,2021,(16):3.\n[7]张立达.现代汉语类词缀“家”探析[J].广州广播\n电视大学学报,2021,(2):4.\n[8]沈光浩.现代汉语类词缀的界定标准与范围[J].河\n北师范大学学报:哲学社会科学版,2011,34(3):5.\n作者简介:\n何波麾,四川大学文学与新闻学院在读硕士研究生,\n研究方向:现代汉语。", "title": "从“打工人”看指人语素的类词缀化", "topic": "指人 类词缀", "touch": "신흥 사례 제시(서론의 문제 제기, 사례 분석 장의 보조 예시)에 활용할 수 있다.", "updatedAt": "2026-10-06T11:53:00Z", "url": "", "year": "2023", "id": "b05c9104", "pid": "p_legacy01"}, {"analysis": "", "author": "党晓萌, 吴媛", "ch": "pdf", "createdAt": "2026-10-06T11:54:00Z", "cut": 0, "fileName": "浅议表人的类词缀——“族、奴、家”_党晓萌吴媛.pdf", "grade": 4, "gradeBy": "AI", "gradeReason": "유사접사와 접사·어근을 구별하는 비교표가 판별 기준 서술에 유용하다.", "insight": "", "keywords": ["类词缀", "族", "奴", "家", "词根", "词缀", "感情色彩"], "kind": "학술논문", "myView": "", "pages": 6, "publisher": "景德镇学院学报, 33(1)", "summary": "族·奴·家 세 지인 유사후접사를 예로 유사접사와 접사·어근의 공통점과 차이를 능산성, 의미 허화, 경성화 등 여섯 기준으로 비교한다. 이어 의미 표현, 품사 결합, 감정 색채의 특징을 분석하고, 감정 색채가 서로 다른 원인을 각 형태소의 어원에서 찾는다.", "text": "[p.1]\n一、引言\n词汇反映着社会发展和语言发展的状况,也\n标志着人们对客观世界认识的广度与深度[ 1] 216。\n新词的产生与旧词的消亡都会随着社会进步、\n经济发展而不断进行,因此词汇是语言中最活跃\n的部分。2007 年8 月教育部发布了《中国语言生活\n状况报告(2006)》,公布了171 个汉语新词[ 2],其\n中以“族、奴、家”结尾的新词共有23 个,占到了\n高达13.45%的比例。从这三个语素组成的词语\n来看,他们具有很强的时代性,这类词的兴起是\n很多新事物产生和生活方式、行为举止变化的\n见证。也正是因为这类词对词语表意空白的填\n充,以及词语表现力强的缘故,得到了越来越多\n的社会人群的肯定。\n对于表人的类词缀的研究近来才有,以“奴”\n字最多,大多从历时的角度分析其语义发展的\n变迁以及语言机制的形成与发展。而对于这类\n语素在语法单位中的归属、感情色彩和形成词\n语感情色彩的原因讨论不多。本文以“ 族、奴、\n家”三个类后缀为例,具体讨论它们与词根、词\n缀之间的区别与联系,分析这三个语素在语义\n表达、词类搭配、感情色彩上的特点,并尝试探\n1收稿日期:2017- 05- 25\n作者简介:党晓萌(1991—),女,陕西渭南人。在校研究生,主要从事语言学及应用语言学方向研究。\n通讯作者:吴媛(1972—),女,陕西西安人。副教授,博士,主要从事现代汉语方言、汉语国际教育方向研究。\n党晓萌,吴媛1\n(陕西师范大学文学院,西安710119)\n摘\n要:词缀与类词缀之间的界限很难完全划分,但类词缀这一类语素确有其独特性。论文以三个表人的类词缀为例,讨论了\n类词缀的两方面问题,一是类词缀与词缀、词根的相同点与不同点,二是类词缀作为语素在组成词后的语义、词性搭配、感情\n色彩等特征,并从词的来源探讨造成词的感情色彩不同的原因\n关键词:类词缀;\n“族”;\n“奴”;\n“家”\n中图分类号:H136.8\n文献标志码:B\n文章编号:2095- 9699(2018)01- 0048- 06\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n浅议表人的类词缀——\n—“族、奴、家”\n求造成这三个语素感情色彩不同的原因。\n二、类词缀“ 族、奴、家” 与词缀、词根\n的区别与联系\n现代汉语中有很多类似“族、奴、家、者、友、\n党......”之类的语素,它们有自己的特征,吕叔湘\n先生最先把他们统一归类并命名为类词缀,他在\n《汉语语法分析问题》中提到:\n“汉语里地道的词\n缀不多,有不少语素差不多可以算是前缀或后\n缀,然而还是差点儿,只可以称为类前缀和类后\n缀......”[ 3] 32 而后刘月华、汤志祥、张斌等均同意\n这种说法,然而王洪君指出“语义虚化很难用来\n作为判断词缀的条件,相反意义实在也不妨碍一\n个语素成为词缀......”[ 4] 3-17 朱德熙先生则不主张\n设这一类词。笔者认为这类词很难被归入到词缀\n或词根这两大类之中,它介乎词缀与词根之间,\n有其自身的特征。这类词的界限很难划分,但不\n能忽视这类语素的现实存在性,因此本文称这类\n语素为类词缀。\n为了说明类词缀与词缀、词根的异同,我们\n通过能产性、词义虚化、读音轻声化等六个方面\n对词缀、类词缀和词根进行比较。\n详情见下表:\n第33 卷第1 期\n2018 年2 月\nVol.33 No.1\nFeb.2018\n景德镇学院学报\nJournal of Jingdezhen University\n[p.2]\n1.类词缀“族、奴、家”与词缀、词根能产性的\n区别与联系\n词缀能产性特别强,并且由词缀所衍生的词\n大多已经固定下来,如:老师、桌子、阿姨、面儿。\n类词缀能产性同样强大,如:爱车族、酷抠族、卡\n奴,然而由类词缀衍生出来的词口语性强,是否\n能固定还不能够确定。而词根的能产性与语素本\n身所表达的内容与意义有很大关系,不能统一说\n明,因此不讨论。如“璧”的构词能力较弱;而\n“国”的构词能力却很强,如国家、国际、国籍、国\n庆、国情、爱国、回国等等。\n2.类词缀“族、奴、家”与词缀、词根的词义虚\n化的区别与联系\n朱德熙认为“真正的词缀只能粘附在词根成\n分上头,它跟词根成分只有位置上的关系,没有\n意义上的关系”[ 5] 29。《语言学引论》指出“ 词根\n表示实在的意义,是词中词汇意义的基础......词\n中除词根以外的其他词素都是词缀。词缀表示附\n加意义或语法意义”[ 6] 247。词缀是从词根演变而\n来,典型词缀的意义已经明显虚化。例如:花儿、\n鸟儿、草儿里的“儿”主要表达的是附加意义,明\n显与儿子、儿童、儿戏中的“儿”不同;再如桌子、\n椅子中的“子”也不同于莲子中的“子”。词根语\n素在组成词时常为复合词,并在词中发挥表意的\n作用,词根的意义极少存在虚化情况。而类词缀\n意义没有完全虚化,大多与词根义有一定的联\n系。\n就本文所提到的“族、奴、家”在语义虚化的\n程度上有所不同,其中“族”虚化程度相对较高,\n而“奴、家”虚化程度相对较低。“ 爱车族、上班\n族”等以“ 族”字结尾的词语可以理解为爱车的\n人、上班的人,而“出国奴”、\n“书法家”等以“奴”、\n“家”这两个字结尾的词语则不能理解为出国的\n人、写书法的人,而应该是为了出国付出很多的\n词缀\n类词缀\n词根\n儿\n子\n族\n奴\n家\n族\n奴\n家\n能产性\n+++\n+++\n+++\n+++\n+++\n****\n词义虚化\n+++\n+++\n++\n+\n+\n—\n—\n—\n读音轻声化\n+++\n+++\n—\n—\n—\n—\n—\n—\n表达附加意义+++\n+++\n+++\n+++\n+++\n****\n单向聚合构词+++\n+++\n+++\n+++\n+++\n****\n单独成词\n—\n—\n—\n—\n—\n—\n—\n+++\n类词缀“族、奴、家”与词缀、词根的区别与联系总表1\n人、写书法很有成就的人。由此看出“奴、家”在\n组成新词时还较大程度地保留了原本的词根义。\n3.类词缀“族、奴、家”与词缀、词根读音的区\n别与联系\n作为词缀“儿”\n“子”在构词时的读音有轻声\n化特征,其中“子”由214 曲折调变为轻声调,\n“儿”在构成词时不自成音节,也并不是一个音\n素,只是词尾所在音节发音时的一个伴随的卷舌\n动作。而类词缀发音则不完全轻声化,\n“族”\n“奴”\n的读音不发生任何变化,\n“家”的发音有两种,一\n种是55 高平调,如银行家、书法家;一种是轻\n声,如姑娘家,孩子家。词根的发音除了音变外\n都为单字音。\n4.类词缀“族、奴、家”与词缀、词根表义的区\n别与联系\n董秀芳在《汉语词缀的性质与汉语词法特\n点》中提到:\n“汉语中比较公认的派生词缀很多\n都属于表达性词缀”[ 7] 13-18。词缀“儿、子”都有很\n强的表达性,增加感情色彩:\n“儿”在大多数情况\n下有亲昵、爱称之意,\n“他知道星儿怎样扬他们\n的美眼, 月儿怎样独笑...... ”2而“ 子”在一些词\n语中也会表示出轻视、不尊重之意。如:\n“这老头\n子,硬头硬脑,正是躲避差徭游食户。”3类词缀\n“族、奴、家”也有很强的表达性,如,\n“奴”有被束\n缚、压迫之义,并夹杂同情之义,\n“虽然我还没去\n做房奴, 但看着周边同事那样的生活压力, 觉得\n人完全被束缚了。”4而“家”则有一种褒扬,尊敬\n之义。“书法家是擅长书法的人;具有汉字书写\n能力,并能将其推至艺术高度的人。”5词根的感\n情色彩由语素的理性意义决定。\n5.类词缀“族、奴、家”与词缀、词根单独成词\n的区别与联系\n类词缀与词根不是简单的相加关系,而是融\n合关系。它们组成一个整体,类词缀离开了这个\n整体,既无单独的意义,又不能独立成词。词缀\n与类词缀的意义都有不同程度的虚化,因此不能\n单独作为一个词出现,而大多数词根的意义很实\n在,可单独成词,如:词根“头”作为名词,可以单\n独成词充当句子成分,而词缀“ 头”则不可单独\n成词。文章中提到的词根“奴、族”在现代汉语\n中不能单独成词。\n党晓萌,吴媛:浅议表人的类词缀——\n—“族、奴、家”\n49\n·\n·\n[p.3]\n景德镇学院学报\n2018 年第1 期\n6.类词缀“族、奴、家”与词缀、词根单向聚合\n构词性的区别与联系\n单向聚合构词指的是语素在固定方位的构\n词能力。聚合关系在《语言学纲要》被描述成\n“......组合结构的某一环节能够互相替换并且替\n换后结构关系不会变”[ 8] 65。词缀与类词缀都有很\n强的单向聚合构词能力,词根则有双向聚合构词\n能力,如类词缀语素“族”只能组词为上班族、有\n车族等,而词根语素“ 族”,既可组词为民族、种\n族、汉族、家族、宗族,又可以组词为族谱、族徽、\n族长。\n综上所述,类词缀与词缀相比,它拥有词缀\n的能产性、位置固定与表达附加意义的特征;与\n词根相比,它不像词根那样可以单独成词;但它\n也不像词缀那样意义完全虚化、读音轻声化,因\n此类词缀是介乎词缀与词根之间又靠向词缀的\n一类词。\n三、表人的类词缀的不同语义、词类\n搭配与感情色彩\n1.类词缀“族、奴、家”表示客体的几种不同\n特征\n“族”\n“奴”\n“家”在组成词时,词义主要集中\n在前面的成分,常常可以通过字面或补充词语、\n引申等几种方式进行理解。“族、奴、家”同样作\n为表某一类人的类词缀,因为其原本意义不同,\n在组成词的时候往往有不同的语义特征。\n“族”表示的客体可分为以下几种:(1)表示\n有共同的某种行为的一类人:骑车族、开车族、\n打车族、暴走族、刷卡族、拇指族;(2)表示有共\n同生存、生活状态的一类人:高收入一族、贫困\n一族、白领族、月光族;(3)表示有共同的某种爱\n好的一类人:户外活动一族、背包族、咔嚓一族、\n飙车族、爱车族。\n“奴”所表示的客体可分为以下几种:(1)特\n别喜欢或痴迷某一事物,主观意愿强迫自己为之\n付出很多的一类人:猫奴、狗奴、花奴、孩奴;(2)\n被某种事物所束缚,并不得不付出很多的一类\n人:车奴、房奴、证奴、卡奴;(3)被强迫或出于\n某种原因不得不做某种事的人:性奴、歌奴、舞\n奴;(4)特别想要达成某个的目的,并为之付出、\n牺牲很多的一类人如:考研奴、出国奴、学位奴、\n论文奴。\n“族”和“奴”在表人时语义有部分的共通性,\n同样都表示对某种事物、某件事情的喜欢;或者\n共同做某件事情的一类人。但这两个语素在程度\n上有所不同,\n“ 奴”的程度比“ 族”的程度深。比\n如:\n“2015 年的考研族们,应该正在焦虑地等待\n复试线的出炉。”这句话中“考研族”表示的是每\n一个考研学生。“考研也为找工作,并不是为了\n做考研奴。”这句话中“考研奴”指的是为了考研\n付出了极大心血或为了考研放弃很多的考研学\n生。\n“家”所表示的客体可分为以下几类:(1)表\n示从事某种工作或进行某种活动,并在这一领域\n有很高成就被大众认可的人:外交家、画家、作\n家、钢琴家、探险家、批判家、活动家、改革家;\n(2)表示某一特征的人:女人家、孩子家、姑娘\n家、学生家;(3)表示某种身份的人:东家、行\n家。\n2.类词缀“族、奴、家”不同的词类搭配\n“族”作为类词缀能产性很强,与之搭配的词\n词类丰富,有名词性成分:电脑族、候鸟族、背包\n族;有动词性成分:寄生族、打工族、持卡族、健\n身族;有形容词成分:贫困族、时尚族;也有拟\n音、英文、数字等成分:咔嚓族、嘻哈族、OK 族。\n搭配的音节多种多样,有单音节、双音节和多音\n节,如囧族、有车族、以卡养卡族......\n与“奴”搭配的词类相对较少,主要以名词成\n分为主:报奴、书奴、花奴;少量的动词成分的:\n考研奴、出国奴;没有形容词与拟音、数字与英\n文等成分。\n与家搭配的词类与奴相近,主要以名词为\n主:技术家、思想家、言论家、音乐家,少量的动\n词成分:改革家、外交家、革命家、探险家,也不\n存在其他成分。\n类词缀\n名词\n动词\n形容词\n拟音词\n数词\n字母词\n族\n+\n+\n+\n+\n+\n+\n奴\n+\n+\n-\n-\n-\n-\n家\n+\n+\n-\n-\n-\n-\n类词缀“族、奴、家”不同的词类搭配表6\n3.类词缀“族、奴、家”不同的感情色彩\n“族、奴、家”作为三种不同的表人类词缀,有\n很强的构词能力,然而这三种类词缀由于意义的\n50\n·\n·\n[p.4]\n不完全虚化,在组成词的时候带入了词本身的感\n情色彩,以至于这三种类词缀所组成的众多词表\n现为不同的感情色彩。\n“族”作为类词缀在感情色彩方面主要表现\n为中性词与贬义词。\n1.香港的房地产迅速盛行起来,出现了一大\n批近乎疯狂的“炒楼族”。当时的香港,人们盲目\n地投资房地产。\n2.一个人要想从“打工族”成为巨富,全靠的\n是胆识,拼搏,脑筋里时刻产生新观念。\n3.市场价格降至国际市场水平,那么中国的\n平民百姓就可统统成为“汽车族”。\n4.市场经济呼唤更多的“持卡族”,信用卡在\n我国的风靡只不过是迟早的事。\n第1 句为贬义,\n“炒楼族”指的是一些利用自\n己手上资金,交少量的房子订金或首付,然后再\n卖出以此挣钱的人。“炒楼族”是有炒楼行为的\n人,但因为炒楼族房价被哄抬过高,所以人们对\n这一类人深恶痛绝,为贬义词。第2、3、4 句则为\n中性词,\n“打工族”指的是从一个地方到另外一\n个地方务工的人。“汽车族”即为有车族,就是拥\n有车的一类人。“持卡族”指的是拥有信用卡的\n人。“打工族、汽车族”与“持卡族”本身没有任何\n感情色彩,单纯地表示某一种特性的人,为中性\n词。\n“奴”在感情色彩上主要为中性和贬义,但在\n语句中常常有同情、无奈、自我揶揄的感情。\n5.社会上的人们由于风气的缘故,都慢慢地\n沦为“贪奴”,许多令人难以容忍的卑劣风气以\n及案件也逐一并发。\n6.妻子爱鞋如命,是个名副其实的“ 鞋奴”,\n一进我们家门,就可以看到地上摆放着各式各样\n的鞋。\n7. 我是作为英语四级没过的人坐了一个多\n小时,还没有成为“房奴、卡奴、车奴、老婆奴”的\n时候,我早就做了十几年的“英语奴”,还是一直\n都没反抗的机会,我真不争气。\n8.在逆市飞涨的房价下,普通老百姓无奈地\n称自己为“房奴”,大部分人无法承担的高房价\n已成为社会最不和谐的因素之一。\n第5、6 句都为贬义,\n“贪奴”被贪心所束缚,\n做一些不好甚至犯罪的事情;\n“鞋奴”指爱鞋成\n魔,这里有轻微的贬义和讽刺。第7、8 句中都为\n中性词,“英语奴”是说每每因英语考试而头疼、\n烦恼的人,\n“墓奴”与“房奴”一样,因为买了某种\n东西,而在经济上陷入“赤字”的人。在“奴”所组\n成的词语成句时,主语为第一人称,常常为自\n嘲、自我讽刺又带有一种无奈之感,如例句7;主\n语为第三人称时,则带有一种同情,如例句8。\n“家”作为类词缀出现的时候,它有褒义、中\n性及贬义。\n9.自文艺复兴以来,众多的思想家们都在高\n扬与神性相对立的人之自然属性......。\n10.苏联的一批教育改革家提出“合作教育学”\n的思想,主张“个性的民主化”。\n11.因为他运用外交,从俄国收回伊犁,他是\n国际有名的外交家。\n12. 就如同在印象派画家的眼中,空气和阳\n光是流动的一样。\n13.各国记者、抵抗运动人士、社会活动家蜂\n拥而至。\n14.法国当时联俄以对德,俄要法帮忙,法不\n敢拒绝,何况法国也有野心家想乘机向远东发展\n呢?\n15.周正闪开了那透发着姑娘家香脂味的小\n凤,摸住了在后边的老娘多皱纹的手。\n第9、10、11、12、13 句含褒义的意味,思想\n家、改革家、外交家这些都是在这一领域有一定\n的成就才会被称为某某家,所以在句中用某某家\n来称呼一个人,在意义上就有褒义的意味。第14\n句为贬义,\n“野心家”指的是权力欲极强的人。而\n第15 句是表示这样的一类人,\n“家”的意义完全\n虚化,\n“姑娘家”就等于姑娘,像这样的还有男人\n家、孩子家、妇女家等等。\n四、“ 族、奴、家” 三个表人类词缀感\n情色彩不同的原因\n同样是表人的类词缀,\n“族、奴、家”在感情色\n彩有很大的差异,这与它们的来源、变迁有很大\n的关系。\n“族”作为类词缀的这一用法来源于日本,李\n晓冬在他的论文中提出“族”的这一用法来源于\n日语,后经港台辗转进入普通话[ 9] 19-20。它最早用\n党晓萌,吴媛:浅议表人的类词缀——\n—“族、奴、家”\n51\n·\n·\n[p.5]\n景德镇学院学报\n2018 年第1 期\n于指物,表示事物有某种共同属性的一大类,如\n“水族”,后来引申为指人,表示具有某种共同属\n性的一类人,如“打工族、上班族”。而“~族”词\n汇还有十分重要的语义特征——\n—多带有贬义,由\n于日本人有排斥自己不能理解、不能接受的一类\n人的习惯,在这种传统的集体意识的影响下,日\n本人往往用“~族”来指称那些行为与众不同的\n另类,以此来加以指责和蔑视。因此由“族”组成\n的新词语中有很多表示人的一些与众不同的行\n为与习惯。\n而“族”作为词根义在《现代汉语大词典》中\n有“家族;种族;事物有某种共同属性的一大类”\n之意[ 10] 1738,可以看出来“ 族”在汉语中也有表示\n同一类人之义,只不过表示的是以血缘维系的一\n类人;并且也表示拥有同样特征的一类事物,而\n在字典里也没有表示褒贬之意。\n因此,笔者认为“族”的中性义来自于汉语的\n惯用用法,而贬义则来自于日语的用法。\n“ 奴”在《说文解字》中解释为:\n“ 奴、婢皆古\n之辠人也。从女从又[ 11]卷十二。”“辠人”即罪\n人。此时“奴”的中心语义是奴役。而在《世说新\n语·方正》中提到:\n“(周侯)抚其背曰:\n‘奴好自\n爱。’”其中“奴”即阿奴,是尊对卑、兄对弟的爱\n称。在“奴”走向“~ 奴”的过程中,\n“奴”的意义不\n断受到影响发生变化,\n“~ 奴”指把“~”当作奴隶\n或奴仆。后来“奴”用于妇人谦称,甚至成为一种\n美称、爱称。明清两代宦官及清代旗籍文武官员\n对皇帝自称奴才,清朝皇帝对旗籍官吏亦以奴才\n称之。这时的奴的贬义已经彻底淡化。\n“奴”的最初语义特征[+ 被奴役+ 地位低下\n+ 失去自由+ 受剥削+ 为主服务+ 人]在做表人\n类词缀“~ 奴”的语义特征[—被奴役—地位低\n下—失去自由—受剥削—为主服务+ 人],主要\n表达的是因为“~”生活等被影响的一类人。由\n“奴”组成的这些词有很强的描述性,给人以陌\n生化的词语组成形式。如“猫奴”,之前在人与猫\n的关系之间,人属于主体、支配的地位,猫属于\n客体、被支配的地位,而现在为了体现人对猫喜\n爱、爱护的态度和自己出于对猫的喜爱而不得不\n为猫付出很多的状况,形象地夸大主人是猫的\n奴,给人一种感官上的冲击,造成陌生化形象的\n作用。而“房奴”也一样,主客体位置互换,支配\n与被支配互换,把人在经济重压下的痛苦、无\n奈,为房而到处奔波的状态刻画得十分具体。\n“家”古来有之,《说文解字》中这样解释:\n“居也。从宀,豭省聲[ 10]卷七。”由此可知“家”的\n本义为家庭的住所。之后引申为家庭。而在古代\n户籍管理较为严苛,于是“ 家”带有了一种指称\n身份的意义。《周书》第三十五《君牙》中提到:王\n若曰:\n“呜呼!君牙,惟乃祖乃父,世笃忠贞,服劳\n王家,厥有成绩,纪于太常。句中“王家”指的是\n并不一定是帝王,而是说皇室。之后更渐渐发展\n为表示某一职业的人。这一说法最晚出现于东\n汉。《太平经》卷一百一十四“炫卖所有,更为主\n宾,酒家箕踞,调戏谈笑,歌舞作声,自以为健\n......”《太平经》卷三十五“孝悌人使西向坐,佃\n家谨子使居东南角中西北向坐......”句中的酒家\n指的以卖酒为业的人和店主雇佣的员工,佃家指\n的是租种地主土地的农民。“家”前面所加的名\n词就是这类人职业的内容。再后来,家出现了表\n示人物身份的意义。在《红楼梦》中有这样的用\n法。凤姐道:\n“也未可知,男人家见一个爱一个也\n是有的。”\n“邢夫人纵是铁心铜胆的人,妇女家终\n不免生些嫌隙之心,近日因此着实恶绝凤姐。”\n男人家、妇女家也就指的是男人和妇女,\n“家”在\n这些词中没有任何实际的意义。这一用法又与\n孩子家、姑娘家、学生家这类词相似。由此看来\n现代汉语中“家”的用法主要继承了古代汉语,\n并且没有特别大的创新、发展。\n五、结语\n类词缀作为一类新词在当今社会确实存在\n并受到社会群体的欢迎。以“族、奴、家”这三个\n表人的类词缀为代表,它们大部分形式新颖、语\n义内涵丰富,有极强的修辞色彩,也是我们了解\n社会语言发展的窗口。但是这类词语都是使用\n“ 词语模”[ 12]类推机制产生的,其中不乏媒体和\n网民为求点击率、关注率随意造词,而造成一些\n只求新奇而语义艰涩、词不达意的现象。因此,\n哪些词语可以固定下来,哪些词语会淹没在历史\n中,还得看词语发展规律与社会人群的规范与选\n择。\n52\n·\n·\n[p.6]\n注\n释:\n1本文讨论的是三种表人的类词缀,位置固定、词性明晰,所\n以不讨论类词缀位置是否固定以及是否标注词性;表格中:\n“+++” 表示此种特征完全符合;“++ ” 表示此种特征基本符\n合;“+”表示此种特征一般符合;“— ” 表示此种特征完全不符\n合;“***”表示不讨论此种特征。\n2来源于叶圣陶童话《稻草人》。\n3本文所有古汉语语料引用于北大语料库古代汉语。\n4元岳伯川《铁拐李》第一折。\n5来源于百度百科。\n6“+ ” 表示可以与此类词类搭配;“— ” 表示不可与此类词类\n搭配;字母词本不应与名词、动词、形容词等词类作为同一分\n类,但本文为了兼顾这一现象,因此将字母词纳入在内。\n参考文献:\n[1]黄伯荣,廖序东.现代汉语(增订版)[M]. 北京:高等教育出版\n社,1991 :216.\nOn Quasi-affixes Expressing the Meaning of Human——\n—\"Zu\",\"Nu\",\"Jia\"\nDANG Xiao-meng,WU Yuan\n(School of Chinese Language and Literature, Shaanxi Normal University, Xi'an 710119, Shaanxi province, China)\nAbstract: It is difficult to mark off the boundaries between the affix and quasi-affix, while the quasi-affix is unique. The paper\nwill n研\n究#\n31.2.\n2\n汉语\n词缀、“ 指人” 类词缀的国际中\n文\n教\n学\n研\n究#61.\n3\n语\n料\n来\n源\n#\n91.3.1\n语\n料\n收\n集\n的\n范\n围\n#91.\n3.\n2\n语料的分类\n#1\n0第二章汉语“ 指\n人”\n类\n词\n缀\n的界定与\n分类\n#112.1\n“\n指\n人\n”\n类词缀\n的界定\n#11\n2.1.1汉语词\n缀\n、\n类\n词\n缀\n的性质\n与\n特点\n#11\n2.1.2\n汉语\n“\n指\n人\n” 类词\n缀\n的界定\n#1\n62.1.3\n汉\n语\n“\n指\n人\n”类\n词缀的\n确定#19\n2.\n2\n“指人”类\n词缀的\n分类#26第三章汉语“ 指\n人”\n类\n词\n缀\n的构词、\n语义、\n语用特点#30\n3.\n1\n“\n指\n人”\n类词缀\n的构词特点#30\n3\n.\n2\n“\n指人\n” 类词\n缀的语义特点#31\n3\n.\n3“\n指人”\n类词缀的语用特点#40\n第四\n章\n“\n指人”\n类词缀的国际中文教学现状#45\n4.1\n《国际中文教\n育中\n文\n水\n平\n等\n级\n标准》收录“ 指人\n” 类词\n缀情况#45\n4\n.\n2\n国际\n中文教\n材收录“ 指人” 类词缀情况#4\n8\n4\n.\n3“\n指人”类\n词缀的\n使用偏误类型及原因#5\n3\n4\n.\n3\n.\n1\n“\n指人”\n类词缀的使用偏误类型#\n53\n4.3\n.2\n“ 指人” 类词缀的使用偏误原因\n#\n6\n0\n第\n五\n章\n“\n指\n人\n”\n类\n词\n缀\n的\n国\n际\n中\n文\n教\n学\n建\n议\n#\n6\n5\n[p.9]\nZemN\n硕士学位论文\nMASTER\n'\nSTHESIS\n5\n.\n1对国际中文教材编写的建议\n#\n6\n5\n5.2对国际中文教师的教学建\n议\n#\n6\n7\n5.3对母语非汉语学习者的学习\n建议\n#\n69\n第六\n章“指人”类词缀的\n教学\n设\n计\n#71\n第七\n章\n结语#8\n9\n参\n考文\n献#9\n1\n附\n录\n#94\n致\n谢\n#\n9\n5\n[p.10]\n?\n硕士学位论文\nMASTER\n'\nSTHESIS\n第\n一章绪论\n1\n.1选题缘由\n、研究意义和研究思路\n1\n.1\n.1选题缘由\n邢福义在\n《现代汉语》\n(201\n1\n)\n中提出\n,\n语素是最小的音义结合体\n,\n是构成\n词的语言单位\n;\n词是具有\n一定语音形式且能独立运用的最小的语言单位\n。\n对汉语\n成词结果进行语素分析\n,\n则根据构成语素的多少\n,\n汉语词可以分为单纯词与合成\n词两类\n。\n其中\n,\n合成词是指由两个或两个以上的语素按照\n一定的结构方式和语义\n关系组合而成的词\n。\n合成词中能够表示基本词汇意义的语素被称为词根\n,\n如\n“ 工\n人\n工+人\n”\n“ 火箭\n-火+箭\n”\n“ 生命\n-生+命\n” 等\n。\n有的语素意义相对而言不那么实\n在\n,\n只能附着在词根成分之上\n,\n表示某种附加意义\n,\n这种语素被称为词缀\n,\n如\n“ 老师\n-老\n”\n“ 兔子\n-子\n”\n“ 盖儿\n-儿\n” 等\n。\n现代汉语中\n,\n词缀多是\n一种形态标志\n,\n它在汉语的构词中\n一般都是定位的\n,\n根据其在合成词中出现位置的不同\n,\n词缀可分为前缀\n、\n中缀和后缀\n。\n如\n:\n“ 老虎\n”\n是前缀加词根\n,\n“ 想\n一想\n”\n中的\n“\n一\n” 是中缀\n,\n“ 桌子\n” 是词根加后缀\n。\n现代汉\n语里\n,\n构词的语法形式主要包括前缀和后缀\n,\n它们有构成新词的作用\n,\n并且往往\n起标记词类的作用\n。\n然而\n,\n不少学者注意到\n,\n现代汉语中除词缀之外\n,\n还存在大量意义虚化程度\n既不如词缀\n、\n同时意义实在程度也不如词根\n、\n介于二者之间的\n一种特殊语言成分\n,\n我们暂且将其命名为\n“ 类词缀\n”\n。\n陈光磊在\n《汉语构词法》\n(\n1994\n)\n中提出\n,类词\n缀是现代汉语词在缀化过程中出现的\n一种语义尚未最后完成虚化的词缀\n,\n是\n一种\n“ 准词缀\n” 或\n“ 副词缀\n”\n,\n或称\n“ 预备词缀\n”\n。\n尹海良在\n《现代汉语类词缀研究》\n(20\n1\n1\n)\n中谈到\n,如果把词汇系统视为\n一个发展变化的动态过程\n,\n“ 类词缀\n” 就是\n在构词语素层级内出现的\n、\n处于实语素与虚语素之间的构词成分\n。\n总而言之\n,\n类\n词缀的存在说明了汉语语言始终处在不断变化发展的过程中\n。\n目前\n,\n己为大多数\n学者所承认的典型类词缀主要有\n“ 超\n-\n、\n反\n、\n准\n-\n、\n类\n-\n、\n-化\n、\n-型\n、\n-家\n、\n-式\n”\n等\n。\n由于汉语属于语言学中的孤立语\n,\n并无严格意义上的形态变化\n,\n其主要语法\n手段为语序和虚词\n,\n这\n一点对母语非汉语学习者按照其母语中有规律的词形变化\n形式对汉语词汇进行类推记忆造成\n一定的困扰\n,\n表现在其二语习得过程中\n,\n母语\n非汉语学习者在\n“ 词根+类词缀\n” 构成的派生词运用方面会出现各种不同的错误或\n者偏误\n,\n如\n:\n1\n[p.11]\n硕士学位论文\nMASTER\n'\nSTHESIS\n(\n1\n)\n有\n一次\n,\n车上的人很多很拥挤\n,\n觉得都不能呼吸了\n,\n可是每到\n一站\n,\n都会接着上来\n半夸\n,\n在\n一个站点儿\n,\n上来\n一位白发老大爷\n,\n他就站在我的旁边\n。\n(2\n)\n他是我听过有名的学,專\n。\n(3)_年千都很亲切\n。\n(语料选自全球汉语中介语语料库\n1\n.\n0\n)\n近年来\n,\n汉语新词族的\n一个重要产生方式源于\n“ 词根+类词缀\n”\n的构词方式\n,\n类词缀所具有的\n一些特点如能产性\n、\n类推性等在\n一定程度上可以帮助母语非汉语\n学习者学习和掌握汉语新词的构成方式\n,\n同时能够帮助母语非汉语学习者扩大自\n身汉语词汇量\n。\n然而\n,\n王洪君在\n《试论现代汉语的类词缀》\n(2005\n)\n中明确指出\n:\n类词缀在对外汉语教学中尚未受到重视\n。\n因此\n,\n我们在前人研宄基础上\n,\n选取汉\n语类词缀的其中\n一种\n一一汉语\n“ 指人\n” 类词缀进行研宄\n,\n希望能够进\n一步完善现\n代汉语词汇系统\n;\n此外\n,\n我们将汉语\n“ 指人\n” 类词缀与国际中文教学相结合\n,\n从\n教材编写\n、\n教师教学\n、\n学生学习三个方面对汉语\n“ 指人\n” 类词缀语法点的收纳\n、\n教学与学习提供了针对性建议\n,\n并围绕母语非汉语学习者的高频偏误\n“ 指人\n” 类\n词缀进行教学设计\n,\n以期能够促进国际中文词汇教学工作的发展\n。\n1丄2研究意义\n汉语类词缀是语义部分虚化\n、\n语义具有粘附性与类化性\n、\n同时构词具有定位\n性与能产性的相对不成词语素\n,\n汉语\n“ 指人\n” 类词缀是根据其语义内容对类词缀\n进行分类所得到的\n一个结果\n。\n由于汉语\n“ 指人\n” 类词缀是语言不断发展变化的产\n物\n,\n处在动态过程中\n,\n因此其数量和范围均不易确定\n,\n同时汉语\n“ 指人\n” 类词缀\n具有较强的构词能产性与语义类化性\n,\n既丰富了现代汉语词汇系统\n,\n又体现了汉\n语构词的理据性\n,\n同时折射出当代社会独特的文化心理\n。\n但是在国际中文教学中\n,\n对母语非汉语学习者而言\n,\n由\n“ 指人\n” 类词缀附加在词根之后所构成的新词具有\n什么样的特点\n、\n如何区分和记忆不同\n“ 指人\n” 类词缀的语素义及构成新词语后的\n词汇融合意义\n、\n如何利用\n“ 指人\n” 类词缀进行正确类推构词等都是当前国际中文\n教学所面临的问题\n。\n据此\n,\n本文通过对前人所著汉语词汇学\n、\n语法学专著及近十年期刊文献中汉\n语\n“ 指人\n” 类词缀的研宄状况进行梳理\n,\n分析汉语\n“ 指人\n” 类词缀的性质和特点\n,\n进\n一步完善汉语\n“ 指人\n” 类词缀的本体研宄\n,\n利用对比分析和偏误分析理论对母\n语非汉语学习者在使用\n“ 指人\n” 类词缀进行构词的过程中所出现的偏误及原因进\n行整理与分析\n,\n在此基础上提出国际中文教学相关建议\n,\n并针对\n“ 指人\n” 类词缀\n使用偏误进行教学设计\n,\n期望能够为国际中文词汇教学提供\n一定的帮助\n。\n2\n[p.12]\n硕士学位论文\nMASTER\n'\nSTHESIS\n1\n.1\n.3研究思路\n本文研宄思路在于将文献\n、\n古代汉语词典\n、\n现代汉语词典\n、\n教学大纲\n、\n国际\n中文教材及母语非汉语学习者使用偏误语料相结合\n,\n对汉语\n“ 指人\n” 类词缀进行\n理论研宄与教学应用研宄\n。\n首先\n,\n我们通过阅读大量文献对汉语词缀\n、类词缀研究现状进行梳理\n,\n从中\n提取合理观点作为本文的理论支撑\n。\n其次\n,\n基于前人研宄成果\n,\n结合类词缀\n、\n“ 指人\n” 类词缀特点\n,\n对\n“ 指人\n” 类词缀作出界定标准\n,\n明确\n“ 指人\n” 类词缀数\n量\n。\n第三\n,\n根据针对国际中文教师教材使用情况所进行的问卷调查结果\n,\n选取当\n前国际中文教育中适用范围教广\n、\n通行时间较长的两套综合类国际中文教材\n《博\n雅汉语\n》\n和\n《HSK标准教程\n》\n,\n结合\n《国际中文教育中文水平等级标准\n》\n(202\n1\n)\n,\n对汉语\n“ 指人\n” 类词缀的收纳与成词数量进行考察\n,\n明确当前国际中\n文教学中\n“ 指人\n” 类词缀语法点设置\n、\n收纳与成词情况\n。\n第四\n,\n利用全球汉语中\n介语语料库\n1\n.0对母语非汉语学习者的使用偏误语料进行搜集与整理\n,\n对使用偏误\n进行分类\n,\n运用对比分析分理论和偏误分析理论对偏误原因进行探宄\n,\n在此基础\n上进\n一步对国际中文教材\n、\n国际中文教师及母语非汉语学习者提出教材编写\n、\n教\n师教学和学生学习建议\n。\n最后\n,\n根据所搜集到的汉语\n“ 指人\n” 类词缀使用偏误情\n况\n,\n结合其构词\n、\n语义\n、\n语用特点\n,\n在国际中文教学原则和教学方法等指导下围\n绕初等\n“ 指人\n” 类词缀进行教学设计\n,\n以期能够帮助国际中文教师提高汉语词汇\n教学能力与母语非汉语学习者词汇习得能力\n。\n本文的创新点首先在于对母语非汉语学习者使用偏误语料的选择\n。\n全球汉语\n中介语语料库\n1\n.0\n由北京语言大学开发\n,\n其设计总规模为五千万字\n,\n包含口语语料\n和书面语语料\n,\n该语料库采取动态建设策略\n,\n目前语料仍在持续增加与标注\n,\n且\n系统具有实时统计功能\n,\n这对我们探宄当前母语非汉语学习者使用\n“ 指人\n” 类词\n缀进行构词的能力与偏误情况提供了即时语料\n。\n其次\n,\n本文在对汉语\n“ 指人\n” 类\n词缀的构词\n、\n语义\n、\n语用特点进行分析后\n,\n结合母语非汉语学习者的使用偏误情\n况和对国际中文教师的认知问卷调查结果\n,\n对教材\n、\n教师和学习者提供针对性建\n议\n,\n并在母语非汉语学习者偏误语料考察基础之上对\n“ 指人\n” 类词缀进行教学设\n计\n,\n用以指导国际中文教师的词汇教学\n。\n1\n.2\n“指人\n” 类词缀研究的相关文献综述\n1\n_2\n_1汉语词缀、\n“指人\n,,类词级研究\n目前\n,\n有不少论著都提到了类词缀\n。\n当代中国社会经济髙速发展\n,\n新鲜客观\n3\n[p.13]\n硕士学位论文\nMASTER\n'\nSTHESIS\n事物的产生影响人们的认知现状\n,\n在语言上表现为类词缀在人们日常生活中的使\n用频率越来越高\n,\n并且不断有新的类词缀产生\n。\n但是对于什么是类词缀\n、类词缀\n分为哪几类\n、\n类词缀具有哪些特征\n、\n范围有多广\n,\n汉语学界诸多学者对此持不同\n看法\n。\n根据我们对前人所著相关文献的搜集\n、整理与分析\n,\n我们将汉语类词缀的\n研宄历史大致划分为三个阶段\n,\n分别为\n:\n起始阶段、\n发展阶段、深入阶段\n。\n(\n一\n)起始阶段\n(20世纪\n80年代以前\n)\n目前我们可以追溯到的关于汉语词缀的最早研宄出自\n1898年\n《马氏文通》\n,\n作者从汉语语法和汉语构词法两个角度出发对汉语词缀进行了初步探宄\n,\n提出\n“ 前加\n”\n“ 后加\n” 等术语\n。\n1919年\n,\n薛祥绥在\n《中国言语文字说略》\n中首次引用了西方语言学理论中的\n术语\n“ 语根\n” 和\n“ 语系\n”\n,\n1920年\n,\n胡适在\n《说儒》\n中首次谈到\n“ 语尾\n”\n,\n1923\n年\n,\n黎锦熙在\n《新著国语文法》\n中使用了\n“ 语头\n”“ 语尾\n”\n(或称\n“ 词尾\n”\n)\n。\n1930年\n,\n杨树达在\n《髙等国文法》\n中将汉语助词分为\n“ 语首助词\n”\n“ 语中助\n词\n” 和\n“ 语末助词\n” 三类\n,\n并首次在\n“ 语末助词\n” 分类列表\n“ 焉\n” 下提出\n“ 助词\n为副词或形容词之语尾\n” 这\n一观点\n,\n认为可做\n“ 语尾\n” 的助词包括\n“ 焉\n”“ 乎\n”\n“ 尔\n”\n“ 而\n”\n“ 然\n”\n“ 斯\n” 等\n。\n193\n1年\n,\n瞿秋白在\n《普通的中国话字眼的研宄》\n中提出了附加构词法\n,\n如在\n字根的后面加上\n一种口头的字尾\n。\n这种构词法体系由\n“ 字根\n” 和\n“ 字尾\n” 两部分\n组成\n,\n其中的\n“ 字根\n” 和\n“ 字尾\n” 相当于现在普通语言学当中的\n“ 词根\n” 和\n“ 后\n缀\n”\n。\n1942年\n,\n吕叔湘在\n《中国文法要略》\n中论述\n“ 字和词\n” 的关系时\n,\n以\n“ 院子\n”\n为例\n,\n说明\n“ 院子\n” 是\n一个词\n,\n词是最小的表现单位\n。\n其中\n,\n“ 院\n” 是\n“ 院子\n”\n一词中最小的意义单位\n,\n可称为\n“ 词根\n”\n,\n“ 子\n” 在\n“ 院子\n”\n一词中只起辅助造\n词作用\n,\n其本身并无实在意义\n,\n可称为\n“ 词尾\n”\n。\n之后又在论述\n“ 词尾\n” 时提到\n“ 有\n一类复词\n,\n是在\n一个词根后头附加\n一个词尾的\n”\n,\n并以物件的名称进行举例\n说明\n。但\n“ 词尾\n” 的提出在当时并未引起汉语学界学者的关注\n。\n1943年\n,\n王力在\n《中国现代语法》\n中将\n“ 桌子\n”“ 石头\n”\n中的\n“ 子\n”“ 头\n”\n这\n一类的字叫做\n“ 记号\n”\n,\n并认为\n“ 记号\n” 是\n一种附加成分\n,\n表示词或仂语的性\n质\n。\n1945年\n,\n王力又在\n《中国语法理论》\n中提出\n,\n随着中国语的大进化\n,\n词类的\n记号大量增加\n,\n并进\n一步提出\n“ 前附号\n” 和\n“ 后附号\n” 的说法。\n1961年\n,\n丁声树\n、\n吕叔湘在\n《现代汉语语法讲话》\n中提到\n“ 汉语当中有\n一些\n4\n[p.14]\n/wEn\n硕士学位论文\nMygMMASTER\n'\nSTHESIS\n字总是附在\n一个词的前面或后面\n”\n,\n附在前面的叫做\n“ 词头\n”\n,\n附在后面的叫做\n“ 词尾\n”\n。\n但是二位学者当时只将\n“ 着\n”\n“\n了\n”\n“ 的\n” 视为词尾进行浅谈\n,\n未对\n“ 准\n”“ 化\n”“ 然\n” 等进行进\n一步探究\n。\n1962年\n,\n吕叔湘在其著作\n《说\n“\n自由\n” 和\n“ 黏着\n”\n》\n中又\n一次强调\n,\n汉语当\n中存在\n一些特殊成分\n,\n它们近似于词尾\n,\n并列举出\n“ 家\n”\n“ 人\n”\n“ 界\n” 等例子进\n行举证\n,\n但在当时仍未能引起汉语学界学者的关注\n。\n1979年\n,\n吕叔湘在\n《汉语语法分析问题》\n中明确提出\n“ 类前缀\n” 和\n“ 类后缀\n”\n的概念\n,\n并列举\n“ 类\n“ 可\n“ 亚\n等近似前缀的语素进行说明\n。\n至此\n,\n类词\n缀才引起人们的关注\n。\n总之\n,\n起始阶段的汉语类词缀研究\n一定程度上是对汉语词缀研究的新突破\n,\n但是类词缀与词缀\n、\n类词缀与实词语素之间的区别与联系尚未得到进\n一步的辩证\n分析\n,\n且\n一部分学者在这\n一时期对\n“ 类词缀\n” 概念的提出持怀疑态度\n。\n(二\n)发展阶段\n(20世纪\n80年代\n)\n类词缀的研宄在二十世纪八十年代进入发展阶段\n,\n这\n一阶段的研宄内容主要\n涉及词缀与类词缀的划分界限\n、\n类词缀与\n“ 准词头\n” 及\n“ 准词尾\n”\n的名称区分\n、\n类词缀与词缀的关系\n、\n汉语新词缀化倾向及特点等\n,\n不同学者从共时与历时\n、\n个\n体与集体等多个角度对类词缀进行了较为全面的分析\n,\n主要研究成果有\n:\n张静主\n编的\n《新编现代汉语》\n(\n1980\n)\n,\n任学良\n《汉语造词法》\n(\n1981\n)\n,\n朱茂汉\n《后\n缀\n“ 子\n”\n“ 儿\n”\n“ 头\n”\n》\n(\n1982\n)\n,\n郭良夫\n《现代汉语的前缀和后缀》\n(\n1983\n)\n,\n等等\n。\n(三\n)深入阶段\n(20世纪\n90年代至今\n)\n二十世纪九十年代至今为类词缀研宄的深入阶段\n,\n这\n一时期学者们意识到汉\n语词缀内部存在复杂性与多样性\n,\n对类词缀的存在进行了肯定\n,\n并在前人研宄基\n础上进行更深入的研究\n。这\n一时期的研究成果在研究方法和研宄领域上都具备\n一\n定的创新性\n,\n有力推动了类词缀从现代汉语本体领域研究向国际中文教学领域研\n宄的过渡\n,\n这\n一时期的主要研究成果有\n:\n王绍新的\n《谈谈后缀》\n(1992\n)\n,\n陈光\n磊\n《汉语词法论》\n(\n1994)\n,\n沈梦璎\n《再谈汉语新的词缀化倾向》\n(\n1995\n)\n,\n徐\n世璇\n《汉藏语言的派生构词方式分析》\n(\n1999\n)\n,\n汤志祥\n《当代汉语词语的共时\n状况及其嬗变》\n(2001\n)\n,\n王洪君\n、\n富丽\n《试论现代汉语的类词缀》\n(2005\n)\n,\n尹海良\n《现代汉语类词缀研宄》\n(2007\n)\n,\n曾丽英\n《现代汉语类词缀的定性与定\n量分析》\n(2008\n)\n,\n等等\n。\n随着学者们对汉语词缀\n、\n类词缀研宄的不断深入\n,\n汉语类词缀的\n一些性质\n、\n5\n[p.15]\n/Sf\nix\n硕士学位论文\nMASTER\n’\nSTHESIS\n特点及下属类别\n,\n如\n“ 指人\n” 类词缀\n,\n引起了诸多学者的兴趣\n,\n并以此为研宄对\n象进行了汉语本体层面的类词缀研宄\n,\n目前己有的研宄成果主要有\n:\n李伟大\n《\n“ X花\n”\n的语义语法特征\n一\n一兼论指人类词缀\n“ 花\n” 的主观性》\n(2009\n)通过对\n“ X花\n” 词语模式进行语义\n、\n语法特征分析\n,\n明确了其语义指向\n。\n王春娇\n《现代汉语新兴指人\n“ 类词缀\n” 研宄》\n(201\n1\n)从共时与历时\n、\n静态\n与动态等多个角度对汉语新兴指人类词缀的构词特点和产生途径进行探宄\n,\n并预\n测了新兴\n“ 指人\n” 类词缀未来\n一段时间内的发展趋势\n。\n王周\n《类词缀\n“ 族\n”“ 党\n”“ 迷\n”“ 控\n” 研宄》\n(2013\n)从不同渠道对现代\n汉语\n“ 指人\n” 类词缀进行搜集\n,\n并运用横向对比\n、\n纵向对比等不同研宄方法对其\n特征进行分析\n。\n战怡如\n《现代汉语指人类词缀的多维度考察》\n(2015\n)通过检索语料库与搜\n集网络语料\n,\n确定词义\n、\n形式和功能为\n“ 指人\n” 词缀\n、\n类词缀的界定标准\n,\n确定\n了\n“ 指人\n” 类词缀数量\n,\n分析了汉语语言系统的未来发展趋势\n。\n张璐\n《痴迷型指人类后缀\n“ 迷\n” 三个平面的研宄》\n(2019\n)\n选取汉语\n“ 指人\n”\n类后缀中语义为痴迷型的类词缀为研宄对象\n,\n对其构词模式进行语法\n、\n语用特点\n两个方面的描写与分析\n。\n以上对汉语\n“ 指人\n” 类词缀的研究主要集中在选取个别汉语\n“ 指人\n” 类词缀\n进行语法和语义分析\n,\n从而揭示其在性质\n、\n特点\n、\n功能上与汉语缀\n、\n实词语素之\n间的区别与联系\n,\n较少涉及对\n“ 指人\n” 类词缀构词及语用特点的研宄\n,\n对\n“ 指人\n”\n类词缀的起源\n、\n发展与演变尚未能够进行完整的探宄\n。\n1\n.2.2汉语词缀、\n“指人\n” 类词缀的国际中文教学研究\n随着国际中文教学事业的飞速发展\n,\n越来越多的学者开始将类词缀与国际中\n文教学相结合进行研宄\n,\n丰富了国际中文教学中类词缀的研宄成果\n。\n尹海良\n《现代汉语类词缀研宄》\n(2007\n)\n以国际中文教学中的两个大纲为语\n料来源\n,\n抽取所收录的全部汉语类词缀及相应的派生构词结果\n,\n指出大纲在类词\n缀收纳上存在的主要问题\n,\n论述了类词缀的语法功能以及如何通过掌握其功能以\n提高母语非汉语学习者对汉语派生词的习得能力\n。\n张爱武\n《现代汉语词缀问题研宄》\n(2008\n)在对汉语合成词进行字义分析后\n,\n提出汉字是构成合成词的基础\n,\n认为国际中文词汇教学应结合汉语自身特点\n、在\n强化汉字的基础教学的同时也要遵循由字到词的渐进式教学原则\n。\n杜旭东\n《论对外汉语中的类词缀教学》\n(201\n1\n)选取国际中文教学中的两个\n通用大纲以及部分国际中文教材进行类词缀考察\n,\n并对类词缀的教学方法进行分\n6\n[p.16]\n硕士学位论文\nMASTER\n'\nSTHESIS\n析\n,\n丰富了国际中文课堂教学中类词缀的教学方法\n。\n潘显丽\n《〈HSK大纲〉类词缀\n(后缀\n)\n常用搭配分析》\n(2012\n)通过对前人文\n献的分析确定了类词缀\n(后缀\n)数量\n,\n结合\n《汉语水平考试大纲》对类词缀\n(后\n缀\n)\n的常用搭配成分进行统计分析\n,\n在此基础上整理出两份用于国际中文教学的\n词语表\n,\n为母语非汉语学习者学习和掌握类词缀\n(后缀\n)\n的使用特点与构词规律\n提供了参考\n。\n王小曼\n《面向对外汉语教学的类词缀研究》\n(2013\n)对国际中文教学中的两\n套通用大纲及部分教材所收录类词缀进行考察\n,\n分析类词缀归类情况\n、\n出现频率\n和数量\n,\n并通过问卷调查总结出学习者在类词缀习得和使用时产生的偏误类型\n,\n分析偏误产生原因\n,\n在此基础上对汉语教师提出相应教学方法\n。\n谢祎坤\n、\n曾立英\n《类词缀对外汉语教材中的运用》\n(20\n14)\n选取四套国际中\n文教材进行考察\n,\n分析了类词缀语法点设置在国际中文教材中的有益作用和不利\n影响\n,\n以指导国际中文教材的编写\n。\n杨斌\n、\n高飞\n《基于语料库的汉语类词缀教学研究》\n(2016\n)\n对近五年的\n《人\n民日报》文本进行分析\n,\n统计得到\n《等级划分》\n中\n14个类词缀所造派生词共计\n9357个\n。\n结合类词缀在语义上表现出类属性\n、\n具有范畴义的语义特征\n,\n提出类词\n缀的汉语教学方法\n。\n此外\n,\n作者构建了\n一份带有等级标记的\n《类词缀常用派生词\n词表》\n,\n一定程度上为类词缀的国际中文教学提供了帮助\n。\n徐朝晖\n《留学生汉语类词缀习得偏误和教学策略探讨》\n(20\n18\n)\n通过对留学\n生习得词缀时出现的偏误情况进行分类\n,\n对偏误原因进行分析\n,\n在偏误分析基础\n上对类词缀的课堂教学提出了针对性的教学方法\n。\n贾泽林\n《汉语类词缀的新词生成能力及对外汉语教学研宂》\n(20\n19\n)对现代\n汉语类词缀构成新词时的具体表现进行分析\n,\n总结出类词缀构词具有动态性\n、\n理\n据性等特征\n,\n提出在国际中文词汇教学中教师应对类词缀进行准确释义\n,\n在教学\n对象能够理解语素义的情况下引导学习者利用汉语词汇的类推机制进行正确造词\n。\n杨向熠\n《汉语类词缀的语义逻辑机制分析及其对外汉语教学方法研究\n》\n(2020\n)运用结构分析方法对汉语类词缀产生的语义和语法机制进行分析\n,\n对母\n语非汉语学习者更准确地运用类词缀进行构词具有辅助作用\n。\n以上学者对汉语类词缀的研宄主要具有以下两个特点\n:\n一是将汉语类词缀与\n国际中文教学相结合\n,\n将国际中文教学中所涉及的几个教学大纲\n、\n词汇大纲与汉\n语类词缀结合起来进行研宄\n,\n探究国际中文词汇教学中汉语类词缀的部分语义\n、\n功能特点与教学方法\n,\n?\n二是从偏误的角度对母语非汉语学习者的偏误语料进行分\n7\n[p.17]\n硕士学位论文\nMASTER\n'\nSTHESIS\n析\n,\n对母语非汉语学习者在汉语类词缀的使用过程中所出现的\n一些偏误语料进行\n分类整理\n,\n从而有针对性的提出教学策略\n,\n一定程度上丰富了国际中文词汇教学\n。\n同时也存在以下两个问题\n:\n一是语料的选取范围较为狭窄\n,\n未能与国际中文教材\n相结合\n;\n二是所论述的汉语类词缀缺乏全面性\n,\n未能将汉语本体研宄与类词缀的\n国际中文教学研宄相结合\n,\n在汉语类词缀的分类与教学方法上需要进行进\n一步的\n细化与补充\n。\n此外\n,\n将汉语\n“ 指人\n” 类词缀与国际中文教学相结合所进行的研宄主要有\n:\n徐艾妮\n《基于第二语言教学的现代汉语指人类后缀研宄》\n(2012\n)选取国际\n中文教学大纲\n、\n国际中文教材\n、\n新媒体等作为\n“ 指人\n” 类后缀语料搜集的主要渠\n道\n,\n根据人们对\n“ 指人\n” 类后缀使用频率的高低\n,\n将类后缀分为开放式和半开放\n式两种类型\n,\n对其组合特征进行分析\n,\n并以此为基础对母语非汉语学习者进行认\n知\n、\n运用等情况考察\n。\nMelliseUt\nomo(吴淑英\n)\n《中高级印尼学生汉语指人词缀习得情况研宄》\n(2014)将类词缀划入词缀范畴中\n,\n并选取了16个汉语\n“ 指人\n” 类词缀\n,\n将其与\n印尼语中的\n“ 指人\n” 类词缀进行对比\n,\n从产生途径、\n构词表现\n、\n语义等方面进行\n分析\n,\n并利用问卷调查法对中高级印尼学生在\n“ 指人\n” 类词缀的习得能力进行了\n考察\n,\n搜集学生偏误语料并进行偏误分析\n,\n在此基础上提出教学建议\n。\n习拓\n《对泰汉语指人类词缀教学研宄\n一一以\n“ 们\n”\n、\n“ 家\n”\n、\n“ 员\n” 等九个\n指人类词缀为例》\n(2018\n)\n以\n《汉语水平等级标准与语法等级大纲》\n中收纳的九\n个\n“ 指人\n” 类词缀为研宄对象\n,\n结合泰国学习者偏误语料与偏误类型\n,\n运用偏误\n分析理论对学习者偏误原因进行分析\n,\n在此基础上提出教学建议\n。\n_琪\n《现代汉语指人类词缀研宄及在教学中的应用\n》\n(2019\n)在广泛搜集语\n料的基础上\n,\n对\n“ 指人\n” 类词缀范围\n、\n数量进行确定\n,\n在语料库语言学理论\n、\n偏\n误分析理论指导下对留学生的偏误语料进行整理与分类\n,\n探宄偏误原因\n,\n并在此\n基础上对国际中文教学提出相关建议\n。\n总之\n,\n目前己有的与国际中文教学相关的汉语\n“ 指人\n” 类词缀研宄内容主要\n集中在\n“ 指人\n” 词缀与类词缀的界定\n、\n“ 指人\n” 类词缀的产生途径与语义特点\n、\n母语非汉语学习者偏误语料分析等方面\n,\n而对\n“ 指人\n” 类词缀的构词特点\n、\n语用\n特点\n、\n围绕\n“ 指人\n” 类词缀所进行的国际中文词汇教学设计等方面的研宂较为狭\n窄\n,\n且对当前国际中文教师对\n“ 指人\n” 类词缀的认知情况缺乏调查\n,\n我们认为在\n“ 指人\n” 类词缀的国际中文教学研宄方面仍存在可进\n一步补充\n、完善的空间\n。\n8\n[p.18]\n/pm\\\n硕士学位论文\nMASTER\n'\nSTHESIS\n1\n.3语料来源\n1\n.3\n.1语料收集的范围\n我们坚持从汉语本体研宄出发\n,\n结合国际中文教学实际情况对语料进行收集\n。\n首先\n,\n我们选取九部具有详实参考意义的汉语学专著\n,\n提取其中所收纳的具\n有指人义的构词语素\n,\n同时借助中国知网进行期刊文献检索\n,\n抽取\n15篇发表于\n201\n1\n-202\n1十年间的期刊文献\n,\n提取其中所收纳的具有指人义的构词语素\n,\n初步确\n定语料研宄范围\n。\n其次\n,\n我们根据汉语词缀\n、\n类词缀的性质与特点\n,\n结合前人研宄成果以及现\n代汉语\n、\n古代汉语工具书对每\n一个构词语素的释义\n,\n对汉语\n“ 指人\n” 类词缀提出\n四条界定标准\n,\n并最终确定本文要探宄的汉语\n“ 指人\n” 类词缀数量为\n54个\n:\n控\n、\n族\n、奴\n、\n党\n、客\n、\n哥\n、\n姐\n、\n迷、手\n、\n帝\n、\n家\n2\n、\n妹\n、\n师\n、\n员\n、\n嫂\n、\n婶\n、\n霸\n、\n虫\n、\n棍\n、\n星\n、\n花\n、\n爷\n、\n友\n、\n户\n、生\n、\n士\n、\n粉\n、\n鬼\n、\n徒\n、\n弟\n、\n汉\n、\n盲\n、\n叔\n、\n蛋\n、\n夫\n、\n货\n、\n精\n、\n佬、派\n、\n神\n、犯\n、\n长\n、\n痴、\n丁\n、贩\n、\n豪\n、\n狂、\n魔\n、农\n、婆\n、\n仔\n、\n宅\n、\n王\n、\n才、\n第三\n,\n由于本文与国际中文教学密切相关\n,\n为体现语料的客观性与全面性\n,\n我们首先对\n《国际中文教育中文水平等级标准》\n中\n《词汇表》所收录的\n“ 指人\n”\n类词缀项目\n、数量与成词情况进行考察与分析\n,\n其次利用问卷对\n70位国际中文教\n师围绕教材使用情况\n、\n类词缀认知情况\n、\n类词缀教学方法等方面进行调查\n,\n选取\n《博雅汉语》全套教材学生课本及\n《HSK标准教程》全套教材学生课本对\n“ 指人\n”\n类词缀的收纳情况进行考察\n,\n最后将国际中文教学标准与国际中文教材进行横向\n对比\n,\n分析国际中文教学中\n“ 指人\n” 类词缀语法点设置与项目收纳上存在的主要\n问题\n。\n最后\n,\n为探究母语非汉语学习者对汉语\n“ 指人\n” 类词缀的习得与运用情况\n,\n我们借助全球汉语中介语语料库\n1\n.0抽取母语非汉语学习者的偏误语料\n,\n对学习者\n偏误语料进行分类\n,\n探宄偏误成因\n。\n综上所述\n,\n本文语料与数据主要有以下几个来源\n:\n(\n1\n)汉语学专著\n。\n(2)近十年\n(201\n1\n-2021\n)汉语\n“ 指人\n” 类词缀相关期刊文献\n。\n(3\n)\n《辞源》\n(第三版\n)\n、\n《现代汉语规范词典》\n(第\n3版\n)\n。\n(4\n)\n《博雅汉语》全套教材学生课本\n、\n《HSK标准教程》全套教材学生课本\n、\n《国际中文教育中文水平等级标准》\n。\n(5\n)\n全球汉语中介语语料库\n1\n.0\n。\n9\n[p.19]\n硕士学位论文\nMASTER\n'\nSTHESIS\n1\n.3\n.2语料的分类\n陆俭明\n(2004\n)\n认为\n,\n人类认识客观世界的\n一种最基本的方法就是分类\n。\n@因\n此我们需要先根据研宄对象的基本特征进行分类\n,\n明确研宄对象在各个方面所存\n在的不同表现\n,\n以此为基础进行更深\n一步的研宄\n。\n为更全面地认识汉语类词缀\n,\n前人从不同角度出发对其进行了分类\n,\n由此可以得到不同的分类结果\n。\n如\n,\n陈光\n磊在\n《汉语词法论》\n(\n1994\n)\n中根据类词缀与词根成分在合成词中所处位置的相\n对稳定特点\n,\n将类词缀分为类前缀和类后缀两类\n;\n尹海良在\n《现代汉语类词缀研\n宄》\n(201\n1\n)\n中从构词能力\n、\n使用频率\n、\n产生途径\n、\n所处位置\n、\n音节数量等五种\n不同角度对类词缀特点进行考察\n,\n并得到能产型和非能产型\n、\n高使用度型和低使\n用度型\n、\n自源型和他源型\n、类前缀和类后缀\n、\n单音型和双音型五种分类结果\n。\n汉语\n“ 指人\n” 类词缀是根据类词缀与词根相结合后所体现的意义为标准进行\n分类所得出的汉语类词缀之下的\n一个小类\n,\n根据目前我们所搜集到的语料\n,\n我们\n发现汉语\n“ 指人\n” 类词缀在合成词中的位置相对词根成分而言基本上都是后加式\n。\n因此我们在对所要探宄的\n“ 指人\n” 类词缀进行分类时\n,\n将主要从\n“ 指人\n” 类词缀\n的构词能力\n、\n语义指向\n、\n情感色彩三个角度对\n“ 指人\n” 类词缀进行分类\n。\n1陆俭明.\n现代汉语语法研究教程[M]\n.\n北京:\n北\n京大学出版社,\n2\n004.\n10\n[p.20]\n/pm\\\n碩士学位论文\nMASTER\n'\nSTHESIS\n第二章汉语\n“指人\n” 类词缀的界定与分类\n2.1\n“指人\n” 类词缀的界定\n尽管现代汉语词缀研宄硕果累累\n,\n然而\n,\n马庆株\n(\n1995\n)\n认为\n,\n在现代汉语\n各级语法单位中\n,\n对词缀的认识分歧和术语分歧是最大的\n。\n?随着现代汉语词汇系\n统的不断丰富与扩展\n,\n汉语词汇系统中出现了\n“ 类词缀\n” 这\n一特殊语言成分\n,\n类\n词缀的产生在\n一定程度上体现出汉语当中运用加缀法理论所出现的\n一些困难\n。\n从\n动态的角度来看\n,\n合成词的结构形式是\n一个持续变化的历史过程\n,\n类词缀处于\n“ 词缀\n一一词根\n” 这个\n“ 连续统\n”\n中\n,\n它作为\n一种过渡成分\n,\n始终介于词缀与词\n根之间\n,\n因此类词缀的界定\n、\n数量与范围难以确定\n。\n李茜在\n《汉语新词语类词缀\n及其对外汉语教学研宄》\n(202\n1\n)\n中提出\n,\n从语义角度出发\n,\n汉语类词缀的语义\n类型可以分为指人\n、\n指程度\n、\n指心理活动等六种类型\n。\n本章我们将结合汉语词缀\n、\n类词缀的性质与特点对汉语\n“ 指人\n” 类词缀作出界定\n,\n明确汉语\n“ 指人\n” 类词缀\n的数量与范围\n。\n2.1\n.1汉语词缀v类词缀的性质与特点\n西方语言学理论认为语言中的词尾可以分为两类\n:\n构词词尾\n(der\nivative\n)\n和\n构形词尾\n(\ninf\nlective)\n。\n陈刚在\n《建立中国文法体系的基本问题》\n(\n1946\n)\n中首次\n提出汉语不但有\n“ 推出语\n(der\nivatives)\n”\n,\n也有\n“ 变形语\n(\ninf\nlectives\n)\n”\n,\n是我\n国第\n一个明确区别构词词尾和构形词尾的学者\n。\n张寿康在\n《构词法和构形法》\n(\n198\n1\n)\n中将汉语的\n“ 构形法\n” 分为四类\n,\n认\n为在指人的名词后面附加语素\n“ 们\n” 成为复数\n(概数\n)\n形式是名词\n、\n量词\n、\n代词\n的构形法\n。\n葛本仪在中\n《现代汉语词汇学》\n(\n1985\n)将汉语\n“ 构形法\n” 分为两类\n,\n其中\n“ 附加法\n” 是指把\n一个语素附加在词干成分之后造成形态变化的方法\n,\n比如单音\n节人称代词和指人名词带上词尾语素\n“ 们\n” 可以表示复数的语法意义\n。\n陈光磊在\n《汉语词法论》\n(\n1994\n)\n中将汉语\n“ 构形法\n” 分为三类\n,\n在\n一个词\n上附加某种形态标志以显示某种语法特征的方法就是\n“ 加缀法\n”\n,\n并列举说明\n“ 第\n”“ 头\n” 等构形前缀和\n“ 们\n” 等构形后缀是汉语当中主要起构形作用的词缀\n。\n张斌在\n《新编现代汉语》\n(2002\n)\n中提到\n:\n汉语中的\n“ 们\n”“ 着\n”“\n了\n”\n“ 过\n” 近似于印欧语中标示词形变化的后缀\n,\n比如英语中名词之后附加\n“\ns\n” 表示\n1马庆株\n.现代汉语词缀的性质\n、\n范围和分类[\nJ].中国语言\n学\n报,1995(0\n6\n)\n.\n1\n1\n[p.21]\n#\n硕士学位论文\nMASTER\n'\nSTHESIS\n复数\n,\n这时\n“\nS\n” 是\n一个构形后缀\n。\n但是汉语的\n“ 们\n”“ 着\n”“\n了\n”“ 过\n” 除了可\n以附着在词根成分之后\n,\n还可以附着在短语单位之后\n,\n因此可以将这种成分称为\n“ 语缀\n”\n。\n汉语词缀和词尾\n(或称语缀\n)有所不同\n,\n前者用以构词\n,\n后者用以构\n形\n。\n曹炜\n《现代汉语词汇研宄》\n(2010\n)论述\n“ 构词法\n” 和\n“ 构形法\n”\n的区别时\n,\n提出\n“ 构形法\n” 和\n“ 构词法\n” 有所不同\n,\n前者是从形式上对\n一个词进行考察\n,\n后\n者则是探宄\n一个词的形式所形成的原因\n,\n词根和词缀存在于\n“ 构词法\n” 的范围内\n。\n至此我们可以明确\n:\n现代汉语词缀有构词词缀和构形词缀两种\n。\n构形词缀是\n指粘附在实词之后\n、\n具有词尾性质\n、表示某种语法意义的助词\n,\n典型的构形词缀\n是\n“ 们\n”\n。本文我们主要讨论构词词缀\n,\n不讨论构形词缀\n。\n汉语是典型的孤立语\n,\n相较于其他语言\n(例如英语\n)\n,\n形态标志不明显\n,\n缺\n少词的形态变化\n。\n因而在汉语的构词法中\n,\n附缀构词方式对比联合\n、\n偏正等构词\n方式显得较为弱势\n。\n由于附缀构词的词例较少\n,\n从理论上界定汉语词缀存在\n一定\n困难\n,\n各家的说法也因此存在差异\n。\n主要有\n:\n吕叔湘在\n《汉语语法分析问题》\n(\n1979\n)\n中提出\n,\n语素是比词小的单位\n。\n语\n素义独立是词\n,\n语素义不能独立就是构词成分\n,\n它包括词根和语缀\n。\n赵元任在\n《汉语口语语法》\n(\n1979\n)\n中提出\n,\n现代汉语中\n,\n词仅作为粘着语\n素出现在复合词中\n,\n少数出现在复合词中的粘着形式因为失去了其作为词根语素\n时的意义\n,\n进而取得语缀的身份\n,\n在构词时起标志功能的作用\n。\n朱德熙在\n《语法讲义》\n(\n1982\n)\n中提出\n,\n词缀是不表示实在的词汇意义\n、\n只\n表示抽象的语法意义的定位语素\n。\n汉语真词缀只能附着于词根成分之上\n,\n与词根\n成分没有意义上的关系\n、\n只有位置上的关系\n。\n张斌在\n《新编现代汉语》\n(2002\n)\n中提出\n,\n一个词中\n,\n词根是能够表示基本\n词汇意义的语素\n,\n词缀是附着于词根之上\n、表示附加意义的语素\n。\n蒋宗许在\n《汉语词缀研宄》\n(2009\n)\n中提出\n,\n词缀基本上都是由汉语实词语\n素虚化而来\n,\n因此具有语义高度虚化的特点\n,\n是\n一种构词成分\n。\n判断\n一个词素是\n否为词缀\n,\n必须结合其在所组成的结构中所充当的角色进行考察\n。\n他以\n“ 高子\n”\n和\n“ 矮子\n” 为例进行说明\n:\n“ 子\n” 本身有\n“ 人\n”\n的义项\n,\n“ 高子\n” 和\n“ 矮子\n” 分\n别指高的人\n、\n矮的人\n,\n它是\n一个偏正式双音词\n,\n“ 子\n” 决非其前形容词的词缀\n。\n蒋宗许先生据此总结出\n:\n汉语词缀不承载实词意义\n,\n删除它并不影响词汇的基本\n意义\n。\n邢福义在\n《现代汉语》\n(201\n1\n)\n中提出\n,\n汉语词缀在附加式合成词中是\n一种\n12\n[p.22]\n硕士学位论文\nMASTER\n'\nSTHESIS\n形态标志\n,\n构词时\n一般是定位的\n,\n根据其与词根成分的相对位置\n,\n可以分为前缀\n和后缀\n,\n此外还有极少数是中缀\n。\n根据以往学者对汉语\n“ 词缀\n”\n的认识\n,\n我们可以初步概括汉语词缀的几个主\n要特点\n:\n(\n1\n)\n词缀语义已经完全虚化\n;\n(2)\n词缀出现在附加式合成词中\n;\n(3\n)\n词缀具有构词定位性\n;\n(4)\n词缀往往有类化的历程\n;\n(5\n)有的词缀具有标示词性的作用\n;\n(6)\n后缀基本都轻音化\n。\n结合汉语词缀以上几个特点\n,\n我们可以得知汉语词缀的主要性质\n:\n词缀是虚\n语素\n、\n是构词语素\n。\n汉语在运用加缀法理论中的困难主要表现在汉语语法学家们对\n“ 新兴词缀\n”\n或\n“ 类词缀\n” 语言成分存在争议\n。\n193\n1年\n,\n瞿秋白先生将\n“ 新式字头\n”\n“ 新式字\n尾\n” 作为构词法列入其所提出的体系中\n,\n并于第二年在\n《新中国文草案》\n中提出\n了更多新兴词缀的例子\n。\n吕叔湘首先提出\n“ 近似词尾\n” 这\n一称呼\n。在\n《中国文法要略》\n(\n1982\n)\n中\n,\n他提到有\n一些常用来组成复合式复词的成分\n(近似词尾\n)\n,\n这种成分与词尾意义\n相近但实际上各有适用范围\n。\n他举了两类例子进行说明\n;\n“ 医士\n”“ 医生\n”\n“ 医\n师\n” 等词语中的\n“ 士\n”“ 生\n”“ 师\n” 表示从事各种职业的人员\n;\n“ 米店\n”\n“ 布厂\n”\n“ 医院\n” 等词语中的\n“ 店\n”\n“ 厂\n”\n“ 院\n” 表示具体的场所\n。\n但在该书中\n,\n“ 近似词尾\n” 这\n一概念被放在括号内\n,\n表示吕叔湘先生当时还\n未决定是否正式使用这\n一术语\n。\n直到过了几乎四十年后\n,\n吕叔湘先生才于\n1979年\n提出\n:\n汉语里不少语素只能被称为类前缀和类后缀\n,\n是因为这类语素的语义尚未\n完全虚化\n,\n有时还会以词根的意义出现\n。\n刘月华\n、\n潘文娱等在\n《实用现代汉语语法》\n(1983\n)\n中提到\n,\n除了\n“ 子\n”\n“ 儿\n”\n“ 头\n” 等典型的名词后缀之外\n,\n汉语中还有\n一些用于名词的类后缀\n,\n它们\n多是由具有实在意义的词逐渐虚化而成\n,\n但还没有完全转变成后缀\n,\n有时还可作\n〇\n陈光磊在\n《汉语词法论》\n(\n1994\n)\n中谈到\n,\n相比汉语典型构词词缀\n,\n类词缀\n无论是在数量上还是类别上显然更加丰富\n。\n张斌在\n《新编现代汉语》\n(2002\n)\n中\n将合成词分为复合式\n、\n重叠式\n、\n加缀式三类\n。\n其中\n,\n加缀式又可进\n一步细分为加\n13\n[p.23]\n硕士学位论文\nMASTER\n'\nSTHESIS\n真词缀和加类词缀两类\n。\n他认为\n,\n汉语类词缀\n一部分比较接近于真词缀\n,\n一部分\n又接近于词根\n,\n是\n一个半开放式的类别\n。\n张小平在\n《当代汉语词汇发展变化》\n(2008\n)\n中提出\n,\n新时期汉语新词的大量产生是受到语言类推作用的影响\n,\n比如\n“ X盲\n”“ X族\n” 等词语模式中的\n“ 盲\n”\n、\n“ 族\n” 等词素都是核心词素\n,\n它们在词\n的聚合群中起系联作用\n。\n由此可见\n,\n虽然在命名上不同学者各有说法\n,\n但我们认为将现代汉语中存在\n的\n一些\n“ 类似词缀的语素\n” 称为\n“ 类词缀\n” 更容易表现出其与词根存在着较大差\n异\n、某些方面上更偏向汉语典型词缀的特点\n。\n我们认为\n,\n“ 类词缀\n” 的提出主要有以下两个依据\n:\n1\n.从哲学角度看\n,\n世界是\n一个连续统\n一体\n,\n原事物向目标事物转化的过程中所\n出现的既不同于原事物\n、\n又不同于目标事物的中间过渡状态\n,\n我们称其为连续统\n,\n汉语\n“ 类词缀\n” 就处于这\n一连续统当中\n,\n它与词根\n、\n典型词缀有所区分\n,\n是\n一种\n中间状态\n;\n2\n.从语言学角度看\n,\n相比印欧语系\n,\n汉语缺乏形态变化\n,\n实词虚化是\n一个过程\n,\n主要表现是词的缀化过程不是\n一蹴而就而是循序渐进的\n,\n“ 类词缀\n” 介于实词和\n典型词缀之间\n,\n体现了语言发展的顺序性\n,\n其存在避免了对汉语\n“ 词根\n” 与\n“ 词\n缀\n” 的\n“\n一刀切\n” 两分法\n,\n尊重了汉语词汇发展的客观规律\n。\n在汉语类词缀的产生途径上\n,\n曹炜\n、蒋宗许\n、\n张斌等大多数学者认可类词缀\n大都是由汉语实词语素虚化而来\n,\n同时也有部分类词缀的产生源于其他语言的影\n响\n。\n相比属屈折语的印欧语\n,\n汉语缺少形态变化\n,\n因此汉语词缀和类词缀可以算\n得上是汉语构词中独有的语法手段\n。\n尽管汉语词汇系统具有自己的特点\n,\n但汉语\n词汇系统的开放性决定了它的兼容性\n,\n因此类词缀的产生既有内部因素也有外部\n因素\n,\n内部因素主要有语义的虚化\n、\n语言的类推机制\n、\n语言的经济制约原则等\n,\n外部因素主要有社会\n、\n经济\n、\n文化\n、大众认知心理等\n。\n由于汉语类词缀的概念相对笼统\n,\n且类词缀的衍生与发展仍处于动态变化中\n,\n因此目前对于汉语词缀\n、\n类词缀还没有易于操作的界定原则\n,\n但是类词缀所存在\n的\n一些特点已逐渐为学者明确\n:\n张斌在\n《新编现代汉语》\n(2002\n)\n中根据语素构词能力的不同将语素分为自\n由语素\n、\n半自由语素和不自由语素三类\n,\n并指出半自由语素在某些义项上可以独\n立成词\n,\n而在另\n一些义项上意义已经类化\n,\n自由度降低\n,\n只能与别的语素组合\n,\n呈现定位\n、\n黏着的趋势\n,\n正在成为类词缀\n。\n张小平在\n《当代汉语词汇发展变化研宂》\n(2008\n)\n中提出\n,\n词汇意义的虚化\n14\n[p.24]\n/tm\\\n硕士学位论文\nMgyp\nlMASTER\n'\nSTHESIS\n程度是词根和词素之间最主要的区别\n,\n因为汉语词根词素具有实在意义\n,\n词缀是\n附加在词根词素上表示语法意义和某些附加词汇意义的词素\n。\n她认为\n,\n类词缀至\n少应具备构词定位\n、\n非独立成词\n、\n词汇意义大部分虚化等特性\n。\n尹海良在\n《现代汉语类词缀研宄》\n(201\n1\n)\n中通过对类词缀内部进行考察\n,\n总结出类词缀具有语义虚化与语法功能增强\n、\n语义粘附\n、\n多义与功能兼职\n、\n单项\n高搭配\n、\n构词定位\n、\n语音非轻声等六个内部特点\n。\n从这三位学者对类词缀特点的总结上我们不难发现\n,\n类词缀最主要的特点是\n:\n相对汉语典型词缀而言\n,\n类词缀语义未完全虚化\n,\n多为半自由语素\n,\n构词具有定\n位性\n。\n汉语典型词缀基本上都是由实词素虚化而来\n,\n如果实词虚化的结果是词缀\n,\n那么语义虚化指的就是意义的虚无\n、\n空灵\n,\n表现在实词语素的概念义逐渐消失\n,\n最终成为虚语素\n。\n按照这种推理\n,\n全部保留本义或基本义的语素都不是类词缀\n。\n比如\n,\n“ 人\n” 在构成\n“ 好人\n、\n坏人\n、\n男人\n、\n女人\n、\n大人\n、\n老人\n、\n穷人\n、\n富人\n” 等\n词语时\n,\n“ 人类\n” 这\n一概念义明确\n,\n在构成\n“ 工具人\n、\n香蕉人\n、\n打工人\n、\n社会人\n、\n干饭人\n” 等词语时\n,\n“ 人类\n”\n的实词意义仍然很强\n,\n我们不能因为构词具有定位\n性与能产性就认为它是\n一个类词缀\n。\n然而实际情况更为复杂\n,\n我们对以往学者所\n判定为类词缀或近似类词缀的语素进行搜集与整理\n,\n发现它们可以分成两种类型\n:\n一种是本身带有\n“ 指人\n” 义的\n,\n一种是本身不带\n“ 指人\n” 义的\n,\n前者争议更大\n。\n如\n,\n“ 员\n” 在\n《辞源》\n(第三版\n)\n?中前两个释义\n:\n1定数的人或物\n,\n人员\n;\n2周\n围\n。\n在\n《现代汉语规范词典》\n(第\n3版\n)\n?中前两个释义\n:\n1指从事某种职业或担\n当某种职务的人\n;\n2指\n一定团体或组织中的成员\n。\n类似的还有\n“ 师\n”“ 士\n”“ 家\n”\n“ 夫\n”“ 佬\n” 等语素\n,\n它们的本义或基本义都有\n“ 指人\n” 义\n,\n如果据此认为它们\n不是类词缀\n,\n未免有些牵强\n。\n对此\n,\n张小平在\n《当代汉语词汇发展变化》\n(2008\n)\n中提出\n,\n在语言发展演\n变的过程中\n,\n类词缀具有动态性特征\n,\n其模糊性和不确定性是影响人们对其数量\n与概念进行归纳和界定的主要因素\n。\n由于词汇意义的虚化具有连续性特征\n,\n这就\n导致对类词缀进行判定时存在困难\n。\n目前\n,\n汉语当中的典型词缀主要有前缀\n“ 老\n、\n阿\n、\n第\n、\n初\n” 和后缀\n“ 子\n、\n头\n、\n儿\n”\n,\n它们的演变过程漫长且数量屈指可数\n。\n而类词缀的形成时间相对短暂\n,\n来\n源复杂\n,\n数量繁多\n,\n其界定标准与界定范围因人而异\n,\n更加导致了类词缀范围的\n1何九\n盈\n,王\n宁\n,董琨\n等.辞\n源[\nM\n].北\n京\n:商务印书\n馆\n,2\n01\n8\n.\n2李行健主\n编.现代汉语规范词\n典[M\n].北\n京\n:外语教\n学\n与研究出版社,\n2\n01\n4.\n15\n[p.25]\n/Si^\n\\\n硕士学位论文\nMASTER\n'\nSTHESIS\n不断扩大\n。\n除此以外\n,\n词根与类词缀的区分也是\n一个难题\n。\n语义虚化多\n一点是类词缀\n,\n语义虚化少\n一点是词根\n。\n然而在语义虚化的\n“ 多\n” 和\n“ 少\n”\n的判断上人们难免会\n带上主观性\n。\n张斌在\n《新编现代汉语》\n(2002\n)\n中提出了\n一个区分词根和词缀的\n基本标准\n:\n某个语素在语义保持不变的情况下可以和其他语素自由组合\n、\n换位\n,\n那么它还是\n一个词根\n;\n某个语素在构词时位置趋于固定\n,\n同时语义出现类化\n,\n那\n么它是\n一个类词缀\n;\n一旦某个语素不但位置固定\n,\n而且语义虚化\n、\n读音弱化\n,\n那\n么它就是\n一个真词缀\n。\n张斌提出的这\n一标准考虑到了类词缀构词定位与构词类化\n的特点\n,\n对我们判断汉语类词缀有极其重要的参考作用\n。\n我们在以往学者对汉语类词缀特点的共有认识基础上\n,\n从语义\n、\n功能\n、\n语音\n三个方面对类词缀与实词语素\n、\n典型词缀进行对比\n,\n可以初步概括出汉语类词缀\n具备以下几个主要特点\n:\n(\n1\n)类词缀语义部分虚化\n;\n(2\n)类词缀语义具有粘附性\n;\n(3\n)类词缀语义具有类化性\n;\n(4)类词缀构词具有定位性\n;\n(5\n)类词缀构词具有能产性\n;\n(6)类词缀构词具有类推性\n;\n(7)类词缀绝大多数标志名词\n;\n(8)类词缀读音基本保持不变\n。\n结合汉语类词缀以上几个特点\n,\n我们可以认识到汉语类词缀的主要性质\n:\n类\n词缀是语义部分虚化\n、\n构词时位置基本固定\n、读音非轻声的相对不成词语素\n。\n2\n.1\n.2汉语\n“指人\n” 类词缀的界定\n汉语\n“ 指人\n” 类词缀是根据其语义内容对类词缀进行分类所得到的\n一个结果\n。\n典型的汉语词缀由于语义完全虚化\n、\n必须粘附在词根之上\n,\n一般不表示具体的词\n汇意义\n,\n因此其语义透明度很低\n。\n类词缀语义部分虚化且语义粘附性时强时弱\n,\n因此当同\n一个类词缀在与不同词根成分相结合后其概念义虚化程度不完全\n一致\n,\n相比典型词缀\n,\n类词缀的语义透明度会更高\n,\n语义具有类化性\n。\n类化性主要体现\n在两个方面\n:\n一是类词缀的缀义具有类化性\n,\n二是类词缀在与不同词根成分相结\n合后所产生的融合意义具有类化性\n。\n我们借助\n《辞源》\n(第三版\n)\n,\n以语素\n“ 盲\n” 和\n“ 户\n” 为例来进行说明\n:\n“ 盲\n”\n的本义是\n“ 眼睛看不见东西\n”\n,\n在本义基础上又产生了比喻义\n“ 对某些事\n16\n[p.26]\n硕士学位论文\nIlm\nggPi/MASTER\n’\nSTHESIS\n物不认识或分辨不清\n”\n,\n利用这\n一比喻义所构成的新词\n“ 文盲\n、\n法盲\n、\n色盲\n、\n舞\n盲\n、\n电脑盲\n” 等词语都含有\n“ 对某些事物不认识或分辨不清的人\n” 义\n,\n这是\n“ 盲\n”\n的\n“ 指人\n” 缀义具有类化性的体现\n。\n“ 户\n”\n的本义是\n“ 单扇门\n。\n一扇为户\n,\n两扇\n为门\n”\n,\n之后引申为\n“ 住户\n,\n一家为\n一户\n”\n,\n“ 户\n”\n的\n“ 指人\n” 义在\n“ 关系户\n、\n专业户\n、\n个体户\n、\n暴发户\n” 等词语中才有所体现\n,\n利用\n“ 词根+类词缀\n‘ 户\n’” 所\n构成的新词词义上都有\n“ 指具有某种特点的人\n” 这\n一融合意义\n,\n这也是类词缀语\n义具有类化性的体现\n。\n此外\n,\n汉语词缀和类词缀在构词能产性上也存在\n一定差别\n。\n从构词能力上看\n,\n汉语典型词缀的构词能力略弱于类词缀\n,\n这\n一点从王洪君\n、\n富丽\n(2005\n)基于\n8亿\n语料得出\n“ 子\n” 缀词是\n760\n-\n1000个\n、\n“ 式\n” 类词缀词有\n3466个可以得到验证\n。\n1\n此外\n,\n从构词类推能力上看\n,\n类词缀在构词上的类推能力正随着社会的发展与人\n们认知范围的不断扩大而逐渐增强\n。\n构词类推能力与类词缀的语义类化性密切相\n关\n,\n如\n:\n(\n1\n)\n花\n:\n比喻美女班花\n、\n系花\n、\n校花\n、\n厂花\n、\n村花\n、\n警花\n、\n姐妹花\n、\n交际花\n。\n(2\n)\n蛋\n:\n比喻具有某种特点的人—坏蛋\n、\n混蛋\n、\n笨蛋\n、\n傻蛋\n、\n穷光蛋\n、\n糊涂蛋\n。\n语素\n“ 花\n” 和\n“ 蛋\n” 附加在词根之上所构成的新词在词义上都具有类化性\n,\n人们可以根据语义类化性特点不断进行仿拟造词\n,\n以满足自身交际需要\n。\n相比汉语当中的典型词缀\n,\n类词缀在语义趋向虚化\n、\n语义具有类化性\n、\n构词\n具有类推性与能产性等方面的特点更加突出\n,\n是我们界定汉语\n“ 指人\n” 类词缀的\n重要参考依据\n。\n因此\n,\n我们在对汉语\n“ 指人\n” 类词缀进行界定时\n,\n坚持从本质出\n发\n,\n结合汉语词缀\n、\n类词缀的性质与特点\n,\n对汉语\n“ 指人\n” 类词缀的界定提出以\n下四条标准\n:\n(\n一\n)语义部分虚化\n我们认为\n“ 指人\n” 类词缀的语义虚化实际上包括了语义虚化和语义泛化两种\n情况\n。\n1\n.语义虚化是指类词缀的\n“ 指人\n” 义不是其本义或基本义\n,\n而是由本义\n、\n基本\n义或引申义虚化而来\n,\n部分语素的语义又可进\n一步发生转移\n,\n从而产生比喻义\n,\n因此部分\n“ 指人\n” 类词缀在构词时可以采用比喻\n、\n仿词等修辞学造词法\n。\n以\n《现\n代汉语规范词典》\n(第\n3版\n)\n为例\n,\n“ 虫\n”\n“ 蛋\n”\n“ 棍\n”\n“ 花\n” 等语素的类词缀义\n项在词典中的标注序号比较靠后\n,\n而词典中同\n一个语素的不同义项所标注的不同\n序号通常是按照词义的古今演变顺序进行顺序排列所得到的结果\n,\n有些语素的类\n1王洪君\n,\n富丽\n.试论现代汉语的类词缀\n[\nJ]\n.\n语言科学,\n2\n005(05)\n.\n17\n[p.27]\n硕士学位论文\nMASTER\n'\nSTHESIS\n词缀义项在所有义项中位置并不是最后\n一个\n,\n而是略微靠前\n,\n这也说明了类词缀\n的语义有所虚化但还未完全虚化\n,\n仍保留\n一定的实词义\n。\n2\n.语义泛化是指类词缀的语义所表达的概念外延扩大\n,\n内涵减少\n。\n如\n“ 哥\n”\n“ 姐\n”\n“ 妹\n” 等词语本是亲属称谓词\n,\n但在\n“ 犀利哥\n”\n“ 大衣哥\n”“ 淡定\n姐\n”“ 柜姐\n”\n“ 打工妹\n”“ 外来妹\n” 等词语中表示的是\n“ 具有某种特点的人\n” 或\n“ 从事某种行业的人\n” 义\n,\n语义发生泛化\n,\n词义己不再局限于亲属称谓中\n。\n(二\n)语义粘附与构词定位\n“ 指人\n” 类词缀语义虚化程度高低决定了其语义粘附性的强弱\n,\n语义虚化程\n度高时语义粘附性强\n,\n反之则低\n。\n即\n,\n如果部分类词缀的\n“ 指人\n” 缀义必须粘附\n在词根成分之后才能得到显示或者强化\n,\n脱离词根成分独立成词\n、或与其他实词\n语素自由组合成词时\n,\n“ 指人\n” 缀义弱化或脱落\n,\n那么这类\n“ 指人\n” 类词缀语义\n虚化程度高\n,\n语义粘附性强\n。\n如\n,\n“ 生\n” 在\n“ 学生\n、\n本科生\n、\n研宄生\n、\n博士生\n、\n留学生\n” 等词语中具有指人义\n,\n在\n“ 生命\n、\n生活\n、\n生存\n、\n生产\n、\n生日\n” 等词语中\n无指人义\n,\n可认为\n“ 指人\n” 类词缀\n“ 生\n”\n的语义虚化程度高\n、\n语义粘附性强\n。\n“ 员\n”\n“ 夫\n”\n“ 师\n” 等半自由语素的语义虚化程度低于\n“ 家\n”\n“ 手\n”\n“ 迷\n” 等自\n由语素\n,\n体现在\n“ 家\n”\n“ 手\n”\n“ 迷\n” 等语素需黏附于词根成分之后才能产生\n“ 指\n人\n” 缀义\n,\n而\n“ 员\n”\n“ 夫\n”\n“ 师\n” 等语素粘附于词根成分之后其\n“ 指人\n” 义得到\n进\n一步强化\n,\n脱离词根成分后虽不能独立成词但其\n“ 指人\n” 义仍然较为明显\n。\n此外\n,\n“ 指人\n” 类词缀在构词时只有粘附在词根成分之后才具备\n“ 指人\n” 义\n,\n如\n“ 货\n”\n“ 蛋\n”\n“ 才\n” 等语素在\n“ 蠢货\n、\n贱货\n、\n笨蛋\n、\n坏蛋\n、\n天才\n、\n庸才\n” 等词\n语中具有\n“ 指人\n” 义\n,\n在\n“ 货物\n、\n货资\n、\n蛋糕\n、\n蛋壳\n、才能\n、\n才学\n” 等词语中不\n具备\n“ 指人\n” 义\n,\n说明\n“ 指人\n” 类词缀构词时位置相对固定\n。\n(三)\n构词能产与构词类推性\n“ 指人\n” 类词缀数量相当丰富\n,\n附着对象可以是词或词以上的单位\n,\n因此结\n合面宽\n,\n可以产生大量新词\n。此外\n,\n人们利用\n“ 指人\n” 类词缀的同\n一\n“ 指人\n” 缀\n义进行仿拟造词\n,\n所构成的新词在词汇意义上出现类化\n,\n具有标记\n“ 某\n一类人\n”\n的功能\n,\n从而使人们能够利用同\n一\n“ 指人\n” 类词缀与造词模式进行类推造词\n。\n(四\n)具有\n一定情感色彩\n。\n一个词如果能够体现出说话人对所指对象或有关现象的积极\n、\n消极\n、\n戏谑等\n主观情感态度\n,\n就说明这个词具有\n一定的情感色彩意义\n。\n从情感色彩角度来分析\n,\n“ 指人\n” 类词缀有褒义型\n、\n贬义型\n、\n戏谑意型及中性义型\n,\n部分具有比喻义的\n“ 指人\n” 类词缀所体现的情感色彩更加强烈\n,\n如\n“ 鬼\n”\n“ 蛋\n”\n“ 货\n”\n“ 花\n” 等\n。\n18\n[p.28]\n硕士学位论文\nMASTER\n’\nSTHESIS\n以上四条界定标准中\n,\n最后\n一条在判定\n“ 指人\n” 类词缀上起辅助作用\n,\n需要\n结合\n一定的语言环境进行分析\n。\n基于以上四条对于汉语\n“ 指人\n” 类词缀的界定标\n准\n,\n接下来我们对汉语\n“ 指人\n” 类词缀数量进行确定\n。\n2\n.1\n.3汉语\n\"指人\n\"类词缀的确定\n我们在阅读前人所著文献专著时\n,\n首先选取九部在研宄汉语类词缀方面具有\n较为广泛代表性的词汇学\n、\n语法学专著\n,\n对其中所收纳的类词缀进行量化统计\n,\n得到表\n2\n-\n1数据\n:\n表2\n-1\n:\n各家列举汉语类词缀数量统计表\n-\n序号\n|\n提出者\n|\n出处\n|时间\n|术语命名\n丨语素\n|数量\n丨\n总数\n准\n、\n类\n、\n亚\n、\n次\n、\n超\n、\n反\n、\n类前缀半\n、\n多\n、\n单\n、\n无\n、\n不\n、\n非\n、\n18\n可\n、\n自\n、\n前\n、\n代\n、\n好\n、\n难\n1吕叔湘《汉语语法分析问题》\n1979性H\n4\n1\n米\n礎界\n、\n种\n、\n类\n'\n另\n丨\nJ\n、\n法\n、\n体\n、?\n学\n、\n质\n、\n品\n、\n力\n、\n子\n、\n人\n、\n23\n员\n、\n家\n、\n民\n、\n具\n、\n件\n#C\n\\\\/反\n、\n亲\n、\n准\n、\n伪\n、\nk\n、\n不\n、\n新K前缀\n^^^#\n10\n2赵元任《汉语口语语法》1979\n:\n̄: ̄ ̄:\n22\n新兴后缀HI\n:I\n:S\n'\n法\n、\n12\n_—\n3任学良《汉语造词法》198\n1\n-\n-\n—8\n准词尾度\n、\n式\n、\n论\n、\n豪\n、\n却\n5\n总\n、\n准\n、\n有\n、\n亚\n、\n小\n、\n伪\n、\n全\n、\n前\n、\n吋\n、\n类\n、\n好\n、\n非\n、\n.\n.\n反\n、\n泛\n、\n单\n、\n大\n、\n打\n、\n次\n、\n2〇\n半\n、\n超\n(\n1\n)用于指人名词\n:\n夫\n、\n家\n、\n匠\n、\n师\n、\n生\n、\n士\n、\n员\n、\n长\n、\n手\n、\n汉\n、\n翁\n、\n倌\n、\n工\n、\n4陈光磊《汉语词法论》1994S\n、\n迷\n、\n族7\n1\nC2\n)带贬称的指人名词类后\n^缀\n:\n傻\n、\n鬼\n、\n棍\n、\n蛋\n、\n虫C\n1\n(3)其他\n:\n观\n、\n论\n、\n学\n、\n5\n1\n派\n、\n界\n、\n度\n、\n率\n、\n气\n、\n类\n、\n品\n、\n种\n、\n件\n、\n具\n、\n子\n、\n化\n、\n性\n、\n法\n、\n来\n、\n角\n、\n型\n、\n式\n
