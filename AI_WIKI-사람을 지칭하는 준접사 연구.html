<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>AI WIKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: 연구 서가 — 왼쪽 서가 목록(내비게이션) + 오른쪽 열람대(작업 영역). 등급은 청록 농도 5단계. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8EDEC; --ink:#162427; --muted:#5A6A6D; --line:#D6DEDD;
  --accent:#0D6B66; --accent-ink:#FFFFFF; --accent-soft:#DDEFED; --mark:#F2D16B; --danger:#B0412F; --ok:#2E7A4E; --warn:#A36A00;
  --g1:#CAD7D6; --g2:#9DC0BC; --g3:#68A39D; --g4:#33857F; --g5:#0D6B66;
  --f-display:"Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px; --shadow:0 1px 2px rgba(16,40,40,.06), 0 4px 16px rgba(16,40,40,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1516; --surface:#152022; --sunk:#1B282A; --ink:#E2EBEA; --muted:#92A4A5; --line:#283739;
  --accent:#4DBDB3; --accent-ink:#06201E; --accent-soft:#16393A; --mark:#B8962E; --danger:#E07A66; --ok:#62BE87; --warn:#D9A43A;
  --g1:#2A3B3D; --g2:#2F5856; --g3:#33786F; --g4:#3E9C93; --g5:#4DBDB3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1516; --surface:#152022; --sunk:#1B282A; --ink:#E2EBEA; --muted:#92A4A5; --line:#283739;
  --accent:#4DBDB3; --accent-ink:#06201E; --accent-soft:#16393A; --mark:#B8962E; --danger:#E07A66; --ok:#62BE87; --warn:#D9A43A;
  --g1:#2A3B3D; --g2:#2F5856; --g3:#33786F; --g4:#3E9C93; --g5:#4DBDB3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em;display:block}
.brand span{color:var(--muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.store{margin-top:auto;font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
main{padding-block:28px 120px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1240px;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head>div{min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=url],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;line-height:1.65}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--sunk);font-size:.78rem;color:var(--ink)}
.chip.k{background:var(--accent-soft)}
.chip.ex{background:var(--mark);color:#3a2c00}
.gb{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:#fff}
.gb.g0{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.gb.g1{background:var(--g1);color:var(--ink)} .gb.g2{background:var(--g2);color:var(--ink)} .gb.g3{background:var(--g3)} .gb.g4{background:var(--g4)} .gb.g5{background:var(--g5)}
:root[data-theme="dark"] .gb.g3,:root[data-theme="dark"] .gb.g4,:root[data-theme="dark"] .gb.g5{color:#06201E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gb.g3,:root:not([data-theme="light"]) .gb.g4,:root:not([data-theme="light"]) .gb.g5{color:#06201E}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(70px,34%) 1fr 36px;gap:8px;align-items:center;font-size:.85rem}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.col .bar{width:100%;max-width:56px;border-radius:4px 4px 0 0;min-height:2px}
.col .v{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.collab{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center;font-size:.78rem;color:var(--muted);padding-top:6px}
.cloud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.cloud span{color:var(--accent);font-weight:500;cursor:pointer}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;cursor:pointer}
.item .t:hover{color:var(--accent)}
.item .meta{font-size:.82rem;color:var(--muted)}
.item .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.bulk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bulk .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:1.1rem;display:block;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.queue{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.queue div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--sunk);border-radius:6px}
.prose{line-height:1.8;max-width:72ch}
.prose h2{font-size:1.12rem;margin:1.4em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font-size:1rem;margin:1.1em 0 .4em}
.prose p{margin:.6em 0}
.prose blockquote{margin:.8em 0;padding:.4em 1em;border-left:3px solid var(--mark);background:var(--sunk);border-radius:0 6px 6px 0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto}
.prose td,.prose th{border:1px solid var(--line);padding:4px 8px}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:0 4px;border-radius:3px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 10px;align-items:center;font-size:.88rem}
.kv>span{color:var(--muted)}
.raw{max-height:420px;overflow:auto;white-space:pre-wrap;font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}
details>summary{cursor:pointer;font-weight:500}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);margin-bottom:6px}
.chapter{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:14px}
.chapter>header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.chapter>header input{font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:transparent;border-color:transparent;flex:1 1 220px}
.sec{padding:12px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.sec-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-head input.st{flex:1 1 200px;font-weight:600}
.sec-head input.tg{width:90px}
.cnt{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.over{color:var(--warn)} .cnt.good{color:var(--ok)}
.sec .row select{width:auto;flex:0 1 280px}
.sec textarea{min-height:120px;background:var(--surface)}
.sec .prose{padding:4px 2px}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;flex:1 1 120px}
.meter i{display:block;height:100%;background:var(--accent)}
.jobbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px);font-size:.88rem}
.jobbar .spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.jobbar .spin{animation:none}}
.jobbar button{all:unset;cursor:pointer;background:var(--danger);color:#fff;border-radius:999px;padding:3px 12px}
.toast{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;box-shadow:var(--shadow);z-index:30;max-width:min(380px,calc(100% - 32px));font-size:.9rem}
.toast.err{border-left-color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(10,20,20,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--surface);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.note{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 12px}
.refs{font-size:.92rem;line-height:1.75}
.btable{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
.btable th,.btable td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.btable th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--sunk)}
.refs li{margin-bottom:6px;padding-left:4px}
.refs .src{font-size:.78rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.pickl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--bg)}
.pickl label{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.pickl label:last-child{border-bottom:0}
.mobile-nav{display:none}
.app>*{min-width:0}
@media (max-width:900px){ .side{max-width:100vw;width:100%} .app{grid-template-columns:minmax(0,1fr)} }
.projbox{display:flex;flex-direction:column;gap:4px;margin:10px 0 6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.projbox .lbl{font-size:.72rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.projbox select{padding:6px 8px;font-weight:600}
.nav button[aria-disabled="true"]{opacity:.45}
.crumb{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb button{all:unset;cursor:pointer;color:var(--muted)} .crumb button:hover{color:var(--accent)} .crumb button:focus-visible{outline:2px solid var(--accent)}
.crumb b{color:var(--ink);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(20px,3vw,34px);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px);opacity:.22;pointer-events:none}
.hero>*{position:relative}
.htitle{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:.01em;line-height:1.05}
.lead{font-size:1.02rem;color:var(--muted);margin-top:10px;max-width:56ch}
.btn.lg{padding:10px 18px;font-size:.95rem}
a.btn{text-decoration:none;color:var(--ink)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
.hero-stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.hero-stats b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:.8rem;color:var(--muted)}
.newproj{margin-top:16px;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.req{font-size:.7rem;color:var(--danger);margin-left:4px}
.folderopt{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px;background:var(--sunk);border-radius:8px}
.folderopt .check{align-items:flex-start}
.tree{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;white-space:pre;padding-left:26px}
.tablewrap{overflow-x:auto;margin:0 -4px;position:relative}
.ptable{border-collapse:collapse;width:100%;min-width:820px;font-size:.88rem}
.ptable th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.ptable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable tr.on td{background:var(--accent-soft)}
.ptable .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plink{all:unset;cursor:pointer;font-weight:600} .plink:hover{color:var(--accent)} .plink:focus-visible{outline:2px solid var(--accent)}
.fchips{display:flex;flex-direction:column;gap:4px}
.fchip{font-size:.76rem;padding:1px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);white-space:nowrap;width:max-content}
.fchip.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline} .linkbtn[disabled]{opacity:.4;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:22px}
.fnode{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);min-width:0}
.fnode b{font-family:var(--f-display);font-size:1rem;color:var(--ink)}
.fno{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem}
.fnode:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700}
.floop{margin-top:14px;font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.floop span{color:var(--accent);font-size:1.2rem}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.gcard p{font-size:.88rem;color:var(--muted)}
