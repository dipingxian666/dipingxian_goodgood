.在\n《现代汉语规范词典》\n(第\n3版\n)\n中\n,\n“ 家\n” 读轻声时是后缀\n,\n附着在某\n些指人的名词后面\n,\n表示属于某\n一类人\n,\n如\n“ 小孩子家\n”\n“ 姑娘家\n”\n“ 女人家\n”\n“ 学生家\n”\n,\n我们将其标记为\n“ 家\n。\n“ 家\n” 读非轻声时有十二个义项\n,\n其中五\n个为\n“ 指人\n” 义项\n,\n我们将其标记为\n“ 家\n2”\n,\n并纳入备用语料中\n。\n2\n.在\n《现代汉语规范词典》\n(第\n3版\n)\n,\n“ 才\n” 和\n“ 花\n” 都是同形同音词\n,\n因\n此在词典中收录了\n“ 才\n“ 才\n2” 和\n“ 花\n’\n”“ 花\n2”\n,\n我们根据词典所收纳的义项\n将\n“ 才\n>\n”\n“ 花\n1” 纳入备用语料中\n。\n根据本文提出的界定汉语\n“ 指人\n” 类词缀的四条标准\n,\n我们对\n91个备用语料\n进行筛选\n,\n最终确定本文要探宄的汉语\n“ 指人\n” 类词缀为\n54个\n,\n分别是\n:\n控\n、\n族\n、\n奴\n、\n党\n、\n客\n、\n哥\n、\n姐\n、\n迷\n、手\n、\n帝\n、\n家\n2\n、\n妹\n、\n师\n、\n员\n、\n嫂\n、\n婶\n、\n霸\n、\n虫\n、\n棍\n、\n星\n、\n花\n'\n、\n爷\n、\n友\n、\n户\n、\n生\n、\n士\n、\n粉\n、\n鬼\n、\n徒\n、\n弟\n、\n汉\n、\n盲\n、\n叔\n、\n蛋\n、\n夫\n、\n货\n、\n精\n、\n佬\n、\n派\n、\n神\n、\n犯\n、\n长\n、痴\n、\n丁\n、\n贩\n、\n豪\n、\n狂\n、\n魔\n、\n农\n、\n婆\n、\n仔\n、\n宅\n、\n王\n、\n才\n、\n具体筛除步骤为\n:\n1\n.合成词中\n“ 指人\n” 义是本义或基本义的不是\n“ 指人\n” 类词缀\n,\n据此筛除\n19\n个语素\n:\n人\n、\n民\n、\n男\n、\n女\n、孩\n、\n娘\n、\n郎\n、\n匠\n、\n兵\n、\n医\n、\n侠\n、\n工\n、\n主\n、\n翁\n、\n爸\n、\n妈\n、\n妻\n、\n爹\n、\n子\n。\n2\n.概念义仍然实在的不是\n“ 指人\n” 类词缀\n,\n据此筛除\n5个语素\n:\n狗\n、虎\n、\n贪\n、\n草\n、\n漂\n。\n3\n.\n“\n白领\n、\n蓝领\n、金领\n” 等词语的\n“ 指人\n” 义产生于人们运用了借代的修辞手\n法\n,\n“ 领\n” 本身并不具备\n“ 指人\n” 义\n,\n其实词语义并未发生虚化\n,\n据此筛除\n1个语\n素\n:\n领\n。\n4\n.\n“ 们\n” 是\n一个构形词缀\n,\n予以筛除\n。\n5\n.\n“ 头\n2” 在\n“\n丫头\n、\n对头\n、\n姘头\n” 等词语中已经不表示具体的词汇意义而是\n25\n[p.35]\n/S\n|k\\\n硕士学位论文\nMASTER\n'\nSTHESIS\n起标志名词的语法作用\n,\n其语义已完全虚化\n,\n同时语音轻音化\n,\n是\n一个典型的\n“ 指人\n” 词缀\n,\n予以筛除\n。\n6\n.\n“ 文学界\n、\n演艺界\n、\n医学界\n”\n中的\n“ 界\n” 和\n“ 文坛\n、\n影坛\n、\n诗坛\n”\n中的\n“ 坛\n”\n都是指\n“ 某\n一区域范围\n”\n,\n如\n,\n我们不能说\n“ 你是\n一个文学界\n”“ 你是\n一个文\n坛\n”\n。\n此外\n,\n“ 可爱型\n、\n主动型\n、\n御姐型\n”\n中\n“ 型\n”\n的\n“ 指人\n” 语义不明确\n,\n据\n此筛除\n3个语素\n.\n?\n界\n、\n坛、\n型\n。\n7\n.从语音形式上看\n,\n“ 托\n” 和\n“ 倌\n” 在构成人称名词时发生儿化\n,\n如\n:\n医托儿\n、\n药托儿\n、\n羊倌儿\n、\n猪倌儿\n。\n我们认为这种词语属于儿化词\n,\n据此筛除\n2个语素\n:\n托\n、\n倌\n。\n8\n.我们通过扩展法判定\n“ 达人\n”“ 二代\n”\n“ 分子\n” 是词而非类词缀\n。据此筛除\n“ 达人\n”“\n一代\n”“ 二代\n”\n“ 分子\n”\n。\n9\n.在\n《辞源》\n(第三版)\n中\n,\n“ 者\n” 有四个义项\n,\n前三个分别为\n:\n1助\n。\n近于\n现代汉语结构助词\n“ 的\n”\n;\n2指示代词\n;\n3应诺声\n,\n表示同意\n。\n在\n《现代汉语规\n范词典》\n(第\n3版)\n中\n,\n“ 者\n” 有四个义项\n,\n前三个分别为\n:\n1代词\n。\n跟动词\n、\n形\n容词或动词\n、\n形容词性短语结合\n,\n分别表示做这\n一动作或有这\n一属性的人\n、\n事\n、\n物\n:\n劳动者/弱者/先进生产者\n;\n2代词\n。\n跟\n“ 工作\n”\n、\n“ 主义\n” 等词语结合\n,\n表\n示从事某项工作\n、\n信仰某种主义或有某种严重倾向的人\n:\n音乐工作者/唯物主义者\n/教条主义者\n。\n可见语素\n“ 者\n” 既可以出现在词根成分之后\n,\n也可出现在谓词性词\n组之后\n,\n意义虽然有所虚化但是并不属于构词成分\n,\n我们认为将其归为助词更为\n合理\n,\n据此予以筛除\n。\n2\n.2\n“指人\n” 类词缀的分类\n在上\n一小节中\n,\n我们提出了界定汉语\n“ 指人\n” 类词缀的四条标准\n,\n据此确定\n了54个汉语\n“ 指人\n” 类词缀\n。对\n“ 指人\n” 类词缀从不同角度进行划分\n,\n我们可以\n归纳出其在语义\n、\n结构\n、\n功能等方面的不同表现\n,\n从而有针对性地对母语非汉语\n学习者进行词汇教学\n。\n因此\n,\n我们将从\n“ 指人\n” 类词缀的构词能力\n、\n语义指向\n、\n情感色彩三个角度对\n“ 指人\n” 类词缀进行分类\n。\n(\n一\n)构词能力\n“ 指人\n” 类词缀的\n“ 指人\n” 缀义是在语义虚化或语义泛化的过程中产生的\n,\n语义虚化或者语义泛化程度高时语义粘附性强\n,\n与词根相结合后能够指称\n“ 具有\n某种特点的人\n”\n。\n汉语类词缀相比典型的汉语词缀在构词上具有更强的能产性\n,\n但是受语义虚化程度高低的影响\n,\n不同\n“ 指人\n” 类词缀彼此之间的构词能产性也\n26\n[p.36]\n硕士学位论文\nMASTERSTHESIS\n有高低强弱区分\n。\n据此\n,\n我们将汉语\n“ 指人\n” 类词缀按照构词能力的强弱不同将\n其分为能产型和非能产型两类\n。\n我们参考闫琪\n?及战役如\n@对汉语\n“ 指人\n” 类词缀\n构成派生词结果的收录情况\n,\n同时通过百度检索方式搜集\n“ 指人\n” 类词缀的派生\n构词结果\n,\n认为\n“ 族\n、\n派\n、\n员\n、\n师\n、\n手\n、家\n2\n、\n长\n” 七个\n“ 指人\n” 类词缀相对而言\n具有较强的构词能产性\n,\n其余\n“ 指人\n” 类词缀的构词能产性相对较弱\n,\n我们认为\n其原因主要有两个\n:\n一是旧有\n“ 指人\n” 类词缀在长时间的使用过程中其\n“ 指人\n”\n义逐渐稳定\n,\n己经不能满足大众求异造词的心理\n;\n二是新兴\n“ 指人\n” 类词缀出现\n时间较短\n,\n其使用频率随着时间的推移而不断下降\n,\n因此部分\n“ 指人\n” 类词缀只\n在\n一段时间内构词活跃\n,\n之后就进入旧有\n“ 指人\n” 类词缀当中\n,\n活跃性降低\n。\n(二\n)语义指向\n“ 指人\n” 类词缀的语义可以进\n一步细化为指向性别\n、\n职业\n、\n身份\n、\n特点等\n。\n1\n.语义指向性别\n(\n1\n)指向男性\n:\n哥\n、\n弟\n、\n爷\n、\n叔\n、\n汉\n;\n(2\n)指向女性\n:\n姐\n、妹\n、嫂\n、\n花、\n婆\n;\n(3\n)不限性别\n:\n控\n、族、\n奴\n、\n党\n、\n客\n、\n迷\n、\n手\n、\n帝\n、\n家\n2\n、\n师\n、\n员\n、\n虫\n、棍\n、\n星\n、\n友\n、\n户\n、\n生\n、\n士\n、\n粉\n、\n鬼\n、\n徒\n、\n盲\n、\n蛋\n、\n夫\n、\n货\n、\n精\n、\n佬\n、\n派\n、\n神\n、\n犯\n、\n长\n、\n痴\n、\n丁\n、\n贩\n、\n豪\n、\n狂\n、\n魔\n、\n农\n、\n婆\n、\n仔\n、\n宅\n、\n王\n、\n才、\n2\n.语义指向职业\n这类\n“ 指人\n” 类词缀本身语义透明度较高\n,\n在与词根成分相结合后受词根成\n分的修饰限制性强\n,\n所构成的新词语在词汇融合意义上可以指明人物的职业\n。\n如\n:\nX贩\n:\n鱼贩\n、\n虾贩\n、报贩\n、毒贩\n、\n商贩\n、摊贩\nX农\n:\n菜农\n、\n村农\n、\n药农\n、码农\n、\n烟农\n、\n瓜农\n、\n果农\nX家\n:\n画家\n、\n作家\n、\n钢琴家\n、\n音乐家\n、美术家\n、教育家\n、\n科学家\nX员\n:\n球员\n、\n店员\n、船员\n、\n服务员\n、\n售货员\n、\n宇航员\n、\n辅导员\n、\n消防员\n3\n.语义指向身份\n这类\n“ 指人\n” 类词缀在与词根成分相结合后构成的新词所产生的融合意义具\n有指向某人身份的功能\n。\n如\n:\nX族\n:\n上班族\n、\n月光族\n、\n急婚族\n、慢活族\n、\n追星族\n、\nBOBO族\n、\nSOHO族\nX犯\n:\n战犯\n、\n逃犯\n、\n囚犯\n、\n杀人犯\n、\n纵火犯\n、抢劫犯\n、\n诈骗犯\nX粉\n:\n颜粉\n、\n铁粉\n、\n黑粉\n、僵尸粉\n、\n男友粉\n、\n死忠粉\n、\n脑残粉\n1闫琪\n.现代汉语指人类词缀研究及在教学中的应用\n[D\n]\n.中央民族大学\n,\n20\n19\n.\n2战怡\n如.现代汉语指人类词缀的多维度考\n察[\nD\n].黑龙江大\n学\n,2\n0\n1\n5\n.\n27\n[p.37]\n硕士学位论文\nMASTER\n’\nSTHESIS\nX奴\n:\n房奴、\n车奴\n、\n猫奴\n、\n狗奴\n、\n守财奴、\n孩子奴\n、\n老婆奴\nX师\n:\n厨师\n、\n画师\n、\n医师\n、\n导师\n、\n工程师\n、\n美术师\n、\n摄影师\nX客\n:\n顾客\n、\n旅客\n、\n游客\n、政客\n、\n黑客\n、背包客\n、烧香客\nX星\n:\n明星\n、球星\n、\n影星\n、歌星\n、\n童星\n、\n巨星\n、\n丑星\nX神\n:\n车神\n、股神\n、\n战神\n、\n男神\n、\n女神\n、\n学神\n、\n赌神\nX王\n:\n赌王\n、\n卷王\n、海王、\n舞王\n、\n歌王\n、\n天王\n、\n女王\n4\n.语义指向特点\n这类\n“ 指人\n” 类词缀的\n“ 指人\n” 缀义与其作为实词语素时的意义紧密相关\n,\n语义粘附性强\n,\n附加在词根成分之后具有指向人的某种特点的功能\n。\n如\n:\nX狂\n:\n结婚狂、\n购物狂\n、\n工作狂、\n加班狂\n、\n自大狂、\n杀人狂\n、\n囤货狂\nX控\n:\n声控、\n颜控\n、\n御姐控\n、\n软妹控\n、\n萝莉控\n、\n正太控、\n发型控\nX精\n:\n腿精\n、\n杠精、\n戏精\n、柠檬精\n、\n马屁精\n、粘人精\n、\n害人精\nX盲\n:\n色盲\n、\n文盲、\n法盲\n、路盲\n、\n手机盲\n、\n历史盲\n、\n电脑盲\nX迷\n:\n财迷、\n球迷、\n书迷\n、\n影迷\n、\n歌迷\n、\n小说迷\n、\n电脑迷\nX痴\n:\n情痴\n、\n书痴\n、棋痴\n、花痴\n、\n诗痴\n、\n墨痴\n、游痴\nX才\n:\n天才\n、\n蠢才、\n人才\n、\n将才\n、庸才、\n贤才\n、\n髙才\nX宅\n:\n肥宅\n、技术宅\n、科技宅\n、人气宅\n、健康宅\n(三)情感色彩\n从\n“ 指人\n” 类词缀的情感色彩上看\n,\n“ 指人\n” 类词缀与词根相结合后产生的\n新词所具备的融合意义根据情感色彩主要可以分为褒义和贬义两种类型\n。\n褒义情\n感色彩是指能够体现说话人肯定\n、\n喜爱\n、\n赞扬等积极情感态度\n,\n贬义情感色彩是\n指能够体现说话人否定\n、\n厌恶\n、贬低等消极情感态度\n。\n1\n.褒义情感色彩\nX家\n:\n画家\n、作家\n、\n文学家、\n书法家\n、\n文学家\n、钢琴家、\n梦想家\nX师\n:\n教师\n、\n画师\n、\n技师\n、\n医师\n、\n工程师\n、\n园艺师\n、\n设计师\nX花\n:\n班花、\n系花\n、\n校花\n、\n厂花\n、\n警花、\n交际花\n、姐妹花\nX星\n:\n明星\n、球星、\n影星\n、歌星\n、\n童星、\n巨星\n、\n男星\nX神\n:\n股神\n、\n车神\n、\n赌神\n、\n枪神\n、\n学神\n、\n男神\n、\n女神\nX士\n:\n男士、\n女士\n、\n绅士\n、\n烈士\n、\n勇士\n、\n义士\n、\n壮士\n2\n.贬义情感色彩\nX鬼\n:\n烟鬼\n、\n酒鬼\n、\n懒鬼\n、\n冒失鬼\n、\n吝啬鬼\n、胆小鬼\n、\n势利鬼\nX虫\n:\n米虫\n、\n网虫\n、\n书虫\n、懒虫\n、\n鼻涕虫\n、\n糊涂虫\n、\n害人虫\n28\n[p.38]\n/Sm\\\n硕士学位论文\nMASTER\n’\nSTHESIS\nX货\n:\n蠢货\n、\n憨货\n、\n二货\n、\n贱货\n、水货\n、赔钱货\n、\n倒霉货\nX蛋\n:\n笨蛋\n、\n坏蛋\n、懒蛋\n、\n傻蛋\n、软蛋\n、\n倒霉蛋\n、\n穷光蛋\n在这里我们要说明\n一点\n,\n“ 指人\n” 类词缀的褒贬情感色彩划分并不绝对\n,\n大\n部分\n“ 指人\n” 类词缀在交际过程中会根据说话者的心理需求或交际目的而发生情\n感色彩上的变化\n,\n如\n,\n语素\n“ 鬼\n”一般是贬义\n“ 指人\n” 类词缀\n,\n但是由它组成的\n“ 机灵鬼\n”\n“ 贪吃鬼\n” 又带有\n一定的亲昵\n、\n戏谵意味\n,\n因此情感色彩意义并不是\n“ 指人\n” 类词缀语素义的必要构成成分\n,\n而是附加成分\n。\n29\n[p.39]\n硕士学位论文\nMASTER\n'\nSTHESIS\n第三章汉语\n“指人\n” 类词缀的构词\n、语义\n、语用特点\n3\n.1\n“指人\n” 类词缀的构词特点\n从形式上看\n,\n现代汉语典型词缀与类词缀存在最明显的共同点是构词都具有\n定位性\n。\n定位性是指词缀在与词根相结合时其位置相对固定\n,\n或在词根之前\n,\n或\n在词根之后\n,\n据此可分为前加式词缀和后加式词缀\n,\n此外汉语当中还存在极少数\n中缀\n。\n类词缀构词具有定位性这\n一特点在王洪君\n、\n富丽的\n《试论现代汉语的类词\n缀》\n(2005\n)\n中被概括为\n“ 单向高搭配性\n”\n。\n“ 单向高搭配\n” 是指在派生词的词\n义和词性不变的前提下\n,\n其中\n一个位置上的成分可以被自由替换\n,\n另\n一个位置上\n可被替换的成分不多\n,\n表现在由\n“ 词根+类词缀\n” 构成的派生词中\n,\n词根可以被自\n由替换\n,\n类词缀不可被自由替换\n。\n如\n:\n友\n友爱\n、\n友邦\n、\n友好\n、友军\n、\n友邻\n、\n友情\n、\n友善\n、\n友谊\n-友\n:\n盟友\n、\n战友\n、\n网友、校友\n、\n棋友\n、\n麻友\n、\n工友\n、\n朋友\n在第\n一组词语中\n,\n语素\n“ 友\n” 表示\n“ 关系好\n,\n亲近\n” 或\n“ 有友好关系的\n”\n;\n而在第二组词语中\n,\n语素\n“ 友\n” 表示\n“ 关系密切\n、\n有交情的人\n”\n,\n此时\n,\n“ 友\n”\n是\n一个类词缀\n,\n“ 指人\n” 缀义表现突出\n,\n构词时位置相对固定\n,\n可以体现出类词\n缀\n“ 单向高搭配\n” 的特点\n。\n“ 指人\n” 类词缀除具有构词定位性特点之外\n,\n还有\n一个突出特点是构词具有\n能产性\n。\n构词能产性是指类词缀可以附加在语素\n、\n词\n、\n短语等不同语言成分之后\n构成新词\n,\n如\n:\n作家\n、影星\n、\n影帝\n、倒爷\n、渔翁\n、\n行长\n、\n杠精\n、笨蛋\n、\n情痴\n、\n媒婆\n飞车党\n、\n实力派、\n月光族、暴发户\n、\n工程师\n、\n老婆奴\n、\n狙击手\n、赔钱货\n临终关怀师\n、\nRCA分析师\n、行为艺术家\n、\n酒店试睡员\n、\n高考离婚族\n对比以上三组词语\n,\n可知在第\n一组中\n,\n“ 指人\n” 类词缀与单音节语素\n、\n单音\n节词组合\n,\n在第二组中\n,\n“ 指人\n” 类词缀与双音节语素\n、\n双音节词组合\n,\n在第三\n组中\n,\n“ 指人\n” 类词缀与短语/字母词组合\n,\n由此可见\n“ 指人\n” 类词缀结合面之广\n、\n构词能产性之强\n。\n最后\n,\n“ 指人\n” 类词缀的构词能产性特点又进\n一步促生了其构词类推性特点\n,\n如\n:\nX花\n:\n班花\n、\n系花\n、校花\n、厂花\n、\n警花\n、\n村花\n、\n姐妹花\n、\n交际花\nX星\n:\n歌星\n、\n舞星\n、\n影星\n、球星\n、\n童星\n、\n笑星\n、\n巨星\n、\n丑星\n语素\n“ 花\n有\n“ 比喻美女\n” 义\n,\n语素\n“ 星\n” 有\n“ 比喻某种突出的\n、\n有特殊作\n30\n[p.40]\n硕士学位论文\nMASTER\n'\nSTHESIS\n用或才能的人\n” 义\n,\n利用语素\n“ 花\n和\n“ 星\n” 的比喻义所构成的合成词都是人称\n名词\n,\n“ 指人\n” 类词缀利用同\n一“ 指人\n” 缀义与语言模式进行类推造词\n,\n语义开\n始类化\n,\n具有标记\n“ 某\n一类人\n”\n的功能\n。\n3.2\n“指人\n” 类词缀的语义特点\n汉语\n“ 指人\n” 类词缀在语义上主要具有五个特点\n:\n语义虚化\n、\n语义泛化\n、\n语\n义类化\n、\n语义具有粘附性\n,\n以及语义具有\n一定情感色彩\n。\n(\n一\n)\n“ 指人\n” 类词缀的语义虚化\n汉语中\n,\n语义虚化是\n一个过程\n,\n在这\n一过程中\n,\n语素的本义或基本义发生改\n变\n,\n从而出现了引申义或者比喻义\n。\n如\n,\n现代汉语中的典型词缀\n“ 头\n” 就是由实\n词意义虚化而来\n,\n逐渐成为构词后缀\n。\n汉语类词缀是实词语素的本义或基本义发\n生虚化后的产物\n,\n在意义上与实词语素仍保持比较紧密的联系\n,\n因此部分类词缀\n语义透明度相对较高\n,\n表现在类词缀与词根成分相结合后我们可以根据类词缀的\n语义指向对新词所具有的融合意义进行理解\n。在合成词中\n,\n类词缀的\n“ 指人\n” 缀\n义通过两种方式得以体现\n:\n一是类词缀语义虚化具有\n“ 指人\n” 义\n,\n二是类词缀语\n义转化具有\n“ 指人\n” 义\n。\n如\n:\nX家\n:\n画家\n、\n作家\n、\n艺术家\n、\n音乐家\n、\n钢琴家\n、\n舞蹈家、演说家\n、\n科学家\nX员\n:\n演员\n、\n职员\n、快递员\n、派送员\n、\n售货员\n、推销员\n、\n宇航员\n、\n航天员\nX师\n:\n教师\n、\n技师\n、厨师\n、\n医师\n、\n画师\n、\n工程师\n、\n理发师\n、\n摄影师\nX士\n:\n女士\n、\n斗士\n、\n勇士\n、\n护士\n、\n学士\n、\n硕士\n、\n博士\n、\n披头士\nX虫\n:\n书虫\n、\n米虫\n、懒虫\n、\n鼻涕虫\n、\n瞌睡虫\n、\n糊涂虫\n、\n可怜虫\n、\n应声虫\nX鬼\n:\n烟鬼\n、\n酒鬼\n、赌鬼\n、\n懒鬼\n、\n冒失鬼\n、\n吝啬鬼\n、\n胆小鬼\n、\n势利鬼\nX蛋\n:\n笨蛋\n、\n坏蛋\n、懒蛋\n、\n愁蛋\n、\n傻蛋\n、\n软蛋\n、\n倒霉蛋\n、\n糊涂蛋\n通过以上例词可以发现\n,\n“ 家\n2”“ 员\n”\n“ 师\n”\n“ 士\n” 等语素语义虚化后与词\n根成分相结合具有\n“ 指称某\n一类人\n”\n的功能\n,\n“ 虫\n”“ 鬼\n”“ 蛋\n” 等语素在引申\n义的基础上语义发生转化从而产生比喻义\n,\n也就是说话人利用修辞学造词法使其\n产生了\n“ 指人\n” 义\n。\n由此可见\n,\n“ 指人\n” 类词缀的语义虚化是其\n“ 指人\n” 缀义得\n以产生的重要条件\n。\n汉语典型词缀大多是由实词语素虚化而来\n,\n同样的\n,\n语义虚化也是类词缀产\n生的\n一个重要途径\n,\n现代汉语中大部分类词缀都是语义虚化的产物\n。\n本文\n54个\n“ 指人\n” 类词缀中\n,\n由于语义虚化而产生\n“ 指人\n” 缀义的类词缀共有\n37个\n,\n我们\n借助\n《辞源》\n(第三版\n)对这\n37个\n“ 指人\n” 类词缀的本义或基本义进行考察\n:\n3\n1\n[p.41]\n硕士学位论文\nMASTER\n'\nSTHESIS\n表\n3\n-1\n:37个\n“ 指人\n,,类词缀在\n《辞源》中的前两个义项考察\n序号\n|\n类词缀\n丨释义\n1奴1古罪人\n、\n罪人子女\n,\n或被掠卖剥夺人身自由的都称奴\n;\n2对自己的谦称\n。\n2迷1迷惑\n;\n2迷路\n,\n分辨不清\n。\n^\n3\n\"\"\n手1人体上肢的总名\n,\n一般指腕以下持物的部分\n;\n2表示手的动作\n。\n^\n4帝1古代指最高的天神\n,\n如上帝\n、\n天帝\n;\n2君主的称号\n,\n皇帝\n,\n5家1家族\n,\n家庭\n;\n2结婚成家\n。\n6W1古代军队编制以二千五百人为师\n;\n2老师\n,\n教师\n。\n^\n7\n一\n员1定数的人或物\n,\n人员\n?\n,\n2周围\n。\n8\n霸\n1古代诸侯之长\n;\n2胜过他人\n。\n9虫1昆虫的通称\n;\n2泛指动物\n。\n^\n10棍1棍棒\n;\n2无赖\n、\n恶徒\n=\n1\n1\n^\n星1宇宙间发射或反射光的天体\n;\n2星宿名\n。\n胃\n12友古称同志为友\n。\n13户1单扇门\n;\n2住户\n,\n一家为\n一户\n。\n14生1生长\n,\n长出\n;\n2生育\n,\n养育\n。\n15\n^\n士1从事耕种等劳动的男子\n;\n2古时四民之\n一\n。\n位于庶民之上\n。\n^\n16\n鬼\n1迷信称 个\n“ 指人\n” 类词缀本义或基本义都具有\n“ 血缘或姻亲关\n系\n”\n,\n但是在现代汉语中这些\n“ 指人\n” 类词缀粘附在词根之后所构成的新词意义\n不再局限于亲属称谓中\n,\n如\n:\nX哥\n:\n大衣哥\n、\n犀利哥\n、\n唯哮哥\n、\n淡定哥、\n玩命哥\n、\n目盡睡哥\n、\n学问哥\nX妹\n:\n打工妹\n、\n洗脚妹\n、\n洗头妹\n、\n四眼妹\n、\n外来妹\n、\n学生妹\n、\n农家妹\nX嫂\n:\n月嫂\n、\n军嫂\n、\n警嫂\n、\n房嫂\n、\n空嫂\n、\n胖嫂\n、\n邮嫂\n、\n环卫嫂\nX爷\n:\n房爷\n、\n款爷\n、\n军爷\n、\n倒爷\n、\n坟爷\n、\n冒死爷\n、\n担忧爷\n33\n[p.43]\n/pi^\n\\\n硕士学位论文\nMASTER\n'\nSTHESIS\nX姐\n:\n学姐\n、\n御姐\n、\n房姐\n、柜姐\n、港姐\n、\n包姐\n、\n劳模姐\nX婆\n:\n媒婆\n、\n神婆、\n产婆\n、接生婆、黄脸婆\nX弟\n:\n学弟\n、\n迷弟\n、\n房弟\n、\n徒弟\nX婶\n:\n房婶\n、\n月婶\n、\n打工婶\nX叔\n:\n房叔\n、\n鸟叔\n、\n炸鸡叔\n部分亲属称谓词的语义泛化使其在构词上具备了更高的能产性\n,\n但是不同亲\n属称谓词的语义泛化程度不同\n,\n如\n,\n“ 指人\n” 类词缀\n“ 弟\n”“ 叔\n”“ 婶\n” 的构词\n能力相对来说较弱\n,\n说明这两个亲属称谓词由于语义泛化程度较低\n,\n其\n“ 指人\n”\n缀义目前尚未稳定\n,\n未来或许会随着人们使用频率的提升而促使其\n“ 指人\n” 缀义\n得到进\n一步的强化\n。\n(三\n)\n“ 指人\n” 类词缀的语义类化\n苏宝荣\n、\n沈光浩\n(2014\n)认为\n,\n汉语类词缀的缀义是人们在实词义的基础上\n通过隐喻的方式进行类推所形成的类指\n(泛指\n)义\n,\n具有语义内涵与外延同时扩\n大的特点\n。\n?然而实际上汉语\n“ 指人\n” 类词缀的\n“ 指人\n” 缀义产生方式既有语义虚\n化\n、\n语义泛化\n,\n也有外来词语的借用\n。\n我们通过对比分析的方式对\n“ 指人\n” 类词\n缀在派生词中的语义指向进行分析后\n,\n认为语义类化应该是指\n“ 指人\n” 类词缀在\n与词根成分相结合后产生\n“ 标记具有某种特点的\n一类人\n” 义\n,\n如\n,\n类词缀\n“ 迷\n”\n在与不同成分的词根\n“ X\n” 相结合后都产生了\n“ 对\n...\n... 非常入迷的人\n;\n非常喜\n欢\n... ... 的人\n” 这\n一缀义\n,\n比如\n“ 书迷\n” 是指\n“ 非常喜欢看书或者收藏书籍的人\n”\n,\n“ 球迷\n” 是指\n“ 非常喜欢某种球类运动的人\n”\n,\n“ 电视迷\n” 是指\n“ 非常喜欢看电\n视的人\n”\n,\n等等\n,\n“ X迷\n” 语言模式所生成的人称名词具有明显的类化意义\n,\n艮P\n,\n人称名词所指对象在某些方面具有某种共同特点\n。\n我们再以类词缀\n“ 友\n” 为例进行说明\n。\n“ 友\n” 在古代汉语中是\n一个兼语词\n,\n多用作动词\n。\n程湘清在\n《汉语史专书复音词研宄》\n(2008\n)\n中指出\n:\n“ 朋友\n”\n一\n词大致产生于先秦时期\n,\n表示\n“ 亲属以外彼此有交情的人\n”\n,\n并与\n“ 朋\n”\n、\n“ 友\n”\n两个单音节词在同\n一时期共存使用\n。\n“ 朋友\n” 原是\n一个双音并列词语\n,\n但在长期\n使用过程中\n,\n逐渐受到偏正结构的压制\n,\n两个语素之间的并列关系被人们识读为\n修饰与被修饰\n、\n说明与被说明的关系\n,\n“ 朋\n” 逐渐具有了类义属性概念\n,\n修饰和\n说明\n“ 友\n” 的指称义\n。\n随着人们交往方式和范围的不断扩大\n,\n为满足人们表意精\n确的需要\n,\n人们利用\n“ X友\n” 语言模式来表达\n“ 在某\n一方面存在共同兴趣的人或群\n体\n;\n从事某\n一活动的人或群体\n” 的意义\n,\n并在仿拟构词机制的作用下创造出更多\n1苏宝荣\n,\n沈光浩\n.类词缀的语义特征与识别方法[J]\n.语文研究\n,\n20\n14\n(0\n4\n)\n.\n34\n[p.44]\n硕士学位论文\nMgyMMASTER\n'\nSTHESIS\n具有类似语义的新词语\n,\n如\n“ 网友\n”“ 漫友\n”\n“ 损友\n”\n“ 发烧友\n” 等\n。\n“ 指人\n” 类词缀的语义类化促使人们利用类推机制进行类推与仿拟造词\n,\n从\n而不断丰富汉语词汇系统\n,\n同时便于人们理解新词词义\n。\n(四\n)\n“ 指人\n” 类词缀的语义粘附\n朱德熙在\n《语法讲义》\n(\n1982\n)\n中提到\n,\n汉语中的真词缀只能粘附于词根成\n分之上\n,\n词缀与词根成分之间没有意义上的关系\n,\n只有位置上的关系\n。\n如\n:\n“ 子\n”\n在\n“ 孩子\n”\n“ 袖子\n”“ 桌子\n” 等词语中是位置相对固定的语素\n,\n词根成分与词缀\n成分之间的并无修饰关系\n;\n而\n一旦脱离词根成分\n,\n“ 子\n” 将不能被视为\n一个真词\n缀\n,\n其语素义有所分化\n。\n汉语类词缀与典型词缀在构词上都具有定位性\n,\n但是除此之外\n,\n类词缀与词\n根成分之间还存在\n一定的语义联系\n,\n因此类词缀在与词根相结合构成派生词时不\n仅会起标志名词的语法作用\n,\n还会表示\n一定的词汇意义\n,\n因此可以认为类词缀是\n汉语中尚未完全语法化的构词成分\n。\n“ 指人\n” 类词缀语义虚化程度高低决定了其语义粘附性的强弱\n,\n语义虚化程\n度高时语义粘附性强\n,\n反之则低\n。\n此外\n,\n“ 指人\n” 类词缀在构词时只有粘附在词\n根之上才具备\n“ 指人\n” 义\n,\n如\n“ 货\n”\n“ 蛋\n”\n“ 才\n等语素在\n“ 蠢货\n、\n贱货\n、\n笨蛋\n、\n坏蛋\n、\n天才\n、\n庸才\n” 等词语中具有\n“ 指人\n” 义\n,\n在\n“ 货物\n、\n货资\n、\n蛋糕\n、\n蛋壳\n、\n才能\n、\n才学\n” 等词语中不具备\n“ 指人\n” 义\n,\n因此类词缀的\n“ 指人\n” 缀义具有粘附\n性\n。\n(五\n)\n“ 指人\n” 类词缀的情感色彩\n在本文第二章第二节中\n,\n我们从构词能力\n、\n语义指向\n、\n情感色彩三个角度对\n“ 指人\n” 类词缀进行了分类\n,\n但是\n“ 指人\n” 类词缀情感色彩的产生原因还需要进\n一步分析\n。\n据此我们利用\n《现代汉语规范词典》\n(第\n3版\n)对\n54个汉语\n“ 指人\n”\n类词缀义项进行考察\n,\n得到\n15个具有明显情感色彩的\n“ 指人\n” 类词缀\n:\n表\n3\n-3\n:\n《现代汉语规范词典》\n中带情感色彩的\n“ 指人\n” 类词缀\n>号\n|类词級\n丨\n“ 指人\n” 义项\n|\n组词\n|\n情感色彩\n1奴对有某种特点的人的蔑称卡奴\n、\n证奴\n、\n洋奴\n、\n守财奴贬义\n2霸依仗权势欺压他人的人恶霸\n.\n渔霸\n、\n路霸\n、\n乡霸\n胃\n贬义\n.^比喻具有某种特点的人\n(含鄙视\n、\n轻蔑或谐懒虫\n、\n网虫\n、\n可怜虫\n、\n糊涂5\nJS谑意\n)虫\n虹乂\n4棍\n\"\n指具存某鸣特点的坏人恶棍\n、\n赌棍\n、\n讼棍\n、\n光棍\n̄ ̄贬义\n5星\n\"\n比喻某种突出的\n、\n有特殊作用或才能的人\n\"\n救星\n、\n影星\n、\n歌星\n、\n丑星褒义\n6士\n\"\n对人的美称勇士\n、\n烈士\n、\n女士\n、\n绅士\n̄ ̄\n褒义\n7鬼\n对具有某种特点的人的蔑称^n^贬义\n|\n[_%\n35\n[p.45]\nz2S\\\n硕士学位论文\nMASTER\n'\nSTHESIS\n|对人的昵称\n|机灵鬼\n、\n贪吃鬼\n、\n调皮鬼\n|\n亲昵^\n̄\n8\n̄\nm\n̄\n指具有某种属性的人\n(含贬义\n)歹徒\n、\n叛徒\n、赌徒\n、\n亡命f贬义\n9\n蛋\n比喻具有某种特点的人\n(含贬义\n)^贬义\n10\n花\n1\n比喻美女f\nH_褒义\n^\n1\n1K\n称具有某种不良品行的人\n(用于骂人\n)_贬义\n12\n佬\n称成年男人\nC有时含轻蔑意\n)豐篇\n、\n美国俺\n、\n船家佳\n、\n乡贬义\n13\n犯\n犯罪的人^\n3E\n'^贬义\n14魔比喻害人的东西或邪恶势力狂魔\n、\n色魔\n、\n恶魔\n、\n琴魔贬义\n1\n5才\n1|指某种人\n(从才能的标准说\n)\n|天才\n、\n高才\n、\n庸才\n、\n蠢才\n|褒义/贬义\n_\n根据表\n3\n-3\n,\n我们可以得知\n“ 指人\n” 类词缀情感色彩可以分为褒义\n、贬义及昵\n称三种\n,\n其中具有贬义情感色彩的\n“ 指人\n” 类词缀有\n12个\n,\n占比\n80%以上\ 类词缀义是\n“ 指有某些特征或从事某种职业的\n年轻人\n”\n,\n类词缀义在本义的基础上虚化产生\n,\n此时并无明显的褒贬情感色彩\n。\n“ 仔\n” 的另\n一个实词义项是\n“ 动物的小称\n”\n,\n由这\n一义项可以构成\n“ 猪仔\n、\n羊仔\n、\n牛仔\n” 等词语\n。但是在现代汉语中\n,\n“ 牛仔\n”\n一词用以指人时是\n一个仿译词\n,\n它\n是用汉语的语素逐\n一翻译外语原词\n“\ncowboy\n” 的\n“\ncow\n” 和\n“\nboy\n” 两个部分\n,\n即\n连同原词的意义和结构形式\n一起翻译过来\n,\n因此也是\n一种意译词\n,\n指\n“ 在美洲牧\n场上照顾牛马的人\n”\n。\n4\n.类词缀的褒贬情感色彩划分并不绝对\n,\n大部分\n“ 指人\n” 类词缀的情感色彩需\n要结合\n一定的语境进行分析\n,\n从而产生临时的褒义\n、\n贬义或者戏谑意\n。\n此外\n,\n外\n来词语的借用也会改变类词缀的情感色彩\n。\n顾江萍在\n《汉语中的日语借词研宄》\n(201\n1\n)\n中提出\n,\n“ 族\n” 在日语词汇系统中既是词\n,\n也是词缀\n,\n作词缀时表示\n“ 具有某种共同属性的\n一大类\n”\n。\n由此构成的\n“ 社用族\n”\n“ 暴走族\n” 等复合词在\n曰语词汇系统中\n一般都带有贬义色彩\n。\n但是\n“ 族\n” 字进入汉语词汇系统后\n,\n不仅\n构词能力显著增强\n,\n且词义情感色彩发生了由贬义转向中性义的变化\n,\n比如汉语\n词汇系统中的\n“ 暴走族\n”“ 丁克族\n”\n“ 不婚族\n”\n“ 上班族\n”“\nBP族\n”\n“ 考G族\n”\n等复合词都是中性义\n。\n3.3\n“指人\n” 类词缀的语用特点\n语用就是语言运用\n,\n表现在交际双方处于某种语言环境之下\n,\n为了达到某种\n交际目的或取得某种交际效果\n,\n从而采取特定的方式进行言语交际活动\n。\n从语用\n的角度出发\n,\n汉语\n“ 指人\n” 类词缀在表达手段\n、\n表达效果\n、\n语言使用环境\n、\n语体\n色彩\n、语言文化心理等方面都存在不同的特点\n。\n(\n一\n)表达手段\n1\n.利用比喻进行表达\n。\n由汉语\n“ 指人\n” 类词缀附加在词根成分之后所构成的人\n称名词在语言运用过程中具备的\n一个主要特点就是人们往往会利用\n“ 指人\n” 类词\n缀的比喻义进行话语表达\n。\n邢福义在\n《现代汉语》\n(20\n1\n1\n)\n中提出\n,\n一个词在新出现时\n一般是单义的\n。\n由于语言中的词相较于客观事物其数量有限\n,\n随着人们对客观事物认识的不断深\n化\n,\n人们会用同\n一个词表示具有\n一定联系的不同事物\n,\n词的多义现象由此产生\n。\n多义词的各个义项地位不等\n,\n性质不同\n,\n其中有的是本义\n,\n有的是基本义\n,\n有的\n40\n[p.50]\n/ga\\\n硕士学位论文\nMASTER\n'\nSTHESIS\n是引申义\n,\n有的是比喻义\n。\n有的比喻义是在本义或基本义上产生的\n,\n有的比喻义\n是从引申义产生的\n。在\n《现代汉语规范词典》\n(第\n3版\n)\n中\n,\n“ 指人\n” 类词缀\n“ 虫\n”\n“ 星\n”\n“ 蛋\n”\n“ 花\n“ 魔\n” 都被明确收纳了比喻义项\n。\n此外\n,\n“ 盲\n”“ 奴\n”“ 棍\n”\n“ 鬼\n”\n“ 货\n”\n“ 才\nl\nw等\n“ 指人\n” 类词缀在构成新词用以指人时也都具备\n一定的比\n喻效果\n,\n但是其具体的\n“ 指人\n” 缀义尚未稳定\n,\n需要结合\n一定的语言环境进行分\n析\n。\n陆俭明在\n《现代汉语语法研宄教程》\n(2004\n)\n中提出\n,\n隐喻和转喻是人类的\n一种重要思维方式\n,\n是人类认识与理解客观世界的工具\n。\n在语言运用过程中\n,\n人\n们会采取给旧词赋予新义或创造新词的方式来指称在某些方面具有相似性联系的\n不同事物\n,\n由此激发出许多旧词新义和仿拟词语\n。\n比如\n“ 车奴\n、\n电奴\n、\n房奴\n、\n卡\n奴\n、\n妻奴\n、\n工作奴\n、\n守财奴\n” 等词语中\n,\n“ 奴\n” 前面的可变成分\n“ X\n”\n多表示\n一种\n原因\n,\n“ 奴\n” 就是受到可变成分\n“ X\n” 的影响而产生的\n一种比喻性结果\n。\n词的比喻\n义建立在相似性基础上\n,\n当代新词语中的\n“ 奴\n” 不再指封建社会中的奴隶\n,\n而是\n指受到某种因素被束缚的人\n。\n二者之间的相似性特征是激发\n“ X奴\n” 新词语的基础\n。\n在\n“ 班花\n、\n校花\n、\n警花\n” 等词语中\n,\n“ 花\n” 有\n“ 比喻美女\n”\n的语素义\n,\n人们利用\n仿拟的方式创造\n“ 班草\n、\n校草\n、\n警草\n” 等词语\n。\n对语素\n“ 草\n” 赋予\n“ 比喻帅哥\n”\n的意义\n,\n但是语素\n“ 草\n”\n目前还未能成为\n“ 指人\n” 类词缀\n,\n是因为通过仿拟的方\n式所创造的新词其词汇意义是相对存在的\n,\n如\n“ 班花\n-班草\n、\n校花\n-校草\n”\n,\n但是\n我们注意到\n,\n汉语中有\n“ 姐妹花\n”\n的表达\n,\n但是没有\n“ 兄弟草\n”\n的表达\n,\n这就说\n明语素\n“ 草\n”\n的比喻义是人们根据语素\n“ 花\n” 的比喻义通过仿拟的方式产生的\n,\n其\n“ 指人\n” 义是临时的\n、\n相对存在的\n、\n不稳定的\n。\n未来随着人们对语素\n“ 草\n”\n的\n“ 指人\n” 义的高频使用\n,\n或许其比喻义会稳定下来\n,\n目前可以将其视为潜在的\n“ 指人\n” 类词缀\n。\n2\n.利用简略与类推进行表达\n。\n当汉语中的\n一个语素被高频使用\n,\n其语义具有稳\n定性与社会性\n,\n构词形式相对固定\n,\n出于语言的经济性原则\n,\n人们会根据汉语词\n汇的构成习惯对某\n一语言结构进行简化\n,\n短语出现词化趋势\n。\n我国改革开放以来\n新词创生的特点之\n一是缩略词非常多\n,\n表现也十分活跃\n。\n蒋向勇在\n《现代汉语缩\n略语的认知研宄》\n(20\n17\n)\n中将现代汉语缩略语分为缩合式缩略语\n、\n拼缀式缩略\n语和节略式缩略语三种类型\n,\n其中\n,\n部分由汉语\n“ 指人\n” 类词缀与词根成分相结\n合所构成的合成词在形式上具有缩合式缩略语的特点\n,\n即通过截取原词语中的代\n表性语素重新组合而成\n。\n如\n:\nX姐\n:\n空姐\n(空中小姐\n)\n、\n柜姐\n(柜台小姐\n)\n、港姐\n(香港小姐\n)\n4\n1\n[p.51]\n硕士学位论文\nMASTER\n'\nSTHESIS\nX星\n:\n影星\n(电影明星\n)\n、笑星\n(搞笑明星\n)\n、\n舞星\n(舞蹈明星\n)\nX粉\n:\n职粉\n(职业粉丝)\n、铁粉\n(铁杆粉丝\n)\n、\n颜粉\n(颜值粉丝\n)\n此外\n,\n语言具有类推机制\n,\n同时类推也是人的\n一种思维形式\n。\n语言的类推机\n制促使\n“ 指人\n” 类词缀构词具有较强能产性\n,\n如\n,\n“ 族\n” 原指具有共同属性的\n一\n类事物\n,\n常用的词有\n“ 种族\n”\n“ 民族\n”“ 家族\n” 等\n。\n但是在当代汉语中\n,\n“ 族\n”\n的指代的范围有所扩展\n,\n“ X族\n” 可以指称具有某种共同特征或兴趣爱好的\n一群人\n,\n如\n“ 上班族\n、\n慢活族\n、\n月光族\n、\nBOBO族\n、\nSOHO族\n” 等\n。\n“ X族\n” 新词语的大量\n产生除了受自身形式和意义的影响外\n,\n还与当今社会的发展直接相关\n。\n曹大为\n(2007\n)认为\n,\n把具有共同特征的\n一类人称作\n“ XX族\n” 体现出鲜活的时代气息\n,\n表达新奇\n,\n容易得到年轻人的青睐\n,\n且表达简洁明了\n,\n易于类推\n,\n具有迅速传播\n的潜质\n。\n?\n(二\n)表达效果\n新时期许多类词缀\n“ 指人\n” 缀义的产生都是人们为了表义明确而创造的\n。\n如\n,\n现代汉语中\n“ 虫\n” 本指\n“ 昆虫\n”\n,\n并不指人\n,\n这点在前三版\n《现代汉语词典》词\n条注释中可以看出\n:\n1996年版的\n“ 虫\n” 词条只有\n一个义项\n:\n“ 虫子\n”\n;\n2005年版\n才在\n“ 虫\n” 词条下增加了\n一个新义项\n:\n“ 比喻具有某种特点的人\n(多含轻蔑\n意\n)\n”\n。\n可见用\n“ 虫\n” 来指称人是当代汉语词的新用法\n。\n由类词缀\n“ 虫\n” 构成的\n“ 书虫\n”\n(喜欢书籍并沉迷其中的人\n)\n、\n“ 馋虫\n”\n(嘴馋贪吃的人\n)\n、\n“ 应声虫\n”\n(没有主见\n、\n随声附和的人\n)等词语都可以用来比喻具有某种特点的人\n,\n利用比\n喻义进行表达可以在\n一定程度上体现出说话人的情感态度\n。\n我们认为\n,\n类词缀\n“ 虫\n” 之所以能够产生\n“ 指人\n” 义\n,\n一个重要的原因在于\n用\n“ X虫\n” 称人能够产生表意生动的特点\n,\n同时具有称呼上的简洁性与新颖性\n。此\n夕卜\n,\n人们利用比喻的方式创造新词\n,\n可以在概念义之外附加评价义\n,\n使新词语在\n言语交际过程中具有更加形象生动\n、\n趣味盎然的表达效果\n,\n同时也反映出人们创\n造新词上崇尚新异幽默\n、\n生动形象的共同审美心理倾向\n。\n(三)语用环境\n由汉语\n“ 指人\n” 类词缀构成的人称名词目前主要流行于网络媒体中\n,\n并且随\n着网民群体的低龄化\n,\n更多出现在年轻人的日常交际中\n。\n为了达到求新求异的表\n达效果\n,\n一些新闻标题中也会使用\n“ 指人\n” 类词缀进行构词表达\n,\n多带有调侃\n、\n戏墟意味\n。\n前文我们分析了54个汉语\n“ 指人\n” 类词缀的情感色彩\n,\n强调了情感色\n彩义不是\n“ 指人\n” 类词缀语义的必要构成成分\n,\n而是\n一种附加成分\n,\n同\n一个\n“ 指\n1曹大为\n.\n“ 族\n” 的类词缀化使用分析\n[J\n]\n.山东社会科学\n,\n2007(05)\n.\n42\n[p.52]\n硕士学位论文\nMgip\nfMASTER\n'\nSTHESIS\n人\n” 类词缀在不同词语中的情感色彩有所不同\n。\n如\n:\n乂霸\n1\n:\n乡霸\n、路霸\n、\n票霸\n、\n市霸\n、\n狱霸\n、\n座霸\n、\n恶霸\n乂霸\n2\n:\n笔霸\n、考霸\n、\n面霸\n、投霸\n、\n学霸\n、\n听霸\n、\n萝霸\n在第\n一组词语中\n,\n以\n“ 霸\n” 为\n“ 指人\n” 类词缀的加缀结构新词语都是贬称\n,\n类词缀\n“ 霸\n” 使用的是\n“ 强横无理\n、\n依仗权势压迫人民的人\n” 这\n一义项\n;\n在第二\n组词语中\n,\n以\n“ 霸\n” 为\n“ 指人\n” 类词缀的加缀结构新词语都是褒称\n,\n类词缀\n“ 霸\n”\n使用的是\n“ 在同类中最强\n、\n最多或最大的人\n” 这\n一义项\n。\n“ X霸\n” 式新词语尽管词\n语模式相同\n,\n但在情感色彩上存在很大差异\n,\n“ 霸\n” 这种褒贬义兼备的现象在现\n代汉语词汇中是很独特的\n。\n此外\n,\n由同\n一\n“ 指人\n” 类词缀构成的同\n一人称名词在\n特定语言环境中其褒贬情感色彩也会发生变化\n,\n如\n,\n由\n“ 指人\n” 类词缀\n“ 花\n”\n附\n加在词根成分之后所构成的人称名词\n“ X花\n” 都是褒称\n,\n“ 班花\n” 指\n“ 班集体中长\n得最漂亮的女孩子\n”\n,\n但是有时人们也会用\n“ 班花\n” 来称呼\n“ 班集体中长得最丑\n的女孩子\n”\n,\n这是人们故意运用反语的修辞格式来加大讽刺力度或使语言幽默诙\n谐\n。\n(四\n)语体色彩\n人们在言语交际活动中\n,\n会根据交际领域和交际目的不同而采取特殊表达手\n段\n,\n从而形成风格各异的语言表达体系\n,\n也就是语体\n。\n现代汉语语体系统可以分为口头语体和书面语体两大类\n,\n口头语体的主要特\n点是遣词造句较为随意\n,\n语气生动活泼\n。\n从语体色彩上看\n,\n大多数汉语\n“ 指人\n”\n类词缀与词根成分相结合所构成的人称名词主要表现出浓厚的口语色彩\n,\n如\n,\n由\n“ X控\n” 语言模式生成的新词语\n“ 声控\n”“ 颜控\n”\n“ 御姐控\n”“ 萝莉控\n” 等人称名\n词主要活跃于网络\n、\n游戏等媒体用语当中\n,\n而由\n“ X虫\n” 语言模式生成的人称名词\n在口语中使用频率较低\n,\n“ 指人\n” 类词缀\n“ 虫\n”\n己经逐渐归入旧有\n“ 指人\n” 类词\n缀当中\n,\n构词能产性趋于稳定\n,\n类似的还有\n“ X师\n”“ X家\n”“ X夫\n” 等\n,\n在这些\n语言模式中\n,\n类词缀的\n“ 指人\n” 缀义产生时间早\n、\n通用时间长\n,\n“ 指人\n” 缀义渐\n趋稳定\n,\n在口语\n、\n书面语中都有所使用\n,\n已不能满足人们从众从优与求新求异的\n语言文化心理\n,\n因此口语色彩略弱于书面语色彩\n。\n(五\n)语言文化心理\n从众从优与求新求异的语言文化心理是汉语\n“ 指人\n” 类词缀不断构成新词的\n重要推动力量\n。\n杨旭明\n、\n杨文全\n(2009\n)\n认为\n,\n“ 从众\n” 是指向大众时尚看齐\n,\n“ 从优\n” 是指在言语上主动模仿在政治\n、\n经济\n、\n文化等方面比自己优越的人群的\n43\n[p.53]\n硕士学位论文\nMASTERSTHESIS\n语言\n。\n?在这\n一语言心理的影响下\n,\n人们力求从语言上认同和模仿流行词汇\n,\n表现\n为人们在交际过程中自觉或不自觉地运用新的语言材料进行创新性或独具个人特\n色的表达\n。\n表现在词汇上就是人们利用\n“ 指人\n” 类词缀进行仿拟造词\n,\n从而促生\n大量新词语\n。\n与此同时\n,\n人们在语言使用上还会表现出另\n一种心理倾向\n,\n即对已\n有的词语和表达方式会慢慢产生厌倦心理\n,\n总是想方设法去追求新奇的\n、\n陌生化\n的词语和言语表达方式\n,\n不断创造新的词语\n。\n比如\n,\n汉语中本来己经存在\n“ 乘客\n”\n“ 旅客\n”\n“ 顾客\n” 等许多\n“ X客\n” 式词语\n,\n在借入英语词hacker时人们采用半译音\n半译义的方式将其译为\n“ 黑客\n”\n,\n由于这\n一新词语的产生手段很独特且受到认可\n和推崇\n,\n于是引发了仿拟\n、类推造词的大量使用\n,\n一大批英文词如\nBlogger、\npod\n?\ncast\n、witkey\n、digger、sharer\n、cracker等或以谐音\n、或以仿拟的方式分别被译为\n“ 博客\n”\n“ 播客\n”“ 威客\n”\n“ 掘客\n”\n“ 快客\n” 等新词\n。\n由此可见\n,\n由\n“ 指人\n” 类\n词缀附加在词根之后构成的人称名词在人们求新求异心理的驱动下产生\n,\n又在从\n众从优心理的驱动下尽可能保持着与已有词语的关联\n,\n新生词语的这种联系又是\n“ 指人\n” 类词缀不断构成新词的基础\n。\n1杨旭明\n,\n杨文全\n.当代汉语新词新语探析[J]\n.汉语学习\n,\n2009(01\n)\n.\n44\n[p.54]\n硕士学位论文\nMASTER\n'\nSTHESIS\n第四章\n“指人\n” 类词缀的国际中文教学现状\n4.1\n《国际中文教育中文水平等级标准》收录\n“指人\n” 类词缀情况\n目前针对国际中文教育词汇教学的大纲主要有五个\n:\n《汉语水平词汇与汉字\n等级大纲》\n(\n1992\n)\n、\n《汉语水平等级标准与语法等级大纲》\n(\n1996\n)\n,\n《新汉\n语水平考试大纲》\n(2009\n)\n、\n《国际汉语教学通用课程大纲\n(修订版\n)\n》\n(2014\n)\n和\n《国际中文教育中文水平等级标准》\n(202\n1\n)\n。\n在这五个大纲中\n,\n《汉语水平\n词汇与汉字等级大纲》\n(\n1992\n)共收词\n8822个\n,\n分为甲乙丙丁四个等级\n。\n它在国\n际中文教学领域影响最大\n,\n多年来受到广泛重视\n。\n但由于出版和使用多年\n,\n在使\n用过程中逐渐暴露了\n一些问题\n。\n因此国家汉办又出台了\n《新汉语水平考试大纲》\n(2009\n)\n,\n词汇等级变为六级\n,\n总词汇量较原HSK有所减少\n。\n为适应国际汉语教学形式的新变化\n,\n及时总结汉语教学的研宄成果\n,\n更好地\n规划和指导汉语教学课程设计\n、\n教材编写\n、\n能力评价等工作\n,\n2013年孔子学院总\n部/国家汉办组织相关专家启动了\n《国际汉语教学通用课程大纲》修订工作\n。\n《国\n际汉语教学通用课程大纲\n(修订版\n)\n》\n(2014)\n由五级目标等级调整为六级目标\n等级\n,\n与汉语水平考试\n(HSK)相\n一致\n。\n对各级字\n、\n词\n、\n语法\n、\n话题等语言知识\n进行更新\n,\n并强调与HSK的关联\n。\n新修订\n《教学大纲》共收录词语\n5000个\n,\n一到\n六级新词汇分别为150/150/300/600/1300/2500\n。\n近几年\n,\n随着中国在国际交往中的作用日益凸显\n,\n中文学习需求不断扩大\n,\n国际中文教育迫切需要\n一套科学规范\n、\n包容开放\n、\n便于实施的规范标准\n,\n用以指\n导中文学习\n、\n教学\n、\n测试与评估各个环节\n,\n推动教育教学质量和效果显著提升\n。\n据此\n,\n中华人民共和国教育部国家语言文字工作委员会于\n202\n】年\n3月发布了新\n一\n版\n《国际中文教育中文水平等级标准》\n(以下简称新\n《标准》\n)\n,\n并于同年\n7月正\n式实施\n。\n新\n《标准》共收录词汇\n1\n1092个\n,\n将学习者的中文水平从低到高分为初\n、\n中\n、\n高三等\n,\n在每\n一等内部根据水平差异各分为三级\n,\n共\n“ 三等九级\n”\n,\n其中初\n等词汇\n2245个\n,\n中等词汇\n321\n1个\n,\n高等词汇\n5636个\n。\n下面是新\n《标准》\n中\n《词\n汇表》所收录汉语\n“ 指人\n” 类词缀及构词结果\n:\n表4\n-1\n:\n《词汇表》中\n“ 指人\n” 类词缀收录情况\n等级类词缀构词结果^\n类词缓敷量\n友\n、\n网友\n-— —\n.工\n初等\n'生学生\n、\n医生\n、\n男生\n、\n女生\n4\n_\n1\n1\n二级词汇\n̄\nK:\n|班长\n、\n队长\n、\n家长\n、\n市K\n、\n校长\n、\n院\n1C\n、\n组长7\n45\n[p.55]\n硕士学位论文\nMASTER\n'\nSTHESIS\n家\n2画家\n、\n作家\n、\n科学家\n3\n客旅客\n、游客\n、\n顾客\n3\n\"\n生考生\n、\n留学生\n2\n师教师\nI\n星\n■\n1\n员^员\n、\n队员\n、\n公务员\n、\n会员\n、\n演员\n、服务员\n̄ ̄\nr\n̄\n迷歌迷\n、\n球迷\n2\n^\n手对手\n、\n歌手\n、\n选手\n3\n̄\n三级词汇长部长\n、\n所长\n2\n才「\n人才\n1\n家\n2专家\n1\n师工程师\n1\n士\n̄^\n、\n女士\n、\n护士\n、\n战士4\n员售货员\n、\n运动员\n2\n四级词汇\n一\n生研究生\n、\n毕业生\n2\n_\n师律师\n̄\nT\n̄\n", "title": "“指人”类词缀的国际中文教学研究", "topic": "指人 类词缀", "touch": "판별 기준·분류 체계와 함께, 결론의 교육적 시사점(국제 중국어 교육) 서술 근거로 쓸 수 있다.", "updatedAt": "2026-10-06T11:57:00Z", "url": "", "year": "2022", "id": "ec4eddc8", "pid": "p_legacy01"}, {"analysis": "", "author": "陈鑫", "ch": "pdf", "createdAt": "2026-10-06T11:56:00Z", "cut": 0, "fileName": "新兴指人类词缀语法化中的主观化_陈鑫.pdf", "grade": 4, "gradeBy": "AI", "gradeReason": "문법화·주관화라는 이론적 설명 틀을 제공해 형성 기제 장의 핵심 근거가 된다.", "insight": "", "keywords": ["语法化", "主观化", "语义虚化", "语用推理", "党", "帝", "花", "奴", "族"], "kind": "학술논문", "myView": "", "pages": 3, "publisher": "新课程导学, 2020(09上)", "summary": "党·帝·二代·狗·花·控·奴·嫂·族 등 신흥 지인 유사접사의 문법화 과정에서 주관화가 함께 일어남을 논증한다. 양의 격률에 따른 화용 추론이 의미 범화·추상화를 이끌고, 형식은 자유에서 의존으로 바뀌며, 객관적 의미는 약해지고 화자의 주관적 평가가 강해진다고 본다. '花'의 의미 자질 변화(+여성 +젊음 +아름다움 → '뛰어난 여성')를 대표 사례로 든다.", "text": "[p.1]\nKE YAN LUN WEN | 科研论文\n25\n新\n课\n程\n导\n学\n2020.09\n(\n上\n)\n语言中的重叠、语气词、词缀都有表情功能,这是主观\n性在语言中的表现手段,Traugott 强调主观化是语法化的一\n个重要机制,认为它们之间相互联系。指人类词缀在语法化\n中,逐渐从本义中抽离出来,词根义渐弱,会话信息减少,\n在足量准则和不过量准则的制约下,促使受话人从语用上推\n出言者想要强调的信息,语素义虚化后形成的词模由于类推\n机制主导下,反复使用,加快了语法化进程,也使得语素的\n形式越来越不自由,意义上越来越依托于说话人的主观感受。\n本文结合当下新兴的指人类词缀,着重探索其语法化进程以\n及语法化中的主观化。\n一、主观性在汉语词缀中的凸显性\n语法化最早由元朝的周伯琦在《六书证伪》中提出:“大\n抵古人制字,皆从事物上起。今之虚字,皆古之实字。”语\n法化是一个渐进的过程,不是一蹴而就的,因此语法化的程\n度也常有不同,语法化的程度越高,就越倾向于采用形尾和\n零形式,按照语法化演变的阶段,可做出如下划分:词汇形\n式(>副词)>介词 >词缀/ 形尾>零形式。\n可见词缀的语法化程度较高,词缀的语法化是否涉及主\n观化,根据Traugott 的观点,的确可以做出如是猜想。\n语言的主观性和主观化最早由Lyons 提出,主观性是说\n话人在说出一段话的同时表明自己对这段话的立场、态度和\n感情。如果这种主观性在语言中用明确的结构形式加以编码,\n或者一个语言形式经过演变而获得主观性的表达功能,则谓\n之主观化。主观性的表达手段有很多,如动词重叠式“看看”\n“听\n听”“走走”,是在减弱话语的命题功能,转而提升言谈功能,\n负载说话人对某个语用信息的强调。汉语中,词缀和重叠一样,\n也是一种主观性的表达手段。董秀芳在《汉语词缀的性质与\n汉语词法特点》中曾提道,“汉语派生结构的类型以表达性\n派生为主。”表达性派生即反映说话人的主观态度,如后缀“子、\n儿、头”有指小功能,后又衍生出“喜爱”的主观评价功能,\n又如前缀“老、小、阿”都有表示说话人对其所称呼者的亲近、\n喜爱的感情功能。可见,在词缀化过程中,的确不可否认有\n主观化的存在。\n摘要:除词缀外汉语中还有大量的类词缀,它们意义已经虚化,但同原词根意义仍是藕断丝连的状态,与典型的词缀相比,类词缀的\n新生类推潜能无限,作为一个词模可以不断类推出很多新词新语指称新的概念。类词缀的语法化过程中涉及主观化,说话人要传达个人的\n主观感受,不可避免地对客观描述的词语加以主观识解。指人类词缀的语法化演变中,语义上由实渐虚,形式上由自由变为黏着,语法化\n中也伴随着主观化,表现为客观意义减弱,主观意义加强,经过了语义的重新调整,同时,使用上因为说话人的主观性表达,语用增强。\n了解指人类词缀语法化中的主观化,有助于我们认识和把握实词虚化的规律。\n关键词:类词缀 语法化 主观化\n新兴指人类词缀语法化中的主观化\n文/ 陈鑫 编辑/ 邓小青\n二、指人类词缀的语法化过程\n根据《“X 花”的语义语法特征——兼论指人类词缀“花”\n的主观化》《说流行语“X 党”——兼论指人语素的类词缀化》\n《现代汉语类词缀的定量与定性研究》《语言接触影响下类\n词缀的汉化与显化》《“狗”的类词缀化及相关问题研究》《现\n代汉语新词新语五类类词缀研究》《现代汉语新兴指人类词\n缀探究》,结合王洪君、富丽提出的类词缀的判定标准(单\n向高搭配性、结构类型个别化、类化作用、定位、意义泛化、\n新生类推潜能无限),选取几个典型的新兴指人类词缀——党、\n帝、二代、狗、花、控、奴、嫂、族。\n这些指人类词缀的语法化过程包括由语用推理引起的语\n义虚化及语形变化。\n(一)语用推理引起的语义虚化\n指人类词缀的语法化首先表现在意义上,原词根义在使用\n中逐渐消损,受语用原则制约,而负载更多的语用信息,这是\n由语用推理引起的,具体表现为语义泛化、语义抽象化两个方面。\n1. 语义泛化。词义的类化或泛化是语素成为类词缀的前\n提条件。“花”的本义是“种子植物的有性繁殖器官,由花瓣、\n花萼、花托、花蕊组成,有各种颜色,有的很艳丽,有香味”,\n可用来喻指美女,如“娇花巧笑久寂寥”(唐· 白居易《霓裳\n羽衣舞歌》);前面可以加“玫瑰”“月季”等指代花的品\n种的名词,但加名词“某一类人的聚合单位”构成“X 花”,\n如“班花”“系花”“厂花”,是原名词“花”所不具备的功能,\n当听话人接触到这样的表达时,受语用原则(主要是足量准\n则和不过量准则)制约,推理出说话人肯定要传达某种特殊\n的信息,即“年轻、漂亮又突出的女性”。\n这表明“花”的语义开始发生了变化。“班花”“校花”\n等诸类词的性质、意义、特点经过抽象、概括浓缩在“花”\n这一语素中,花从本义抽离出来,成为负载了原型内涵的原\n型标记,与“有组织的团体”(如学校、学院、班级)相组合,\n构成“X 花”。\n2. 语义抽象化。“花”的意义虚化后,最初的语义特征\n是[+ 女性,+ 漂亮,+ 年轻,+ 突出],还有比较实在的词汇\n[p.2]\n科研论文| KE YAN LUN WEN\n26\n新\n课\n程\n导\n学\n2020.09\n(\n上\n)\n意义,处于虚化过程中,但尚未完全虚化。随着社会的发展,\n“花”的语义虚化度愈来愈高,有作为类词缀潜质的“花”\n能产性也在增强,开始组配成警花、女人花等词语,但所指\n称的人却并不一定具有“漂亮”“年轻”的语义特征。出于\n交谈策略“足量准则”和“不过量准则”的考虑,听话人可\n以认为说话人是要传递一个特殊的信息,即说话人想强调所\n称呼的这个人是“一位杰出的女性”。“花”的意义逐渐虚化,\n甚至可以抽象概括指“女性”,而其最开始的语义特征[+ 年轻]\n[+ 漂亮][+ 突出] 存在不同程度的损耗。\n同样地,当出现某种不同于该语素的普遍用法的时候,\n就会引导说话人在足量准则和不过量准则的制约下推导出该\n语素的引申义,例如,“帝”从“宇宙的创造者和主宰者”\n抽象概括为“在某方面或某领域有某一专长的人”;“党”\n由“为了政治目的结合起来的团体”抽象概括为“有共同爱\n好、属性的群体”;“二代”从“指产品的更新换代”抽象\n概括为“对父母财富状况等有继承的一类人”;“狗”从“最\n早驯化的家畜”抽象概括为“喜欢或常常做某类事的一类人,\n或者是标识其身份的一类人”;“控”从“控告、控制”的\n实在意义抽象概括为“具有强烈的嗜好和痴迷的状态,甚至\n达到病态心理的人”;“奴”从“受压迫而失去政治权利的\n人”抽象概括为“为追求某事物而不断奔波忙碌、承受巨大\n压力的人”;“嫂”从“哥哥的妻子”抽象概括为“某种受\n尊重的身份”;“族”从“有血缘关系的家族”抽象概括为“有\n某种共同属性的一类人”。\n这些指人类词缀的意义泛化都是在语用原则规范下推导\n出来的,词义的偏离使得听话人去推导出说话人想传达的某\n部分语用信息,如果将这些语素以词根身份出现的义项看作\n无标记项,听话人无须推理也可以知道说话人传达的意思,\n那么,这些语素意义虚化后以类词缀的身份参与构词则可看\n作是有标记项,原词根义的陨落使得受话人不得不从语用方\n面去弥补缺失的信息,即是语用推理引起了语义演变。\n(二)类推和重复引起的语形变化——由自由变为黏着\n在类推机制及语用推理的作用下,词模“X 党/ 帝/ 二代\n/ 狗/ 花/ 控/ 奴/ 嫂/ 族”开始发挥作用,如由“上班狗”触\n发出与其对应的群体“学生狗”,进而细分出“考研狗”“高\n三狗”“硕士狗”“博士狗”,由尊称“军嫂”“警嫂”泛\n化为“从事某种受人尊重的工作的人”,如“空嫂”“环卫\n嫂”,“狗”“嫂”的语义虚化程度越高,类推潜能也越显\n著,能组配更多的新词,随着使用范围扩大、使用频率提高,\n重复所带来的效果之一就是适应,高频重复使得反应者对刺\n激物的反应持续减弱,最终导致刺激物的形式和意义被磨蚀。\n在语法化过程中,重复可以导致形式发生弱化,体现为这些\n指人类词缀从不定位变为定位,由自由变为黏着。\n三、指人类词缀语法化中的主观化\n汉语是一种主观性比较强的语言,主观性是客观存在的,\n类词缀“党、帝、二代、狗、花、控、奴、嫂、族”语法化\n的机制之一就是主观化,主要体现在三个方面——体现说话\n人的视角、情感和认识。\n(一)指人类词缀中“言者”情感的流露\n指人类词缀的主观性首先体现在说话人的“情感 ”上,\n“情感的表达也可以看作一种社会指称,即人们从周围交往\n的人和社会环境中获取感情信息来帮助理解不确定的信息,\n并做出相应的反应”。这就是所谓的移情现象。试比较以下\n几句话。\n(1)一丛深色花,十户中人赋。——白居易《买花》\n(2)有约不来过夜半,闲敲棋子落灯花。——赵师秀《约客》\n(3)娇花巧笑久寂寥。——白居易《霓裳羽衣舞歌》\n(4)他模仿普希金的语句给班花写了50 封情书。(BCC\n语料库)\n(5)中国网球选手李娜,获封6 月“女人花 ”。(BCC\n语料库)\n从例(1)到例(5),“花”的词根义逐渐消损,主观\n性渐次增强,类词缀“花”融入了说话人的喜爱、褒义的感\n情色彩。\n(二)指人类词缀中“言者主语”的显现\n视角是说话者对客观情状叙述的角度,句子的主语是说\n话人叙述的出发点,当说话人把“自我”也放在整个句子主\n语中,就隐含了“言者主语”在内。可比较以下几个例子。\n(6)本报记者刘志强“‘抢’到房子了,也当上‘房奴’\n了”,你说我该乐还是该愁?(BCC 语料库)\n(7)12 月上映的三部大片均有葛优主演,媒体不禁戏称\n葛优为“贺岁帝”,玩味之余,也暴露了中国电影产业链上\n演员后继乏人的窘状。(《光明日报》2010 年12 月14 日)\n(8)清华大学新闻与传播学院陈昌凤教授认为,“贫二代”\n学生确实在生活中、工作中、学习中处于相对的弱势。(《北\n京青年报》2009 年9 月2 日)\n(9)当下不少学生已成为“手机控 ”“iPad 控”,这给\n一些学生家长带来了新烦恼。(BCC 语料库)\n这几组句子的主观性都很强,除了语法上的主语外,还\n隐含了高层次的“言者主语”,(6)中将刘志强划类于“房\n奴”,是说话人主观上的选择,房奴是“因为买房不断奔波忙碌、\n承受巨大压力的人”,刘志强“因为买房而承受巨大压力”\n是说话人的主观判断,这就是句子中隐含的主语;(7)中将\n葛优戏称为“贺岁帝”也是说话人主观上对葛优出演的肯定;\n(8)中对“贫二代”学生的界定范围虽然有一定的客观依据,\n但是“贫二代”的程度也有高有低,是否都处于相对的弱势,\n也是说话人的主观判断;(9)中的“手机控”亦是如此,是\n人为地、主观地归类划分。\n(三)指人类词缀中“言者”认识的映现\n言者的认识往往通过某些特殊的词汇体现出来,指人类\n[p.3]\nKE YAN LUN WEN | 科研论文\n27\n新\n课\n程\n导\n学\n2020.09\n(\n上\n)\n词缀大多都隐喻着说话人对客观情状的某种主观识解。请看\n以下几个例子。\n(10)一只分不清白天黑夜半死不活的考研狗。(BCC\n语料库)\n(11)网站要提高内部规章制度的可操作性,从内部遏\n制“标题党”产生。(BCC 语料库)\n(12)寂寞党,穷二代,不当民,经济适用男,人们的\n幽默感仍在。(《新京报》2009 年12 月6 日)\n(13)花明天的钱圆今天的梦成为一种时髦,\n“月光族”\n“城\n市新贫族”“百万负翁”等越来越多的消费理念仿佛是一夜\n之间闯入了我们的生活。(BCC 语料库)\n从例(10)到(13),无一没有表达说话人主观上的调\n侃或不满,并且,通过替换比较“考研族”“考研党”“考\n研狗”,“标题党”“标题狗”,可以发现从族到党到狗,\n戏谑义愈来愈凸显,情感也越来越强烈。“单身狗”中“狗”\n的负面义有所消解,着重幽默的调侃单身这一特征,“标题党”\n意在强调这类标题充实,内容空洞的人给大家带来的不满,\n“月光族”则更多是在描述“月底就把薪水用完的工薪阶层”\n这一类人的某种特征。\n词类是一个原型范畴,范畴的边界是模糊的,不固定的,\n同一范畴内的成员在说话人的心目中地位并不相等,有较好\n的样本与较差的样本之分,即成员资格有等级之分。尤其在\n指人类词缀,将具有某些属性的人划归到一类,这一行为本\n身就带有主观性,因而也就不可避免地会带有说话人的视角、\n感情和认识。\n四、余论\n类词缀是汉语中一种新的现象,新生类推潜能无限,随\n着社会的发展,新的类词缀也在不断涌现,其虚化程度不一,\n构词能力也有差别,基本不可能将其所构成的词全部收录词\n典,这样既不经济,也不实用,因此,有必要概括出所有类\n词缀的语义特点、语用条件、语音方面的变化,把握类词缀\n语法化的进程和原因,本文对类词缀的研究尚专注于“指人\n类词缀”上,指出了“指人类词缀”语法化中的主观化,其实,\n不仅是指人类词缀,其他类词缀甚至是意义虚化度比较高的\n词缀,语法化中的主观性也愈来愈凸显,如“门”做类后缀\n时专指“那些对违法行为进行掩盖的政治事件或大的丑闻”,\n“有”是表“客气义”的前缀,“可”是认识情态词缀,“不”\n是否定意愿词缀,“见”是遭受义词缀,汉语中主观性的表\n现手段还很多,期待对这些问题的进步探索。\n参考文献\n[1] 中国社会科学院语言研究所词典编辑室. 现代汉语词\n典[C]. 商务印书馆,2016.\n[2] 沈家煊. 语言的主观性和主观化[J]. 外语教学与研\n究,2001.\n[3] 沈家煊. 语法化研究综观[J]. 外语教学与研究,1994.\n[4] 沈梦璎. 试论新词缀化的汉民族性[J]. 南京师范大学\n学报,1995.\n[5] 董秀芳. 主观性表达在汉语中的凸显性及其表现特征\n[J]. 语言科学,2016 (6).\n[6] 李海燕. 语言接触影响下类词缀的汉化与显化[J]. 云\n南师范大学学报,2019.\n[7] 王寅, 李弘. 原型范畴理论与英汉构词对比[J]. 四川\n外国语大学学报,2003.\n[8] 沈家煊. 语用原则、语用推理和语义演变[J]. 外语教\n学与研究,2004.\n[9] 战怡如. 现代巧语指人类词缀的多维度考察[D]. 黑龙\n江大学学位论文,2015.\n[10] 曹立英. 现代汉语类词缀的定量与定性研究[J]. 世界\n汉语教学,2018.\n[11] 陈昌来, 朱艳霞. 说流行语“X 党”——兼论指人语\n素的类词缀化[J]. 当代修辞学,2010(3).\n[12] 张现荣. 外来构词词缀主观性的认知识解——以类词\n缀“门”为例[J]. 语言文字应用,2016(2).\n[13] 朱亚军. 现代汉语词缀的性质及其分类研究[J]. 汉语\n学习,2001.\n[14] 孙艳. 现代汉语词缀问题探讨[J]. 河南师范大学学\n报,2000(3).\n[15] 于秒. 类词缀的发展与现代汉语的形态化趋势[J]. 中\n国海洋大学学报,2009(1).\n[16] 周日安, 邵敬敏. 美英式原型标记“门”的类化和泛\n化[J]. 外国语,2007(4).\n[17] 王洪君, 富丽. 试论现代汉语的类词缀[J]. 语言科\n学 function trimText(t){ t=String(t||"").replace(/\u0000/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); return t.length>TEXT_LIMIT ? {text:t.slice(0,TEXT_LIMIT), cut:t.length} : {text:t, cut:0}; }
async function pdfText(file){
  await needPdf();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let out=[], meta={};
  try{ const m=await pdf.getMetadata(); meta={title:m?.info?.Title||"", author:m?.info?.Author||""}; }catch{}
  for(let p=1;p<=pdf.numPages;p++){
    const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
    let line="", lines=[]; let lastY=null;
    for(const it of tc.items){ const y=it.transform?it.transform[5]:0; if(lastY!==null && Math.abs(y-lastY)>2){ lines.push(line); line=""; } line+=it.str; lastY=y; }
    lines.push(line);
    out.push(`[p.${p}]\n`+lines.join("\n"));
    if(out.join("\n").length>TEXT_LIMIT*1.2) { out.push(`[이하 ${pdf.numPages-p}쪽 생략]`); break; }
  }
  return {text:out.join("\n\n"), pages:pdf.numPages, meta};
}
async function hwpxText(file){
  await needZip();
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const names = Object.keys(zip.files).filter(k=>/^Contents\/section\d+\.xml$/i.test(k)).sort((a,b)=>n(a.match(/\d+/)[0])-n(b.match(/\d+/)[0]));
  let parts=[];
  for(const nm of names){
    const xml = await zip.file(nm).async("string");
    const doc = new DOMParser().parseFromString(xml,"application/xml");
    const paras = doc.getElementsByTagNameNS("*","p");
    for(const p of paras){ const ts=p.getElementsByTagNameNS("*","t"); let s=""; for(const t of ts) s+=t.textContent; if(s.trim()) parts.push(s); }
  }
  if(!parts.length && zip.file("Preview/PrvText.txt")) parts=[await zip.file("Preview/PrvText.txt").async("string")];
  let title="";
  const hdr = zip.file("Contents/content.hpf");
  if(hdr){ const x=await hdr.async("string"); const m=x.match(/<opf:title>([^<]*)<\/opf:title>/); if(m) title=m[1]; }
  return {text:parts.join("\n"), title};
}

function findItems(o, test, out=[], d=0){ if(o==null||d>7) return out; if(typeof o==="string"){ if(d<2){ try{ findItems(JSON.parse(o),test,out,d+1); }catch{} } return out; } if(Array.isArray(o)){ for(const x of o) findItems(x,test,out,d+1); return out; } if(typeof o==="object"){ if(test(o)) out.push(o); else for(const v of Object.values(o)) findItems(v,test,out,d+1); } return out; }
const schemaCache={};
const ALIAS={query:/^(query|q|search|search_?query|keywords?|term)$/i, id:/^(file_?id|id|document_?id|drive_?file_?id)$/i, title:/^(title|name|file_?name)$/i, content:/^(content|text|body|data|file_?content)$/i, mime:/^(mime_?type|content_?type)$/i, limit:/^(limit|page_?size|max_?results|n|count)$/i, parent:/^(parent|parent_?id|folder_?id|parents)$/i};
const DEF={query:"query", id:"fileId", title:"title", content:"content", mime:"mimeType", limit:"pageSize", parent:"parentId"};
async function argsFor(server, tool, want){
  if(!(tool in schemaCache)){ try{ schemaCache[tool]=(await cap.mcp.describeTool(server,tool))?.inputSchema?.properties||null; }catch{ schemaCache[tool]=null; } }
  const props=schemaCache[tool], out={};
  for(const [k,v] of Object.entries(want)){ if(v==null||v==="") continue; let key=DEF[k];
    if(props){ const hit=Object.keys(props).find(x=>ALIAS[k].test(x)); if(hit) key=hit; else if(k!=="query"&&k!=="id"&&k!=="title"&&k!=="content") continue; }
    else if(k==="limit"||k==="parent") continue;
    if(props && props[key] && props[key].type==="array" && !Array.isArray(v)) v=[v];
    out[key]=v; }
  return out;
}
async function mcall(server, tool, want){ if(!cap.mcp) throw {code:"no_mcp"}; return cap.mcp.callTool(server, tool, await argsFor(server, tool, want), {cache:false}); }

async function driveSearch(q){
  const tries=[q, `fullText contains '${q.replace(/'/g,"")}'`];
  let lastErr=null;
  for(const query of tries){
    try{ const r=await mcall(GD,"search_files",{query, limit:50}); const items=findItems(payloadOf(r), isDriveFile); if(items.length) return items; }
    catch(e){ lastErr=e; if(e.code && e.code!=="tool_error") throw e; }
  }
  if(lastErr) throw lastErr; return [];
}

function textOfRead(r){
  const p=payloadOf(r);
  if(typeof p==="string") return p;
  if(p && typeof p==="object"){ for(const k of ["content","text","markdown","body","data"]) if(typeof p[k]==="string") return p[k]; }
  return (r?.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

async function saveAcad(papers, ch, fallbackUrl){

    const url=String(p.url||fallbackUrl||""); if(url && S.sources.some(s=>s.url===url && s.title===p.title)) continue;

  if(!requireAI()) return; const A=S.acad; const site=ACAD[A.site];

/* ---------- 참고문헌 ---------- */
function authorsKR(a){ return a||"저자 미상"; }
function fmtRef(s, style){
  const a=authorsKR(s.author), y=s.year||"n.d.", t=s.title||"제목 없음", p=s.publisher||"", u=s.url||"";
  const ko=/[가-힣]/.test(t);
  switch(style){
    case "kci": return ko ? `${a}(${y}), 「${t}」${p?`, 『${p}』`:""}.${u?` ${u}`:""}` : `${a}(${y}), "${t}"${p?`, ${p}`:""}.${u?` ${u}`:""}`;
    case "chicago": return `${a}. ${y}. "${t}."${p?` ${p}.`:""}${u?` ${u}.`:""}`;
    case "mla": return `${a}. "${t}."${p?` ${p},`:""} ${y}.${u?` ${u}.`:""}`;
    default: return `${a} (${y}). ${t}.${p?` ${p}.`:""}${u?` ${u}`:""}`;
  }
}
function srcAttr(s){ const parts=[CH[s.ch]||s.ch]; if(s.fileName) parts.push(s.fileName); if(s.url) parts.push(s.url); if(s.kind) parts.push(s.kind); return parts.join(" · "); }
function refList(){ return S.sources.filter(s=>n(s.grade)>=S.refOpt.min && s.ch!=="ai").sort((a,b)=> n(b.grade)-n(a.grade) || authorsKR(a.author).localeCompare(authorsKR(b.author),"ko")); }
function refsText(withGrade=true){
  const L=refList(), o=S.refOpt; let out=[];
  const one = s => fmtRef(s,o.style) + (o.attr?`  [출처: ${srcAttr(s)}]`:"") + (withGrade?`  (관련도 ${s.grade}등급)`:"");
  if(o.group){ for(const g of [5,4,3,2,1]){ const a=L.filter(s=>n(s.grade)===g); if(a.length){ out.push(`■ ${g}등급 · ${GL[g]} (${a.length}건)`); a.forEach(s=>out.push(one(s))); out.push(""); } } }
  else { const a=[...L].sort((x,y)=>authorsKR(x.author).localeCompare(authorsKR(y.author),"ko")); a.forEach(s=>out.push(one(s))); }
  return out.join("\n").trim();
}

function draftMarkdown(d, withRefs=true){

async function saveFile(filename, data){
  if(!cap.dl){
    try{ const blob = data instanceof Blob ? data : new Blob([data],{type:"application/octet-stream"}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
    catch{ toast("파일을 저장하지 못했습니다.", true); }
    return; }
  try{ await cap.dl.save({filename, data}); }
  catch(e){ if(e.code==="declined") return; if(e.code==="rate_limited") toast("저장 창이 이미 열려 있습니다."); else toast("파일을 저장하지 못했습니다.", true); }
}

    const safe=t=>{ let b=String(t).replace(/[\\/:*?"<>|#^\[\]]/g," ").replace(/\s+/g," ").trim().slice(0,80)||"제목 없음"; let k=b,i=2; while(used.has(k)) k=`${b} (${i++})`; used.add(k); return k; };

    const blob=await zip.generateAsync({type:"blob"});

}
function parseFrontmatter(txt){
  const m=txt.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/); if(!m) return {fm:{}, body:txt};
  const fm={}; let lastKey=null;
  for(const line of m[1].split("\n")){
    const li=line.match(/^\s*-\s+(.*)$/); if(li && lastKey){ (fm[lastKey]=Array.isArray(fm[lastKey])?fm[lastKey]:[]).push(li[1].replace(/^["']|["']$/g,"")); continue; }
    const kv=line.match(/^([\w\-]+):\s*(.*)$/); if(!kv) continue; lastKey=kv[1]; let v=kv[2].trim();
    if(/^\[.*\]$/.test(v)) v=v.slice(1,-1).split(",").map(x=>x.trim().replace(/^["']|["']$/g,"")).filter(Boolean);
    else v=v.replace(/^["']|["']$/g,"");
    fm[lastKey]=v===""?[]:v;
  }
  return {fm, body:txt.slice(m[0].length)};
}
async function importMd(name, txt, extra={}){
  const {fm, body}=parseFrontmatter(txt);
  const h=body.match(/^#\s+(.+)$/m);
  const title=fm.title||(h?h[1].trim():"")||name.replace(/\.(md|txt)$/i,"");
  const tags=[...(Array.isArray(fm.tags)?fm.tags:fm.tags?[fm.tags]:[]), ...[...body.matchAll(/(^|\s)#([\p{L}\d_\-\/]+)/gu)].map(m=>m[2])];
  const t=trimText(body);
  const exist = fm.aiwiki_id && S.sources.find(x=>x.id===fm.aiwiki_id);
  const base = exist ? {...exist} : newSource({});
  Object.assign(base,{ch:exist?exist.ch:"obsidian", title, text:exist?exist.text:t.text, keywords:[...new Set(tags)].slice(0,12), fileName:name, ...extra});
  if(fm.grade) base.grade=n(fm.grade); if(fm.topic) base.topic=fm.topic; if(fm.author) base.author=fm.author; if(fm.year) base.year=fm.year; if(fm.url) base.url=fm.url; if(fm.publisher) base.publisher=fm.publisher;
  await Store.saveSource(base); return !!exist;
}
async function importExchange(files){
  let made=0, restored=0;
  for(const f of files){
    const ext=f.name.split(".").pop().toLowerCase();
    try{
      const txt=await f.text();
      if(ext==="json"){
        const j=JSON.parse(txt);
        if(j && j.app==="AI WIKI"){
          for(const s of (j.sources||[])){ const ex=S.all.find(x=>x.id===s.id); const other=ex && pidOf(ex)!==S.pid; await Store.saveSource({...newSource({}), ...s, pid:S.pid, id:other?uid():(s.id||uid())}); restored++; }
          for(const d of (j.drafts||[])){ const ex=S.allDrafts.find(x=>x.id===d.id); await Store.saveDraft({...d, pid:S.pid, id:(ex && pidOf(ex)!==S.pid)?uid():(d.id||uid())}); }
          if(j.thesis && !S.thesis.topic){ S.thesis={...S.thesis, ...j.thesis}; await Store.saveThesis(); }
        } else {
          const arr=Array.isArray(j)?j:(j.notes||j.items||[j]);
          for(const o of arr){ const t=trimText(o.content||o.text||o.body||""); await Store.saveSource(newSource({ch:"obsidian", title:o.title||o.name||f.name, text:t.text, keywords:Array.isArray(o.tags)?o.tags:[], fileName:f.name})); made++; }
        }
      } else if(ext==="md"||ext==="txt"){
        (await importMd(f.name, txt)) ? restored++ : made++;
      } else if(false){
        const {fm, body}=parseFrontmatter(txt);
        const h=body.match(/^#\s+(.+)$/m);
        const title=fm.title||(h?h[1].trim():"")||f.name.replace(/\.(md|txt)$/i,"");
        const tags=[...(Array.isArray(fm.tags)?fm.tags:fm.tags?[fm.tags]:[]), ...[...body.matchAll(/(^|\s)#([\p{L}\d_\-\/]+)/gu)].map(m=>m[2])];
        const t=trimText(body);
        const exist = fm.aiwiki_id && S.sources.find(x=>x.id===fm.aiwiki_id);
        const base = exist ? {...exist} : newSource({});
        Object.assign(base,{ch:exist?exist.ch:"obsidian", title, text:exist?exist.text:t.text, keywords:[...new Set(tags)].slice(0,12), fileName:f.name});
        if(fm.grade) base.grade=n(fm.grade); if(fm.topic) base.topic=fm.topic; if(fm.author) base.author=fm.author; if(fm.year) base.year=fm.year; if(fm.url) base.url=fm.url; if(fm.publisher) base.publisher=fm.publisher;
        await Store.saveSource(base); exist?restored++:made++;
      } else if(ext==="html"||ext==="htm"){
        const doc=new DOMParser().parseFromString(txt,"text/html");
        doc.querySelectorAll("script,style,nav,footer").forEach(x=>x.remove());
        const t=trimText(doc.body?.innerText||doc.body?.textContent||"");
        await Store.saveSource(newSource({ch:"obsidian", title:doc.title||f.name, text:t.text, fileName:f.name})); made++;
      } else { toast(`${f.name}: 지원하지 않는 형식입니다.`, true); }
    }catch(e){ toast(`${f.name}: 읽지 못했습니다 (${e.message||"형식 오류"})`, true); }
  }
  toast(`새 자료 ${made}건, 갱신·복원 ${restored}건을 가져왔습니다.`); render();
}

function buildStandalone(){
  const c=document.documentElement.cloneNode(true);
  c.removeAttribute("data-theme"); c.removeAttribute("style");
  const q=s=>c.querySelector(s);
  q("#main").innerHTML=""; q("#nav").innerHTML=""; q("#store").innerHTML="";
  for(const id of ["#modal","#toast","#jobbar"]){ const e=q(id); if(e){ e.hidden=true; if(id!=="#jobbar") e.innerHTML=""; } }
  c.querySelectorAll("script").forEach(s=>{ const src=s.getAttribute("src")||""; if(s.hasAttribute("data-app")) return; if(/^https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/(marked|dompurify|pdf\.js|jszip)\//.test(src)) return; s.remove(); });
  const seed=document.createElement("script"); seed.id="aiwiki-seed";
  seed.textContent="window.AIWIKI_SEED="+JSON.stringify({v:2, projects:S.projects, sources:S.all, drafts:S.allDrafts}).replace(/</g,"\\u003c")+";";
  q("script[data-app]").before(seed);
  if(!q('meta[charset]')){ const m=document.createElement("meta"); m.setAttribute("charset","utf-8"); q("head").prepend(m); }
  return "<!doctype html>\n"+c.outerHTML;
}

function newIdOf(r){

  const s=typeof p==="string"?p:JSON.stringify(p||""); const m=s.match(/"(?:id|fileId)"\s*:\s*"([^"]+)"/)||s.match(/\/d\/([\w-]{15,})/)||s.match(/id[:=]\s*([\w-]{15,})/i); return m?m[1]:null;

async function driveMkdir(name, parent){

  const r=await mcall(GD,"create_file",{title:name, mime:"application/vnd.google-apps.folder", parent});

function nextSteps(){
  const t=S.thesis, L=S.sources;
  const items=[
    [!!t.topic, "내 논문 주제·키워드 입력", "thesis"],
    [L.length>=5, `자료 5건 이상 수집 (현재 ${L.length}건)`, "collect"],
    [L.length>0 && !L.some(s=>!n(s.grade)), "모든 자료 AI 분류", "library"],
    [L.some(s=>s.myView), "자료에 내 관점 입력", "library"],
    [L.some(s=>s.analysis), "분석 보고서 1건 이상 작성", "library"],
    [S.drafts.some(d=>draftLen(d)>0), "원고 집필 시작", "write"]
  ];
  const done=items.filter(x=>x[0]).length;
  return `<section class="panel steps"><div class="panel-head"><h2>다음 할 일</h2><span class="cnt">${done}/${items.length} 완료</span></div><div class="meter" style="margin-bottom:12px"><i style="width:${(done/items.length*100).toFixed(0)}%"></i></div>
    <ol class="todo">${items.map(([ok,l,v])=>`<li class="${ok?"ok":""}"><span class="tick">${ok?"✓":""}</span><span>${l}</span>${ok?"":`<button class="btn sm" data-act="go" data-v="${v}" type="button">하러 가기</button>`}</li>`).join("")}</ol></section>`;
}

function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let L=S.sources.filter(s=>(!f.topic||s.topic===f.topic)&&(!f.ch||s.ch===f.ch)&&(!f.kind||s.kind===f.kind)&&(f.grade===""||String(n(s.grade))===f.grade));
  if(q) L=L.filter(s=>[s.title,s.author,s.topic,s.summary,(s.keywords||[]).join(" "),s.myView].join(" ").toLowerCase().includes(q));
  const so=f.sort;
  if(so==="grade") L=[...L].sort((a,b)=>n(b.grade)-n(a.grade));
  else if(so==="title") L=[...L].sort((a,b)=>String(a.title).localeCompare(String(b.title),"ko"));
  return L;
}

    </aside></div>`;
}

  main.innerHTML=(S.view!=="home"?`<nav class="crumb" aria-label="현재 위치"><button type="button" data-act="go" data-v="home">AI WIKI</button><span>›</span><button type="button" data-act="go" data-v="dash">${esc(clip(curProj()?.name||"",30))}</button><span>›</span><b>${VN[S.view]||""}</b></nav>`:"")+v();

function softRender(force){ if(!force && editing()){ pending=true; return; } render(); }

  if(S.view==="exchange") importExchange(fs.filter(f=>/\.(md|txt|json|html?)$/i.test(f.name)));

}
document.addEventListener("dragover", e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const d=e.target.closest?.("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e=>{ const d=e.target.closest?.("#drop"); if(!d) return; e.preventDefault(); d.classList.remove("over"); const fs=[...e.dataTransfer.files]; if(fs.length) route(fs); });
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.np && e.target.type==="text"){ e.preventDefault(); createProject(); return; } if((e.key==="Enter"||e.key===" ") && e.target.id==="drop"){ e.preventDefault(); e.target.click(); }
  if(e.key==="Enter"){ const m={driveQ:driveFind, acadQ:acadSearch, dsyncQ:dsyncFind}[e.target.id]; if(m){ e.preventDefault(); m(); } } });

const go = v => { if(v!=="home" && !S.pid){ toast("먼저 대문에서 프로젝트를 만들거나 고르세요."); S.view="home"; S.showNew=!S.projects.length; render(); return; } S.view=v; render(); };
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  const cur = () => S.sources.find(x=>x.id===S.srcId);
  switch(a){
    case "go": if(v==="write" && !S.draftId && S.drafts[0]) S.draftId=S.drafts[0].id; go(v); break;
    case "tab": S.tab=v; render(); break;
    case "pick": fileInput.accept=v; fileInput.click(); break;
    case "pickDir": fileInput.accept=""; fileInput.setAttribute("webkitdirectory",""); fileInput.click(); break;
    case "open": S.srcId=v; go("detail"); break;
    case "kw": S.f={...S.f, q:v}; go("library"); break;
    case "classifyUncl": classifyMany(S.sources.filter(s=>!n(s.grade))); break;
    case "classifyOne": { const s=cur(); if(s) classifyMany([s]); break; }
    case "analyze": analyzeSource(v); render(); break;
    case "copyAn": { const s=cur(); copy(s?.analysis||""); break; }
    case "setGrade": { const s=cur(); if(!s) break; await Store.saveSource({...s, grade:n(v), gradeBy:"user"}); render(); break; }
    case "dlPdf": { const s=cur(); if(!s?.pdfAsset) break; try{ const r=await fetch("/_blob/"+s.pdfAsset); if(!r.ok) throw 0; const b=await r.blob(); await saveFile((s.fileName||s.title+".pdf").replace(/[\\/:*?"<>|]/g," "), b); }catch{ toast("보관된 원문을 찾지 못했습니다.", true); } break; }
    case "delOne": { const s=cur(); if(s && await ask(`'${clip(s.title,40)}' 자료를 삭제할까요? 분석 보고서와 내 관점도 함께 지워집니다.`)){ if(s.pdfAsset && cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id); toast("삭제했습니다."); go("library"); } break; }
    case "sel": if(el.checked) S.sel.add(v); else S.sel.delete(v); render(); break;
    case "selAll": { const L=filtered(); if(el.checked) L.forEach(s=>S.sel.add(s.id)); else L.forEach(s=>S.sel.delete(s.id)); render(); break; }
    case "selNone": S.sel.clear(); render(); break;
    case "bulkClassify": classifyMany(S.sources.filter(s=>S.sel.has(s.id))); break;
    case "bulkSyn": S.syn.ids=new Set(S.sel); go("analysis"); break;
    case "bulkExport": S.exp.scope="sel"; go("exchange"); break;
    case "bulkDel": { const L=S.sources.filter(s=>S.sel.has(s.id)); if(L.length && await ask(`선택한 ${L.length}건을 삭제할까요?`)){ for(const s of L){ if(s.pdfAsset&&cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id);} toast(`${L.length}건을 삭제했습니다.`); render(); } break; }
    case "delExamples": { const L=S.sources.filter(s=>s.isExample); if(!L.length){ toast("예시 자료가 없습니다."); break; } if(await ask(`예시 자료 ${L.length}건을 삭제할까요?`)){ for(const s of L) await Store.deleteSource(s.id); for(const d of S.drafts.filter(d=>d.isExample)) await Store.deleteDraft(d.id); toast("예시 자료를 삭제했습니다."); render(); } break; }
    case "delUncl": { const L=S.sources.filter(s=>n(s.grade)===1); if(!L.length){ toast("1등급 자료가 없습니다."); break; } if(await ask(`관련도 1등급(무관) 자료 ${L.length}건을 삭제할까요?`)){ for(const s of L) await Store.deleteSource(s.id); toast("삭제했습니다."); render(); } break; }
    case "delAll": { if(!S.sources.length) break; if(await ask(`모든 자료 ${S.sources.length}건을 삭제할까요? 원고와 논문 정보는 남습니다.`,"모두 삭제")){ for(const s of [...S.sources]){ if(s.pdfAsset&&cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id);} toast("모든 자료를 삭제했습니다."); render(); } break; }
    case "scrape": {
      const url=$("#webUrl").value.trim(); if(!/^https?:\/\//.test(url)){ toast("http:// 또는 https://로 시작하는 주소를 입력하세요."); break; }
      el.disabled=true; el.textContent="가져오는 중…";
      try{ const r=await scrapeWeb(url); const t=trimText(r.md); if(!t.text) throw {code:"tool_error"};
        const src=newSource({ch:"web", url, title:r.title||url, text:t.text, cut:t.cut, publisher:(()=>{try{return new URL(url).hostname}catch{return ""}})()});
        await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id});
        render(); if($("#optAuto")?.checked!==false && cap.sample) classifyMany([src]);
      }catch(err){ toast(MCP_ERR[err.code]||"웹 페이지를 가져오지 못했습니다. 본문을 직접 붙여 넣으세요.", true); }
      finally{ const b=$('[data-act="scrape"]'); if(b){ b.disabled=false; b.textContent="가져오기"; } }
      break; }
    case "saveWeb": {
      const text=$("#webText").value.trim(); if(!text){ toast("본문을 붙여 넣으세요."); break; }
      const t=trimText(text); const url=$("#webUrl").value.trim();
      const src=newSource({ch:"web", url, title:$("#webTitle").value.trim()||url||"웹 자료", publisher:$("#webPub").value.trim(), text:t.text});
      const auto=$("#optAuto")?.checked; await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id}); render(); if(auto&&cap.sample) classifyMany([src]); break; }
    case "saveManual": {
      const text=$("#mText").value.trim(); if(!text){ toast("내용을 입력하세요."); break; }
      const src=newSource({ch:"manual", title:$("#mTitle").value.trim()||clip(text,30), author:$("#mAuthor").value.trim(), year:$("#mYear").value.trim(), text:trimText(text).text, kind:"메모"});
      const auto=$("#optAuto")?.checked; await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id}); render(); if(auto&&cap.sample) classifyMany([src]); break; }
    case "synType": S.syn.type=v; render(); break;
    case "synSel": if(el.checked) S.syn.ids.add(v); else S.syn.ids.delete(v); render(); break;
    case "synPick": S.syn.ids = n(v) ? new Set(S.sources.filter(s=>n(s.grade)>=n(v)).map(s=>s.id)) : new Set(); render(); break;
    case "synth": synthesize(); render(); break;
    case "synCopy": copy(S.syn.last?.text||""); break;
    case "synSave": { const L=S.syn.last; if(!L) break; const src=newSource({ch:"ai", kind:"보고서", title:`${S.syn.type} · ${stamp()}`, author:"AI WIKI", year:String(new Date().getFullYear()), text:L.text+"\n\n---\n자료 번호표\n"+L.refs, analysis:L.text, myView:S.syn.view, summary:clip(extractSec(L.text,1)||L.text,400), topic:S.thesis.topic?"종합 분석":"", grade:0}); await Store.saveSource(src); toast("위키에 'AI 생성' 자료로 저장했습니다."); S.srcId=src.id; go("detail"); break; }
    case "insight": thesisInsight(); render(); break;
    case "regradeAll": { if(!S.sources.length){ toast("자료가 없습니다."); break; } if(await ask(`자료 ${S.sources.length}건의 등급을 현재 논문 정보로 다시 매길까요? 직접 지정한 등급도 바뀝니다.`,"다시 매기기",false)) classifyMany(S.sources.filter(s=>s.ch!=="ai")); break; }
    case "refCopy": copy(refsText(false)); break;
    case "refSave": saveFile(`참고문헌-${stamp()}.txt`, refsText(true)); break;
    case "newDraft": { const d=newDraft(); await Store.saveDraft(d); S.draftId=d.id; go("write"); break; }
    case "openDraft": S.draftId=v; render(); break;
    case "delDraft": { const d=curDraft(); if(d && await ask(`'${clip(d.title,40)}' 원고를 삭제할까요?`)){ await Store.deleteDraft(d.id); S.draftId=S.drafts[0]?.id||null; render(); } break; }
    case "dset": { const d=curDraft(); if(!d) break; d[el.dataset.k]=v; await Store.saveDraft(d); render(); break; }
    case "toc": recommendToc(); render(); break;
    case "addCh": { const d=curDraft(); d.toc.push({id:uid(), title:`${["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ"][d.toc.length]||d.toc.length+1}. 새 장`, secs:[{id:uid(), title:"1. 새 절", target:800, brief:"", content:"", prev:""}]}); await Store.saveDraft(d); render(); break; }
    case "addSec": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); c.secs.push({id:uid(), title:`${c.secs.length+1}. 새 절`, target:800, brief:"", content:"", prev:""}); await Store.saveDraft(d); render(); break; }
    case "delCh": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); if(c && await ask(`'${clip(c.title,30)}' 장과 그 안의 본문을 삭제할까요?`)){ d.toc=d.toc.filter(x=>x.id!==v); await Store.saveDraft(d); render(); } break; }
    case "delSec": { const d=curDraft(); const f=findSec(d,v); if(f.s && (!f.s.content || await ask(`'${clip(f.s.title,30)}' 절을 삭제할까요?`))){ f.c.secs.splice(f.i,1); await Store.saveDraft(d); render(); } break; }
    case "writeSec": writeMany([v], "절 집필"); break;
    case "writeCh": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); const ids=c.secs.map(s=>s.id); if(c.secs.some(s=>s.content) && !(await ask("이 장에 이미 쓴 절이 있습니다. 모두 다시 쓸까요? (각 절은 되돌리기로 이전 본문을 복구할 수 있습니다)","다시 쓰기",false))) break; writeMany(ids, "장 집필"); break; }
    case "writeAll": { const d=curDraft(); const ids=d.toc.flatMap(c=>c.secs).filter(s=>!s.content).map(s=>s.id); if(!ids.length){ toast("비어 있는 절이 없습니다."); break; } writeMany(ids, "전체 집필"); break; }
    case "revise": { const box=el.closest(".row"); const instr=($("[data-revtxt]",box).value.trim()||$("[data-revsel]",box).value); reviseSection(v, instr); break; }
    case "undo": { const d=curDraft(); const f=findSec(d,v); if(f.s?.prev!=null){ const t=f.s.content; f.s.content=f.s.prev; f.s.prev=t; await Store.saveDraft(d); render(); toast("이전 본문으로 되돌렸습니다. 다시 누르면 수정본으로 돌아갑니다."); } break; }
    case "togglePreview": S.preview=!S.preview; render(); break;
    case "draftExport": { const d=curDraft(); const m=draftMarkdown(d); const base=d.title.replace(/[\\/:*?"<>|]/g," ").slice(0,60)||"원고";
      if(v==="md") saveFile(base+".md", m); else if(v==="txt") saveFile(base+".txt", m.replace(/^#+\s*/gm,"").replace(/\*\*/g,"")); else saveFile(base+".html", htmlDoc(d.title, md(m))); break; }
    case "expScope": S.exp.scope=v; render(); break;
    case "export": doExport(v); break;
    case "newProj": S.showNew=true; S.view="home"; render(); setTimeout(()=>{ $("#newProj")?.scrollIntoView({behavior:"smooth",block:"start"}); $("#npName")?.focus(); },30); break;
    case "hideNew": S.showNew=false; render(); break;
    case "createProj": createProject(); break;
    case "openProj": setProject(v); S.view="dash"; render(); break;
    case "renameProj": { const p=S.projects.find(x=>x.id===v); if(!p) break; const nm=await promptText("새 프로젝트 이름", p.name); if(nm && nm!==p.name){ if(S.projects.some(x=>x.name===nm)){ toast("같은 이름의 프로젝트가 있습니다."); break; } p.name=nm; await Store.saveProject(p); toast("이름을 바꿨습니다. 이미 만든 폴더 이름은 그대로입니다."); render(); } break; }
    case "delProj": deleteProjectFlow(v); break;
    case "mkObs": { const p=S.projects.find(x=>x.id===v); if(p) makeObsidianFolder(p).then(render); break; }
    case "mkDrive": { const p=S.projects.find(x=>x.id===v); if(p) makeDriveFolders(p); break; }
    case "driveFind": driveFind(); break;
    case "drivePick": if(el.checked) S.drive.picked.add(v); else S.drive.picked.delete(v); render(); break;
    case "drivePickTop": S.drive.picked=new Set(S.drive.items.filter(f=>!f.have).slice(0,20).map(f=>f.id)); render(); break;
    case "drivePickNone": S.drive.picked=new Set(); render(); break;
    case "driveImport": driveImport(); break;
    case "driveExport": driveExport(); break;
    case "dsyncFind": dsyncFind(); break;
    case "dsyncImport": dsyncImport(); break;
    case "acadSite": S.acad.site=v; S.acad.items=[]; S.acad.note=""; render(); break;
    case "acadSearch": acadSearch(); break;
    case "acadFetch": acadFetch(v); break;
    case "acadPaste": acadPaste(); break;
    case "refMode": S.refOpt.mode=v; render(); break;
    case "refCsv": { const L=refList(); const q=x=>`"${String(x??"").replace(/"/g,'""')}"`; saveFile(`서지정보-${stamp()}.csv`, "\ufeff"+["저자,출판연도,제목,출판사·학술지,관련도등급,출처,URL", ...L.map(s=>[s.author,s.year,s.title,s.publisher,n(s.grade),CH[s.ch]||s.ch,s.url].map(q).join(","))].join("\n")); break; }
    case "saveApp": saveFile(`AI_WIKI-${stamp()}.html`, buildStandalone()); break;
  }
});
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("복사했습니다."); }catch{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("복사했습니다.");}catch{toast("복사하지 못했습니다.",true);} ta.remove(); } }

document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="fq"){ S.f.q=t.value; debounce("fq", ()=>{ const pos=t.selectionStart; render(); const n2=$("#fq"); if(n2){ n2.focus(); n2.setSelectionRange(pos,pos);} }, 250); return; }
  if(t.id==="myView"){ const id=t.dataset.id; $("#mvState").textContent="입력 중…"; debounce("mv"+id, async ()=>{ const s=S.sources.find(x=>x.id===id); if(!s) return; await Store.saveSource({...s, myView:t.value}); const st=$("#mvState"); if(st) st.textContent="저장됨"; }, 900); return; }
  if(t.id==="synView"){ S.syn.view=t.value; return; }
  if(t.id==="driveQ"){ S.drive.q=t.value; return; }
  if(t.dataset.np){ const k=t.dataset.np; S.np[k]= t.type==="checkbox" ? t.checked : t.value; if(k==="name"){ const tr=$(".tree span:nth-child(2)"); if(tr) tr.textContent=`└ ${projFolderName({name:t.value||"프로젝트명"})}/`; } return; }
  if(t.id==="acadQ"){ S.acad.q=t.value; return; }
  if(t.id==="dsyncQ"){ S.dsync.q=t.value; return; }
  const mf=t.closest("#metaForm");
  if(mf){ const id=mf.dataset.id, k=t.dataset.k; debounce("meta"+id+k, async ()=>{ const s=S.sources.find(x=>x.id===id); if(!s) return; const val = k==="keywords" ? t.value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean) : t.value; await Store.saveSource({...s, [k]:val}); }, 800); return; }
  const tf=t.closest("#thesisForm");
  if(tf && t.dataset.k){ const k=t.dataset.k; S.thesis[k] = k==="keywords" ? t.value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean) : t.value; $("#thState").textContent="입력 중…"; debounce("thesis", async ()=>{ await Store.saveThesis(); const st=$("#thState"); if(st) st.textContent="저장됨"; }, 900); return; }
  const df=t.closest("#draftForm");
  if(df && t.dataset.k){ const d=curDraft(); if(!d) return; const k=t.dataset.k; d[k] = (k==="target"||k==="minGrade") ? n(t.value) : t.value; if(k==="target") $("#tgtVal").textContent=n(t.value).toLocaleString()+"자"; debounce("draft"+d.id, ()=>Store.saveDraft(d), 700); return; }
  const sec=t.closest(".sec");
  if(sec && t.dataset.f){ const d=curDraft(); const f=findSec(d, sec.dataset.sid); if(!f.s) return; const k=t.dataset.f; f.s[k] = k==="target" ? Math.max(100,n(t.value)) : t.value;
    if(k==="content"){ const c=$(".cnt",sec); const L=len(t.value); c.textContent=`${L.toLocaleString()}/${n(f.s.target).toLocaleString()}자`; t.rows=Math.min(24,Math.max(5,Math.ceil(L/60))); }
    debounce("draft"+d.id, ()=>Store.saveDraft(d), 900); return; }
  const ch=t.closest(".chapter");
  if(ch && t.dataset.cf){ const d=curDraft(); const c=d.toc.find(x=>x.id===ch.dataset.cid); c.title=t.value; debounce("draft"+d.id, ()=>Store.saveDraft(d), 900); return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="projSel"){ if(t.value){ setProject(t.value); if(S.view==="home") S.view="dash"; } render(); return; }
  if(t.dataset && t.dataset.np && t.type==="checkbox"){ S.np[t.dataset.np]=t.checked; return; }
  if(t.id==="ftopic"){ S.f.topic=t.value; render(); }
  else if(t.id==="fch"){ S.f.ch=t.value; render(); }
  else if(t.id==="fgrade"){ S.f.grade=t.value; render(); }
  else if(t.id==="fsort"){ S.f.sort=t.value; render(); }
  else if(t.id==="refMin"){ S.refOpt.min=n(t.value); render(); }
  else if(t.id==="refStyle"){ S.refOpt.style=t.value; render(); }
  else if(t.id==="refAttr"){ S.refOpt.attr=t.checked; render(); }
  else if(t.id==="refGroup"){ S.refOpt.group=t.checked; render(); }
  else if(t.id==="expMin"){ S.exp.min=n(t.value); render(); }
  else if(t.closest("#draftForm") && t.dataset.k==="minGrade"){ const d=curDraft(); d.minGrade=n(t.value); Store.saveDraft(d).then(render); }
  else if(t.closest("#draftForm") && t.dataset.k==="target"){ render(); }
});

boot();
})();
</script>

</body></html>
