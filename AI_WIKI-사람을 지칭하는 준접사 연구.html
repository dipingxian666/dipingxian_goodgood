<script id="aiwiki-seed">window.AIWIKI_SEED={"v": 2, "projects": [{"name": "신흥 指人 类词缀 연구", "desc": "업로드한 중국어 类词缀 논문 9편으로 시작한 프로젝트", "thesis": {"field": " 중어중문 어학 분약", "insight": "", "keywords": ["현대 중국어", "인칭 접사", "준접사", "구문 이론", "인지언어학", "문법화"], "outline": " 준접사는 어근과 전형적인 접사 사이의 과도기적 조어 성분으로, 어휘 시스템에서 가장 활발하고 언어의 발전 양상을 가장 잘 반영하는 영역에 위치합니다. 지난 20~30년간 빠른 사회적 변화와 인터넷 매체의 보편화에 따라 현대 중국어에서는 일련의 신흥 인칭 준접사가 등장했으며, 그중에서도 \"族(족), 客(객), 友(우), 粉(팬), 侠(협), 狗(개), 奴(노), 霸(패), 精(귀신/정령)\" 등 단음절 준접미사가 가장 활발하게 사용되고 있습니다. 이러한 성분은 단어 형성 위치가 고정되어 있고, 의미가 실사(實詞)적 의미에서 \"특정 유형의 사람\"을 가리키는 유의미(類意味)로 단계적으로 허화(虛化) 및 범주화되며, 생산성이 뛰어나고 전파 속도가 빠르며 어용적 색채가 선명하여 현대 중국어 조어 혁신의 중요한 상징이 되었습니다. 그러나 기존 연구는 대부분 \"X族\", \"X哥\" 등 개별 사례 연구에 집중되거나 전통적인 형태소 분류 방식을 따라 정성적 분류를 진행하는 데 그쳤으며, 신흥 인칭 준접사에 대한 체계적인 연구는 비교적 적어 판정 기준, 의미 변화 기제, 범주화 과정 및 분포 규칙에 대해 한층 더 깊이 있는 규명이 필요한 실정입니다.\n본 논문은 현대 중국어의 신흥 인칭 준접사를 연구 대상으로 삼아 단음절 준접미사를 중심으로 연구를 진행합니다. 인지언어학, 구문문법 및 문법화 이론을 종합적으로 활용하며, 공시적 묘사와 통시적 고찰, 정량적 통계와 정성적 분석, 묘사와 설명의 결합이라는 연구 방법을 견지합니다. 통시적 차원에서는 문법화 이론을 적용하여 준접사가 실사에서 준접사로 이행하는 허화 경로를 추적합니다. 공시적 차원에서는 원형 범주 이론, 은유·환유 기제 및 도식 이론을 활용하여 준접사 어족의 내부 구조와 형성 규칙을 밝히고, 동시에 \"X+준접사\" 구문을 하나의 전체로 간주하여 구문 의미를 고찰합니다. 어휘 자료 측면에서는 베이징대학 CCL코퍼스, BCC코퍼스 및 인터넷 어학용례를 주요 출처로 하여 전수 검색과 계량 통계를 통해 신흥 인칭 준접사의 어족 기록을 구축하였습니다.\n본 논문은 먼저 위치의 고정성, 의미의 허화 정도, 조어 생산성 및 품사 표시 등 4가지 차원에서 준접사를 식별하는 기준을 확립하고, 이를 어근 및 전형적인 접사와 구별함으로써 연구 범위를 설정합니다. 둘째, 수집된 신흥 인칭 준접사를 체계적으로 정리하고 분류합니다. 셋째, 공시적 차원에서 각 어족의 범주 구조를 분석함과 동시에 \"X+준접사\" 전체가 \"특정 유형의 사람을 가리키는\" 추상적인 구문 의미를 획득하는 과정을 고찰하고, 생산성 기제를 통해 새로운 어근을 지속적으로 수용하는 방식을 밝힙니다. 통시적 차원에서는 준접사의 문법화 경로를 제시합니다. 즉, 실사가 복합 구조 내에서 고빈도로 공현(co-occurrence)하면서 어휘적 의미가 문맥 수용에 의해 단계적으로 허화되고, \"실형태소 - 복합어화 - 준접사화\"라는 의미 진화 사슬을 거쳐 준접미사로 고착되며, 유추 기제의 작용에 따라 빠르게 확산됩니다. 마지막으로, 본 논문은 사회인지적 관점에서 신흥 준접사가 급부상한 동인, 즉 새로움과 차별성을 추구하는 언어 심리, 집단 정체성 구축의 욕구, 인터넷 맥락의 낮은 진입 장벽 등을 설명하여 준접사의 생산적 확장에 인지적 기반과 사회적 토대를 제공합니다.\n연구 결과는 다음과 같습니다. 첫째, 신흥 인칭 준접사의 의미 허화와 기능 확장은 본질적으로 은유, 환유 등 인지 기제가 조어 층위에서 반영된 것이며, 구문 의미는 의미의 범주화 현상을 이해하는 핵심 열쇠입니다. 둘째, 신흥 접사와 기존 접사는 상호 보완적인 동적 시스템으로서 두 요소가 함께 인칭 조어 수단의 연속체를 구성합니다. 셋째, 준접사의 공시적 생산성은 통시적 문법화 정도와 정적 상관관계를 보이며, 공시와 통시를 결합한 관점은 이러한 상관관계의 내적 기제를 밝히는 데 유용합니다.", "topic": "사람을 가리키는 새로운 인칭 준접사 연구"}, "folders": {}, "createdAt": "2026-10-06T12:00:00Z", "updatedAt": "2026-10-27T12:00:00Z", "id": "p_legacy01"}], "sources": [{"analysis": "", "author": "王周", "ch": "pdf", "createdAt": "2026-10-06T11:58:00Z", "cut": 84741, "fileName": "类词缀“族”“党”“迷”“控”研究_王周.pdf", "grade": 5, "gradeBy": "AI", "gradeReason": "개별 유사접사의 통시적 기원과 횡적 비교, 생성 동인을 체계적으로 다루어 핵심 비교 연구 틀을 제공한다.", "insight": "", "keywords": ["族", "党", "迷", "控", "词语模", "修辞造词", "语言接触", "自源性", "他源性"], "kind": "학위논문", "myView": "", "pages": 94, "publisher": "扬州大学 硕士学位论文", "summary": "族·党·迷·控 네 지인 유사접사의 고금 의미 체계를 사전과 용례로 추적해 '迷'는 자원성(自源性), '族·党'은 언어 접촉으로 촉발된 경우, '控'은 타원성(他源性) 유사접사로 구분한다. 词语模 이론(模槽·模标)과 수사적 조어 관점에서 'X+类词缀' 패턴을 분석하고 의미·결합·색채 특징을 횡적으로 비교한 뒤, 내부(유추·경제성·균형) 및 외부(언어 접촉, 사회 변화, 매체, 화자 심리) 동인을 정리한다.", "text": "[p.1]\n分类号\n学\n兮\n密\n级\n学\n位办\n文\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n王\n周\n指导教师姓名\n:\n谢明副教授\n,\n扬州大学\n,\n江苏扬州\n,\n申请学位级别\n:\n硕\n士\n学科专业名称\n:\n语言学及应用语言学\n论文提交日期\n:\n年\n月\n论文答辩日期\n:\n年\n月\n学位授予单位\n:\n扬\n州\n大\n学\n学位授予日期\n:\n年\n月\n答辩委员会主席\n:\n肖奚强教授\n论文评\n阅人\n:\n年\n月\n[p.2]\n中文摘要\n英文摘要\n绪\n它\n一\n、研究对象与研究内容\n二\n、\n研究综述\n三\n、研究意义及创新点\n四\n、\n研究方法\n五\n、\n语料来源\n第一章\n“ 族”\n“ 党\n”\n的语义系统研究\n第一节\n“ 族”\n的语义系统研究\n一\n、\n“ 族”\n的语义系统描写\n二\n、\n古代汉语中\n“ 族”\n的使用\n三\n、\n现代汉语中\n“ 族”\n的使用\n四\n、\n类词缀\n“ 族”\n分析\n五\n、\n小结\n第二节\n“ 党\n”\n的语义系统研究\n一\n、\n“ 党”\n的语义系统描写\n二\n、\n古代汉语中\n“ 党\n”\n的使用\n三\n、\n现代汉语中\n“ 党”\n的使用\n四\n、\n类词缀\n“ 党” 分析\n五\n、\n小结\n第二章\n“ 迷”\n“ 控”\n的语义系统研究\n第一节\n“ 迷”\n的语义系统研究\n一\n、\n“ 迷”\n的语义系统描写\n二\n、\n古代汉语中\n“ 迷”\n的使用\n三\n、\n现代汉语中\n“ 迷”\n的使用\n[p.3]\n四\n、\n类词缀\n“ 迷”\n分析\n五\n、\n、\n第二节\n“ 控\n”\n的语义系统研究\n一\n、\n“ 控”\n的语义系统描写\n二\n、\n古代汉语中\n“ 控”\n的使用\n三\n、\n现代汉语中\n“ 控”\n的使用\n四\n、\n类词缀\n“ 控”\n分析\n丘\n、\n第三章\n“\n类词缀” 模式分析\n第一节\n构词分析\n一\n、\n“ 族”\n与\n“ 党\n”\n构成的合成词\n二\n、\n“ 迷”\n与\n“ 控”\n构成的合成词\n三\n、\n第二节\n“\n类词缀\n” 模式与词语模\n模\n论与词语模\n二\n、\n从词语模理论看类词缀\n三\n、\n、\n第三节\n“\n类词缀\n” 模式修辞造词分析\n一\n、\n造词法与构词法\n二\n、\n“\n类词缀” 模式修辞造词分析\n三\n、\n小结\n第四章\n“\n类词缀” 模式比较研究\n第一节\n语义特征\n一\n、\n“\n族”\n族词与\n“\n党”\n族词\n二\n、\n“\n迷” 族词与\n“\n控” 族词\n三\n、\n小结\n第二节\n组配特征\n一\n、\n的音节对比\n二\n、\n双音节\n“\n”\n的构词类型对比\n[p.4]\n三\n、\n“ 迷”\n与\n控”\n的特殊用法\n吉\n第三节\n色彩特征\n一\n、\n语体\n彩\n二\n、\n感情色彩\n三\n、\n形象色彩\n四\n、\n小结\n第五章\n现代汉语类词缀产生的动因\n第一节\n内部动因\n一\n、\n语言类推机制的推动\n二\n、\n语言经济机制的需求\n三\n、\n语言内部平衡机制导致词汇中潜词的显现\n四\n、\n第二节\n外部动因\n一\n、\n语言接触的催化\n二\n、\n社会发展变化的结果\n三\n、\n社会文化包容性的影响\n四\n、\n新的传播媒介的推动\n五\n、\n使用者求新\n、\n求简\n、\n求异心理的促成\n六\n、\n录\n射\n攻读硕士学位期间发表的学术论文\n扬州大学学位论文原创性声明和版权使用授权书\n[p.5]\n王周\n:\n类词缀\n族”\n“ 党”\n“ 迷”\n“ 控” 研究\n中\n文摘要\n近年来\n,\n随着词汇的变化发展\n,许多近似词缀的语言单位出现在汉语中并广泛参与\n造词\n,它们意义未完全虚化\n,\n具有定位性\n、类化性及能产性等特征\n,我们称之为\n类词\n缀\n。现代汉语类词缀的迅速发展引起了学界重视\n,\n对它们的研究也逐步展幵\n。但过去\n的研究多是对类词缀这一语言现象本身或单个类词缀进行探讨\n,缺乏对其深层次解读及\n横向对比\n。在类词缀中\n,指人的类词缀数量较多\n,\n发展较快\n,代表性较强\n,\n具有重要研\n究价值\n,\n故本文选取了\n“ 族”\n党”\n“ 迷”\n“ 控”\n四个现代汉语指人类词缀\n,\n依托从新词\n语词典\n、语料库及网络搜集的语料\n,运用纵向分析与横向比较相结合\n、计量统计与对比\n分析相结合\n、描写与解释相结合的方法\n,对它们进行了深入\n、系统地分析\n。通过本文的\n研究\n,可以探寻它们的历时发展线索\n,窥见不同类词缀的异同\n,分析类词缀产生的原因\n,\n有助于了解汉语合成词的发展状况。\n本文包括绪论\n、\n主体及结语三部分\n,\n其中主体内容共五章\n。\n第一章\n、\n第二章是对\n“ 族\n“ 党”\n“ 迷”\n“ 控”\n四个类词缀语义系统的研究\n。\n由于学\n界缺少对它们的溯源性探讨\n,\n故我们选取了介绍古今语义的多部权威工具书作为参考\n。\n首先将各部工具书对上述类词缀的解释整理归纳\n,\n而后结合具体用例寻求其相关用法\n,\n以此为佐证\n,\n对四个指人的类词缀语义演变脉络做了梳理。通过分析我们认为\n,\n“ 迷”\n为典型的自源性类词缀\n,是现代汉语自身变化的结果\n;\n“ 族” “ 党” 虽不属自源性类词缀\n,\n但却是在汉语自身发展的基础上\n,\n由于汉外语言接触而产生\n;\n“ 控” 则是他源性类词缀。\n第三章首先对每个类词缀自身构词特点进行了分析\n,主要是对\n“\n类词缀” 这一模\n式中\n” 的特点及相关族词的语法特征做了分析。经分析发现\n,\n由于汉语双音节词占\n优势\n,几个族词中\n“\n” 多为双音节词语\n。\n需要指出的是\n,\n“\n迷” 族词中虽然\n“\n” 以\n双音节居多\n,但从绝对数量、使用频率看\n,\n单音节\n“\n” 仍占据优势。\n由于\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 都是指人类词缀\n,\n故所构造的词语均为名词性\n,\n具有名词的语法特征\n。从\n词语模角度看\n,\n“\n类词缀” 模式中\n,\n“\n” 可以看做词语模中的空位\n,\n即模槽\n,而类词\n缀是词语模的模标。最后\n,本章从修辞造词角度分析了这一模式\n,认为它们整体为类推\n式仿拟造词\n,\n其中\n“\n” 又运用了借代造词、\n比喻造词等不同造词方法\n。\n第四章从语义特征、组配特征\n、色彩特征三方面对四个类词缀展幵横向比较\n。我们\n在进行语义特征比较时\n,\n分\n“ 族” 与\n“ 党” 及\n“ 迷” 与\n“ 控” 两组展幵分析,\n它们相互\n[p.6]\n扬州人学硕士学位论文\n间在语义上有交叉\n,\n同时又存在不同\n。\n组配特征方面\n,\n“ 迷” 与\n“ 族”\n“ 党”\n“ 控” 三个\n新兴指人类词缀有明显不同\n;\n“ 迷” 与\n“ 控” 本身都为动词性成分\n,它们又有区别于\n党”\n“ 族” 的组配特征\n。\n另外\n,\n本章还从语体色彩、感情色彩、形象色彩三方面比较了它们\n的色彩特征。\n第五章总结阐述了类词缀产生的动因\n,分为语言内部动因及外部动因\n。\n内部动因主\n要有语言类推机制的推动、语言经济机制的需求、语言内部平衡机制导致词汇中潜词的\n显现\n。外部动因包括语言接触的催化、社会发展变化的结果、社会文化包容性的影响\n、\n新的传播媒介的推动以及使用者求新、\n求简\n、求异心理的促成\n。\n关键词\n:\n类词缀\n;\n“ 族”\n“ 党”\n“ 迷”\n“ 控” ;\n语义\n;\n合成词\n;\n词语模;\n修辞造词\n[p.7]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n,\n,\n“\n” ,“\n”\n“\n”\n“\n”\n,\n“\n” ,\n“\n,\n,\n“\n”\n,\n“\n”\n“\n”\n“\n”\n“\n”\n“\n”\n”\n,\n“\n”\n[p.8]\n扬州大学硕士学位论文\n“\n“\n”\n,\n“\n”\n“\n” ,\n“\n”\n“\n“\n”\n“\n”\n“\n”\n“\n”\n“\n”“\n”“\n,,\n“\n[p.9]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控\n研究\n绪\n论\n、研究对象与研究内容\n汉语是孤立语\n,\n与印欧语言相比\n,缺乏严格意义上的形态变化\n,\n主要通过虚词及语\n序变化来表达语法意义\n。随着社会的发展\n,越来越多的新事物出现在日常生活中\n,这就\n要求语言用更丰富\n、更新颖的形式表达新的内容\n。词汇作为语言的建筑材料\n,\n往往更敏\n感地体现出语言的变化\n。现代汉语词汇以合成词为主\n,\n其中\n,\n复合式合成词占多数\n,\n附\n加式次之\n,\n重叠式较少\n。近些年\n,汉语某些语素的造词能力有了很大变化\n,\n其中一个重\n要的表现就是许多近似词缀出现并广泛参与造词\n,我们将这些近似词缀的语言单位称为\n“ 类词缀” 。所谓类词缀\n,\n是指语义未完全虚化\n,\n具有定位性、类化性及能产性的语言\n单位。\n汉语词汇中\n,\n典型前缀如\n“ 小\n、\n老\n、初” ,\n后缀如\n“ 子、\n头、儿”\n,\n中缀如\n“ 罗里罗\n嗦” 中的\n“ 里” ,\n这些词缀的构词目前已趋于稳定\n,\n变化不大\n。\n与典型词缀相对应\n,\n许\n多近似词缀的单位越来越受到学界重视并引起诸多学者对其展幵研究。\n吕叔湘\n(\n提到\n:\n“ 有不少语素差不多可以算是前缀和后缀\n,\n然而还是差点儿\n,\n只可以称为类前缀\n和类后缀... ... 说它们作为前缀和后缀还差点儿\n,\n还得加个\n‘ 类\n’\n字\n,\n是因为它们在语义\n上还没有完全虚化\n,\n有时候还以词根的面貌出现\n。\n”\n此后\n,语言学界对类词缀的研究广\n泛开展起来\n。\n目前\n,\n学界对于类词缀的研究多是从\n“ 类词缀” 这一术语出发\n,\n对与\n“ 类词缀” 相\n关的定义、界定\n、性质、特点\n、成因进行宏观分析介绍\n,\n缺乏对其内部的深层次解读\n。\n虽然以单个类词缀进行研究的论文近年多有出现\n,但仅仅是局限于\n“ 类词缀” 本身及所\n研究的单个类词缀\n,没有横向或纵向的系统分析\n,更缺少对不同类词缀进行对比研究的\n创新性学位论文\n。在语言生活中\n,\n以\n“ 族”\n“ 客”\n“ 门”\n“ 控”\n“ 帝”\n“ 哥” 等构词成分结\n尾的词语逐渐增多\n,人们的交际词汇越发丰富\n。对这些词进行研究\n,\n有助于我们了解\n汉语目前的使用情况\n,\n加深对汉语词汇的认识研究\n,\n更好地掌握现代汉语的发展方向\n,\n为汉语词汇研究及词汇规范化提供可借鉴的参考\n。\n由于\n“ 族”\n“ 客” 等语素的意义尚未\n吕叔湘\n:\n《汉语语法分析问题》\n,\n商务印书馆\n,\n丨\n年\n,\n第\n页\n下文中把以\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 为类词缀所构造的词语分别称\n“\n族” 族词\n、\n党” 族词、\n“\n迷” 族词、\n“\n控” 族词\n。\n[p.10]\n扬州大学硕士学位论文\n完全虚化\n,\n还处在发展之中\n,\n只是倾向定位和范畴化\n,\n并有一定能产性\n,\n故本文将它们\n归入类词缀范畴进行研究\n。\n在类词缀中\n,指人的类词缀所占比例较大\n,\n如\n“ 族” “ 哥” “ 客” “ 帝” “ 奴”\n“ 党”\n“ 二\n代\n’ ’\n‘ ‘ 控\n’ ’\n“ 爷\n’ ’\n‘ ‘ 迷\n’ ’\n“ 姐” 等\n。\n从来源上观察这些类词缀我们不难发现\n,\n它们有的由亲\n属称谓转化而来\n,如\n“ 哥” “ 姐” “ 爷” ;有的由汉语名词词义的虚化而來\n,如\n“ 党” “ 帝” ;\n有的由外来语素发展演变而來\n,\n如\n“ 控” 。\n从所构词的色彩义来看\n,\n一般具有明显的感\n情色彩\n,\n如\n“ 迷”\n“ 控” 具有喜爱偏好意味\n;\n“ 二代” 具有讽刺\n、揶揄意味\n;\n“ 奴” 含有\n一种被束缚的意味\n。本文正是由它们相互间的横向比较得到启发\n,选取了指人类词缀中\n表示感情色彩的\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 四个类词缀进行分析研究。\n“ 族” 与\n“ 党” 在现\n代汉语中都为名词性\n,\n族” 表示具有某种共同属性的一类人\n,\n是目前现代汉语新词\n语中发展较为稳定且使用较为规范的代表\n;\n“\n党” 表示经常做某事或有共同属性的人\n,\n多表示艇义的感情色彩\n,\n现在逐渐向中性色彩发展\n。\n“ 迷” 与\n“ 控” 在现代汉语中都为\n动词性\n,\n“\n迷” 表示沉醉于某一事物的人\n,\n作为出现较早的类词缀\n,\n“\n迷” 的使用已\n趋于规范\n;\n“\n控” 表示极度痴迷于某类事物的人\n,\n“\n控”\n目前应用较广\n,类推能力很\n强\n,\n但极不稳定\n,\n有待规范\n。\n本文选取\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 为研究对象\n,\n以语料库\n、\n新词语词典\n、\n网络为语\n料来源\n,\n对\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 的相关问题进行梳理\n。\n首先从历时意义变化角度出\n发\n,初步探求\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 的语义系统\n。\n由于目前学界缺乏对\n“ 族” “ 党” “ 迷”\n“ 控” 这四个语言单位语义的系统研究\n,在考虑到权威性及准确性的情况下\n,我们参考\n工具书对它们的相关解释\n,并结合工具书及语料库中较早的例证\n,来探求它们的语义系\n统\n。此外\n,\n本文还将从结构\n、\n词语模、修辞造词等角度分析以\n“ 族”\n“ 党”\n“ 迷”\n“ 控”\n为类词缀的词语的诸多特点\n,\n并全面解读类词缀发展的内部与外部动因\n。\n二、研究综述\n一)关于类词缀的研究\n早在二十世纪前期\n,\n瞿秋白先生就已酝酿\n“ 类词缀”\n(\n这一思想。他提\n出了现代汉语构词上除字根加字尾法外的另一种方法:\n“ 采取一些汉字\n,\n把它们变成新\n式的字尾\n,\n例如\n‘ 资本家\n’\n的\n‘ 家\n’\n,\n‘ 民权主义\n’\n的\n‘ 主义\n’\n;\n再则\n,\n还有新式的字头\n,\n例如\n‘ 非资本主义的\n’\n的\n‘ 非\n’\n。”\n瞿先生所讲的新式字头\n“ 非” 与新式字尾\n“ 家”\n“ 主\n摄秋白\n:\n《霍秋白文集\n文学编\n第三卷》\n,\n人民文学出版社\n,\n丨\n年\n,\n第\n页\n[p.11]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n义” 正是今天我们所讲的类词缀\n。此外\n,鲁迅先生的杂文集\n《准风月谈》\n中\n“ 准” 也与\n我们现在常见的\n准新郎”\n“ 准妈妈” 中的\n“ 准” 类似。方光鮝先生也提出\n“\n‘ 性\n’ 有词\n尾化的倾向\n;\n‘ 非\n’\n、\n‘ 反\n’ 有词头化的倾向\n。” 1王力先生也提出了\n“ 准前附号” 2的说法\n。\n吕叔湘\n(\n在\n《中国文法要略》\n中提出了\n“ 近似词尾” 的观点\n,\n并列举了\n个近似词尾。张志公也讲到\n:\n“ 还有一些构词成分\n,\n如\n‘ 者\n、\n家、\n员\n、手、性\n’\n,\n意义比\n‘ 子、儿、\n头\n’\n实在一些\n,\n可是性质跟\n‘ 子\n、\n儿\n、\n头\n’\n相近... ... ”\n3陆志韦\n、\n赵元任等\n人也对此类成分有所介绍\n。文化大革命后\n,\n吕叔湘先生在\n《汉语语法分析问题》\n中第一\n次提出了\n类前缀” 与\n“ 类后缀” 的概念。\n吕先生的论述前文已经介绍\n,这里不再赘述。\n之后\n,\n许多学者如赵元任\n(\n、任学良\n(\n、沈孟瓔\n(\n、\n陈光晶\n(\n、\n朱亚军\n(\n、\n富丽\n(\n、\n刘灵敏\n(\n等都对类词缀这一语言现象发文探讨\n,\n但各位学者对类词缀的认定有些分歧\n。\n杨锡彭\n(\n认为\n,\n“ 意义是否虚化对确定词\n缀起决定性作用... ... 类词缀必须是定位的不成词语素” 气张斌\n(\n在\n《现代汉语\n描写语法》一书中对词缀进行了更详细的说明\n,他将词缀分为纯词缀\n、准词缀\n、类词缀\n三类\n,\n“ 位置固定\n、\n意义虚化且范畴化的词缀为纯词缀\n;\n意义尚未完全虚化的词缀为准\n词缀\n;\n意义未完全虚化且只是倾向定位和类化的词缀为类词缀\n。”\n他还将纯词缀分纯前\n缀和纯后缀\n,将准词缀分准前缀\n、准中缀\n、准后缀\n,将类词缀分类前缀和类后缀\n。此外\n,\n张斌先生指出\n“ 类词缀大多是\n世纪后半叶从外语翻译引入的\n,\n也有一部分是汉语自\n发形成的\n,\n而且\n,这类语言单位正在不断产生中\n,\n其本身的数量虽然不算太多\n,\n但结合\n面大都比较宽... ... 一般都附在双音节语素组后面\n,构成特定用途的语法词\n。”\n张斌先生\n所讲的语法词是相对于词汇词来讲的\n,它们\n“ 在句法组合关系中相当于一个词\n,但是这\n种组合单位在词汇学层面还没有完全凝固\n、定型\n,\n即使在收词完备的大型词典中也没有\n他们的位置”\n,\n如\n:\n雷锋式\n、李代桃僵式、沉默状、气急败坏状等\n。\n《汉语知识词典》、\n《中国语言文字学大辞典》、\n《辞海》都对\n“ 类词缀\n(或类前缀\n、类后缀\n)” 这一术语进\n行了解释说明\n。\n二\n)关于\n“ 类词缀化” 的研究\n方光泰\n:\n《方光燕语言学论文集》\n,\n商务印书馆\n,\n年\n,\n第\n页\n2王力\n:\n《王力文集\n第一卷\n中国语法理论》\n,\n山东教育出版社\n,\n年\n,\n第\n张志公:\n《汉语\n第三册》,\n人民教育出版社\n,\n年,\n第\n杨锡彭\n:\n《汉语语素论》\n,\n南京大学出版社\n,\n年\n,\n第\n页\n张斌主编\n:\n《现代汉语描写语法》\n,\n商务印书馆\n,\n年\n,\n第\n页\n张斌主编\n:\n《现代汉语描写语法》\n,\n商务印书馆\n,\n丨\n年\n,\n第\n页\n张斌主编\n:\n《现代汉语描写语法》\n,\n商务印书馆\n,\n丨\n年\n,\n第\n[p.12]\n扬州大学硕士学位论文\n以往学者较多采用\n“ 语法化”\n“ 虚化” 这样的术语\n,\n对于\n“ 类词缀化” 这一术语并\n无专门的研究探讨\n。\n多位学人曾使用\n“ 词缀化” 一词\n,\n如沈孟瓔先生曾撰写文章\n《汉语\n新的词缀化倾向》\n,讲到\n“ 所谓词缀化的倾向指的是作为词根的原来实在意义逐渐虚化\n,\n在构词中产生某些附加意义的倾向\n。\n”\n我们可以据此理解\n“ 类词缀化倾向” ,\n即词根原\n来的实在意义正往虚化方向发展\n,但是在很大程度上还保留着原来的实在意义\n,\n在构词\n中会产生附加意义的倾向\n。\n类词缀化” 这一说法已经被多人使用\n,\n邵凌力在学位论文\n《汉代汉语类词缀鉴定标准及语法化研究》\n中讨论语法化时\n,\n也运用了\n“ 类词缀化” 这\n一说法。本文所讲的\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 的类词缀化\n,\n就是指研究\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 怎样从汉语构词的实语素逐渐产生虚化意味\n,但仍很大程度上保留原来的实在意\n义\n,\n向类词缀的方向发展这一问题\n。\n三)关于\n“\n族” 族词\n、\n“\n党” 族词\n、\n“\n迷” 族词\n、\n“\n控” 族词的研究\n以\n“ 族” 及\n“\n族” 族词为研究对象的文章较多\n,\n且有一篇学位论文专门探讨\n。\n其\n中\n,\n禹存阳\n(\n认为类推机制及词语模框架模式促进了\n“\n族” 族词的衍生\n。赵佳\n从生成的角度\n,\n结合框架语义学、\n隐喻和转喻以及类推理论\n,\n对现代汉语中的\n“\n族” 词进行了比较系统的描写和分析\n。任凤琴\n(\n分析了\n“\n族” 族词产生的\n原因\n,她认为主要可以从语言自身\n、大众心理因素、社会的进步等方面进行分析\n。宋贝\n贝\n(\n考察了\n“\n族” 中\n“ 族” 的虚化情况\n,\n并从语言的内外部因素对\n“\n族” 衍\n生动因进行了分析。许赛群\n(\n以历史文献为线索\n,\n对\n“\n族” 的语法结构、虚化\n历程进行了分析\n,\n探讨了其虚化机制和动因\n。\n“ 党” 及\n“\n党” 族词研究文章不多\n,\n陈昌来\n、朱艳霞\n考察了\n“\n党” 族词\n的语义功能及句法功能\n,介绍了该类词语的形成和发展规律\n,认为\n“\n族” 对于\n党”\n的兴起和发展起到了重要的推动作用\n。指人语素的发展既是语言本身发展的结果\n,也是\n社会发展的结果\n,\n文章中作者用到了\n“ 类词缀化” 这一术语\n,\n并认为\n“ 党” 等指人语素\n类词缀化的动因在于框填。\n以\n“ 迷” 及\n“\n迷” 族词为研究对象的文章较少\n,\n李秋菊\n(\n对\n“ 迷” 类词的\n音节数量、功能类型\n、组合方式、生成能力进行了分析\n,认为其在构词性质上位置固定\n,\n有一定程度虚化并有语法标志作用\n,呈现类词缀特征\n。张晓青\n从多方面对“\n迷”\n现象进行了探讨\n,介绍了\n“\n迷” 的语义特点\n、结构特点\n,\n并认为\n迷” 有类词缀化趋\n向\n。\n沈孟瓔\n:\n《汉语新的词缀化倾向》\n,\n《南京师大学报》\n(社会科学版\n,\n年\n,\n第\n期\n[p.13]\n王周\n:类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n“\n控” 族词方面\n,陈海峰\n(\n对“ 控” 族词进行了最初的简单探讨\n。王丽\n(\n从构成和功能分布、语义表达和运用等角度分析了\n“\n控” ,\n并对\n控” 词的演变发\n展进行了简单的描述\n。何佩佩\n(\n依据所搜集的语料\n,\n描写了\n“\n控” 族词的结构\n来源、发展、用法及产生原因\n。认为\n“\n控” 族词已经形成了自己所独有的一系列特征\n,\n并有相当的能产性。刘旭\n(\n在语法及语用方面阐述了\n“ 控” 族词\n,\n并针对\n“ 控”\n族词的特点对其发展做出评价\n,\n认为应对其健康引导\n,辩证看待\n。曹春静\n(\n介绍\n了\n“ 控” 的类词缀化动因及衍生模式\n,\n并从修辞效果方面对其进行了分析。\n三、研究意义及创新点\n一)研究意义\n对\n“ 族”\n“ 党”\n“ 迷”\n控” 及相关类词缀研究具有一定的理论意义及较高的实用价\n值\n,\n总结归纳如下\n:\n第一\n,\n依托\n《汉语大词典》、\n《辞源》\n、\n《现代汉语词典》等工具书\n,\n分析\n“ 族”\n“ 党”\n来\n,,\n“ 访” 辞均\n米\n雜的耳\n玄体\n悔\n?十们\n士\n;今的\n;时长展线索\n丄\n、\n口\n、夕、\n、刀\n—\n匕\n人\n。\n第二\n,\n运用共时历时相结合的方法\n,\n分\n“ 族” 与\n“ 党”\n“ 迷” 与\n“ 控” 进行比较研\n究\n,\n寻求它们的异同\n,\n并进一步分析指人类词缀的产生原因\n。\n第三\n,\n从模因论及修辞造词法角度探究类词缀所构造的相关族词的结构特点\n。\n二)创新点\n本文依据新词语词典、语料库语料及网络语料\n,系统全面地对比分析\n族” “ 党” “ 迷”\n“ 控” 等类词缀\n,\n从共时与历时两方面分析它们的语义系统及使用情况\n。\n四个类词缀都\n为指人类词缀\n,\n“ 迷” 是旧有指人类词缀\n,\n新兴指人类词缀中\n,\n“ 族” 使用广泛且稳定\n,\n“ 党” 热度降温\n,\n“ 控” 大规模发展但极不稳定\n,\n通过对它们的比较研究\n,\n可以较全面\n地了解各自特点并总体掌握指人类词缀特点\n。本文还将探索类词缀构词的结构特点\n,并\n探讨指人类词缀发展的内部外部动因\n。\n四\n、研究方法\n一)纵向分析与横向比较相结合的方法\n运用纵向分析与横向比较相结合的方法\n,\n依托所调查的语料\n,\n系统分析\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 的意义系统及以它们为类词缀的附加式合成词的异同\n。\n二)计量统计与对比分析相结合的方法\n对语料库\n、\n网络、\n辞书中出现的\n“\n族”\n“\n党”\n“\n迷”\n“\n控” 族词进行计量统\n[p.14]\n扬州大学硕士学位论文\n计\n,\n并对比分析相\n间的特点\n。\n三)描写与解释相结合的方法\n对\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 和以它们为类词缀的词语进行全面描写\n,\n并在此基础上\n解读其变化的内部外部动因\n。\n五\n、语料来源\n北京大学汉语语言学研究中心古代汉语语料库\n(\n古代汉语语料库网络版\n)\n北京大学汉语语言学研究中心现代汉语语料库\n(\n现代汉语语料库网络版)\n《汉语新词语》\n(\n年\n年)、\n《汉语新词词典\n》等新词语词典中\n的相关新词语。\n《现代汉语词典》、\n《辞源》、\n《汉语大词典》等工具书的相关词条。\n从人民网\n、\n百度网\n、新浪网等较有影响力的网站选取的网络语料\n。\n在语料选择时\n,\n为了保证权威性及实用性\n,\n我们首先以近几年\n《汉语新词语》的语\n料为第一目标\n,\n该书中\n,\n“\n族” 族词出现较多\n;\n“\n党”\n“\n控” 族词也有出现\n,\n但数\n量较少\n;\n“ 迷” 作为旧有类词缀\n,该书并未收录\n“\n迷” 族词\n。\n语料库收录内容较多\n,\n但考虑到其更新较慢\n,近几年新产生的词并未收录\n,故我们从中主要选取\n“\n迷” 族词\n,\n少量\n“\n族” 族词\n;\n“\n党” 族词与\n“\n控” 族词语料主要来源于网络\n。\n本文中\n,\n我们根据\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 的各自特点\n,\n对它们进行了详细分类\n,\n以期更明了\n、更直观地进行研究。\n以\n“ 族” 为例\n,\n首先\n,\n依托辞书\n,\n对古代汉语、现代\n汉语中\n族” 的义项进行梳理\n。然后\n,根据\n“ 族” 所在位置\n,将它们分为\n“ 族\n” 与\n“\n族\n,\n两种形式\n。\n在\n“\n族” 的形式中\n,\n又分为\n“ 族” 作为词根构词1与\n“ 族” 作为类词\n缀构词两种\n。\n“ 族\n” 与旧\n“\n族” 族词共同构成旧\n“ 族” 族词\n。这样\n,\n“\n族\n,,族词可\n以更好地与其它类型的\n“ 族” 族词分幵。具体分类方法如下图所示\n图\n“ 族” 族词的结构关系\n“ 族\n”\n(如\n‘‘ 族群” )\n旧\n“ 族,,族词\n“ 族”\n「旧\n“\n族” 族词\n(如\n“ 民族” )\n“\n族”\n“\n族” 族词\n(如\n“追星族”\n“\n族” 族词\n“\n族” 类型词语中\n“ 族” 作为词根构词本文统称为旧\n“\n族” 族调\n,\n‘ ‘ 党”\n“ 迷\n“ 控” 说法与\n“ 族” 一致。\n[p.15]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控\n研究\n第一章\n“ 族”\n“ 党” 的语义系统研究\n“ 族” 与\n“ 党” 作为现代汉语类词缀在当今应用广泛\n,\n尤其是以\n族” 为类词缀组\n成的\n“\n族” 族词\n,\n广泛见于文章、\n报刊\n、\n辞典之中\n。\n在古代汉语中\n,\n“ 族” 与\n党”\n意义较为接近\n,\n它们都有\n“ 地方的基层组织” 这一意义\n。五家为邻\n,\n五邻为里\n,\n五百家\n为党。在\n《周礼\n地官\n大司徒》讲到\n:\n“ 五族为党\n。\n” 现代汉语中\n,\n作为词根构词时\n,\n“ 族” 与\n“ 党” 所成的词都是名词性的\n;\n同时\n,\n由它们作类词缀的汉语词语蓬勃发展\n,\n如\n“ 追星族”\n“ 考碗族”\n“ 飞车党”\n“ 五毛党” 等\n。在这些词中\n,\n“ 族” 与\n“ 党” 都表示有\n某种共同属性的一群人的意思\n,在某些时候意义相通\n,可以互换。联系它们的古今意义\n及用法\n,\n我们将它们归入一章进行介绍\n。\n第一节\n“ 族” 的语义系统研究\n从造字法来讲\n,\n“ 族” 是会意字\n。\n它的中骨文字形为\n,\n观察它的平骨文字形\n,\n上\n半部分为一杆树立的旗杆\n,\n其上旗映飞扬\n,\n下半部分是\n“ 矢”\n,\n意思是箭头\n。\n旗巾只在战\n争中有集合战士的作用\n,\n“ 矢” 很明显是表示用兵器杀敌\n,\n所以\n“ 族” 在古代造字时最\n初是一个表示战斗的字\n。\n随着汉字的不断发展\n,\n“ 族” 逐渐产生了许多不同的意思。\n本\n节中\n,\n我们将系统梳理\n“ 族” 的意义发展脉络\n,\n概括其从古代的词到现代汉语的词根\n,\n直至当下类词缀用法的发展变化。\n— 、\n“ 族” 旳语义系统描写\n从先秦诸子散文到后来明清小说\n,\n“ 族” 应用广泛\n。\n《说文解字》\n中\n,\n“ 族” 的写法\n为将\n,\n从字形看\n,\n由\n“ 放” 和\n“ 矢” 两部分组成\n,\n从放从矢。\n《说文》解释\n族” 的意\n思为\n“ 矢锋也\n,\n束之族族也\n。\n”\n古代五十矢为束\n,\n“ 族族” 是聚集之意\n,\n而从放\n,\n即\n有用旌旗来引起大家注意、汇集之意\n,旌旗所在的地方就是矢聚集之地。据此理解\n,\n“ 族”\n本义为箭头\n,\n进而引申为在旌旗的指引下汇集弓箭之意\n。\n我们整理了多部权威的工具书\n,参考它们对\n“ 族” 的解释\n,来探究\n“ 族” 的语义系\n统。这几部辞书中\n,\n《辞源》\n2、\n《古汉语常用字字典》\n3、\n《古代汉语词典》\n4为解释古汉\n汉)许慎\n《说文解字》\n,\n中华书局\n,\n年版\n,\n第\n丨\n页\n■广东\n、\n广西、湖南、\n河南辞源修订组\n、\n商务印书馆编辑部编\n:\n《辞源》\n,\n商务印书馆\n,\n年\n王力\n、\n每麟祥等原编\n,\n蒋绍愚\n、唐作藩等增订\n:\n《古汉语常用字字典》\n,\n商务印书馆\n,\n年\n《古代汉语词典》编写组编\n:\n《古代汉语词典》,\n商务印书馆\n,\n年\n[p.16]\n扬州大学硕士学位论文\n语语义的工具书\n,\n《辞海》\n、\n《汉语大词典》\n对古今语义皆有解释\n,\n《现代汉语词典》\n(第\n六版\n)\n3是解释现代汉语语义的权威词典\n。\n综合比较各部辞书的解释\n,\n并参考辞书及语\n料库列举的较早例证\n,\n可以较好地理清\n“ 族” 的意义发展脉络\n。\n整理发现\n,\n各部辞书对\n“ 族” 的解释有所不同\n,\n具体见下表\n:\n表\n辞书对\n“ 族” 的解释\n对\n“ 族” 的解释\n宗族\n;\n家族\n。\n5种族\n;\n族\n。\n品类\n;\n族类\n。\n4灭族\n。\n丛聚\n;\n集合\n。\n《辞海》\n通\n奏” 。\n知凑\n)\n同\n“ 藤\n”\n“ 簇” 。\n有血缘关系之亲属的仓称\n。\n品类\n。\n聚结\n,集中\n。\n10群\n,众。\n刑及父母\n兄弟麥子口族\n。\n《辞源》\n节奏\n。\n1音律名\n。\n族\n1有一定血缘关系的亲属的统称\n。\n姓氏\n。\n5指官族\n,\n世官\n。\n古代一\n种地方基层组织\n,\n以百家为一族\n。\n5\n族\n。\n品类\n;\n种类\n。\n7众多\n。\n丛集\n;\n聚集。\n《汉语人词\n筋骨聚结处。\n灭族。\n诛灭;\n诛杀\n。\n典》\n族\n通\n“\n奏” 。节奏\n。\n族\n通\n“\n蔟\n” 。十二律中的律名\n。\n《古汉语常\n家族\n,\n同姓的亲属\n。\n姓\n》\n类\n。\n种族。\n灭族。\n4聚结\n。\n用字字典》\n1家族\n,\n同姓的亲属\n。\n类。\n民族\n,\n种族。\n1众\n,群。\n4聚集。\n5姓。\n灭\n《古代汉语\n族\n,\n刑及全族。\n词典》\n通\n奏” 。\n通\n“ 族\n。音律名\n。\n1家族。\n古代的一种残酷刑法\n,\n即灭族。\n1种族\n;\n民族\n。\n4事物有某种共同属性\n词典》\n的一大类\n。\n称\n■某种共同\n’性的一类\n。\n由上表可知\n,\n“ 族” 在古代有三种读音\n,\n但除\n“\n” 这一读音外\n,\n其它两个是\n“ 族”\n夏征农主编\n:\n《辞海》\n上海辞书出版社\n,\n年\n罗竹风主编\n:\n《汉语大词典》\n,\n汉语大词典出版社\n,\n年\n中国社会科学院语言研究所词典编辑室编\n:\n《现代汉语词典》\n,\n商务印书馆\n,\n年\n[p.17]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n作为通假字时的读音\n,\n它们相互之间语义并无关联\n,\n故\n“ 族” 作为通假字使用的相关词\n义不是本文的研究对象。\n在词义收录方面\n,\n《古汉语常用字字典》所收录的\n“ 族”\n的意\n义最少\n,\n《汉语大词典》所收录的意义最为全面\n、详细\n。\n与\n《汉语大词典》相比\n,\n《古汉\n语常用字字典》\n中\n“ 官族\n(世官)\n、\n古代地方基层组织\n、众多\n、筋骨聚结处\n、\n灭族\n、\n诛\n灭\n(诛杀\n)” 这几个意义都没有收录在内\n。纵观各条释义\n,\n“ 具有一定血缘关系的亲属的\n统称\n、\n民族\n、\n聚集” 等意义所有词典均收录在内\n,\n“ 官族\n,\n世官\n、\n古代一种地方基层组\n织、筋骨聚结处、诛灭\n;诛杀” 只有\n《汉语大词典》收录。在现代汉语方面\n,第\n版\n《现\n代汉语词典》较全面地收集了现代用法\n,\n与第\n版相比\n,\n新版\n《现代汉语词典》将\n“ 称\n具有某种共同属性的一类人” 这一意义单独列出\n,\n这表明\n,\n“ 族” 作为类词缀表示某一\n类人的用法稳定发展并得到肯定\n。\n由于\n《汉语大词典》收录了从古至今所有\n“ 族” 的意\n义及用法\n,而许多用法在现代汉语已经不存在\n,所以我们认为\n《现代汉语词典》对于“ 族”\n在现代汉语中的意义反映较为客观\n。\n为了更清楚地展示\n“ 族” 在各辞书中的意义区别\n,\n我们将它的意义整理如下\n:\n表\n“ 族” 的意义整理简表\n《古汉\n《古代\n《现代\n释义\n,\n°\n《辞海》\n《辞源》\n语常叫\n汉语词\n汉语词\n人词典》\n“\n字字典》\n典》\n典》\n1有一定血缘关系的亲属的统称\n指官族\n,\n世官\n古代一种地方基层组织\n,\n以\n“\n“\n“\n“\n“\n百家为一族\n民族\n品类\n;\n种类\n众多\n7丛集\n;\n聚集\n筋骨聚结处\n灭族\n诛灭\n;\n诛杀\n称具有某种共同属性的一类人\n下表中\n,\n“\n” 代表词典中有该意义\n,\n“\n” 表示词典中无该意义\n。\n[p.18]\n扬州大学硕士学位论文\n二、\n古代汉语中\n” 族” 的使用\n“ 族” 本义为箭头\n,进而引申为丛集\n、\n聚集之意\n,\n在此基础上\n,\n产生了不同的语义\n演变线索\n。本部分我们综合比较\n《汉语大词典》、\n《辞源》等工具书中所列举的出现较早\n的例证\n,\n并广泛查询语料库\n,\n选取所见的最早例证进行举例\n,\n展现\n“ 族” 的使用情况。\n在介绍时\n,\n总体按各个义项出现的时间先后顺序对\n“ 族” 的意义进行呈现\n,\n对于出现时\n期大致相同及无法确定具体出现时间的意义\n,我们结合总结归纳的语义发展脉络的先后\n顺序进行举例介绍\n。\n经分析\n,\n我们认为\n“ 族” 在从古至今的使用过程中主要有以下三\n条语义发展脉络\n。\n一\n)语义发展脉络一\n“ 族” 主要是“ 丛集、聚集” 这一意义发展到其它意义的\n,这一意义引申脉络是“ 族”\n的意义变化的主线\n,\n包括\n“ 有一定血缘关系的亲属”\n“ 民族\n、\n种族” 等\n。\n丛集、\n聚集\n云气不待族而雨\n,\n草木不待黄而落\n。\n(庄周\n《庄子\n■在宥》\n)成玄英疏\n:\n“族\n,\n聚\n也\n。\n”\n木族生为灌\n。\n(《尔雅\n释木》\n)\n有一定血缘关系的亲属\n克明俊德\n,\n以亲九族。\n(《尚书\n免典》\n)\n麟之角\n,振振公族\n,\n于嘆麟兮。\n(《诗经\n周南\n麟耻》\n)\n民族\n,\n种族\n,\n邦族\n言旋言归\n,\n复我邦族\n。\n(《诗经\n小雅\n黄鸟》\n)\n陈\n,\n颜顼之族也\n。\n(左丘明\n《左传\n昭公八年》\n种类,\n品类\n帝曰\n:\n吁\n,\n啡哉\n!\n方命圮族。\n(《尚书\n免典》\n)孔传\n:\n“族\n,\n类也\n。”\n由于研究时间及条件所限\n,\n本文依据工具书及语料而得到的相关内容所出现的时间先后顺序难免出现疏漏\n,\n具体\n各个义项的出现准确时间有待进一步考证\n,\n后文中\n“ 党”\n“ 迷”\n“ 控\n的使用情况介绍沿袭此处的介绍模式。\n[p.19]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n非是族也\n,\n不在把典\n。\n(《国语\n鲁上》\n)\n古代一种地方基层组织\n四闾为族\n,\n使之相葬\n。\n(《周礼\n地官\n‘ 大司徒》\n)\n其次则比\n、\n闾\n、族\n、\n党之师\n,\n亦皆卒\n、\n两\n、\n师\n、旅之帅也\n。\n(王安石\n《上仁宗皇\n帝言事书》\n)\n官族\n,\n世官\n问其族\n,\n对曰\n:\n“冷人也。\n”\n(左丘明\n《左传\n成公九年》\n)\n故派系官族\n,\n文儒德业\n,\n连环如粲星\n。\n(《唐代墓志汇编续集》\n)\n灭族\n罪人以族。\n(《尚书\n泰誓上〉\n灌夫罪至族\n,\n事\n日急\n,诸公莫敢复明言于上\n。\n(司马迁\n《史记\n魏其武安侯列传》\n)\n诛灭、\n诛杀\n诈为自贼伤以辟事者\n,族之。\n(《墨、子》\n)\n族亲者秦也\n,\n非天下也。\n(杜牧\n《阿房宫赋》)\n二)语义发展脉络二\n“ 族” 的第二条发展脉络为由\n“ 丛集\n、\n聚集” 发展为\n“ 筋骨聚结之处” ,\n再往后意\n义无明显引申变化。\n筋骨聚结之处\n每至于族\n,吾见其难为\n,怵然为戒。\n(庄周\n《庄子》郭象注\n:\n“族\n,\n交错聚结处\n。”\n)\n三)语义发展脉络三\n“ 族” 此处作为形容词使用\n,但仅见于少量古代汉语\n,现代汉语中已没有形容词用\n法。用作形容词时\n,\n意义为\n“ 众多的” ,此意义也由\n“ 丛集、聚集” 发展而来。\n[p.20]\n扬州大学硕士学位论文\n许多\n,\n众多\n族废月更刀\n,折也\n(庄周\n《庄子》\n)\n行久之物\n,\n族必起于少\n。\n(韩非\n《韩非子\n喻老》\n)\n三、现代汉语中\n“ 族” 的使用\n“ 族” 在现代汉语中的意义我们以\n《现代汉语词典》释义为准。\n主要包括\n“ 家族、\n种族、\n民族、\n事物有某种共同属性的一大类、称具有某种共同属性的一类人” 等。举例\n如下\n家族\n牛孟两家都是大族\n,婚姻关系世代不断。\n(越树理\n《孟祥英翻身》\n)\n于小姐系出名门\n,\n乃于风至族亲\n,容貌艳丽\n,\n性格开朗\n,\n于沈阳农学院毕业后分\n配至北京农科院。\n(刘低怕\n《作家文摘\n一张\n“全家福”\n背后的故事》\n)\n种族\n;\n民族\n可是哈纳不走\n,\n于是\n,\n卡拉瓦焦和一个叫基普的镇克族工兵也来到废墟里和他们\n一起生活\n。\n(\n加拿大迈克乐\n翁达杰\n《英国病人》\n)\n这样做是为了告诉大家\n,我并没有生奥尼尔的气或者我不认为他是个种族歧视者\n姚明\n《我的世界我的梦》\n)\n事物有某种共同属性的一大类\n这个几乎每周都要跑一趟花鸟市场的男人已经是几个水族店的老主顾\n,\n而这样的\n水族店仅在景星花鸟市场就有\n家\n,每个店都有自己的老主顾\n。\n(新华社\n年新闻稿\n)\n叶酸是人体必需的\n族维生素\n,婴儿、青少年和孕妇特别容易受到叶酸缺乏的危\n害\n(新华社\n年新闻稿\n)\n称具有某种共同属性的一类人\n从这以后\n,似我这样的\n“追星族” 们\n,\n又成了人云亦云的批判他的\n打手”\n。\n(浩\n然\n《刘绍裳走了》\n[p.21]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n控” 研究\n据称上海市已考出驾照而无自备车的\n“本本族”\n约有\n万人\n,\n其中部分人准备\n买车\n,但多数人暂时还无条件买车\n。\n(《新民晚报》\n年\n月\n日\n)\n四\n、类词缀\n“ 族” 分析\n上文介绍了\n“ 族” 的意义及文章举例\n,\n其中\n,\n在现代汉语中\n,\n“ 族” 作为类词缀构\n词这一用法已越发广泛并趋于稳定。与第\n版\n《现代汉语词典》相比\n,\n第\n版\n《现代汉\n语词典》把之前的\n“ 事物具有某种共同属性的一大类” 进一步延伸\n,\n将\n“ 称具有某种共\n同属性的一类人” 这一解释单独列出\n。这一细微变化可以折射出当今汉语中\n“ 族” 指代\n某一类人的用法进一步确立\n。\n“ 族” 的意义没有完全虚化\n,\n目前只是倾向于定位和类化\n,\n属于现代汉语类词缀。\n关于类词缀\n“ 族” 的来源\n,\n目前多数人认为\n“ 族” 是由\n吾发展而来。\n随着我国改\n革开放的持续进行,\n中\n交流的不断扩大与深入\n,许多円本的文化现象进入我国的文化\n系统,对原有的社会生活注入新的元素\n。在中\n交流中\n,语言交流是最基本的交流方式\n,\n语言交流的发展\n,\n带动了\n“ 族” 的流行\n。李晓东\n(\n认为作为类词缀的\n“ 族” 源于\n本\n,\n之后传入港台地区\n,\n然后进入普通话。万红\n(\n指出\n,\n“\n‘ 族\n’ 起源于円本\n,\n从台湾传入内地... ... 本身是一个由\n本传过来的外來语\n,指有着相似的感情或者爱好的\n一群人。”\n王春娇\n(\n也认为\n,\n“ 族” 是他源性类词缀\n,\n现阶段使用的\n“\n族\n族\n词是外来语素借助汉语已有词形进入汉语词汇系统的\n。然而\n,\n许多人也有不同观点\n,认\n为\n“ 族” 是古代汉语发展至现代汉语的结果\n。\n如台湾学者谢菁玉和许瑞峰\n考察了\n众多汉语古今文献,\n釆取历时研究和共时研究相结合的研究办法,\n认为\n“ 现代汉语\n‘\n族\n’ 的形式\n,是古汉语至今的发展\n;现代之日语借词促进词类后缀\n,\n而且这样的词汇虚\n化是汉语的语法走向之一”\n。综合以往学者的研究成果及自身的研究结论\n,\n我们认为\n“\n族” 族词的产生并广泛应用是汉语自身发展的结果\n,\n円语在\n“\n族” 的发展过程中\n起到了催化剂的作用\n,这只是语言交流的\n“ 额外结果” 。\n如果没有汉日语言交流\n,\n“族\n,,\n也可能产生虚化现象\n,\n只不过时间上可能会更久更漫长一些。\n“\n族” 类型词语中\n,\n“ 族” 的意思原本指\n“ 事物具有某种共同属性的一大类” ,\n从\n广义上讲,\n“ 家族”\n“ 水族”\n“ 语族” 等都可以归入这一意义范围\n。\n目前\n,\n随着\n“ 族” 的\n发展,\n它进一步虚化\n,\n类词缀特征更加明显\n,\n可表示具有某种共同属性的一类人。\n如\n:\n万红\n:\n《当代汉语的社会语言学关照\n:外来词进入汉语的第三次高潮和港\n词的北上》\n,南开人学出版社\n,\n年,\n第\n页\n谢菁玉、许瑞峰\n:\n《汉语语料库里的\n“ 族” :走在虚化路上的类词缀》,\n《淸华学报》\n年,\n第\n期\n[p.22]\n扬州大学硕士学位论文\n陪人一族\n、\n晒黑族\n、\n蚁族等。\n陪人一族\n:指专门陪伴别人\n,并把这件事当职业的一类人。传统上仅仅是看护病人\n,\n目前\n“ 陪人” 的范围不断扩大\n,\n比如陪读书\n、陪游览、\n陪下棋、\n陪购物\n,\n甚至充当男女\n朋友陪人回家过年\n。\n在广州市\n,\n细心的人或许能发现\n:\n近来广州市正活跃着一群健康\n、\n闻名的\n“ 陪\n人一族”\n。\n(《北京晚报》\n年\n月\n日\n)\n晒黑族\n:\n指热衷揭露黑暗现象\n,\n并通过论坛、博客等将社会上的一些不公平现象或\n黑暗现象披露到互联网上的人。\n对于\n“\n西黑族”\n,\n商家大可不必如临洪水猛兽\n,\n只要规范服务行为\n,提高服务质\n量\n,\n自己身上不\n“ 黑”\n,\n就不怕被拴出来\n“ 西太阳”\n,\n(《大众生活报》\n年\n月\n日\n)\n蚁族\n:\n刚毕业的大学生中收入低\n、工作及住房条件差并呈现聚居分布的群体。许多\n大城市的\n“ 城中村” 是\n“ 蚁族” 的聚集点\n。\n“蚁族” 们从事着保险推销\n、\n广告营销\n、餐饮服务等临时性工作\n,有的甚至处于\n失业半失业状态\n。\n(《工人日报》\n年\n月\n日\n)\n五\n、小结\n本节主要介绍了\n“ 族” 的意义系统\n,\n“ 族” 本义为箭头\n,\n引申为在旌旗的指引下汇\n集弓箭的意思\n,\n于是产生聚集之意\n。从这一意义出发\n,\n我们总结出了\n“ 族” 的三条发展\n演变脉络并以具体例证描述性展示了\n“ 族” 在古今的使用\n,\n为相关语义发展变化寻求事\n实依据\n。\n“ 族”\n由\n“ 丛集、聚集” 增加\n血缘关系\n、\n人等语义特征便是\n有一定血缘\n关系的人”\n,进而增加\n共同血统\n、\n共同语言等语义特征\n,\n产生了\n“ 民族、\n种族” 的\n意义\n。\n由\n“ 民族、种族” 进一步引申可以得到\n“ 类\n,\n种类” “ 灭族”\n“ 地方基层组织”\n“ 官\n族\n,\n世官” 的意义\n,\n由\n“ 灭族” 还可发展为\n“ 诛杀、诛灭” 之意\n。在日语\n“\n族” 的影\n响之下\n,\n“ 族” 产生了\n“ 称具有某种共同属性的一类人” 的意义并已收录在\n《现代汉语\n词典》之中\n。作为类词缀的\n“ 族” 是在日语助推作用下\n,\n由汉语意义\n“ 类、种类” 发展\n演变的结果。\n我们在相关书证的基础上\n,\n总结了\n“ 族” 的意义发展脉络\n,\n如下图所示\n:\n[p.23]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷\n“ 控” 研究\n图\n“ 族” 的意义引申图\n为类词缀存在处于本\n链条末端\n,语义部分虚化\n产类\n种类—興有共同屠\n类人丨\n;\n灭族\n朱杀\n、诛灭\n有\n定血緣关■人\n种族\n民族」地方基层组织\n丛集\n筋骨聚结处\n官族\n世官\n众多\n第二节\n“ 党” 的语义系统研究\n在古代\n,\n“ 黨\n与\n“ 党” 是两个不同的字\n,\n古代的\n“ 党” 仅有\n“ 党项族” 及\n“ 姓氏”\n的意义\n,\n不是本文研究对象\n。\n“ 黨” 意义众多\n,\n现代汉语中简化为\n“ 党” 。\n从造字法看\n,\n“ 党” 是一个形声字\n,\n本义指不鲜明\n,色泽黑暗\n,\n不新鲜\n。随着语言文字的不断发展\n,\n“ 党” 又出现了许多别的引申意义\n。本节将对\n“ 党” 的意义做梳理\n,\n以了解它从古至今\n的发展变化。\n一、\n“ 党” 的语义系统描写\n党” 在古代汉语中的使用也较多\n,意义宽泛\n。\n《说文解字》中\n,\n“ 党” 的写法为\n,\n从字形看\n,\n由\n“ 尚” 和\n“ 黑” 两部分组成\n,\n从黑尚声\n。许慎在\n《说文》\n中对\n“ 党” 解释\n为\n“ 党\n,\n不鲜也\n。\n”\n2段玉裁注\n,\n新鲜写做\n“ 盡”\n,\n而\n“ 党” 是\n“ 不鲜也”\n,\n党” 是\n暗淡无光的意思。\n《方言》\n中讲\n“ 党\n,\n知也”\n,\n郭璞注\n“ 党朗\n,\n解悟兒”\n,\n这意义与它\n的本义是相反的\n。\n《释名》\n中解释\n“ 五百家为党”\n。\n综合起来看\n,\n“ 党” 从它的本义出\n发,\n意义多有变化。\n参考我们整理的\n《辞源》\n、\n《汉语大词典》\n、\n《现代汉语词典》等辞书对\n“ 党” 的\n解释\n,\n对\n“ 党” 的意义系统进行整理如下\n。\n表\n辞书对\n“ 党” 的解释\n汉字简化时\n,\n“ 黨” 用同音替代的方式与\n“ 党” 同形\n,\n‘‘ 黨” 简化为\n“ 党” ,\n下文中不做注的\n“ 党” 为\n“ 黨” 的简化\n字\n。\n汉)许慎\n:\n《说文解字》\n,\n中华书局\n,\n年\n,\n第\n页\n[p.24]\n扬州大学硕士学位论文\n对\n“ 党” 的解释\n1见\n“ 党项羌” 。\n姓\n。\n黨\n)\n(\n1谓政党。代表某一阶级\n、\n阶戾或政治集团\n,\n并为维护其利益而斗\n《辞海》\n争的政\n、冶组织。\n5古代地方组织\n,\n五百家为党\n。\n5处所\n。\n亲族\n。\n5朋辈。\n朋党\n。\n7偏私。\n黨\n)\n(\n1通\n“ 位” ,\n或者\n。\n3通\n“ 摸;”\n,\n正直。\n古代一种地方基居组织\n。\n亲族\n。\n同伙的人\n。\n等类\n。\n阿附\n,\n偏私\n。\n处所\n。\n美\n,\n善\n,\n正直\n。\n通\n“ 德” 。\n《辞源\n〉\n成者\n,\n偶然\n。通\n“ 愤;” 。\n姓\n。\n黨\n古代一种地方基居组织。\n亲族\n。\n朋党\n;\n同伙\n。\n结成朋党。\n犹类\n。\n偏私\n。\n知晓\n,\n晓悟。\n处所\n。\n时\n。\n辈\n。\n政党\n。在我国特指中国共产党\n。\n通\n讜” 。\n正宵\n。\n《汉语人词\n黨\n成者\n;\n偶然\n。\n后作\n“ 儻”\n“ 倘\n,’ 。\n广人\n。\n典》\n黨\n姓。\n党\n姓。\n党\n“ 黨\n” 的简化字。\n党\n‘ ‘ 黨\n” 的简化字\n。\n党\n1党项\n古代民族名\n,\n汉西宪的一支\n。\n姓》\n《古汉语常\n口\n党\n黨)\n1古代的一种居民组织\n,\n五百家为一党。\n集团\n。\n亲族。\n1袒护偏袒。\n用字字典》\n。通\n“ 倘\n’ ’ 。偶然。\n党\n民族名\n。\n党\n黨)\n古代地方组织单位\n,五百家为党\n。\n乡里\n。\n亲族。\n同伙的人\n,\n《古代汉语\n°\n党徒\n。\n类\n,\n同类。\n亲近\n。\n勾结\n。\n偏私。\n所\n,\n处所\n。\n通\n“ 说” 。\n正直。\n词典》\n通\n倘” 。偶或\n,倘使。\n姓。\n党\n党)\n1囡政党\n,\n在我国特指中国共产党\n。\n由私人利害关系结成的集团\n。\n《现代汉语\n丨\n偏袒。\n4\n书指亲族。\n因姓\n。\n词典〉〉\n党\n1见党项\n因姓\n由于古代汉语的\n“ 黨” 与\n“ 党” 完全不同\n,\n现代汉语中的\n“ 党” ,\n除\n“ 党项族” 及\n[p.25]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n‘‘ 姓氏” 的用法之外\n,\n其它都是古代\n“ 黨” 的简化字\n,所以\n,\n上表中作为民族名\n、姓氏\n以及通假字的\n“ 党” 不是我们的研究对象。通过上表我们可以得知\n,\n作为规模最大\n、最\n全的辞书,\n《汉语大词典》对\n“ 党” 字的意义解释也最为详尽。\n同样\n,\n与\n“ 族” 一样\n,\n《古\n汉语常用字字典》由于规模较小\n,释义内容也较少\n。两两相比\n,后者缺少了\n“ 结成朋党、\n类、偏私、\n知晓、\n处所、\n时\n、\n辈\n、政党” 多达八个解释\n。在所有辞书中\n,\n“ 结成朋党\n、\n知晓、\n时” 这几个意义只有\n《汉语大词典》收录\n,\n可见这几个意义并不经常使用\n。\n“ 古\n代地方基层组织、亲族、朋党” 等义项所有词典均收录在内\n,它们再加上使用较多的“ 处\n所” “ 偏私” 组成了\n“ 党” 在古代的几个常用意义。现代汉语方面\n,\n“ 党” 主要有\n“ 政党”\n与\n“ 由私人利害关系结成的集团” 这两个意义\n,\n“ 偏袒” 和\n“ 亲族” 仅见于书面语\n。\n为\n了更清楚地展示\n“ 党” 的意义\n,\n显示辞书解释异同\n,\n我们也将其意义做了相应的整理。\n见下表\n:\n表\n“ 党” 的意义整理简表\n:\n《古\n...\n《汉语大\n:\n《占代汉\n《现代汉\n粹乂\n州子\n词典》\n语词典》\n语词典》\n1古代一种地方\n—\n基层组织\n亲族\n■\n朋党\n;\n同伙\n1结成朋党\n类\n,\n同类\n偏私\n,\n偏袒\n7知晓\n,\n晓悟\n处所\n时\n辈\n“\n政党\n二\n、古代汉语中\n“ 党” 的使用\n“ 党” 的本义是\n“ 不鲜明\n,\n色泽黑暗” ,\n在古代汉语中\n,\n较常用的意义是\n“ 地方基\n层组织” 。同\n“ 族” 一样\n,我们结合书证\n,并通过合理推究,\n以时间顺序概括梳理了\n“ 党”\n的基本发展脉络\n,\n以此呈现\n“ 党” 在古代汉语中的使用情况\n。\n[p.26]\n扬州大学硕士学位论文\n一\n)语义发展脉络一\n偏私\n,\n偏袒\n无偏无党\n,\n王道荡荡\n。\n(\n《尚书\n洪范》\n)\n君子\n)群而不党\n。\n(《论语\n卫灵公》\n)\n结成朋党\n阳子\n,\n成季之属也\n,\n故党于赵氏\n。\n(左丘明\n《左传\n文公六年》\n)\n初\n,\n朝议以州郡相党\n。\n(范哗\n《后汉书\n■蔡邑传》\n)\n朋党\n,\n同伙\n引党以封己\n,\n利己而忘君\n,\n别也。\n(《国语\n晋语》\n)\n皆里\n之党也。\n(左丘明\n《左传\n僖公十年》\n辈\n,\n朋辈\n吾党之小子狂简\n,\n斐然成章\n,\n不知所以裁之。\n(《论语\n公冶长〉》\n)\n何时临涧柳\n,\n吾党共来攀。\n(贾岛\n《石门政留辞从叔齊\n》\n)\n类\n鬼神得其享\n,\n丧纪得其哀\n,辩说得其党\n。\n(《礼记\n仲尼燕居》\n)\n鸟兔之族\n,\n犀兕之党\n。\n(左思\n《吴都赋》\n)\n二\n)语义发展脉络二\n古代一种地方基层组织\n孔子于乡党\n,\n询拘如也\n,\n似不能言者。\n(《论语\n乡党》\n)\n以与尔邻里乡党乎\n!\n(《论语\n雍也》\n)\n亲族\n[p.27]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n子云\n,\n睦於父母之党\n,\n可谓孝矣\n。\n(《礼记\n坊记》\n)\n赖公立入\n,\n实时退贤及其党亲\n。\n(班固\n《汉书\n王莽传上》\n)\n处所\n不退\n,\n则必引而去君之党\n。\n(《礼记\n‘ 玉漢》\n)\n师乎师乎\n,何党之乎?\n左丘明\n《左传\n哀公五年》\n)\n三)其它意义\n知晓\n(反训\n)\n法先王\n,\n顺礼义\n,\n党学者\n。\n(《荀子\n非相》\n)\n时\n(方言用法)\n反党\n,\n郑伯会公于变\n。\n(公羊高\n《公羊传\n文公十三年》何休注\n:\n党\n,\n所也\n;\n所\n犹时\n,\n齐人语也。\n三、现代汉语中\n“ 党” 的使用\n在现代汉语中\n,\n“ 党” 的意义及用法实际上是比较狭窄的\n。\n“ 党” 一般是政党之意\n,\n由日语发展而来\n,在我国卑独说\n“ 党” 时\n,通常特指中国共产党。此外\n,\n“ 党” 还有\n“ 由\n私人利害关系结成的集团” 之意\n。\n“ 偏袒、亲族” 的意义由于来自古代汉语\n,\n在现代汉\n语中只见于书面语中\n。需要特别注意的是\n,\n与\n“ 族” 不同\n,\n《现代汉语词典》对于\n“ 党”\n的类词缀用法并没有提及\n,这也就意味着\n,\n它的这一用法目前并不成熟\n,需要时间的验\n证。\n政党\n周恩来明白问题的严重性\n,他相忍为党\n,顾全大局\n,\n息事宁人\n,对毛泽东的批评\n未作任何解释和申辩。\n(\n英\n威尔逊\n《周恩来传》\n)\n春枝急赤白脸地说\n,\n景桂哥党龄长\n,\n斗争经验多\n,\n比我胜过十倍呢\n”\n(刘绍棠\n《运河的桨声》\n由私人利害关系结成的集团\n[p.28]\n扬州大学硕士学位论文\n他当上首辅后\n,\n和他儿子严世蕃一起\n,\n结党营私\n,贪赃枉法\n,\n千尽坏事\n。\n(《中华\n上下五千年》\n)\n金苟手下有五六个死党\n,他们总是纠合一起\n,那架式很像我们现在港台电视剧中\n看到的黑社会。\n(方方\n《一波三折〉〉\n)\n偏袒\n这于赵姨良本是个极好的党同伐异\n、\n浑水摸鱼\n、\n以求一逞的时机,\n(刘心武\n《话\n说赵姨娘》\n)\n亲族\n著名京剧表演艺术家梅兰芳\n,早年演出\n《妻党同仇报》时\n,\n在剧中扮演一个童养\n人\n该\n名洛螋士各\n〉\n年\n)\n、、\n‘\n“\n四\n、\n类词缀\n“ 党” 分析\n词缀有\n“ 自源性” 与\n“ 他源性” 的区分\n,\n所以\n,\n类词缀作为词缀的前一阶段其来源\n也与之类似。\n关于类词缀\n“ 党” 的来源\n,\n我们认为其主要是汉语自身语义发展的结果\n。\n如前文介绍\n,\n“ 五族为党” ,\n“ 族” 与\n“ 党”\n自古关系密切\n,\n族” 的许多意义\n“ 党” 也兼\n而有之\n。\n“ 党” 有\n“ 朋党\n,\n同伙” 之意,\n有柩义色彩\n,\n多指有共同目标指向的人\n,\n他们\n聚在一起就成了朋党。作为类词缀\n,\n“ 党” 的基本意义就源自于此\n。\n“ 族” 在类词缀化过\n程中\n,\n吾起到了重要的催化作用\n,我们认为\n,\n“ 党” 也是如此。\n日语中\n,\n“ 党” 也有\n“ 同\n伙、\n朋党”\n“ 有组织的团体” 的意思\n,\n在此意义的基础上发展了\n“ 甜食党” 等词。这些\n词经过传播\n,\n经港台到大陆后进一步触发了\n“ 党\n表示\n“ 经常做某事或有共同属性的一\n类人” 这一意义\n,\n产生了如\n“ 偷拍党”\n“ 飞车党” 等\n“\n党” 族词\n。起初\n,\n这些词多具\n有艇义色彩\n,\n随着它们的不断发展\n,艇义色彩渐微\n,逐渐往中性词方向靠拢。下面选取\n几个典型\n“\n党” 族词的词作介绍\n。\n黄牛党\n:\n指那些囤积车票\n,\n在买票高峰期间将其高价卖出\n,\n以获得高额差价的人。\n多见于车站、球场或演唱会\n。\n这些黄牛党\n,\n步步走运\n,在购票时就占了便宜\n。\n(《羊城晚报》\n年\n月\n日\n)\n[p.29]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n兰\n标题党\n:\n指在标题上做文章\n,\n用另类或著名的作品名称吸引读者的人\n,这些人的作\n品内容与标题往往差距很大。\n李西闽很会为小说取名字\n,但他不是\n“标题党”\n,他的小说是忠实于书名的\n。\n(《京\n华时报》\n年\n月\n日\n)\n五、\n小结\n现代的\n“ 党” 与古代的\n“ 党” 是不同的两个字\n,如今我们常见的\n党” 是古代\n“ 黨”\n的简化字。古代\n“ 黨” 本义为色泽昏暗、不鲜明的意思\n,\n在古代常用义为一种地方基层\n组织\n,其在发展变化中许多意义发生了转移\n,\n目前较难考证。虽然我们可以在相关语料\n中寻求到辞书解释的例证\n,但其意义引申脉络不够清晰\n,本节只是依据工具书的例证及\n从语料库中所搜集发现的最早的书证\n,整理出相关推究性成果\n,\n相关内容\n待进一步研\n究\n。我们主要梳理了两条关于\n“ 党” 的语义发展脉络\n,\n脉络一是由\n“ 偏私” 发展得出\n,\n从\n“ 偏私” 到相互间\n“ 结成朋党” 一脉相承\n,\n进而发展为\n“ 朋党” ,\n之后进一步发展\n,\n产生了\n“ 朋辈\n,\n辈” 与\n“ 类” 的意思\n,\n现代汉语的\n“ 政党” 的语义也与此有关\n。\n“ 党”\n的语义发展脉络二是从\n“ 古代一种地方基层组织” 开始\n,\n引申为\n“ 乡里”\n,\n由此演变产\n生\n“ 亲族” 与\n“ 处所” 两个意义。作为类词缀的\n“ 党” 跟\n“ 族” 类似\n,\n都是在汉语原有\n意义基础上\n,\n由于汉外语言的接触\n,\n对原有意义产生催化作用发展演变而來发展而来。\n经分析可知\n,类词缀\n“ 党” 产生的汉语语义基础为其语义发展脉络一。我们推究的\n“ 党”\n的意义发展脉络如下图所示\n:\n图\n“ 党” 的意义引申图\n脉络一\n:\n昏暗的— 偏私— 结成朋党― 朋党\n;同伙— 辈\n;朋辈— 类— 政党\n经常或习愤做某事的\n类人\n类词缀\n,语义部分虚化\n勝二\n:\n亲族\n地方基层组织\n(\n乡里\n处所\n此表中所列意义联系均为推究性研究成果\n,\n有待进一步研究确认。\n[p.30]\n扬州大学硕士学位论文\n第二章\n“ 迷”\n“ 控” 的语义系统研究\n“ 迷” 与\n“ 控” 都是现代汉语中表示\n“ 爱好\n、极度喜欢某物的一类人” 这一意义的\n类词缀\n,\n应用较广\n。\n“ 迷” 为旧有的指人类词缀\n,\n目前使用已经非常稳定\n,\n很多\n迷”\n族词的词语如\n“ 球迷” “ 车迷” “ 歌迷” 等早已进入现代汉语词汇系统并成为常用词\n;\n“ 控”\n为新兴的指人类词缀\n,\n近几年发展较为迅速\n,\n“ 微博控”\n“ 萝莉控”\n“ 手机控” 等频繁出\n现在交际语言尤其是网络交际语言中\n,但\n“\n控” 族词存在使用不广泛、发展不稳定的\n情况。本章将对\n“ 迷” 与\n“ 控” 进行分析研究\n,\n以期窥见此类类词缀的语义系统。\n第一节\n“ 迷” 的语义系统研究\n“ 迷” 从造字法上看是形声字\n,\n“\n” 为形\n,\n“ 米” 为声\n,\n“\n” 的原形为\n“ 定” ,\n它\n的木义指辨别不淸方向\n。\n弓\n“ 族” 和\n“ 党” 相比\n,\n“ 迷” 意义及用法并不算多\n,\n它的本\n义在现代汉语中也仍然保留\n。在本节中\n,我们探究\n“ 迷” 的意义\n,\n通过搜集的古今语料\n对它们进行分类举例\n,\n希望由此了解\n“ 迷” 的发展变化\n,\n为类词缀\n“ 迷” 的发展由来寻\n求依据\n。\n一、\n“ 迷” 旳语义系统描写\n“ 迷” 在\n《说文解字》中的字形为融\n,通过字形我们可以知道\n,它由\n“ 走” 与\n“ 米”\n两部分组成。\n《说文》对\n“ 迷” 的解释为\n“ 或也”\n。\n“ 定” 的意思是\n“ 乍行乍止也”\n,\n也就是突然地走走停停的意思\n。综合以上解释\n,我们可判断\n“ 迷” 的本义为\n“ 分辨不清\n方向” ,\n泛指\n“ 分辨不清” 。\n参考我们查阅的辞书\n,\n对\n“ 迷” 的意义整理如下\n:\n表\n辞书对\n“ 迷” 的解释\n对\n“ 迷” 的解释\n《辞海》\n分辨不清\n。\n昏乱\n。\n媚惑\n。\n4沉迷于某种嗜好。\n通\n“ 味” 。\n汉)许慎\n:\n《说文解字》\n,\n中平书局\n,\n年\n,\n第\n页\n汉\n)许慎\n:\n《说文解字》\n,\n中平书局\n,\n年\n,\n第\n页\n[p.31]\n王周\n:\n类词缀\n“ 族”\n“ 党\n“ 迷”\n“ 控” 研究\n《辞源》\n迷惑。\n迷路\n,\n分辨不清\n。\n媚惑。\n10沉迷。\n弥漫\n。\n《汉语大词\n迷惑\n;\n辨别不清。\n昏沉\n;\n昏迷\n。\n1迷恋\n:\n沉迷\n。\n媚惑\n;\n使迷恋\n。\n5沉醉丁某\n典》\n一事物的人。\n迷失道路\n;\n不辨方向\n。\n丧失\n;\n丢失\n。\n8通\n“\n弥\n“ 。布满\n;\n遮掩\n。\n6通\n“\n薛\n” 。止息。\n用同\n“\n眯\n” 。\n(\n眼皮微合貌。\n(\n尘埃入眼\n,\n不能挣幵看\n义\n西\n。\n用同\n“ 继\n” 。\n隐语\n,链语。\n姓\n。\n《古汉语常\n1迷乱\n,\n分辨不清。\n用字字典》\n沉醉\n,\n迷恋。\n《古代汉语\n迷路\n,\n迷失。\n迷惑\n,\n惑乱。\n词典》\n迷恋\n,\n沉掘于\n。\n弥漫。\n《现代汉语\n1\n分辨不清\n,\n失去判断能力\n。\n因对某人成某一事物产生特殊爱好而沉醉\n。\n词典》\n1沉醉于某一事物的人。\n使看不清\n;\n使迷惑\n;\n使陶醉\n。\n通过上表可知\n,\n《古汉语常用字字典》\n由于木身的局限性收录的\n“ 迷” 的释义最少\n,\n仅有\n“ 沉醉\n;\n沉迷” 和\n“ 迷乱\n;\n分辨不清两条”\n,\n但这两条恰恰是所有辞书都收录的仅\n有的两条\n迷” 字的意义。\n“ 媚惑” 这一意义被四部辞书收录\n,\n可见其经常使用\n。\n“ 迷失\n道路\n,\n不辨方向” 这一为大家所熟悉的意义仅有三部辞书收录\n,我们认为原因可能是这\n一意义与\n“ 迷惑\n;辨别不清” 都有\n分不清这一语义特征\n,\n为避免意义的重复\n,有些辞\n书从简收录\n。\n“ 弥漫” 这一意义也在多部辞书中提到\n,\n只不过\n《辞源》与\n《古代汉语词\n典》并未将其列入通假字范畴\n,\n《汉语大词典》认为其为通假字\n,通\n“ 弥” 。其它义项中\n,\n“ 昏沉\n;\n昏迷” 仅有\n《汉语大词典》与\n《辞海》两部辞书收录\n,\n“ 丧失\n,\n丢失” 仅\n《汉\n语大词典》收录\n,\n这两个意义古汉语使用较少\n。现代汉语方面\n,\n辨别不清”\n“ 迷恋\n;\n沉\n醉”\n“ 媚惑\n;\n使陶醉” 这三个意义都为较常见的意义\n。\n与本文研究相关的\n“ 沉醉于某一\n事物的人” 这一意义被\n《现代汉语词典》及\n《汉语大词典》单独列出\n,\n球迷”\n“ 戏迷”\n等词已经入现代汉语词条\n,\n说明作为旧有指人类词缀\n,\n“ 迷” 所构成的部分\n“\n迷” 族\n词已摆脱语法词\n,\n进入词汇词范围\n。此外\n,\n“ 迷” 通\n“ 码” 、用同\n眯” 、\n用同\n“ 迷” 这\n几个用法中\n,在意义上虽同\n“ 迷” 有一定联系\n,\n但汉语已有它们的规范用法\n,\n这里我们\n不再进一步讨论\n;\n作为姓氏的\n“ 迷” 也不在我们的讨论范围之内\n。\n为了更清楚地展示各\n部辞书对于\n“ 迷” 的解释区别\n,\n我们将它们所收录的意义整理如下\n:\n[p.32]\n扬州大学硕士学位论文\n表\n“ 迷” 的意义整理简表\n‘\n《古奴五\n丨\n奴\n、、\n《汉语\n广枯\n、\n产磁\n《古代汉\n《现代汉\n释乂\n、”\n、、\n《辞海》\n《辞源》\n常用子字\n、\n、\n、\n、\n、\n、、\n人词典》\n语词典》\n语词典》\n1迷惑\n;\n辨别不清\n昏沉\n;\n昏迷\n迷恋\n;\n沉迷\n4媚惑\n;\n使迷恋\n5沉醉丁某一事物\n的人\n迷火道路\n;不辨方\n丧失\n;\n丢火\n二\n、\n古代汉语中\n“ 迷” 的使用\n古代汉语中\n,\n“ 迷” 主要作为动词出现\n,\n并有少数文章可见其使动用法\n。\n常见意义\n有\n“ 分辨不清”\n“ 迷路\n;\n不辨方向\n”\n“ 迷恋”\n“ 媚惑”\n“ 昏迷”\n“ 丢失\n;\n丧失” 等\n。\n通过查\n找相关书证中的例句\n,\n并结合辞书解释\n,\n我们认为这几个意义之间有较明显的前后相承\n关系\n,\n它们均由\n“ 迷路\n,\n不辨方向” 引申为\n“ 迷惑\n,\n辨别不清” 这一意义\n,\n而后继续发\n展引申而来。值得注意的是\n,通过查找语料我们发现,\n早在宋代就已出现\n“ 蕉迷” 这一\n用法\n,\n说明\n“ 迷” 当时已有虚化现象\n。\n迷路\n,\n不辨方向\n纳于大麓\n,\n烈风雷雨弗迷。\n(《尚书\n舜典》\n)\n然迷而知反\n,\n失道不远\n。\n(裴松之\n《三国志裴注》\n)\n迷惑\n,\n辨别不清\n君子有攸往\n,\n先迷后得\n,\n主利\n。\n(《周易\n坤》\n)\n天子是她\n,俾民不迷。\n(《诗经\n小雅\n节南山》\n)\n媚惑\n,\n使迷恋\n:\n怀其宝而迷其邦\n。\n(《论语\n阳货》\n)\n[p.33]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n媽然一笑\n,\n惑阳城\n,\n迷下蔡。\n(宋玉\n《登徒子好色斌》\n迷恋\n;\n沉迷\n幽王\n)迷于褒似\n,\n废其正后\n。\n(班固\n《汉书\n五行志〉\n羡上都之赫戏兮\n,何迷故而不忘。\n(张衡\n《思玄赋》\n昏沉、\n昏迷\n為鹤遂饮二人毒酒\n,迷死三日\n。\n(《列子\n汤问》\n)\n夜分而坐\n,\n则低迷思寝。\n(猫康\n《养生论》\n)\n丧失\n,\n丢失\n金谷园应没\n,\n夫差国已迷\n(齐己\n《春草》\n各房中也不能趁乱失迷东西\n。\n(曹雪芽\n《红楼梦》\n)\n沉醉于某一事物的人\n赵纯节性喜色黑\n,\n凡轩窗馆宇咸种之\n,\n时称为黨迷。\n(陶谷\n《清异录\n黑迷》\n)\n三\n、现代汉语中\n“ 迷” 的使用\n在现代汉语中\n,\n“ 迷” 主要作动词使用\n。\n《现代汉语词典》主要有\n“ 分辨不清\n;\n失去\n判断能力”\n“ 因特殊爱好某人或某事而沉醉” 以及\n“ 使看不清\n;\n使迷惑\n;\n使陶醉” 三个\n义项\n。其中\n,\n“ 分辨不清\n;\n失去判断力” 这一义项其实是\n“ 迷路”\n“ 迷惑”\n“ 昏迷” 等\n《汉\n语大词典》的义项的集合体\n。\n另外\n,\n《现代汉语词典》还特别将\n“ 沉醉于某一事物的人”\n这一义项列出\n,\n说明由\n“ 迷” 产生的\n“\n迷” 族词已进入现代汉语词汇词范围\n,\n“ 球迷”\n“ 戏迷”\n“ 歌迷” 等已普遍出现在日常生活中\n。\n一)作为词根的\n“ 迷”\n分辨不清\n;\n失去判断力\n他所到之处\n,\n总是给人指点迷津\n,遇山开路\n,逢水架桥。\n(秦牧\n《艺海拾贝\n鲁\n班的妙手》\n[p.34]\n扬州火宁硕士学位论文\n儿子从自己的小房间赤着脚走来\n,走到他们床边\n,揉着惺松睡眼\n,迷里迷登地问\n:\n“ 爸\n,\n你怎么了\n?\n”\n(梁晓声\n《激杀》\n)\n因特殊爱好某人或某事而沉醉\n从小她并不爱贪热闹\n,\n可是为什么一到了北戴河却立刻这样热烈地迷上了海洋\n,\n以致把什么事都忘掉了呢?\n(杨沐\n《青春之歌》\n梁三老汉熟悉这音承\n,\n迷恋这音乐\n。\n(柳青\n《创业史》\n)\n使看不清\n;\n使迷惑\n;\n使陶醉\n春草萋萋\n,\n山花迷猫\n。\n(贾平凹\n《任娠〉\n阮琳气呼呼地说\n:\n“会迷了我的性\n,\n废了我的功\n。”\n(王朔\n《疼人》\n)\n—\n你\n的\n“\n;夹”\n、—‘\n!‘\n人丄;\n相对于\n“ 党”\n“ 控” 等新兴类词缀来讲\n,\n“ 迷”\n出现较早\n。上文中已介绍到\n,\n早在宋\n朝就有与我们今天所讲的\n“\n迷” 族词类似的词语出现\n,\n其它如\n“ 球迷” 一词在\n年\n版\n《现代汉语词典》\n中也已收录\n,\n说明它们己成为词汇词\n,广泛应用于现代汉语中\n。作\n为类词缀存在的\n“ 迷” 应用广泛\n,\n主要表示\n“ 沉醉于某一事物的人” 。\n例如\n:\n他\n)又瘦又黄\n,\n镶着满口的大金牙\n,\n屁股扭了两扭,\n这是谁都知道的糊蝶迷。\n曲波\n《林海雪原》\n)\n美国的奥运迷们似乎根本不需要这类准确信息\n,\n他们随时都在通过各种平台收\n看喜爱的运动节目\n。\n(《人民日报〉\n年\n月\n日\n)\n四\n、\n类词缀\n“ 迷” 分析\n“ 族” 和“ 党” 发展为类词缀是在汉语的基础上受外来语言因素影响的结果\n,而“ 迷”\n的发展轨迹与它们并不相同\n,\n我们认为\n,\n“ 迷” 完全是汉语自古至今发展演变的结果\n。\n上文已经分析过\n,\n“ 迷” 的本义为\n“ 迷路\n,\n不辨方向” ,\n由此引申为\n“ 迷惑\n,\n分辨不\n清” 这一常用意义\n,\n我们就以\n“ 迷惑” 这一词语为义项代表\n。在其它义项之中\n,\n语义上\n都是有联系的\n,\n它们与\n“ 迷惑” 这一核心意义形成了关于\n” 迷” 的语义网络\n。这一语义\n网络不是随意无序排列的\n,\n而是由这一中心义项变换语义特征\n,逐层引申发展而来\n。与\n[p.35]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n这一语义网络相关的还有\n“ 迷恋\n;沉迷” 这一义项\n,在这里我们分析\n迷恋” 这一词语。\n类词缀\n“ 迷” 构成的\n“\n迷” 族词中\n,\n我们选取\n球迷” 这一较常见的词语进行分析\n。\n“ 迷惑”\n“ 迷恋”\n“ 球迷” 的意义如下所示\n:\n迷惑\n:\n辨不清是非\n,\n摸不着头脑\n迷恋\n:\n对某事物过度爱好而难以舍弃\n球迷\n:\n喜欢打球或看球赛而入迷的人\n通过上面各词的意义阐释我们可以了解到\n,\n“ 迷惑” 是分辨不清的意思\n,这也是“ 迷”\n的本义\n,\n由于分辨不清\n,\n过度爱好而难以舍弃\n,\n在此基础上沉醉其中就产生了\n“ 迷恋”\n之意\n;\n由于迷恋而难以舍弃\n,使人沉醉其中\n,进而称对某事十分喜爱的人为\n“\n迷” 。\n“\n迷” 族词早已出现在汉语中\n,\n发展稳定\n。下面列举几例做简单阐释\n。\n车迷\n:\n十分喜欢汽车及与汽车相关的东西\n(如汽车装饰、汽车比赛\n、\n汽车技术等\n)\n的一类人。\n布什亲自来到代托纳国际赛道上\n,\n与两名车手一起和现场车迷握手\n,\n并宣布比赛\n开始\n。\n(新华社新闻稿\n年\n)\n红迷\n:\n“ 红” 是古代四大名著\n《红楼梦》\n的简称\n,\n研究\n《红楼梦》\n的学问称为\n“ 红\n学” ,\n对\n《红楼梦》非常喜爱人称\n“ 红迷” 。\n这不明摆着站污中国的文学瑰宝\n,我作为一个\n“红迷” 绝对不能原谅。\n(《新民晚\n报》\n年\n月\n日\n)\n五、小结\n本节中\n,\n我们首先参考辞书释义\n,通过古今语言用例佐证它的意义演变\n,对\n“ 迷”\n的语义发展脉络进行了分析\n。我们认为\n,\n“ 迷” 本义为\n“ 迷失道路\n;\n不辨方向” ,\n由此引\n申出了\n“ 迷惑、分辨不清” 这一意义\n,\n它比本义少了\n道路\n、\n方向等语义特征\n。本\n文研究的\n“ 迷” 的意义均是在\n“ 迷惑、分辨不清” 这一意义旳基础上引申而来。\n由\n“ 迷\n惑、分辨不清”\n出发\n,\n意义进一步发展为三条脉络\n:\n一是引申出\n“ 昏沉\n;\n昏迷” ;\n二是\n由于别人\n“ 分辨不清” ,\n可以对别人的\n“ 媚惑” ,\n并\n“ 使之迷恋” ,这是由动作义转而指\n动作施动者\n,进而使别人\n“ 沉迷、迷恋” ,然后增加\n行为人这一语义特征就产生了\n“ 沉\n醉于某一事物的人” 这一义项\n。\n“\n迷” 族词产生较早\n,\n在汉语词汇系统中已较为常见\n,\n[p.36]\n扬州人学硕士学位论文\n《现代汉语词典》\n中也有与类词缀\n“ 迷” 相对应的释义\n,\n其中\n,\n球迷\n、影迷\n、棋迷\n、\n网\n迷\n、歌迷已被\n《现代汉语词典》收录\n,\n成为词汇词\n。\n通过分析我们认为\n,\n“ 迷” 为自源\n性类词缀\n,\n是现代汉语自身发展变化的结果\n。通过以下的\n“ 迷” 的意义引申图\n,\n可以帮\n助我们更好地理清\n“ 迷” 的意义发展脉络\n,\n加深对它的理解\n。\n图\n迷” 的意义引申图\n类词缀存在\n,处于本,\n昏、沉\n;昏迷\n链条末端\n,语义部分虚化\n、\n迷失道路\n不辨方向—分辨不清\n媚惑\n使迷恋—迷恋\n多沉迷―坑醉于某\n丢失\n丧失\n第二节\n“ 控” 的语义系统研究\n“ 控” 是现代汉语新兴指人类词缀\n,\n“\n控” 族词近几年飞速发展\n,\n在口语及网络\n语言中广泛应用\n。从造字法看\n,\n“ 控” 是形声字\n,\n从\n“ 才\n” ,\n“ 空” 声\n。在古代\n,\n“ 控” 字\n的本义为拉开弓弦\n,\n也就是引弓之意\n。\n“ 控” 从本义\n引弓\n” 发展到后来常用的\n“ 控制”\n及\n“ 状告” 之意是一脉相承的\n。本节中\n,\n我们探讨\n“ 控” 字的意义系统\n,\n分析它的各种\n意义及相关演变过程。\n、\n“ 控” 的语义系统描写\n《说文解字》\n中\n,\n“ 控” 写法为消\n,\n“ 控\n,\n引也\n;\n《诗》\n曰\n:\n‘ 控于大邦\n’\n,\n匈奴\n名引弓控弦”\n。\n“ 引\n” 就是拉弓\n、\n开弓的意思\n。我们认为\n,\n《诗经》\n中\n,\n“ 控于大邦”\n的\n“ 控” 并不是此意\n,\n而是\n“ 走告” 之意\n。\n马瑞辰讲到\n,\n“\n《传》、\n《箋》训控为引\n,\n未\n免迂曲\n;\n《一切经音义》卷九引\n《韩诗》\n曰\n‘ 控\n,\n赴也\n’\n,\n是也\n,\n赴\n、\n卜古通用\n,\n《说文》\n有\n‘ 赴\n’\n无\n卜\n’\n;\n《既夕》注\n:\n‘ 赴\n,\n走告也\n’\n,\n控于大邦\n,\n即谓走告于大邦耳”\n。\n由\n此可以看出\n,\n马瑞辰认为\n,\n“ 控” 为\n“ 走告” 的意思\n。段玉裁也认为这里是\n“ 控告” 之\n意\n,\n此外\n,\n他还讲到\n“ 止马日控” 等\n“ 控” 的意义\n。下面\n,\n我们就所査阅到的各部辞书\n关于\n“ 控” 的解释整理展示如下\n:\n汉)许慎\n:\n《说文解字》,\n中华书局\n,\n年\n,\n第\n转引自罗竹风主编\n:\n《汉语大词典》\n,\n汉语大词典出版社\n,\n年\n,\n第六册\n,\n第\n页\n[p.37]\n王周\n:类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n表\n辞书对\n控” 的解释\n对\n“ 控” 的解释\n《辞海》\n1开弓\n。\n控制。\n5投。\n4告\n;\n控诉。\n如\n腔)打。\n《辞源》\n控\n引弓\n,\n开弓\n。\n控制\n,\n操纵。\n赴\n,\n走告\n。\n10投。\n控\n打\n。\n《汉语大词\n控\n引弓\n,\n开弓\n。\n驾驳\n;控制\n。\n1走告\n,\n后多指告状、\n中诉4顿挫\n,\n停\n典》\n顿而折返。\n5投\n,\n跌落\n。\n弯曲\n;\n下垂\n。\n7贯通。\n8将容器出口朝下\n,\n让里边的液\n体慢慢流山\n。\n见\n“ 控总\n” 。\n控\n敲打。\n《古汉语常\n1拉\n,\n特指拉住马缰\n,\n勒马\n。\n10控制\n。\n幵弓\n。\n1告\n,\n控诉。\n投\n,\n落下\n。\n字字典》\n《古代汉语\n1引弓\n,\n幵弓\n。\n勒马\n,\n驾驳。\n控制\n,\n操纵。\n1告\n,\n控诉。\n8投\n,\n落\n卜\n。\n词典》\n5打\n。\n《现代汉语\n控\n告发\n;\n控告\n。\n控\n控制\n。\n词典》\n控\n使身体或身体的一部分悬空或处于失去支撑的状态\n。\n使容器口\n(成人的头)\n朝下\n,\n让里边的液体慢慢流山\n。\n通过各部辞书对\n“ 控” 的解释我们可以发现\n,无论辞书规模大小\n,对古代汉语\n“ 控”\n的意义阐释并没有较大差别\n。\n“ 引弓\n;\n开弓”\n“ 勒马\n、\n驾驳\n;\n控制”\n“ 告\n,\n控诉”\n“ 投\n;\n跌\n落” 这几个义项在五部辞书中全部出现。在\n“ 族”\n“ 党”\n“ 迷” 的解释中\n,\n《古汉语常用\n字字典》往往因规模所限收录较少义项\n,\n但\n“ 控” 字由于其本身的义项不多\n,\n且多为常\n见意义\n,\n故收录内容与其它辞书差别不大\n,\n仅有\n“\n敲打” 这一义项没有收录\n,\n而\n这一义项也不是本文的研究内容。\n“ 顿挫\n,\n停顿折返” 与\n“ 贯通” 这两个义项仅有\n《汉\n语大词典》收录\n,\n使用较少\n,\n我们不做讨论\n。现代汉语方面\n,\n常用意义为\n“ 驾驳”\n(引\n申为\n“ 控制”\n、\n“ 告发\n;\n控告”\n“ 弯曲\n;\n下垂”\n“ 使身体悬空或失去支撑” 及\n“ 将容器口\n朝下\n,\n让里面的液体流出来” ,\n其中\n,\n后两个意义主要在现代汉语中使用\n。\n为了更清楚\n地展示\n控” 在各部辞书中义项的异同\n,\n我们也对其进行了整理\n,\n如下所示\n:\n[p.38]\n扬州人学硕士\n位论文\n表\n“ 控” 的意义整理简表\n《汉语人\n《辞\n《古汉语常\n《古代汉\n《现代汉\n词典》\n源》\n字字典》\n语词典》\n语词典》\n1引弓\n,\n开弓\n勒马\n,\n?驳\n控制\n4走告\n控告\n,\n中诉\n投\n,\n跌落\n弯曲\n;\n下\n使身体息空成处\n丁火去支撑的状态\n将作器口朝\n让\n里边的液体流出\n二\n、古代汉语中\n“ 控” 的使用\n“ 控” 在古代汉语中主要作动词使用\n,\n“ 引弓\n”\n“ 驾驳\n;控制”\n走告”\n投” 等古代\n汉语常用意义都为动词\n。通过分析推理\n,\n我们认为\n“ 控” 共有三条引申脉络\n:\n其本义为\n“ 引弓\n,\n开弓\n” ,\n围绕其发展\n,\n产生了\n“ 驾驳”\n“ 控制” 等意义\n;\n“ 控” 的另外一个意义\n“ 走告” 发展为了如今的\n“ 控告\n,\n申诉” ;\n投\n,\n跌落” 引申为\n“ 下垂” ,\n继而产生了现\n代汉语中\n“ 使身体悬空或处于失去支撑的状态” 及\n“ 将容器口朝下\n,让里边的液体流出”\n的意思\n。\n下面我们以古代著作中出现的\n“ 控” 对其常见意义进行举例说明\n。\n一)语义发展脉络一\n引弓\n,\n幵弓\n(本义)\n匈奴名引弓控弦\n。\n(许慎\n《说文解字》\n)\n以故冒顿得自强\n,\n控弦之士三十余万\n。\n(司马迁\n《史记》\n)\n勒马\n,\n驾驳\n抑替控忌\n,\n抑纵送忌。\n(《诗\n郑风\n大叔于田》\n)\n王良之所以使马者\n,\n约审之以控其卷\n。\n(《吕氏春秋\n审分〉》\n)\n[p.39]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n竺\n控制\n,\n操纵\n桓控大国\n,\n扶小国\n。\n(《谷梁传\n僖公五年》\n)\n骑而遇诸途\n,\n必控勒将数百武以为常\n。\n(李贽\n《阿寄传〉》\n二)语义发展脉络二\n走告\n控于大邦\n,\n谁因谁极。\n(《诗\n鄘风\n载驰》\n)\n时则可矣\n,敢少缓于控陈\n。\n(《陆游\n《乞致仕札子》\n)\n控告\n,\n申诉\n张太太心不服\n,\n又到省里上控\n。\n(李宝嘉\n《官场现形记〉〉\n)\n三)语义发展脉络三\n投\n,\n跌落\n时则不至\n,\n而控于地而已矣\n,\n奚以之九万里而南为\n?\n(庄周\n《逍遥游》\n)\n鶴飞虽地控\n,\n龙\n卜常天升\n。\n(叶适\n《寄李季章参政》\n)\n弯曲\n,\n下垂\n太鸾控背射身言曰\n:\n“丞相在上... ... ”\n(许仲琳\n《封神演义》\n)\n三、现代汉语中\n“ 控” 的使用\n“ 控” 在现代汉语中仍为动词性质\n,\n意义主要有三个\n:\n第一\n,\n控告、\n告发\n;\n第二\n,\n控制\n;第三\n,\n使身体悬空或失去支撑、使容器口朝下让里面液体流出\n。这几个意义之间\n并无明显的意义联系\n,\n是上文介绍的\n控” 的三条语义发展脉络分别引申而来\n,\n《现代\n汉语词典》也将它们分别作为三个\n“ 控” 来进行释义。\n一)控告\n、告发\n对祸国块民的\n“ 四人帮”\n,\n我再一次提出我的控诉\n。\n(巴金\n《家》后记\n)\n[p.40]\n扬州大学硕士学位论文\n卫宁和亚红作为犯罪集团从犯被控犯有敲诈勒索公私财物罪\n。\n(王朔\n《一半是火\n焰\n,\n一半是海水》\n)\n二)控制\n黄蓉在这棒上控纵自如\n,棒端疾送\n,\n已点到了郭襄的襁褓\n。\n(金庸\n《神雕侠彳吕》\n南京形势险要\n,\n北控长江\n,\n南阻秦淮\n,\n古有\n钟山龙蟠\n,\n石城虎据” 之称\n。\n(《中\n国儿童百科全书\n〉\n)\n三\n)\n“ 投、\n跌落” 意义的引申\n使身体悬空或失去支撑\n这么控着头\n,\n一会子又头疼了\n。\n(曹雪芽\n《红楼梦》\n)\n这样下去\n,\n脚会控肿的\n。\n(笔者自拟\n)\n使容器口朝下让里面液体流出\n她回到家来\n,把鱼放进水池\n,\n刮鳞\n,\n开腔\n,\n清洗\n,\n控干... ...\n(秩凝\n《大浴女\n〉\n)\n老陶把我放倒在地上\n,\n一手\n贞着我的肚子\n,\n一手把我的头往下按\n,控出了许多\n黄水\n。\n(吴运铎\n《把一切献给党\n童年〉〉\n)\n四\n、\n类词缀\n“ 控” 分析\n商务印书馆于\n年\n月\n日揭晓了\n“ 汉语盘点\n” 年度字词\n,\n“ 控” 位列年\n度国内字首位。\n年汉语年度字词由国家语言资源监测与研究中心联合商务印书馆、\n新浪网及\n《中国青年报》发布\n,\n具有毋庸置疑的权威性及准确性\n。\n中国新闻网的报道中\n提到\n,\n“ 此次入选的年度国内字\n‘ 控\n’\n,\n一方面承接\n年度国内字\n‘ 涨\n’\n而来\n,\n有涨\n就有控\n,\n有涨就需控\n,\n一个\n‘ 控\n’\n字反映了政府的努力和百姓的期盼\n;\n一系列的\n‘\n控\n’\n,\n更折射出\n‘ 控\n’\n已成为一种生活状态\n,\n‘ 控\n’\n字广为流行\n,\n具有更为轻盈的意义空\n间和更为斑斓的语言景观”\n1。\n以\n“ 控” 为类词缀的\n“\n控” 族词\n,\n正越来越多地出现\n在现代汉语词汇之中\n。\n类词缀\n“ 控” 的来自英语\n“\n” ,\n其意思为\n“ 情节” 。\n美国小说\n《萝莉塔》\n中\n[p.41]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n女主人公名叫萝莉塔\n,\n一位中年男子对其近乎疯狂地喜欢\n,\n文章称其有\n“\n也就是我们经常听说的\n“ 萝莉塔情节” 。后来\n,这一说法进入日语借词之中\n,\n在日语中简称为\n广泛为日本动漫领域使用\n,\n意思随即扩大\n,\n指极端喜爱\n动漫作品中的少女形象的人。\n日本动漫在中国广为传播\n,\n这一说法被引入到汉语之中\n。\n由于汉字\n“ 控” 有控制之意\n,含有\n俘获性\n、\n占有性等语义特征\n,\n再加上读音相近\n,\n故\n“ 萝莉控” 这一称呼便产生了\n。\n随后\n,越来越多的\n“\n控” 构词形式被使用\n,\n来表示\n强烈喜爱某物\n,\n甚至达到极端程度的一类人。\n“\n控” 族词在产生之初是具有艇义性质\n的\n,\n随着这一类词极端色彩逐渐淡化,\n其姬义性质逐渐消退\n,\n目前中性词占多数\n。现代\n汉语的\n控” 族词表示\n“ 极度喜欢某人或某物的一类人” ,\n这一意义与\n“\n迷” 族词\n类似\n,\n但喜爱程度要比\n“ 迷” 更深\n。\n与多数类词缀一样\n,\n“ 控” 也有很强的构词能力\n,\n例如\n:\n微博控\n:\n指经常使用微博并痴迷于此的一类人。\n微博也是大学生数码应用的新领域\n,很多人成了\n“微博控”\n。\n(《中国青年报》\n年\n月\n日\n)\n大叔控\n:\n喜欢中年男人的一类人\n,这种中年人多比较成熟\n,\n留胡子\n,给人以稳定感\n和安全感。\n姜文跟张麻子的气质完全差不多\n,\n让一众女记者都变成了\n“ 大叔控,,\n。\n(人民网\n年\n月\n日\n)\n五、小结\n“ 控” 本意为\n“ 引弓” ,\n根据\n“ 引” 这一动作\n,\n引申为\n“ 引远使近”\n(段玉裁)\n的意\n思\n,\n即将远的东西拉到近处。\n《说文》\n中有\n“ 匈奴名引弓控弦” ,\n意即在匈奴方言中\n,把\n“ 引弓\n” 这一动作叫做\n“ 控弦” ,\n这就说明了\n“ 控” 为\n“ 引” 的意思\n。又有\n“ 止马曰控” ,\n也就是拉住马缰\n,\n驾驳马使之停止\n,\n段玉裁也认为\n,这一义项是\n“ 引远使近” 的意思\n,\n意思进一步发展\n,\n“ 控制\n;\n操纵” 这一意义就此产生\n。根据上文所引马瑞辰的解释\n,\n他\n认为\n“ 控\n,\n赴也” ,\n赴\n,\n走告也” ,\n《诗经》中\n“ 控于大邦\n,\n谁因谁极” 意思便是如此。\n这一意义继续发展\n,\n增加\n陈述别人的过错这一语义特征\n,\n如今常用的\n“ 告状\n;\n申诉”\n这一义项就产生了\n。\n“ 控” 的\n“ 投\n;\n跌落” 这一意义是其语义发展第三条脉络的幵端\n,\n[p.42]\n扬州大学硕士学位论文\n由其引申出\n“ 弯曲\n,\n下垂”\n,\n发展到现代汉语\n,\n进一步引申出\n“ 使身体悬空或失去支撑”\n及\n“ 使容器口朝下让里面液体流出” 两个意义\n。\n作为类词缀\n,\n“\n控” 指强烈喜爱某物\n,\n甚至达到极端程度的一类人\n,是较典型的他源性类词缀\n。类词缀“ 控”源于英语“\n”\n一词\n,后来进入\n吾借词中并广泛应用\n,随着\n本动漫的传播进入我国\n,与现代汉语“ 控\n制” 这一意义中的\n“ 控” 在语音及意义上结合\n,发展为目前常用的类词缀\n。类词缀\n“ 控”\n出现时间较短\n,稳定性差\n,\n随意性强且较少出现在典范的汉语著作中\n,可见其在使用上\n存在诸多不符合现代汉语规范的地方\n。\n《现代汉语词典》等权威工具书在新版中并没有\n将\n“ 控” 的类词缀义项列出\n,\n它还将存在于语法词的范畴之内\n,\n经受时间的考验\n。若继\n续大规模使用并且在用法上趋于规范\n,\n则将作为类词缀长期存在下來\n,否则将回归词根\n范畴参与现代汉语构词\n。与其它几个类词缀一样\n,我们整理了\n“ 控” 的意义发展脉络图\n,\n以便更清楚地展示其意义发展源流\n。\n图\n“ 控” 的意义引申图\n。\n引弓\n;幵弓— 勒马\n;驾取\n操狄\n;控制\n走吉\n;告诉\n申诉\n;控告\n使身体悬空或失去支擇\n投\n;跌落\n— 弯曲\n;下垂\n使容器口朝下让里面的液体流出\n由于类词缀\n‘‘ 控” 的产生主要受外语影响\n,\n故本图中并未涉及类词缀\n‘‘ 控” 。\n[p.43]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n第三章\n“\n类词缀” 模式分析\n第一节\n构词分析\n一\n、\n“ 族” 与\n“ 党” 构成的合成词\n社会发展会促进新事物的产生\n,\n同样\n,在语言发展过程中不可避免地会有新的语言\n现象出现\n,类词缀就是现代汉语构词的变化之一。类词缀的产生与发展\n,适应了人们追\n求节俭\n、快速的新理念\n,\n与现代社会快速多变的生活节奏相适应\n。\n族” 与\n党” 作为\n现代汉语新兴类词缀\n,\n它们的出现和应用愈发频繁\n。尤其是\n“\n族” 族词\n,在每年的汉\n语新词语中\n,\n它们都占较大比例\n。\n“ 党” 兴起后出现过一小段使用高潮\n,\n目前发展变缓\n,\n但人们交流中尤其是网络交流中仍经常使用\n。本节我们重点研究以\n“ 族” 和\n“ 党” 为类\n词缀的现代汉语附加式合成词的众多特点与功能。\n一\n)\n“\n族” 族词和\n“\n党” 族词与原族词\n的分流\n“\n族” 与\n“ 族\n”\n由\n“ 族” 构成的词语主要有两种方式\n:\n“\n族\n,,与\n“ 族\n” 。\n3从外在形式看\n,\n我们\n依据\n“ 族” 的位置对\n“ 族” 族词进行分类\n,\n“ 族” 在前的称为\n“ 族\n” ,\n“ 族” 在后的称\n为\n“\n族” 。\n“ 族\n” 结构中\n,\n“ 族” 与\n“\n” 都是作为词根存在的\n,\n意义实在\n。\n“ 族” 较\n常见的意义为\n“ 有血缘关系的亲属”\n“ 民族\n;\n种族” 。\n如以下各词\n:\n族类\n族谱\n族亲\n族权\n族群\n族人\n族裔\n族长\n族子\n族田\n族诛\n族氏\n族望\n族约\n族系\n族属\n族徽\n族落\n“\n族” 结构中\n,我们可以将它们再细分为两类\n:\n旧\n“\n族” 族词与\n“\n族” 族词\n。\n旧\n“\n族” 族词是指\n族” 作为词根存在的词\n,\n这些词中\n,\n“ 族” 意义实在\n,\n虽然处于\n词的尾部但并无类化\n、\n定位特性\n,\n也无虚化迹象\n。\n另一部分中\n,\n“ 族” 处于词尾位置\n,\n意义部分虚化\n,\n并有类化、\n定位、\n能产性\n,\n本文将它们称为\n“\n族” 族词\n。这些词在汉\n语词汇系统中并未完全定型\n,\n大部分只是作为语法词而存在\n。\n旧\n“\n族” 族词\n:\n本文中\n‘ ‘\n类词缀” 模式指由\n和类词缀构成的现代汉语合成词\n,\n除特别说明外\n,\n本文\n“\n类词缀” 模式中\n“ 类词缀” 均以\n‘‘ 族”\n‘ ‘ 党”\n“ 迷”\n控” 为例。\n“ 原族词” 指所有包含\n“ 族” 或\n‘‘ 党” 的现代汉语合成词\n。\n“ 族” 不处于直接构词成分的最外层的词语\n(如\n“ 水族馆”\n,我们不做讨论。\n[p.44]\n扬州大学硕士学位论文\n部族\n大族\n贵族\n族\n家族\n灭族\n民族\n亲族\n氏族\n世族\n水族\n外族\n望族\n异族\n汉族\n宗族\n白族\n傣族\n“\n族\n,,族词\n上班族\n追星族\n刷卡族\n布波族\n打工族\n啃老族\n考碗族\n持照族\n摇头族\n旁听族\n蚁族\n族\n族\n钟摆一族\n新新结婚族\n族” 族词近年发展快速稳定\n,\n已经得到了广泛应用\n。在第\n版\n《现代汉语词典》\n中\n,不仅\n“ 族” 的意义解释中新增了\n“ 称具有某种共同属性的一类人” 这一条\n,而且\n“ 追\n星族、打工族、上班族\n、\n啃老族” 等已作为词条收录。虽然从总体看\n族” 族词中的\n一些词仍将长期作为语法词而存在\n,\n但\n“ 打工族” 等词的\n“ 入典” 已标志着\n“\n族” 族\n词被权威工具书的承认与接受\n,\n相信随着时间的推移\n,会有更多的此类词进入词汇词范\n围\n。\n“\n党” 与\n“ 党\n”\n同\n“ 族” 一样\n,\n“ 党” 族词由\n“\n党” 与\n“ 党\n” 两种形式组成。\n1在现代汉语中\n,\n“ 党” 的意义除\n“ 政党”\n夕卜\n,\n用的较多的是\n“ 由私人利害关系结成的集团” 。在\n“\n党”\n与\n“ 党\n” 两种结构形式中\n,\n“ 党\n” 的\n“ 党” 作为词根存在\n,\n意义多为\n“ 代表某一阶\n级、\n阶层或政治集团\n,\n并为维护其利益而斗争的政治组织” 气如以下各词\n:\n党报\n党阀\n党费\n党风\n党纲\n党徽\n党课\n党龄\n党派\n党团\n党旗\n党委\n党务\n党国\n党票\n“\n党” 形式中\n,我们按\n“ 党” 是否为类词缀进一步分为旧\n“\n党” 族词和\n“\n党”\n族词\n。\n旧\n“\n党” 族词是传统意义上\n“ 党” 作为词根组成的汉语合成词\n,\n多为\n“ 朋党\n、\n同伙” 或\n“ 有共同利益的组织” ,\n意义实在\n,\n是词汇词\n。\n“\n党” 族词是\n“ 党” 作为类词\n缀而构成的现代汉语附加式合成词\n,\n“ 党” 仍有部分词汇意义\n,\n只是倾向于类化和定位\n。\n这类\n“\n党” 族词发展较为迅速\n,但很不规范\n,所以在新词词典中收录并不多\n,\n常见于\n网络\n,\n属于语法词范畴\n。\n旧\n“\n党” 族词\n:\n“ 党” 还有在词中间的形式\n,\n如\n“ 结党营私”\n,\n由于数量少且与本文研究内容无关\n,\n在此不做讨论。\n■夏征农主编\n:\n《辞海》\n,\n上海辞书出版社\n,\n年\n,\n第卩册\n,\n第\n页\n[p.45]\n王周\n:类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n白党\n朋党\n死党\n私党\n余党\n政党\n拆白党\n狐朋狗党\n狐群狗党\n“\n党” 族词\n:\n卜头党\n黄牛党\n标题党\n飞车党\n五毛党\n茶叶党\n学生党\n机车党\n手机党\n寂寞党\n苹果党\n高三党\n排队党\n党\n考研党\n二\n)\n“\n族” 族词与\n“\n党” 族词分析\n“\n族” 族词与\n“\n党” 族词中\n“\n” 的特点分析\n“\n族” 族词中\n“\n” 的特点分析\n我们搜集了\n《汉语新词语》、\n《汉语新词词典》等多部新词语著作\n,共发现\n个“\n族” 族词词语。其中\n,\n“\n” 为单音节的词数量较少\n,\n仅有\n个\n:\n奴族、\n草族、\n柜族\n、\n描族、\n鼠族\n、蜂族、孤族\n、混族、抢族、拼族\n,\n占总数的\n。在这\n单音节\n“\n”\n与\n“ 族” 组成的词中\n,\n有单音节名词性成分\n,包括鼠\n、草\n、蚁、柜、锚、\n蜂\n;\n单音节动\n词性成分\n:\n抢、拼、\n混\n;\n单音节形容词性成分\n:\n孤\n。\n汉语以双音节词为主\n,\n由双音节词\n“\n” 和\n“ 族” 组成的三音节词在\n“\n族\n,,族词\n中也占据绝对优势。在我们收集的\n“\n族” 族词中\n,\n“\n” 为双音节词的数量达到了\n个\n,\n占总数的\n。数量庞大的双音节词加上\n族” 这一类词缀\n,\n形成了\n“\n族”\n族词三音节词占优势的特点\n。\n具体到词的构成上\n,\n有动宾式结构\n,\n如\n“ 啃老族”\n“ 卖折\n族”\n“ 逃券族”\n“ 恐年族”\n“ 试衣族”\n“ 偷菜族”\n;\n有偏正式结构\n,\n如\n“ 智旅族”\n“ 奴居族”\n“ 合吃族”\n“ 穷游族”\n“ 舉眼族”\n“ 裸婚族” ;\n有主谓式结构\n,\n如\n“ 脑残族”\n;\n有补充式结\n构\n,\n如\n“ 掏空族”\n;\n有重叠式结构\n,\n如\n“ 锅锅族”\n“ 闪闪族”\n“ 奔奔族”\n“ 扣扣族”\n“ 捏捏\n族\n,,\n“ 泡泡族” 等\n。在\n“\n” 为双音节的词中\n,\n我们发现有一词为\n“ 枪迷族” ,\n这一词同\n时用了\n“ 迷” 与\n“ 族” 来表示\n“ 喜欢某事物的一类人” 这个概念\n,\n此处语义侧重不同\n,\n“ 迷” 偏向于词根\n,\n“ 族” 偏向于类词缀\n。\n“\n” 除了单音节及双音节外\n,\n还包括三音节甚至四音节词\n。据我们统计\n,\n在所有\n个\n族” 族词中\n,\n为三音节的包括\n“ 职业敲族”\n“ 后备厢族”\n“ 向日葵族”\n“ 家\n里轉族” 共\n个词\n,\n仅占总体的\n,\n几乎可以忽略不计。而它们之中\n“ 职业敲族”\n中的\n“ 职业敲” 还不能算作一个三音节词\n,它只有加上\n“ 族” 才能成为一个完整的格式。\n在四音节方面\n,\n“\n” 都已经作为短语而出现\n,\n包括\n:\n“ 网络晒衣族”\n“ 职业撞车族”\n毕\n业逃债族” “ 已婚单身族” “ 论坛潜水族” “ 文化啃老族” “ 夕阳隐婚族” “ 月光退休族” “ 未\n[p.46]\n扬州人学硕\n位论文\n富先奔族\n”\n“ 新新结婚族” 。\n这\n个词占总数的\n比例也较小\n。\n在所有\n” 为三\n音节的\n之屮\n,\n“\n” 有名\n成分\n:\n“ 后备厢\n”\n“ 向\n丨\n葵”\n;\n偏正式短语\n:\n“ 家早蹲” 。\n为四音\n‘ 短语的\n“\n族” 族词屮\n,\n“\n”\n多为两两组合而成\n,\n如\n“ 职业”\n“ 撞车”\n“ 论坛”\n“ 潜水\n” 。\n山于它们都是根掘意义再结合\n“\n族\n” 形式进行的嵌套\n,\n这些四音节格式一\n般不单独出现\n,\n在此我们不做进\n步分析\n。\n在市音\n、\n双音节及多音节之外\n,\n“\n” 还钉\n种特殊的形式\n。\n符的\n“\n族” 词屮\n,\n由非屮文字符组成\n,这样的\n“\n” 形式共有\n个\n,\n总数的\n。这些词中\n,\n“\n”\n有的单独由外文字母组成\n,\n如\n“\n族\n、\n族\n、\n族\n、\n族\n、\n族\n、\n族\n、\n族\n、\n族\n、\n族\n、\n矣\n、\n族\n、\n族”\n;\n有的由外文字\n丨\n加汉字组成\n,\n如\n“\n脱机族\n、\n隐身族\n、\n— 族\n、健康\n族”\n;打的山数字与外文字\n:组成\n,如\n“\n族\n”\n;\n有的直接由数字组成\n,\n如\n“\n族”\n;\n介的足\n丨\n丨文取位纽成\n,\n如\n“ 円族”\n(円为\n元的货币巾位\n)\n。\n此外\n,\n“\n族” 族词还有一种特殊的格式—\n“\n— 族” 。\n这类\n丨\n“\n族” 族词在\n意义上雄本一致\n,\n都是表示\n种共同特点的\n类人\n,\n有时可以\n换\n。在所有\n个\n“\n族\n” 族\n中\n,\n“\n—族”\n介\n个\n,\n占总数的\n。\n此类\n中\n,\n为单音节时\n多为动\n性质\n,\n如\n“ 拼” 与\n“ 漂” 纽成的\n“ 拼一族\n” 与\n“ 漂一族”\n;\n“ 宅一族” 中\n,\n“ 宅\n”\n本为名词性\n,套用到这个词语校巾后变为动础质\n。\n“\n” 为双音节时\n,对动宾式\n,如\n“ 赖\n家一族\n钉偏\n式\n,\n如\n“ 低碳一族”\n“ 闷居一族” 。\n除此之外\n,\n还有以英文字母加\n“ 一\n族” 组成的\n“\n一族\n,,。\n图\n“\n族” 族词中\n“\n”\n的音节数量对比\n族” 衷彳\n:中\n“\n” 的音节\n对比\n:\n为箄音\n飞\n,\n为\n:\n音节\n“\n” 为斯\n、乂\n:\n为宇母或数字聖\n‘\n,\n泣、\n:\n“\n—族” 型\n“\n党” 族词中\n“\n” 的特点分析\n由于\n“\n党” 族词规范性上存在不足\n,\n故许多新\n语词典较少收录或没有收录\n。\n在\n近几年\n《汉语新词语》\n中\n,\n有\n“ 奥达党”\n“ 盗版党”\n“ 黄牛党”\n“ 标题党”\n“ 茶叶党” 等为\n数不多的\n“\n党” 族词\n。\n为了研究的深入展开\n,\n在穷尽式搜寻新词语词典上的\n“\n党”\n[p.47]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n族词外\n,\n我们在网络上查找了大量语料\n,共取得\n条\n“\n党” 族词\n。其中\n“\n” 为单\n音节的词仅有\n例\n,\n占\n。\n它们为名词性的\n“ 茶” 和\n铁” ;\n形容词性的\n“ 甜” 与\n“ 辣\n,,。\n双音节词方面\n,\n同\n“\n族” 族词类似\n,受汉语双音节词占优势这一特点的影响\n,\n“\n”\n多为双音节词\n。\n在所有\n条\n“\n党” 族词中\n,\n共有\n条\n“\n” 为双音节的词\n,\n占总\n数的\n与\n“\n族” 族词中这一类型的词比例基本持平\n。具体来讲\n,\n由名词性\n“\n”\n构成的如\n“ 标题党”\n‘ ‘ 黄牛党”\n“ 毽球党”\n;\n动词性的如\n“ 刷屏党”\n穿越党”\n“ 手绘党” ;\n形容词性的如\n“ 寂寞党”\n“ 无聊党”\n“ 低调党” 等\n。从构词类型上看\n,\n“\n” 有动宾式\n,\n如\n“ 考研党”\n“ 截图党”\n“ 逃票党” 等\n;\n“\n” 有偏正式\n,\n如\n:\n腐官党”\n光头党”\n“ 魔声党”\n“ 红毛党” 等\n;\n“\n” 有主谓式\n,\n如\n:\n自学党” ;此外\n,\n“\n” 还有并列式\n,\n如\n“ 生活党” 。\n“\n党” 族词中\n,\n“\n” 为三音节的共有\n个词\n,\n在总词中占\n,\n“\n” 为四音\n节的词语共有\n个\n,\n占总词数的\n。在\n“\n” 为三音节的词中\n,\n有的名词性词语是\n直接以三字人名加\n“ 党” 组成\n,表示对此人的喜爱与崇拜\n,如\n“ 乔布斯党”\n“ 十三爷党”\n;\n有的是以某物加\n“ 党” 组成\n,\n如\n“ 自行车党” 和\n“ 红领巾党” ;\n形容词性的如\n“ 矮穷丑\n党”\n;\n动词性词组如\n“ 爱老婆党”\n;\n还有的在构词上本来就是附加式构词\n,\n再后加\n“ 党” ,\n如\n“ 街溜子党” 。\n在外文字母或数字加\n“ 党” 形式的词中\n,\n“\n党” 与\n“\n族” 类似\n。\n个词中共有\n个此类型词语\n,\n占总数的\n。其中\n,有的是单纯字母加\n“ 党” 组成\n,\n如\n“\n党”\n“\n党”\n“\n党”\n“\n党” 等\n;\n有的是单纯数字加\n“ 党” 组成\n,\n如\n“\n党” ;\n有的是\n汉英夹杂的类型\n,\n如\n“ 苹果\n派党” 。\n“\n族” 族词有一特殊形式\n“\n—族” ,\n这种形式在\n族” 族词中占有一定的比\n例\n。\n“\n党” 族词中\n,\n我们仅发现一例此种用法\n:\n“ 汪涵一党” 。\n由于网络语言的随意性\n及偶发性\n,许多词都是网民随心而写\n,\n故这种\n“\n—党” 的个例不能代表\n“\n党” 族词\n也具备了类似\n—族” 的用法\n。\n它的出现很可能是受\n“\n—族” 类型词的流通而进行\n的模仿\n。\n图\n“\n党” 族词中\n“\n” 的音节数量对比\n[p.48]\n扬州人\n‘癸硕七学位论文\n;\n族谓辛\n的《■节\n量对比\n飞\n丨\n“\n’\n‘ 为虽音\n‘\n“ 为” 音,\n□\n;\n” 为多音气\n:\n‘\n■\n字母或\n义子\n“\n族” 族词与\n“\n党” 族\n的语法特征\n经甜文分析我们已经知道\n,\n“ 族” 与\n“ 党” 二字在现代汉语中都为名词性质\n,\n有动\n调意味的\n“ 灭族”\n“ 偏袒” 等意义一般只用于书而语之巾\n。它们作为类词缀而组成的\n“\n族” 族词与\n“\n党\n” 族词都是表示有某种共同属件的\n类人\n,\n都为名词性质\n,\n具有名词\n的语法特征气\n经常作主语\n“ 西黑族”\n所晒之事\n,\n莫不是民生话题\n,\n他们一出手便是\n“ 一呼百应”\n。\n(《法制\n日报》\n年\n月\n日\n)\n“ 宅养族”\n力求让一切都处于平衡的和谐之中\n,\n他们追求\n“ 美好舒适” 和\n“ 意境\n之美”\n,\n但同时也摒弃\n“肆无忌惮的物语”\n。\n(\n《新周刊》\n年\n月\n日第\n期\n)\n“博客党”\n重现江湖\n,\n继续感悟人生\n。\n(新浪博客\n年\n月\n曰\n)\n强悍\n党打造史上最潮武则天\n。\n(新浪网\n年\n月\n曰\n)\n经常作宾语\n他们管\n自己的小圏子叫\n“ 爱邦族”\n,\n大家互称\n“ 邦友”\n。\n(\n《南方周末》\n年\n月\n西客中加盟人数最多\n、\n发展最快的就是\n“ 晒黑族”\n。\n(上海电视台\n《新闻透视》\n年\n月\n日\n)\n恒大皇马足校招生火爆催生排队党\n。\n(新浪网\n年\n月\n日\n)\n七里河警方十天打掉三个\n“ 飞车党”\n。\n(《兰州晨报》\n年\n月\n曰\n多数能作定语和带定语\n,\n不能作补语\n名词的语法特征参照黄丨\n荣\n、\n麼序东主编\n:\n《现代汉语》增\n二版\n,\n等教育出版社\n,\n年\n[p.49]\n王周\n:\n类词缀\n“ 族\n“ 党”\n“ 迷”\n“ 控\n研究\n椒婚族的她们\n,\n过着怎样的生活?\n(中青在线\n年\n月\n日\n)\n小欧是一家\n企业的员工\n,\n大学毕业一年\n,\n同样抱着\n“咸鱼族” 的心态混曰子\n。\n腾讯网\n年\n月\n日\n)\n作为一名潜水党的前辈\n,\n老朽有几句话要说。\n河内这两年像是被领土问题\n“绑架”\n,成了美国重返亚洲最积极的\n“ 带路党” 之\n一\n。\n(《环球时报〉〉\n年\n月\n日\n)\n前面一般可加数量短语\n,\n一般不能加副词\n在网络上出现了这样一群\n西卡族”\n,\n虽然是双方都获益的事\n,\n可还是有人提醒\n网友们\n,\n小心这样\n“ 西” 会泄露重要的个人信息\n。\n(《西安晚报》\n年\n月\n日\n)\n当今社会的就业形势无奈地\n“逼”\n出了一群\n“考碗族”\n,\n而为了幸福生活的同时\n也冒出了一群\n“嫁碗族”\n。\n(《济南时报》\n年\n月\n日\n)\n名\n“赤膊党” 蹲在派出所里老实了\n,\n已经不是凌晨打劫时那副凶样。\n(《钱江晚\n报》\n年\n月\n日\n)\n度门出现了一种\n“拖车党”\n:\n一个低龄小孩拖着一辆板车\n,\n车上绑着个大音响\n,\n一个成年男子坐在上面唱歌。\n(厦门热线\n年\n月\n日\n)\n表人名词后面可以加\n“ 们” 表示群体\n我来跟大伙算一笔账\n,\n用实实在在的数字说明在金融危机的当下\n,\n对\n“扣扣\n族” 们是\n的\n。\n(多玩游戏网\n年\n月\n曰\n)\n可怎样将这不动的房产变成流动资产呢\n,\n“啃婆族” 们应声而起。\n(中央电视台\n《第一时间\n读报》\n年\n月\n日\n)\n这些人类的先行者\n,\n动网族们\n,再也不能没有移动网络和智能手机。\n(《新周刊》\n年第\n期\n)\n八封党们的聚居地天涯论坛也来凑了个热闹\n,给这个本来就已经无厘头至极的\n总结加上了\n最终完整版\n。\n(人民网\n年\n月\n日\n)\n二\n、\n“ 迷” 与\n“ 控” 构成的合成词\n以\n“ 迷” 为类词缀的\n“\n迷” 族词产生较早\n,\n目前己被广为接受\n,\n“ 球迷”\n“ 歌迷”\n[p.50]\n扬州大学硕士学位论文\n“ 影迷”\n“ 车迷” 在円常生活中频繁出现。早在类词缀研究之初\n,\n“ 迷” 就已被广泛认可\n,\n陈光幕\n、\n马庆株\n、汤志祥等早己将其归入类词缀范围\n。\n目前\n,\n类词缀\n“ 迷” 现已被\n《现\n代汉语词典》等工具书解释说明\n,\n说明\n“\n迷” 族词已经趋于规范化\n。\n“\n控” 族词在\n语义上与\n“\n迷” 族词类似\n,不过前者程度更深\n,并强调\n“ 占有性” “ 俘获性” “ 控制性” 。\n类词缀\n控” 在汉语中出现较晚\n,但发展极为迅速\n,\n在円常用语尤其是网络用语中\n,\n“\n控” 族词经常出现。与\n“ 迷” 不同\n,\n“ 控” 是现代汉语新兴指人类词缀\n,所以在规范性、\n标准性上有待加强\n。本部分\n,\n我们将探讨以\n“ 迷” 和\n“ 控” 为类词缀的现代汉语附加式\n合成词的特点\n。\n一)\n“\n迷” 族词和\n“\n控” 族词与原族词\n‘\n‘ 的分流\n“\n迷” 与\n“ 迷\n”\n按\n“ 迷” 的位置来分\n,\n“ 迷” 族词分\n“\n迷” 与\n迷\n” 两种结构气\n“ 迷” 位置在\n前的我们称其为\n“ 迷\n” 结构\n,\n“ 迷” 位置在后的我们称其为\n“\n迷” 结构\n。在\n“ 迷\n”\n结构中\n,\n“ 迷” 与\n“\n” 都是作为词根参与构词的\n,\n意义实在\n。\n现代汉语中\n,\n“ 迷” 作为\n词根的意义主要有\n“ 分辨不清\n;\n失去判断能力\n”\n“ 使迷惑\n;\n使陶醉”\n以及\n“ 因对某人或\n某物产生特殊爱好而沉醉” 。\n例词如下所示\n:\n迷彩\n迷瞪\n迷宫\n迷航\n迷糊\n迷幻\n迷惑\n迷津\n迷离\n迷恋\n迷路\n迷乱\n迷漫\n迷茫\n迷蒙\n迷梦\n迷失\n迷误\n迷人\n迷途\n迷惘\n迷雾\n迷信\n迷醉\n在\n“\n迷” 这一结构类型中\n,\n我们可以进一步划分\n。按\n“ 迷” 是否作为类词缀参与\n构词\n,\n我们将\n“\n迷” 结构分为旧\n“\n迷” 族词与\n迷” 族词\n。在旧\n“\n迷” 族词中\n,\n与\n“ 迷” 都是作为词根参与构词\n,具有实在的意义\n,并无虚化迹象。\n“\n迷” 族词\n中\n,\n“ 迷” 具有定位性、意义部分虚化、类化性等特点\n,\n为类词缀。\n“\n迷” 族词中\n,\n单\n音节较为常见\n,\n其中作为\n“\n”\n出现的多为单音节名词\n。\n旧\n“\n迷” 族词\n:\n沉迷\n昏迷\n着迷\n入迷\n当局者迷\n纸醉金迷\n“\n迷” 族词\n:\n乐迷\n彩迷\n车迷\n马迷\n戏迷\n“ 原族词” 指所有包含\n“ 迷” 或\n“ 控” 的现代汉语合成词\n。\n同\n“ 党” 一样\n,\n“ 迷” 在中间的词语\n(如\n“ 鬼迷心转” )我们不做分析。\n[p.51]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n书迷\n拳迷\n花迷\n虫迷\n邮迷\n游戏迷\n科技迷\n古董迷\n登山迷\n摔跤迷\n作为旧有指人类词缀\n,\n“ 迷” 在\n《现代汉语词典》、\n《汉语大词典》等权威工具书中\n已占据自己的位置\n,众多\n“\n迷” 族词的词语如球迷、影迷、棋迷、\n网迷\n、歌迷已进入\n规范的现代汉语词汇之中\n。但考虑到它们在词形及语义上均以\n迷” 族词的方式呈现\n,\n故本文中将它们列入该族词进行研究\n。\n随着\n“\n迷” 族词越来越多地应用\n,\n“ 迷” 这一\n类词缀必将长期参与构词\n,\n稳定地存在于现代汉语之中\n。\n“\n控” 与\n“ 控\n”\n同\n“ 迷” 一样\n,\n我们按照\n“ 控” 的位置将其进行初次分类\n。\n“ 控” 在前的称为\n控\n” 结构\n,\n“ 控” 在后的称\n“\n控” 结构\n。\n在\n“ 控\n” 结构形式中\n,\n控” 与\n“\n” 都是\n作为词根存在\n,\n意义实在\n,\n“ 控” 的意义多为\n“ 控制”\n“ 控告、\n申诉” 。例如\n:\n控告\n控购\n控股\n控盘\n控诉\n控仓\n控制\n控油\n控件\n控罪\n控球\n控场\n“\n控” 结构中\n,\n依据\n“ 控” 是否为类词缀我们可以将其进一步分为\n“\n控” 族词\n和旧\n“\n控” 族词\n。后者之中\n,\n“\n” 与\n控” 都是词根\n,\n意义实在\n,\n旧\n“\n控” 族词作\n为词汇词存在\n。\n在\n控” 族词中\n,\n“\n” 是词根\n,\n“ 控” 是类词缀。这类\n“\n控” 族词\n通过语言接触传入汉语\n,结合汉字\n“ 控” 的语音及意义特点形成\n,近几年发展迅速\n,\n“ 控”\n已成为新兴类词缀的典型代表\n。\n旧\n“\n控” 族词\n把控\n调控\n严控\n监控\n操控\n申控\n指控\n管控\n防控\n遥控\n掌控\n测控\n“\n控” 族词\n猫控\n潮控\n萝莉控\n大叔控\n数码控\n微博控\n摄影控\n毛衣控\n西装控\n可爱控\n御姐控\n正太控\n制服控\n萝\n卜控\n兄控\n值得注意的是\n,\n在旧\n“\n控” 族词中\n,\n有诸如\n“ 程控”\n“ 光控”\n“ 声控”\n“ 触控” 等\n词\n,\n它们意义比较实在\n,\n多为\n“ 控制” 之意\n,但在词形上类似于\n“\n控” 族词\n,\n只不过\n少了指人的意义\n,\n因此这类词中的\n“ 控” 不是本文研究的类词缀\n。\n二)\n“\n迷” 族词与\n“\n控” 族词研究\n“\n迷” 族词与\n“\n控” 族词中\n“\n” 的特点分析\n[p.52]\n扬州大学硕士学位论文\n“\n迷\n族词中\n“\n” 的特点分析\n我们对\n语料库中以\n“ 迷” 为类词缀的词语进行了穷尽式搜索\n,共发现\n条\n“\n迷” 族词\n。其中\n,\n“ 球迷” 一词有\n个\n,\n占据了总数的\n,\n其他词语中\n,\n歌迷\n个\n,\n占总数的\n戏迷\n个\n,\n占\n影迷\n个\n,\n占\n棋迷\n个\n,\n占\n乐迷\n个\n,\n占\n。通过以上数据可以得知\n,\n球迷”\n“ 歌迷”\n等词在\n“\n迷” 族词中占据很大比重\n,这些词的频繁使用\n,说明以它们为代表的\n“\n迷”\n族词发展稳定\n、成熟\n。\n由于\n“ 迷” 是旧有指人类词缀\n,\n语料库更新较慢\n,\n为了保证语料的平衡性\n,我\n们又在新词词典及网络上搜索到了\n个\n“\n迷” 族词词语\n,\n加上\n语料库中的\n个词语\n(不计重复\n)\n,\n以这\n个词语作为研究样本进行研究。\n统计发现\n,\n“\n” 为单音\n节的\n“\n迷” 族词词语共\n个\n,\n占总数的\n,\n这一比例与\n“\n族” 族词\n、\n“\n党”\n族词相比有大幅度提高。\n如果计入重复词语\n,\n単音节\n“\n数量更是占据\n以上\n。这\n说明\n“\n迷” 族词中\n,\n单音节\n“\n” 比重提高\n,\n甚至在绝对数量上占据优势。\n” 的词\n类多为名词性质\n,\n有的是单音节名词\n,\n如\n“ 书”\n“ 车”\n“ 马”\n“ 棋\n;\n有的是几种名称的总\n称或简缩形式\n,\n如\n“ 球迷” 的\n“ 球” 为足球\n、篮球\n、排球\n、\n网球等球类的总称\n;\n“ 网迷”\n中的\n“ 网\n” 代表的是网络\n;\n“ 拳迷” 里的\n“ 拳” 指的是\n“ 拳击” 。\n除单音节\n“\n” 外\n,\n双音节\n“\n” 构成了\n“\n迷” 族词的大部分词语\n。据我们统计\n,\n在所有\n个\n“\n迷” 族词词语中\n,\n“\n” 为双音节的词有\n个\n,\n占总数的\n。在\n绝对数量上双音节\n“\n” 虽然比单音节\n“\n” 少\n,但若不计重复词语\n,双音节\n“\n” 仍占\n巨大优势\n,这也是汉语双音节词占优势的体现。在\n” 的词类方面\n,\n多数为名词性的\n,\n如\n“ 军事迷”\n“ 蔬菜迷”\n“ 广播迷”\n“ 武侠迷” ;\n还有动词性的\n,\n如\n“ 游泳迷”\n“ 收藏迷\n等\n;少数是形容词性的\n,如\n“ 科幻迷” 。在构词类型方面\n,双音节\n“\n” 有并列式\n,如\n“ 研\n究迷”\n“ 收藏迷”\n;\n有动宾式\n,\n如\n“ 集邮迷”\n“ 跳水迷”\n“ 投稿迷”\n“ 养狗迷”\n“ 登山迷” ;\n有偏正式\n,\n如\n“ 洋鸟迷”\n“ 京剧迷”\n“ 雪菜迷” 。\n此外\n,\n还有部分\n“\n” 为多音节词\n。在我们的统计中\n,\n共发现\n例\n“\n” 为多音节\n的词\n,\n占\n。在这些词中\n,三音节“\n” 都为名词性质\n,很多都是以\n“ 人名” 加\n“ 迷”\n的形式出现的\n,\n如\n“ 林青霞迷”\n“ 郭富城迷”\n“ 贾平\n迷” ;\n还有的是直接以\n“ 事物的名\n称” 加\n“ 迷” 组成\n,\n如\n“ 自行车迷”\n“ 黄梅戏迷”\n“ 三国杀迷”\n“ 计算机迷” 等\n。此外\n,\n四音节\n“\n” 之中\n,有的以\n“ 人名” 加\n“ 迷” 组成\n,如\n“ 哈利波特迷”\n“ 福尔摩斯迷” 等\n;\n也有的以\n“ 事物名称” 加\n“ 迷” 组成\n,\n如\n“ 电子竞技迷”\n“ 中国文化迷” 等\n。在\n“\n” 的\n类型上\n,有偏正结构\n,\n如\n“ 电子竞技迷”\n“ 集体劳动迷”\n“ 民意测验迷”\n“ 义务普法迷” ;\n[p.53]\n干周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控\n” 研究\n竺\n有并列结构\n,\n如\n“ 行尸走肉迷”\n“ 西装领带迷” 等\n。应注意的是\n,\n这些\n“\n迷” 族词词\n语的出现有极大的随意性\n,\n随着\n“\n” 音节数目的增多\n,\n它们进入词汇词的数目趋小\n,\n三音节及以上的\n“\n” 成词数量远小于双音节及单音节\n。\n还有一部分特殊的\n“\n迷\n” 族词\n,\n它们中\n“\n”\n由外文字母或外文字母加汉字组成\n,\n这类词共\n个\n,\n只占总数的\n。包括\n“ 卡拉\n迷”\n“\n迷”\n“\n迷”\n“\n迷”\n“\n迷”\n“\n迷”\n“\n迷” 。\n图\n“\n迷” 族词中\n“\n” 的音节数量对比\n迷” 誤调中\n‘ ‘\n” 的音节数量对比图\n:\n“\n” 为里音节\n、\n‘\n:\n“\n” 为沒音爷\n‘\n:\n“\n” 为多音节\n” 为字母型\n“\n控\n族\n彳中\n“\n” 的特点分析\n山尸\n“\n控” 族词发展不稳定\n,\n随意性较强\n,\n加之词典较慢\n,\n新词语词典中收录的\n较少\n,\n仅有\n“ 大叔控”\n“ 微博控”\n“ 街拍控”\n“ 签到控”\n“ 屮国控” 等少数\n“\n控” 族词词\n语\n,\n故我们在门户网站\n、\n论坛\n、微博之中进一步搜寻\n,\n共取得\n个例词\n。其内容涉及\n面较广\n,\n有关于水果的\n,\n如\n“ 水果控”\n“ 西瓜控”\n“ 芒果控”\n“ 香焦干控”\n;有关于手机的\n,\n如\n“ 安卓控”\n“\n控”\n;\n有关于服装的\n,\n如\n“ 男装控”\n“ 女装控”\n“ 正装控”\n“ 商务男\n装控” ;\n有关于车的\n,\n如\n“ 汽车控”\n“ 爱车控”\n“ 汽车发烧控” ;\n有关于地域的\n,\n如\n“ 重庆\n控”\n“ 蒙古控”\n“ 西藏控”\n;\n有关于运动品牌的\n,\n如\n“\n控”\n“\n控”\n;\n有关于星座\n的\n,\n如\n“ 星座控”\n“ 十二星座控”\n“ 星座围脖控” 等\n。\n“\n” 的音节方面\n,共有\n个\n“\n” 为单音节的\n“\n控” 族词词语\n,\n占总数的\n。\n其中\n,\n“\n” 大部分为名词性质\n,\n如\n“ 兄控”\n“ 妹控”\n“ 叔控”\n“ 车控” 等\n;\n有部分\n“\n”\n为形容词性质\n,\n如\n“ 萌控”\n“ 潮控” 。\n此外\n,\n还有一词\n“ 力控” ,\n指对\n物都喜爱的人\n。\n汉语双音节词占优势\n,\n这一点在\n“\n控” 族词中\n“\n” 的音节数量上仍体现地较为\n明显\n。在所有\n个属于\n“\n控\n’ ’ 族词的词语中\n,\n“\n” 为双音节的词共\n个\n,\n比例达\n到\n,\n比\n“\n迷” 族词略多\n,\n少于\n“\n族” 族词及\n“\n党” 族词\n。\n在双音节\n“\n”\n构成的\n“\n控” 族词中\n,\n名词性的\n“\n” 仍占据多数\n,\n如\n“ 汽车控”\n“ 杯子控”\n“ 萝莉控”\n“ 女王控”\n“ 水果控” 等\n,\n还有少数动词性与形容词性的\n“\n” ,\n如\n“ 测试控”\n“ 跑步控”\n[p.54]\n扬州人学硕十学位论文\n“ 清新控”\n“ 恐怖控” 等\n。\n构词类型方面\n,\n双音节\n“\n” 有偏\n式\n,\n如\n“ 男装控”\n“ 微里\n控”\n“ 短发控”\n“ 萌物控\n” 等\n;\n有动宾式\n,\n如\n“ 恋图控\n”\n“ 插画控”\n“ 摇奖控”\n“ 折纸控”\n等\n;\n有并列式\n,\n如\n“ 收藏控”\n;\n有重叠式\n,\n如\n“ 包包控”\n;\n有附加式\n,\n如\n“ 阿狸控”\n“ 鞋\n子控” 等\n。\n“\n控” 族词中\n,\n里然\n“\n” 仍是以双音节词为中\n,\n但三音节及三音节以上的\n“\n”\n也为数不少\n,\n数量达到了\n个\n,\n占\n。这一比例在\n“\n族” 族词\n、\n“\n党” 族词\n、\n“\n迷” 族词与\n“\n控\n” 族词中是最高的\n。\n多音节\n“\n控” 族词中\n,\n除\n“ 美少年控”\n“ 高\n跟鞋控”\n“ 红楼梦控” 等少数名词加\n“ 控” 结构外\n,\n“\n” 多是由短语组成\n。有偏正结构\n,\n如\n“ 彩色星座控”\n“ 紫色潮流控”\n“ 创意广告控”\n;\n有并列结构\n,\n如\n“ 行尸走肉控”\n“ 吃喝\n玩乐控”\n“ 妈妈\n丨\n控”\n;\n有主谓结构\n,\n如\n“ 达人自拍控\n”\n“ 生活大爆炸控” 等\n。\n与\n“ 族”\n“ 党”\n“ 迷” 类似\n,\n“\n控” 族词也包含数字或外文字母加\n“ 控” 组成的词\n。\n我们搜索到\n个此类型的\n“\n控” 族词词语\n,\n占总数的\n。\n这拽词语中\n,\n有的由\n英语单词加\n“ 控” 组成\n,如\n“\n控” “\n控” “\n控\n”\n;有的\n丨\n数字和汉字加\n“ 控”\n组成\n,\n如\n“\n穿衣控”\n;\n有的由英语和汉字加\n“ 控” 组成\n,\n如\n“\n资料控”\n“\n影像控”\n;\n有的山英语和数字加\n“ 控\n” 组成\n,\n如\n“\n控” 。\n图\n“\n控” 族词中\n“\n” 的音节数量对比\n族谓由\n的音节\n对比墨\n‘\n“\n、\n:\n“\n” 为卑晉节\n:\n“\n” 为双音节\n乂\n■■■\n:\n“\n” 为多音节\n“\n” 为字母型\n“\n迷” 族词与\n“\n控” 族词的语法特征\n“ 迷” 与\n“ 控” 在现代汉语中主要作动词使用\n,\n“ 迷” 主要指\n“ 分辨不清” 和\n“ 沉\n迷于某事或某人”\n,作为旧有指人类词缀\n,\n“ 迷” 在\n《现代汉语词典》的解释中已出现\n“ 沉\n迷于某一事物的人” 这一义项\n。\n“ 控” 在现代汉语中主要是\n“ 告发\n、控告”\n“ 遥控” 之意\n,\n少数时候还会用到\n“ 倒立容器口使里面液体流出\n” 及\n“ 使身体悬空或失去支撑” 这两个\n意思\n。而作为类词缀构词的“\n控” 族词与\n“\n迷” 族词有区别词性的作用\n,都表示“ ... ...\n的一类人” ,\n都为名词\n,\n故它们都具有名词的语法特征\n。\n[p.55]\n王周\n:类词缀\n“ 族”\n“ 党”\n“ 迷”\n控” 研究\n经常作主语\n一位球迷对我大声吼道\n:\n谁好?中国\n,还是香港答错了我宰了你\n!\n”\n(刘心武《\n长锼头》\n)\n“那上一部呢\n” 影迷不安了\n。\n(《读者》\n年\n)\n“伪娘控” 成为今年\n‘ ‘快男\n当红不让的主题之一\n。\n(《深圳特区报》\n年\n月\n曰\n)\n“签到控”\n“微博控”\n已成为手机用户中最庞大\n、\n最活跃的两大族群。\n(《北京晚\n报》\n年\n月\n日\n)\n经常作宾语\n难怪她几支歌唱下来\n,\n就拥有了成千上万的歌迷。\n(陈建功\n《皇城\n在我国互联网上\n,\n活跃着一大批\n“ 军迷”\n。\n(《人民日报》\n年\n月\n日\n)\n当然\n,\n不少股民都是股票控\n。\n(《羊城晚报》\n年\n月\n日\n)\n郭富城称他是个\n“ 眼镜控”\n,\n平时喜欢戴斯文一些的平光镜出席派对\n,骑摩托车\n或飆车时又爱戴墨镜摆酵\n。\n(《京华时报》\n年\n月\n日\n)\n多数能作定语和带定语\n,\n不能作补语\n我相信一定有一些热情的乐迷围拢在钢琴周围\n。\n(希尔顿\n《消失的地平线》\n)\n到了\n“三缺一”\n的当儿\n,\n那位麻雀迷的先生该跳脚了\n。\n(俞平伯\n《致死者》\n)\n— 大批喜欢操作钢铁机曱\n,\n渴望飞向蓝天奔向宇宙的战士成为了忠实的\n“机甲\n控”\n。\n(新浪游戏\n年\n月\n日\n)\n身为\n“袜控”\n的你\n,还不快来看看编辑为你盘点总结的\n台及膝袜的潮流趋势。\n新浪网\n年\n月\n曰\n)\n前面一般可加数量短语\n,\n一般不能加副词\n达斯是一位舞迷\n,\n对在巴黎举行的舞蹈表演几乎场场不落。\n(《新华社\n年新\n闻稿》\n)\n我俩却忘了家里还有一个奥运迷一一二岁多一点的儿子\n。\n(《健康时报》\n年\n[p.56]\n扬州大学硕士学位论文\n月\n日\n)\n可能以后会有一到几个癫控做版主\n。\n(天涯论坛\n年\n月\n日\n)\n我是一个悲观控。\n(新浪博客\n年\n月\n曰\n)\n表人名词后面可以加\n“ 们\n” 表示群体\n戏迷们拥挤在法兰西剧院和歌剧院中\n,欣赏名家的新作品和有趣的滑稽表演\n沈\n永兴\n《二战全景纪实\n〉》\n)\n很多实况迷们也和陈大伟进行了比赛\n,但都被\n“ 斩落马下”\n。\n人民网\n年\n月\n日\n)\n穿上这套时装\n,\n你就能化身某种猫科动物\n,\n让猫耳控们对你的好感度增加百分\n百\n。\n(新浪游戏\n年\n月\n曰\n)\n贾斯打\n比伯小童鞋不仅是目前欧美乐坛的当红炸子鸡\n,\n更是广大正太控们的\n日\n三\n、小结\n本节中\n,我们对\n“\n类词缀” 这一模式的构词特点进行了细致分析\n。分析时\n,我们\n仍按照前两章的处理办法\n,\n将\n“ 族” 与\n“ 党” 构成的合成词\n、\n“ 迷” 与\n“ 控” 构成的合\n成词分别进行介绍\n。首先是四个类词缀构成的族词与原族词的分流。\n以\n“ 族” 为例\n,\n将\n所有\n“ 族” 族词分为\n“ 族\n” 与\n“\n族” 两种模式\n,而后按照\n“ 族” 是否为类词缀把\n“\n族” 分为旧\n“\n族” 族词与\n“\n族” 族词\n,\n这样实现了由类词缀\n族” 构成的\n“\n族”\n族词与原族词的分流。之后\n,我们分别将四个\n类词缀” 族词中\n“\n” 的特点进行了\n分析\n,\n包括\n“\n” 的音节特点统计、\n词性、\n构词方式等\n,\n并以图表的形式将它们各自的\n音节特点展示出来\n,\n以更直观地表现各个族词内部的不同\n。最后\n,我们介绍了四个族词\n的语法特征\n,\n并进行了举例说明\n。\n由于类词缀具有类化性\n,可以标志词性\n,\n而本文研究\n的四个类词缀所构成的族词都为名词性\n,\n故它们具有名词的语法特征\n:\n经常作主语\n;\n经\n常作宾语\n;\n多数能作定语和带定语\n,\n不能作补语\n;\n前面一般可加数量短语\n,\n一般不能加\n副词\n;\n表人名词后面可以加\n“ 们” 表示群体。\n[p.57]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n第二节\n“\n类词缀” 模式与词语模\n一、模因论与词语模\n现代模因论最早是源于达尔文的进化论\n,\n理查德\n道金斯在\n年模仿生物传递\n单位基因\n(\n来阐述文化进化现象\n,\n提出了模因\n(\n的概念\n,\n他在\n《自私的\n基因》一书中认为模因是存在于大脑中的模式\n,其信息可以用来复制模仿\n,是一个文化\n模仿单位。从广义上讲\n,人类的交际语言、文化传统、风俗习惯、社会制度、思想观念、\n行为方式等都属于文化模因的范畴\n。人的观念可能因为传播条件、理解差异等原因产生\n变异\n,这些变异的观念同一些具有强大生命力的观念相结合可以产生新的观念\n,这种通\n过重组而来的新观念必然具有原本母观念的某些因子\n。学界将模因现象形象地描述为\n“ 病毒”\n,\n这种\n“ 模因病毒” 可以侵袭人的大脑\n,\n改变人类行为\n,\n同时\n,\n又通过被侵袭\n者传染给其他人\n,\n如此不断深入发展\n,\n不断模仿\n、\n传播\n,\n模因现象就形\n了\n。\n模因前期的形成阶段是模仿\n,\n通过模仿而对其复制和传播\n。\n“ 模因被着作是大脑里\n的信息单位\n,是存在于大脑中的一个复制因子\n。\n” 1只有思想或信息得到重复传播和不断\n模仿复制\n,才能称之为模因\n。许多新发明\n、新创造、新思想等推动社会进步的方式都是\n通过模因实现的\n。\n当然\n,\n有模仿必然存在好坏\n,\n有些不健康的思想观念、行为方式、社\n知\n会现象可能会通过模因得到扩散\n,\n引起消极影响\n。这就要求我们对由模因传播的事物必\n须准确识别\n,趋利避害\n。\n模因论提出后受到学者的重视\n,\n相关研究逐渐扩散到文化学、教育学、语言学、心\n理学等领域。模因论引入我国的时间比较晚\n,\n目前相关研究还不够成熟\n。在本世纪初期\n,\n何自然等多位学者先后撰文介绍模因论\n,\n在此不一一介绍\n。\n在语言学领域\n,模因的研究也逐步幵展。\n“ 自然语言中的模因主要是从三个方面体\n现的\n:\n教育和知识传授、语言本身的运用\n、通过信息的交际和交流。”\n2在我国\n,\n李宇明\n由模因理论出发\n,\n结合现代汉语词汇知识\n,最早提出了\n“ 词语模” 这一概念。词语模可\n以分为\n“ 模槽” 与\n“ 模标” 两部分\n,\n“ 模槽” 是指词语模中可以用其他词语来替换的部\n分\n,\n“ 模标” 是词语模中不变的部分\n,\n可变的\n“ 模槽” 与不变的\n“ 模标” 共同构成了词\n语模的框架。\n禹存阳在其硕士学位论文\n《现代汉语词语模研究》\n中\n,\n继承了李宇明关于\n何自然\n、\n冉永平\n:\n《新编语用学概论》\n,\n北京大学出版社\n,\n年\n,\n第\n页\n何自然\n、\n冉永平\n:\n《新编语用学概论》\n,\n北京大学出版社\n,\n年\n,\n第\n页\n[p.58]\n扬州大学硕士学位论文\n词语模的观点\n,综合分析后认为现代汉语词语模的模标可以是词缀\n、类词缀\n,\n也可以是\n构词能力强的语素\n。词语模具有模糊性的特征\n,这种模糊性体现在模标是一种过渡单位\n,\n意义虚化程度不同\n、词语模形成的语言单位是词还是短语上存在不确定性等几方面\n。他\n还分析说词语模是建立在框架理论\n、连续统理论\n、类推理论等理论基础上形成的\n,\n具有\n时代性、\n能产性\n、潜显性\n、理据性等特征\n。曹春静对词语模进行了重新定义\n,\n她认为词\n语模\n“ 由一个意义发生虚化或泛化并形成一定类义的语素或词作为固定成分\n,\n与一系列\n具有相似深层语义特征的语素或词组合而成”\n。她还分析了模标与模槽的各自特点\n,\n并从语言学、文化学\n、韵律学理论及语法化理论等方面对词语模进行了考察\n。还有一种\n与词语模类似的\n“ 词法模式” 说法\n,它是\n“ 不但包括有标志性语素的\n,\n也包括没有标志\n性语素但在组成成分的形类和语义类上有规则可循的构词模式” 气这一概念比词语模\n更加宽泛\n,\n认为只要有一定规则产生的词也可以进入\n“ 词法模式” 范畴\n。\n“ 词法模式”\n与\n“ 词语模” 分别从词语的内部规则和外部框架角度呈现\n,\n前者重点在于突出语义类别\n及语法类别的确定性\n,后者在于强调外部形式的标记性\n。苏向红对词语模进行了全面研\n究\n,认为\n“ 当代汉语词语模指的是语用主体为了满足表达需要\n,\n在认字规律和语用因素\n的相互作用下\n,利用类推方式\n,\n即时生成并且便捷地传播新词语的一种模块化装置” 气\n此外\n,她对词语模的物种价值、性能、产生的外部参数与内部动因进行了研究\n,\n并对词\n语模类型、\n“ 模群” 现象及个别词语模进行了深入探讨\n,\n取得了较大成果。\n在综合前人研究的基础上\n,我们认为汉语词语模由模标与模槽构成\n,模标是指词语\n中的固定成分\n,可出现在词语的前\n、\n中\n、后位置\n,\n词缀、类词缀或形式上及语义上有虚\n化倾向的语素、词都是典型的模标\n,广义的模标甚至可以包含有实在意义的词、短语等。\n具体到当代汉语层面上讲\n,\n由于附加式不是主要构词方式\n,\n词缀少\n,\n词缀能产性不高\n,\n故当代汉语新词语模标一般由类词缀等形式上及语义上有虚化倾向的语言成分充当\n。模\n标具有类化性、模糊性等特点\n。模槽是指可与模标组合并在它的位置上可被与其有聚合\n关系的其他语言成分替换的空位\n,其重要特点是聚合性及灵活性\n。词语模是当代汉语一\n种重要的造词方法\n,\n同时\n,\n也可以从构词法角度对词语模进行分析。词语模有很强的幵\n放性、能产性及新生类推能力\n。\n曹春静:\n《当代汉语词语模研究》\n,\n上海师范大学硕士学位论文\n,\n年\n,\n第\n页\n董秀芳\n:\n《汉语的词库与词法》,\n北京大学出版社\n,\n年\n,\n第\n页\n3苏向红\n:\n《当代汉语词语模研究》\n,\n浙江大学出版社\n,\n丨\n年\n,\n第\n页\n[p.59]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n二、从词语模理论看类词缀\n一)模标\n按照词语模理论\n,\n处于模标位置的语言成分既可以是词缀\n,\n也可以是类词缀\n,\n甚至\n可以是有虚化倾向的词、短语\n,\n“ 族”\n“ 党”\n迷”\n“ 控” 作为现代汉语类词缀\n,\n无疑可以\n作为词语模的模标\n。\n首先\n,\n它们具有导引类化性质。\n当我们认识新事物时\n,往往会根据\n已有的知识、经验首先对其做出判断\n。以“\n迷” 模式为例\n,其模槽为“\n” ,模标为“ 迷” ,\n我们对于\n“ 球迷”\n“ 歌迷”\n“ 影迷”\n“ 棋迷” 等词早已司空见惯\n,\n当遇到其它以\n“ 迷” 为\n模标的词时\n,\n我们能很快依据\n“ 迷” 所表达的思想意义对其做出判断\n,\n即指\n“ 沉醉于\n的人” 。\n再如我们第一次听说\n“ 五毛党” 这一名称时\n,\n往往会首先联想到\n飞车党”\n“ 标题党” 等流行新词语\n,\n因为作为\n“\n党” 模式\n,\n‘ ‘ 五毛党” 这一名称与它们类似\n,\n根据经验\n,\n我们会以\n“ 飞车党”\n“ 标题党” 为导向给\n“ 五毛党” 进行定位\n,\n将其归类\n,\n用以表示\n“ ... ... 一类人” 这一意义\n,这就是模标导引类化的作用\n。本文\n几个现代汉语\n指人类词缀为模标所构成的许多词语我们可能并未听说\n,但当它们出现时\n,我们往往能\n较容揚地根据已有词汇进行联想定位、\n归类\n,\n再结合模槽对其意义进行判断。\n其次\n,模标具有模糊性\n。这里的模糊性首先是对于模标成分的重要组成部分\n类\n词缀定性上的模糊\n。\n由于对现代汉语类词缀的研究各家观点并不一致\n,在讨论是否确定\n“ 类词缀” 这一概念及其具体命名上并不一致\n。有的学者不主张\n“ 类丨\n的说法\n,\n认\n为这会引起汉语词汇很大程度的混乱\n,很多学者对它们的命名也不一致\n,\n目前就有\n“ 类\n词缀”\n“ 准词缀”\n“ 准词头”\n“ 准词尾”\n“ 语体前缀” 等诸多说法。我们赞同类词缀\n,\n主要\n是因为它们处于现代汉语\n“ 词根—词缀” 的连续统中\n,是由词根转化为词缀的重要桥\n梁\n,对其研究与探讨会加深我们对这一连续统的认识。模糊性还体现在人们人识上的模\n糊\n。\n由于个人的思想观念、\n自身经历、知识储备不同\n,对于模标的认识也必然会产生差\n异\n。就\n“\n控” 来讲\n,其主要在网络交际语言中使用\n,\n年轻人对其多比较了解\n,\n而许多\n年龄稍大的人对这一族词往往认识不够\n,\n如\n“ 微博控” ,可能会将其理解为\n“ 控制微博\n,\n不过多使用” ,\n与真实意义产生差距\n。\n二\n)模槽\n模槽是词语模中的可替换成分\n,正是因为模槽的变换\n,才产生了形形色色的新词语。\n首先\n,\n模槽具有灵活性。\n以\n“\n党” 族词为例\n,\n其模槽\n” 可以是动词\n、\n名词\n、\n形容\n词等多种词性\n,\n如\n“ 盗版党”\n“ 黄牛党”\n“ 美丽党” ;\n又可以有单音节、双音节\n、\n多音节\n等多种音节\n,\n如\n“ 甜党”\n“ 飞车党”\n“ 自行车党” ;\n还能有汉字、数字、字母或汉字字母\n[p.60]\n扬州人学硕士学位论文\n混合等外形特征\n,\n如\n截图党”\n“\n党”\n“\n党”\n“ 苹果\n派党”\n;\n“\n” 的构词类型包\n括动宾式\n、偏正式\n、主谓式、并列式等多种类型\n,如\n“ 截图党”\n“ 飞车党”\n“ 自学党”\n“ 生\n活党” 等\n。\n其次\n,\n模槽具有聚合性\n,\n这体现在各个成分的语法功能与语义关系上\n。\n就\n“\n族”\n族词来讲\n,\n其\n“\n” 虽然有动词\n、\n名词等多种词性\n,\n但它们在语法功能上都是对\n“ 族”\n起限定或者修饰的作用\n,\n表示具有\n“\n” 特性的一类人\n,\n中心意义在\n一类人” 这一点\n上\n。\n如\n“ 裸婚族” 指不考虑工作、\n收入等基本生活保证的状况就结婚的一类人\n,\n“ 考碗\n族” 指专注于考取公务员\n、事业编制等有\n“ 铁饭碗” 性质单位的一类人。模槽成分在语\n义关系上有聚合性\n,处于模槽位置的成分相互之间可以替换\n,其在语义特征上存在彼此\n相关性\n。如\n“\n族” 族词中\n,\n“\n” 有表示生活态度的\n,如\n“ 乐活族”\n“ 慢活族” “ 快活族” ;\n有表示心理状况的\n,\n如\n“ 恐归族”\n“ 恐年族”\n“ 爱券族” ;\n有表示彼此分担的生活方式的\n,\n如\n“ 合吃族”\n“ 拼车族”\n“ 拼房族” 。\n三\n、\n小结\n本节主要从词语模的角度分析了类词缀这一语言现象\n。模因的概念是道金斯基于达\n尔文的进化论提出的\n,\n是一个文化模仿单位。通过不断模仿\n、\n复制\n、传播\n,\n许多事物得\n以发展。在语言学研究领域\n,\n李宇明从模因理论出发\n,提出了\n“ 词语模” 的概念\n,\n并将\n其分为不变成分\n“ 模标” 与可变成分\n“ 模槽” 两部分。经分析\n,我们认为\n,\n词缀、类词\n缀或形式上及语义上有虚化倾向的语素、词都是典型的模标\n,现代汉语新词语的模标多\n是由形式上及语义上有虚化倾向的语言单位充当\n。\n模槽是词语模中可以进行替换的部\n分\n,模槽与模标共同组成词语模。从词语模角度看\n,类词缀具有模标的引导类化性、模\n糊性的特点\n;\n“\n类词缀” 模式中的\n“\n” 具有模槽的灵活性、聚合性特征\n。通过本节\n的分析我们认为\n,\n“\n类词缀” 模式是汉语词语模理论的重要应用\n。\n第三节\n“\n类词缀” 模式修辞造词分析\n一、造词法与构词法\n明确造词法这一术语是分析修辞造词的前提\n,所谓造词法\n,顾名思义\n,就是创造词\n的方法\n,它使一个词从无到有\n,产生新词\n,是动态过程。汉语造词法问题是孙常叙在\n年第一次提出的\n,他对\n“ 造词方法” 和\n造词结构” 进行了探究\n,\n相对应的也就是我们\n现在所说的\n“ 造词法” 与\n“ 构词法” 相关问题\n。任学良提出了\n“ 词法学造词法、句法学\n[p.61]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控\n研究\n造词法、修辞学造词法、语音学造词法、综合造词法、文字学造词法”\n六种汉语造词\n的方法。与造词法相对的是构词法\n,所谓构词法\n,\n是从静态角度分析词的内部构造\n,\n是\n对已有的词进行结构分析的方法\n,我们讲一个词为单纯词或者合成词就是从构词法角度\n出发作出的判断\n。正确区分造词法与构词法是我们对现代汉语词汇进行科学研究的重要\n前提\n,\n有助于我们从词的形成方法与语素的构词法则方面对词进行深入了解\n。\n二、\n“\n类词缀” 模式修辞造词分析\n上文提到了任学良先生提出的\n“ 修辞学造词法” ,\n关于这一说法目前学术界尚存在\n分歧\n,\n有的称之为\n“ 修辞造词法” ,\n我们认为后一种说法更为准确\n,\n因为语言学包括语\n音学、形态学\n、句法学、语义学\n、语用学等诸多分支\n,修辞学可以作为语用学的一部分\n,\n从广义上讲也可作为语言学的一个分支\n,\n而造词法是形态学的内容\n,将\n“ 造词法” 中的\n造词方式描述为\n“ 修辞学” 似乎不太合适\n,这是用一个学科分支去描述与之并列的学科\n分支中的内部小类\n。所以\n,\n我们认为将\n“ 修辞学造词法” 称之为\n修辞造词法” 更为妥\n帖\n,\n这样可以更好地体现这一造词法的造词依据\n。\n我们还必须区分\n“ 修辞造词法” 与\n“ 词的修辞义” 这两种概念\n。前者是指通过修辞\n手法\n(比喻\n、借代\n、夸张、\n仿拟\n、双关\n、\n反语、委婉等\n)介入新词创造的过程而创造新\n词的方法\n。众多修辞手法参与造词\n,增强了汉语词汇的活力\n,\n同时使汉语词汇更丰富多\n彩。如现代汉语词汇中关于死亡的说法众多\n,这多是通过委婉造词的方敏实现的\n,\n如牺\n牲、\n归西、\n归天、\n百年、就义、夭折、作古\n、\n与世长辞、\n寿终正寝等\n,这些词都与死亡\n有关\n,\n但由于人们的心理因素及传统观念\n,\n往往不用\n“死” 这个词来表达\n,\n而采用其他\n词语代替\n。\n“ 词的修辞义” 是指在既有词语的意义基础上通过修辞手法派生出来的修辞\n意义。许多经常见到的通过修辞义展现的词往往会使我们与\n“ 修辞造词法” 产生混淆\n,\n如\n“ 红领巾” 一词\n,\n是指佩戴在少年先锋队队员身上的一种红色领巾\n,\n因为少先队员都\n佩戴红领巾\n,所以现在许多作品中用它指代少先队员\n。这是采用了借代的修辞手法\n,\n用\n事物的特征代指整体\n,\n但它的本义仍是\n“ 红领巾\n” 这一事物\n,\n“ 少先队员” 这一意义是\n由其本义派生出来的\n,\n并没有创造新词\n,\n故这是\n“ 红领巾\n” 一词的修辞义\n,而不是修辞\n造词法。\n一)\n类词缀” 模式整体分析\n以\n“ 族”\n“ 党”\n“ 迷”\n控” 等类词缀结尾的词语从造词法角度看\n,\n整体上都为仿拟\n造词形式\n。\n任学良\n:\n《汉语造词法》\n,\n中国社会科学出版社\n,\n年\n,\n第\n页\n[p.62]\n扬州大学硕士学位论文\n陈望道讲到\n“ 为了滑稽嘲弄而故意仿拟特种既成形式的\n,\n名叫仿拟格”\n,\n并提到\n了\n“ 滑稽嘲弄”\n“ 故意” 等词\n,\n以说明仿拟格的特点\n。但目前仿拟格早已摆脱了嘲弄别\n人的特点\n,\n发展为不具有明显的心理倾向的修辞格。我们认为\n,所谓仿拟\n,\n是依据汉语\n原有形式\n,在保留部分成分的基础上替换其中部分成分\n,从而创造出与原形式类似的格\n式\n。\n如魏巍曾仿拟\n“ 白毛女” 一词得来\n“ 白毛男\n”\n(《年轻人\n,\n让你的青春更美丽吧》\n)\n,\n这是很典型的仿拟运用\n。仿拟辞格运用到造词法中\n,依据原有词形替换部分构词成分而\n得到新词的方法就是仿拟造词法\n,\n在修辞格上又称仿词\n。仿词是仿拟的一种\n,\n仿拟包括\n模仿已有的字、词\n、\n句、段\n、\n篇\n,\n而仿词仅仅是模仿词\n。\n仿拟造词是现代汉语创造新词语的重要手段\n,通过仿拟造词\n,\n大大扩展了现代汉语\n词汇范围\n,\n丰富了语言交际\n。类词缀所构成的词语都是以\n“\n类词缀” 的形式出现的\n,\n其造词方式都是保留类词缀\n,替换其中的\n“\n” ,从而创造新词语\n,\n它们完全符合仿拟造\n词的特点\n,\n都可以归入仿拟造词范畴。\n如\n“\n控” 族词最早出现的是\n“ 萝莉控” 一词\n,\n仿照此词又得到了\n“ 大叔控”\n“ 正太控” 等词\n,\n这类词进一步通过仿拟造词发展\n,\n形成\n了我们现在见到的\n“\n控” 族词\n。其它族词如\n:\n球迷\n足球迷\n篮球迷\n排球迷\n兵兵迷\n学生党—高三党\n初三党\n毕业党\n上学党\n喜会族\n替会族\n恐会族\n恐休族\n恐年族\n二)\n“\n类词缀” 模式中\n“\n” 修辞造词分析\n借代造词法\n借代是我们常见的一种修辞格\n,指借用与要描述的对象相关的人或事物来代替描述\n对象\n,\n而不用它们本来的称呼。借代强调事物间的相关性\n,\n在使用时\n,\n本体不会出现\n,\n只出现用来指代本体的代体。借代是现代汉语中使用较多的修辞格之一\n。\n如\n:\n先生\n,\n给现钱\n,\n袁世凯,\n... ...\n(叶圣陶\n《多收了三五斗〉〉\n)\n在此例中\n,运用了借代的修辞格\n,\n本体\n“ 社会流通的银元” 并未出现\n,\n而用银元上\n的明显特征—袁世凯的头像来代替\n,\n表述形象生动\n,\n给人以活拨之感。\n借代造词法是一种用彼代此的造词方法\n,指\n“ 借用和事物有关的特征造成新词\n,并\n用此特征来指称该事物”\n通过借代造词法产生的词的有许多\n,如用\n“ 布衣” 指代\n“ 平\n民百姓” ,\n用\n巾帼” 指代\n“ 女人” ,\n用\n“ 杯” 代指\n“ 酒”\n(如\n“ 贪杯”\n,\n用\n“ 白领” 代\n、‘\n■陈望道\n:\n《修辞学发凡》\n,\n复旦大学出版社\n,\n年\n,\n第\n页\n任学良\n:\n《汉语造词法》\n,\n中华书局\n,\n丨\n年\n,\n第\n页\n[p.63]\n王周\n:类词缀\n“ 族”\n“ 党”\n“ 迷\n“ 控” 研究\n指\n脑力工作者” 等\n。\n在本文讨论的几个类词缀相应的族词中\n,\n许多\n“\n” 都用了借代\n造词法\n。\n“ 本本族” 用来代指考取了许多证书\n,\n以此来增加自身就业竞争力的人\n;\n“ 柜族”\n用来代指由于自身经济原因而无力购买或租住住房\n,住在集装箱里面的人\n“ 背包党”“ 背\n包族” 指向往自由\n,喜欢自然界的事物\n,\n寻求超越自身的体验\n,通常背着旅行包行走在\n各地的人\n,\n这里用他们这一类人最明显的特征\n“ 背包” 来代指整体\n;\n“ 四迷” 代指著名\n作家青年郭敬明的喜爱者\n,\n郭敬明外号\n“ 小四” ,\n“ 四迷” 之名由此得来\n;\n“ 五毛党” 代\n指网络上那些受雇于别人\n,\n为了维护他们的形象、消除不良影响而以普通网民身份出现\n的人\n,\n由于他们发一条帖子有五毛钱的费用\n,\n故被人戏称\n“ 五毛党” ,\n这里用他们的报\n酬代指他们这一类人。\n比喻造词法\n比喻又称譬喻\n,是用一种事物来描绘另一种与之类似而又有不同的事物\n,它们基于\n彼此的相似性而联系在一起\n。\n比喻中\n,\n被描绘的事物称为本体\n,\n通过打\n来描绘对方\n的事物叫做喻体。\n一般来讲\n,\n比喻分为明喻、\n暗喻\n(隐喻\n)\n、借喻三部分\n,\n是我们最常\n用到的修辞格之一\n。借助比喻的修辞手法创造新词的方法就是比喻造词法\n,现代汉语的\n许多词汇都是通过比喻造词法创造的\n,\n如\n:\n剑眉\n:\n像剑一样的眉毛\n,\n比较直\n,\n末端翅起\n冰释\n:\n像冰一样融化\n,\n用来比喻双方的误解消除\n法网\n:\n比喻如同网一般严密细致的法律体系\n类词缀所构造的族词中也有许多词以\n“\n” 的比喻意义呈现\n,运用比喻造词法造词\n。\n最典型的当属\n“ 蚁族”\n“ 鼠族”\n“ 蜂族” 等词\n:蚁族指毕业后因找不到工作或工作收入不\n理想而聚居在廉价城中村或城乡结合部的房屋中的一类人\n,他们如同妈蚁一样呈现聚居\n特点\n,而力量却很卑微\n,无法控制自己命运\n,是社会的弱势群体\n;\n鼠族指城市中租住在\n地下室、人防工程等环境非常恶劣的地方的一群人\n,多是外来务工者、刚毕业大学生等\n;\n蜂族是指如蜜蜂一样辛勤劳动\n,创造人类精神食粮的一类人\n,他们多在写字楼工作\n,\n主\n要从事文化事业\n,追求理想的精神生活\n,\n工作务实\n,不断向上。\n由以上三个词的意义可\n以看出\n,\n这三类人分别具有\n“\n” 所表示的\n蚂蚁”\n“ 老鼠”\n“ 蜜蜂” 等生物的特点\n,通\n过比喻造词法\n,\n巧妙地将它们的特点应用于人物身上\n,形象生动\n。其他与之类似的通过\n比喻造词法得来的词还有如\n“ 水母族”\n“ 考拉族”\n“ 酐米族” 等。\n其他造词法\n类词缀构造的词语数量巨大\n,\n形式多样\n,\n除仿拟造词\n、借代造词、\n比喻造词这几种\n[p.64]\n扬州火学硕士学位论文\n主要的修辞造词的方法外\n,还运用了多种其他修辞造词法\n,如夸张造词法\n、谐音造词法、\n重叠造词法等。\n夸张造词法\n夸张就是为了突出要表达的内容的特点\n,\n故意用言过其实的语言对其进行描述\n,\n主\n要包括夸大与夸小\n。夸张造词法也是重要的修辞造词方法\n,\n如弥天大慌、气吞山河\n、万\n能胶等词语都是通过夸张造词而来。本文的类词缀相关族词中\n,\n许多\n“\n” 都有夸张成\n分\n,\n如\n“ 飞车党” 就是运用的夸张造词法\n,\n用來指骑摩托车抢夺行人包\n、\n首饰等财物后\n飞速逃走的歹徒。\n谐音造词法\n谐音造词法是指模仿词语原来的读音\n,\n以其类似的读音创造新词的方法\n,这类词往\n往都具有活拨新颖的特点\n。\n本文类词缀构造的相关词语中\n,\n也有许多运用\n“\n” 的谐音\n来造词的例证\n,如\n“ 海膝族” “ 大酥控” 等\n。\n“ 海豚族” 是由\n“ 海囤” 一词谐音创造而来\n,\n意思是大量囤积物资的一类人。\n“ 大穌控” 是由\n“ 大叔控” 一词经谐音创造而来\n,\n与\n“ 大\n叔控”\n同义\n,\n但由于网络语言的随意性\n,\n该词能否长期存在尚存疑问\n。\n重叠造词法\n重叠造词法\n,指某个字反复叠加出现\n,来增强表现力的造词方法\n,\n与陈望道先生的\n“ 复叠格” 一脉相承。现代汉语词汇中\n,许多词都是复叠而来\n。本文中\n,\n“ 本本族”\n“ 奔\n奔族”\n“ 抠抠族”\n“ 抢抢族”\n包包控” 等都是通过\n“\n” 的重叠而来\n。通过\n“\n” 的重叠\n形式\n,\n增强了整个词语的形象色彩与感染力\n。\n以上仅仅是选取了较有代表性的由类词缀构造的词语\n,结合与它们相关的几种修辞\n造词法进行了简单阐释\n。\n由于类词缀构词的能产性强\n,造词量巨大\n,所运用的修辞造词\n法绝不仅仅上述几种\n,\n同时\n,\n由于它们的随意性、灵活性\n,许多词语并不稳定\n,\n能否长\n期存在发展有待时间检验。\n三、\n小结\n本节主要从修辞造词角度分析了\n“\n类词缀” 这一语言模式\n。我们首先区分了造词\n法与构词法两个概念\n:造词法是动态创造新词的方法\n,\n是就词的形成方法而言\n;\n构词法\n是从静态角度对已有词语分析其内部结构的方法\n,探讨的是语素的构词法则\n。造词法有\n多种\n,修辞造词法是其中之一\n,指通过修辞手法介入新词创造的过程而创造新词的方法。\n修辞造词法还必须与词的修辞义相区分\n,后者是在已有词语意义的基础之上\n,通过修辞\n手法派生出的意义\n,\n并没创造新词。\n“\n类词缀” 模式从整体上看属于修辞造词法中的\n[p.65]\n王周\n:\n类词缀\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 研究\n仿拟造词\n,它们都是在既有词语的基础上通过仿拟的方式类推而来。其内部的模槽\n“\n”\n又运用了借代造词法\n、\n比喻造词法、夸张造词法、谐音造词法、重叠造词法等多种修辞\n造词法\n。\n[p.66]\n兰\n扬州大学硕士学位论文\n第四章\n“\n类词缀” 模式比较研究\n以\n“\n” 为模槽\n,\n后加\n“ 族”\n“ 党”\n“ 迷”\n控” 等类词缀作为模标\n,\n组成了现代汉语\n中\n“\n类词缀” 这一模式\n。这些类似的模式间必然存在着或多或少的差别\n,在本章\n,我\n们将从语义特征、组配特征、色彩特征等三方面系统比较\n“\n族” 族词\n、\n“\n党\n族词\n、\n“\n迷” 族词\n、\n“\n控” 族词间的异同\n。\n第一节\n语义特征\n上文中我们已经通过辞书解释\n,\n分析了\n“ 族”\n“ 党”\n“ 迷”\n控” 的意义系统\n,\n并对\n它们的古今用法进行了简卑的举例说明\n。\n作为指人类词缀\n,\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 都表\n示\n“ ... ... 的一类人” ,\n某些时候可以两两互换\n,\n但大部分情况下都具有相对独立性\n,\n在\n语义范围上有所不同\n。\n一\n、\n“\n族” 族词与\n“\n党” 族词\n新版\n《现代汉语词典》对\n“\n族” 解释为\n“ 称具有某种共同属性的一类人” ,\n它们\n在语义上所指的一类人包括多个方面\n;\n“\n党” 族词表示\n“ 经常做某事或有共同属性的\n群体” 。\n“ 族” 与\n“ 党”\n自古代就有意义的联系\n,\n如前文介绍的\n“ 五族为党”\n(《周礼\n大\n司徒》)\n,有些旧\n“ 党” 族词可以与旧\n“ 族” 族词互换\n,\n如\n“ 父党”\n“ 母党” 也可以说\n“ 父\n族”\n“ 母族” 。\n在类词缀方面\n,\n“\n族” 族词产生较早\n,\n并对后来的\n“\n党” 族词的大规\n模发展起到了重要的仿拟推动作用\n。陈昌来、朱艳霞\n(\n利用百度搜索对\n、\n两年中典型的\n“\n族” 族词与\n“\n党” 族词词语进行了搜索\n,\n发现部分词语可以相互替\n换\n,\n典型的如\n“ 飞车党”\n“ 俯卧撑党”\n“ 舊油党” 都有相应的\n“\n族” 族词替换\n,\n说明\n“\n族” 与\n“\n党” 的重要临近关系\n。\n族” 族词与\n“\n党\n,,族词在语义表达上有很多共\n性\n,\n我们总结了\n“\n族” 族词与\n“\n党” 族词的语义特征\n,\n如下表所示\n:\n表\n“\n族” 族词与\n“\n党” 族词的语义特征对比\n语义特征\n“\n族” 族词\n例词\n“\n党\n族词\n例词\n指称有共同兴趣爱好的群体\n爱券族\n手机党\n指称有共同心理特征的群体\n恐婚族\n指称有共同行为习惯的群体\n卖折族\n飞车党\n[p.67]\n王周\n:\n类词缀\n“ 族”\n“ 党\n“ 迷”\n“ 控” 研究\n指称有共同生活方式的群体\n乐活族\n熬夜党\n指称有共同生活遭遇的群体\n月光族\n指称有共同外在形象的群体\n红唇族\n可爱党\n指称有共同职业特色的群体\n族\n指称经常使\n某词语的群体\n淡定党\n指称对某亊耍求很高的群体\n包装党\n由表可知\n,\n“\n族” 族词与\n“\n党” 族词都可表示有共同爱好、行为习惯、\n生活方\n式、外在形象等特征的群体\n,其中\n,指称共同的行为习惯与生活方式的群体是这两个族\n词最重要的语义特征\n。\n另夕卜\n,许多词可以相互替换模标\n,如\n“ 背包族” 与\n“ 背包党” ,\n族” 与\n“\n党” 等\n。但它们也有许多语义特征差异\n,\n如\n“\n族” 族词较少用来指称经常\n使用某词语的群体及对某事要求很高的群体\n,\n而\n“\n党” 族词则具有这些语义功能\n,\n反\n过来\n,\n“\n党” 族词又不具备某些\n“\n族” 族词所表示的语义特征\n,\n两个族词间存在相\n对独立性。\n二、\n“\n迷” 族词与\n“\n控” 族词\n“ 迷” 是现代汉语早已存在的类词缀\n,\n到今天使用愈发稳定\n。\n“\n迷” 族词的语义\n较为简单\n,\n《现代汉语词典》将其解释为\n“ 沉醉于某一事物的人” 。\n“ 控” 作为新兴类词\n缀\n,\n是由日语借用而来\n,\n由于适应了人们的心理特点\n,\n“\n控” 族词是近几年发展最为\n迅速的词语\n,\n意思是\n“ 强烈喜爱事物\n,\n甚至到极端程度的人” 。\n“\n迷” 与\n“\n控” 都表\n示极度喜爱之意\n,但在意义层次深浅上有细微差别\n,后者比前者在喜爱程度上更深\n,有\n的甚至有\n“ 无法自拔” 至\n“ 癖” 的程度。我们整理了它们的语义特征如下表所示\n:\n表\n“\n迷” 族词与\n“\n控” 族词语义特征对比\n语义特征\n“\n迷” 族词\n例词\n“\n控” 族词\n例词\n指称喜爱某具体事物的群体\n电脑迷\n眼镜控\n指称喜爱某种性质或状态的群体\n声优控\n指称喜爱某人的群体\n金庸迷\n御姐控\n指称喜爱某节目\n、\n剧目的群体\n火影迷\n行尸走肉控\n指称喜爱某地群体\n中国迷\n重庆控\n指称喜爱某种动作行为的群体\n下载迷\n骑牟控\n综合上表分析\n,\n我们发现\n“\n迷” 族词主要指喜爱某些有具体形象的人或事物的群\n[p.68]\n扬州大学硕士学位论文\n体\n,\n在此基础上\n,\n“\n控” 族词还能表达对于抽象事物的性质或状态的喜爱的群体\n,\n其\n在语义范围上更宽\n,\n并可以在更深层次上表现使用者的心理。此外\n,\n某些\n“\n控” 族词\n的词语也存在与\n“\n迷” 族词词语类推转化而来的特点\n如\n“ 韩剧迷” 与\n韩剧控”\n“ 动\n漫迷” 与\n“ 动漫控” 等\n。\n三\n、\n小结\n本章我们横向比较以\n“ 族”\n“ 党”\n“ 迷”\n“ 控” 为模标并结合模槽\n“\n” 所组成的\n“\n类词缀” 这一模式\n,\n以探求不同类词缀间的异同\n,\n本\n)\n较四个族词的语义特征异同\n。\n“\n族” 族词与\n“\n党” 族词有很多共通之处\n,都可表\n具有共同兴趣爱好、外在形象、\n生活方式等特征的群体\n,两个族词中有些词语具有相\n的模槽\n“\n”\n;两个族词又有区别\n于对方的语义特征\n,\n具有相对独立性\n。\n“\n控” 族词比\n“\n迷” 族词表达更深程度的喜\n爱之情\n,\n除具备\n“\n迷\n族词表达的所有语义外\n,\n还能表示对抽象事物的性质或状态喜\n爱的群体\n。\n第二节\n组配特征\n、\n“\n” 的音节对比\n族”\n“\n党”\n“\n迷”\n“\n控” 各", "title": "类词缀“族”“党”“迷”“控”研究", "topic": "指人 类词缀", "touch": "개별 유사접사 사례 분석 장의 구성 모델과 '내부·외부 동인' 분석 틀로 활용할 수 있다.", "updatedAt": "2026-10-06T11:58:00Z", "url": "", "year": "", "id": "0c7e0b54", "pid": "p_legacy01"}, {"analysis": "", "author": "张盛澜", "ch": "pdf", "createdAt": "2026-10-06T12:00:00Z", "cut": 0, "fileName": "现代汉语新兴指人类词缀探究_张盛澜.pdf", "grade": 5, "gradeBy": "AI", "gradeReason": "신흥 指人 类词缀 전반의 정의·유형·형성 원인·발전 전망을 다루어 연구 주제와 정면으로 겹치는 핵심 선행연구다.", "insight": "", "keywords": ["新兴指人类词缀", "控", "族", "二代", "奴", "帝", "框填理论", "模因论"], "kind": "학위논문", "myView": "", "pages": 58, "publisher": "上海师范大学 硕士学位论文", "summary": "21세기 이후 새로 나타난 '사람을 가리키는' 유사접사(新兴指人类词缀)를 대상으로, 실사였을 때의 의미와 유사접사로 쓰일 때의 의미를 비교한다. 정의·성질·특징·유형을 정리한 뒤 控·族·二代·奴·帝를 음성·의미·문법·화용 측면에서 고찰하고, 출현 원인을 외부(경제·사회, 심리·인지)와 내부(框填理论, 모방소 이론)로 설명한다. 끝으로 전형적 접사화, 정체·소멸, 실사 회귀라는 세 가지 발전 방향을 예측한다.", "text": "[p.1]\n学校代码\n:\n10270\n分类号:\nH146\n学号\n:\n142201051\n硕士学位论文\n论文题\n目\n现代汉语新兴指人类词缀探究\n学\n院\n对外汉语学院\n专\n业\n语言学及应用语言学\n研究方\n向\n语法理论与应用\n研究生姓名\n张盛澜\n指导教师\n陈\n昌来\n教授\n完成\n日\n期\n2018年\n4月\n[p.2]\n[p.3]\n上海师范大学硕士学位论文\n中文摘要\nI\n论文题目:现代汉语新兴指人类词缀探究\n学科专业:语言学及应用语言学\n学位申请人:张盛澜\n指导教师姓名:陈昌来\n论文类型:语法理论与应用\n中文摘要\n在汉语当中有许多类词缀都表示“人”的意义,形成了一个比较特殊的新兴\n类词缀群体。指人类词缀所表达的内容非常丰富,由它所构成的词语可以表示人\n的多重身份,而且还能带有各种丰富多样的感情色彩。本文的研究对象是新兴指\n人类词缀,并且通过将指人类词缀在虚化为类词缀前的实词的含义与其在指人类\n词缀中所表示的意义进行比较,以此来探究这些指人类词缀。\n本文绪论说明本文的研究范围,阐述论文选题的目的和意义,对前人的研究\n成果进行了总结,然后介绍了本文研究所运用的理论、方法以及语料来源。第二\n章主要分析新兴指人类词缀的定义、性质和特征和种类。对进一步认清词缀、类\n词缀、指人类词缀、新兴指人类词缀的性质和特点有一定的理论和实际意义。第\n三章,我们对新兴指人类词缀进行整理和归纳,选举出几个典型的新兴指人类词\n缀(控、族、二代、奴、帝),从语音、语义、语法、语用等几个方面进行考察。\n第四章主要是对新兴指人类词缀产生的原因进行探究,主要从内外两个方面着\n手,外部原因主要分为:经济和社会因素的影响及心理认知机制的变化;内部原\n因可以用框填理论及模因论进行阐释。第五章是对新兴指人类词缀的发展进行预\n测。预测方向主要有:发展成为典型的指人词缀,发展停滞并逐渐淡出,回归实\n词状态。\n关键词:新兴指人类词缀框填理论模因论\n[p.4]\nAbstract\n上海师范大学硕士学位论文\nII\nAbstract\nThere are many affixes that have the meaning of \"man\" in the Chinese language,\nthey has become a special group. The new affixes expression is very rich in content,\nthey can be composed of words expressing multiple identities of people, and also they\nhave a variety of rich and varied emotions. The object of this study is a new kind of\naffixes which have the meaning of human. By comparing the original notional\nmeaning of the persons and the meaning of the Affix refers to person, we want to\nexplore the process of development of human affixes in history.\nThe preface of this paper explains the research scope of this paper, elaborates the\npurpose and meaning of the thesis, summarizes the previous research results, and\nintroduces the theory of this study, methods and data sources. The exhaustive\ninvestigation and analysis of the extraction by on 2010 after the corpus, to identify\nemerging research the range of human affixes. The second chapter mainly analyzes\nthe definition, characteristics and types of these affixes. In the third chapter, we\nchoose several typical human affixes to analyze, such\nas:“kong”,“zu”,“erdai”,“nu”,“di”,. We study from the phonetic, semantic,\ngrammatical, pragmatic and other aspects. The fourth chapter is to explore the human\ngenerated reason refers to the affixes, mainly from inside and outside two aspects. The\nmain reason to the development is: externally, economic changes along with social\nfactors and psychological cognitive mechanism; the internal reasons can be used to\nframe filling theory and memetics interpretation. The fifth chapter is to predict the\ndevelopment of popular human affixes.\nKey words: popular, human affixes , frame thesis, memetics\n[p.5]\n上海师范大学硕士学位论文\n目录\nIII\n目录\n中文摘要.................................................................................................................I\nAbstract..................................................................................................................II\n目录......................................................................................................................III\n第1 章绪论..........................................................................................................1\n1.1 研究内容及意义....................................................................................1\n1.2 国内外研究现状分析............................................................................1\n1.2.1 关于现代汉语类词缀的研究....................................................1\n1.2.2 关于现代汉语新兴指人类词缀的研究现状............................2\n1.3 研究思路及方法....................................................................................4\n1.3.1 主要设想、思路及章节内容简介....
